<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RiseONE — treino, dieta e evolucao em um so lugar. / RiseONE — workout, diet and progress in one place.">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiseONE">
<title>RiseONE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0e1014; --surface:#15181e; --surface2:#1b1f26; --surface3:#242a34;
  --border:rgba(255,255,255,.075); --border2:rgba(255,255,255,.14);
  --text:#f3f5f8; --text2:#aab2bf; --text3:#7a8493;
  --accent:#ff7a2f; --accent2:#ffb257; --accent-ink:#1a0c02; --accent-soft:rgba(255,122,47,.14); --accent-line:rgba(255,122,47,.45);
  --ok:#2ecc8f; --ok-soft:rgba(46,204,143,.14); --warn:#ffb020; --warn-soft:rgba(255,176,32,.14); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.14);
  --s1:#4a90e8; --s2:#e8623a; --s3:#22b37f; --grid:#262c36;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tap:44px;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f1f3f7; --surface3:#e6e9ef;
  --border:#e4e7ed; --border2:#d3d8e1;
  --text:#121519; --text2:#5b6470; --text3:#8a93a1;
  --accent:#e2600f; --accent2:#f5993a; --accent-ink:#ffffff; --accent-soft:rgba(226,96,15,.10); --accent-line:rgba(226,96,15,.4);
  --ok:#0f9d6a; --ok-soft:rgba(15,157,106,.12); --warn:#b97b00; --warn-soft:rgba(185,123,0,.12); --bad:#d63b3b; --bad-soft:rgba(214,59,59,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e3e7ee;
  --shadow:0 10px 30px rgba(15,20,30,.10); --shadow-sm:0 1px 4px rgba(15,20,30,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* ---- arte de fundo ---- */
#bgart{position:fixed;inset:0;z-index:-2;pointer-events:none;display:none;
  background:url("fundo.jpg") center center / cover no-repeat}
#bgart::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 62% 70% at 50% 45%, rgba(14,16,20,.82) 0%, rgba(14,16,20,.64) 55%, rgba(14,16,20,.34) 100%)}
html[data-bg="1"] #bgart{display:block}
html[data-bg="1"] body{background:transparent}
html[data-bg="1"] .card{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px)}
html[data-bg="1"] .stat,html[data-bg="1"] .item,html[data-bg="1"] .ex,html[data-bg="1"] .mvcard,html[data-bg="1"] .eqcard,html[data-bg="1"] .tile{
  background:color-mix(in srgb,var(--surface2) 80%,transparent)}
html[data-bg="1"] header.app{background:color-mix(in srgb,var(--bg) 76%,transparent)}
html[data-bg="1"] #bottombar{background:color-mix(in srgb,var(--bg) 90%,transparent)}
html[data-bg="1"] footer.app{background:color-mix(in srgb,var(--bg) 70%,transparent)}
html[data-theme="light"] #bgart{background-image:url("fundo-claro.jpg")}
html[data-theme="light"] #bgart::after{
  background:radial-gradient(ellipse 58% 66% at 50% 45%, rgba(255,242,230,.82) 0%, rgba(255,242,230,.48) 55%, rgba(255,242,230,.12) 100%)}
html[data-theme="light"][data-bg="1"]{
  --bg:#fff2e6; --surface:#fffaf4; --surface2:#fdf0e3; --surface3:#f8e4d2;
  --border:#f0dcc6; --border2:#e6c9ac; --text2:#6b6158; --text3:#93877c; --grid:#f0dcc6}
html[data-theme="light"][data-bg="1"] .card{background:color-mix(in srgb,var(--surface) 90%,transparent)}
html[data-theme="light"][data-bg="1"] .stat,html[data-theme="light"][data-bg="1"] .item,
html[data-theme="light"][data-bg="1"] .ex,html[data-theme="light"][data-bg="1"] .mvcard,
html[data-theme="light"][data-bg="1"] .eqcard,html[data-theme="light"][data-bg="1"] .tile{background:color-mix(in srgb,var(--surface2) 90%,transparent)}
html[data-theme="light"][data-bg="1"] header.app{background:color-mix(in srgb,var(--bg) 86%,transparent)}
@media (max-width:900px){
  #bgart{background-image:url("fundo-celular.jpg")}
  html[data-theme="light"] #bgart{background-image:url("fundo-claro-celular.jpg")}
}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0 0 .35em;line-height:1.22;font-weight:800;letter-spacing:-.015em}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.02rem} h4{font-size:.92rem}
p{margin:0 0 .7em}
small{color:var(--text2)}
.muted{color:var(--text2)}
.tiny{font-size:.8rem}
.hidden{display:none !important}
.center{text-align:center}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:800}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px;border-radius:8px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.ic svg{width:1.2em;height:1.2em;display:block}
.ibub{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ibub svg{width:20px;height:20px}
.ibub.ok{background:var(--ok-soft);color:var(--ok)} .ibub.warn{background:var(--warn-soft);color:var(--warn)} .ibub.grey{background:var(--surface3);color:var(--text2)}

/* ============ FAIXA DO TOPO: [PT|EN] · [IA] · [ANÚNCIO] · [carrossel] · [×] ============ */
#topbar{display:flex;align-items:stretch;background:var(--surface2);border-bottom:1px solid var(--border);min-height:38px}
#topbar .tb{background:transparent;border:0;border-right:1px solid var(--border);color:var(--text2);padding:0 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;letter-spacing:.04em;white-space:nowrap;transition:.15s}
#topbar .tb:hover{color:var(--text);background:var(--surface3)}
#langbtn .lg{opacity:.55} #langbtn .lg.on{opacity:1;color:var(--accent)} #langbtn i{font-style:normal;opacity:.35;margin:0 2px}
#iabtn{color:var(--accent)}
#iabtn svg{width:15px;height:15px}
#adbar{flex:1;display:flex;align-items:stretch;min-width:0;min-height:52px}
#adbar .adtag{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text3);padding:6px 4px;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
#adbar .adviewport{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#adbar .adtrack{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;will-change:transform;
  animation:adscroll 40s linear infinite;padding:0 8px}
#adbar .adtrack.static{animation:none}
#adbar:hover .adtrack,#adbar.paused .adtrack{animation-play-state:paused}
@keyframes adscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#adbar .aditem{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px 12px 5px 6px;flex-shrink:0;transition:border-color .15s}
#adbar .aditem:hover{border-color:var(--accent)}
#adbar .adimg{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--surface3)}
#adbar .adem{display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem}
#adbar .adtxt{display:flex;flex-direction:column;line-height:1.15}
#adbar .adtxt b{font-size:.8rem}
#adbar .adtxt b em{font-style:normal;font-size:.6rem;color:var(--accent);margin-left:4px;text-transform:uppercase;letter-spacing:.06em}
#adbar .adtxt small{font-size:.72rem;color:var(--text2)}
#adclose{background:transparent;border:0;border-left:1px solid var(--border);color:var(--text2);width:38px;cursor:pointer;font-size:18px;flex-shrink:0}
#adclose:hover{color:var(--text)}
body.fs #topbar{display:none}
@media(max-width:560px){ #adbar .adtxt small{display:none} #adbar .adtag{font-size:.5rem} #topbar .tb{padding:0 9px} }
/* pop-up de anuncio */
.adpop-wrap{z-index:150}
.adpop{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:640px;overflow:hidden}
.adpop-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.adpop-head .tiny{flex:1;text-align:right}
.adpop-body{display:flex;gap:18px;padding:18px;align-items:center}
.adpop-art{flex:0 0 38%;display:flex;align-items:center;justify-content:center}
.adpop-art img{width:100%;max-width:190px;border-radius:16px}
.adpop-em{font-size:4.2rem;line-height:1}
.adpop-txt{flex:1;min-width:0}
@media(max-width:560px){ .adpop-body{flex-direction:column;text-align:center} .adpop-art{flex-basis:auto} .adpop-art img{max-width:120px} .adpop-em{font-size:3.4rem} }
/* tarja do modo de teste (ver como visitante / membro / premium) */
#tarja{background:var(--warn);color:#1a1200;font-weight:800;font-size:.8rem;text-align:center;padding:6px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#tarja button{background:#1a1200;color:#fff;border:0;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:800;cursor:pointer}

/* ============ HEADER ============ */
header.app{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.hrow{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0;color:var(--text)}
.brand .mark{width:32px;height:32px;flex-shrink:0}
.brand .one{color:var(--accent)}
.spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:40px;height:40px;border-radius:12px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:.15s;flex-shrink:0}
.iconbtn svg{width:19px;height:19px}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#helpbtn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);border-radius:999px;width:auto;padding:0 12px 0 8px;gap:6px;font-weight:800;font-size:.82rem}
#helpbtn img{width:22px;height:22px;border-radius:50%;display:block}
#helpbtn:hover{background:var(--accent);color:var(--accent-ink)}
.whoami{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;max-width:200px;height:40px}
.whoami .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}
.whoami .nm{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){
  .hrow{gap:8px;padding:8px 12px;min-height:54px}
  .brand{font-size:1.05rem} .brand .mark{width:28px;height:28px}
  #helpbtn .hl{display:none} #helpbtn{padding:0;width:40px;justify-content:center}
  .whoami{max-width:140px}
  .whoami .nm{font-size:.78rem}
}
@media(max-width:380px){ .whoami .nm{display:none} .whoami{padding:4px} }

/* ============ NAV (5 areas) ============ */
nav.tabs{max-width:1040px;margin:0 auto;display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text2);padding:8px 14px;border-radius:999px;
  cursor:pointer;white-space:nowrap;font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:7px;transition:.15s}
nav.tabs button:hover{color:var(--text);background:var(--surface)}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button svg{width:18px;height:18px}
/* barra de baixo (celular) */
#bottombar{display:none}
@media(max-width:820px){
  nav.tabs{display:none}
  #bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  #bottombar button{flex:1;background:none;border:0;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px 3px;cursor:pointer;font-size:.66rem;font-weight:700;border-radius:12px;max-width:110px}
  #bottombar button .ic{width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:.15s}
  #bottombar button svg{width:22px;height:22px}
  #bottombar button span:last-child{white-space:nowrap;line-height:1.05;font-size:.64rem;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  #bottombar button.active{color:var(--accent)}
  #bottombar button.active .ic{background:var(--accent-soft)}
  main{padding-bottom:86px !important}
}
/* sub-navegacao (controle segmentado) */
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;background:transparent;border:0;color:var(--text2);padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;
  font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;min-height:38px}
.seg button svg{width:17px;height:17px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
html[data-theme="dark"] .seg button.on{background:var(--surface3)}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:.84rem;font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;padding:0;margin-bottom:10px}
.crumb:hover{color:var(--accent)}
.crumb svg{width:16px;height:16px}

/* ============ CARDS / LAYOUT ============ */
main{padding:18px 0 40px}
.screen{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card.tight{padding:12px}
.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface) 70%);border-color:var(--accent-line)}
.card.soft{border-style:dashed;box-shadow:none}
.card h2,.card h3{display:flex;align-items:center;gap:8px}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ch .cht{flex:1;min-width:0}
.ch h2,.ch h3{margin:0}
.ch small{display:block;margin-top:1px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.grid.top{align-items:start}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.g2.collapse,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sep{height:1px;background:var(--border);margin:14px 0}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{margin:0}
.pagehead small{display:block;margin-top:2px}
details.fold{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);margin-top:12px}
details.fold > summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:8px;user-select:none}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);transform:rotate(45deg);transition:.2s}
details.fold[open] > summary::after{transform:rotate(-135deg)}
details.fold > .fb{padding:0 14px 14px}

/* ============ CONTROLS ============ */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:0 16px;min-height:var(--tap);border-radius:12px;
  cursor:pointer;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;text-decoration:none;line-height:1.2}
.btn svg{width:18px;height:18px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.line{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn.line:hover{color:var(--accent);border-color:var(--accent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn.xs{min-height:30px;padding:0 10px;font-size:.76rem;border-radius:8px}
.btn.xs svg,.btn.sm svg{width:15px;height:15px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:5px;font-weight:800}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=email],input[type=search],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:10px 12px;outline:none;transition:.15s;min-height:var(--tap)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);padding:0 13px;min-height:36px;border-radius:999px;
  cursor:pointer;font-size:.84rem;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:15px;height:15px}
.chip:hover{color:var(--text);border-color:var(--text3)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);
  padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:800;color:var(--text2);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:32px}
.switch input{display:none}
.switch .tr{width:46px;height:27px;border-radius:999px;background:var(--surface3);border:1px solid var(--border2);position:relative;transition:.2s;flex-shrink:0}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--text3);transition:.2s}
.switch input:checked + .tr{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .tr::after{left:22px;background:#fff}

/* ============ STAT TILES ============ */
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;min-width:0}
.stat .lb{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .vl{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.15}
.stat .un{font-size:.78rem;color:var(--text2);font-weight:700}
.stat .dl{font-size:.76rem;margin-top:2px}

/* ============ TILES (atalhos e central "Mais") ============ */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:8px;color:var(--text);transition:.15s;min-height:96px;position:relative}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .tl{font-weight:800;font-size:.9rem;line-height:1.2}
.tile .td{font-size:.76rem;color:var(--text2);line-height:1.3}
.tile .lk{position:absolute;top:10px;right:10px}
.tile.row{flex-direction:row;align-items:center;min-height:0;gap:12px}
.tile.row .tl{margin:0}
@media(max-width:400px){ .tiles{grid-template-columns:repeat(2,1fr)} .tile{padding:12px 10px} }

/* ============ BODY MAP ============ */
.bodywrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bodyfig{flex:1;min-width:145px;max-width:300px;text-align:center}
.bodyfig svg{width:100%;height:auto;max-height:440px}
.bodyfig .cap{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-top:2px}
.msc{fill:var(--surface3);stroke:var(--border2);stroke-width:1.2;cursor:pointer;transition:fill .15s,stroke .15s}
.msc:hover{fill:color-mix(in srgb,var(--accent) 45%,var(--surface3));stroke:var(--accent)}
.msc.sel{fill:var(--accent);stroke:var(--accent)}
.bodybase{fill:var(--surface2);stroke:var(--border2);stroke-width:1.2}
.bodyline{fill:none;stroke:var(--border2);stroke-width:1.2}

/* ============ EXERCISE CARDS ============ */
.exlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ex{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:7px}
.ex .exh{display:flex;gap:10px;align-items:flex-start}
.ex .eqic{width:68px;height:74px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;color:var(--accent)}
.ex .eqic svg{width:100%;height:100%;display:block}
.exbig{width:min(52vw,230px);margin:0 auto;color:var(--accent)}
.runfig{width:100px;flex-shrink:0;color:var(--accent)}
.ex .nm{font-weight:800;font-size:.94rem;line-height:1.25}
.ex .tech{font-size:.72rem;color:var(--text3);font-style:italic}

.ex .exf{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.eqcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.eqcard svg{width:100%;height:70px}
.eqcard img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.eqcard .nm{font-weight:800;font-size:.84rem;margin-top:5px}
/* fotos de posicao (fotos-exercicios.jpg, opcional) */
.ph{display:inline-block;width:68px;height:68px;border-radius:10px;background-image:url("fotos-exercicios.jpg");background-size:600% 600%;background-repeat:no-repeat;flex-shrink:0;border:1px solid var(--border)}
.phrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phrow .ph{width:110px;height:110px;border-radius:12px}
.phrow .arrow{color:var(--text3);font-size:1.2rem}
.phrow.big .ph{width:min(38vw,170px);height:min(38vw,170px)}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(4,6,10,.72);backdrop-filter:blur(3px);animation:fadein .18s ease}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);

@media(max-width:600px){
  .modal{align-items:flex-end;padding:0}

}
@keyframes sheetup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

/* ============ MISC ============ */
.list{display:flex;flex-direction:column;gap:8px}

.item.admrow{flex-direction:column;align-items:stretch;gap:7px}

  font-size:.9rem;flex-shrink:0;color:transparent;transition:.15s}

canvas.chart{width:100%;display:block}

  border:1px solid var(--accent);border-radius:14px;padding:11px 18px;box-shadow:var(--shadow);font-size:.88rem;font-weight:700;max-width:90vw;animation:fadein .2s}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--border)}

table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.camprev{width:100%;max-height:52vh;background:#000;border-radius:12px;display:block}
.ocrbox{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.8rem;
  white-space:pre-wrap;max-height:180px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.level-badge{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.optionlist{display:flex;flex-direction:column;gap:8px}
.optionlist .opt{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;text-align:left;color:var(--text);transition:.15s;min-height:56px}

.optionlist .opt .ot{font-weight:800;font-size:.94rem} .optionlist .opt .od{font-size:.78rem;color:var(--text2)}

/* ============ CENTRAL DE AJUDA, TUTORIAL E WIZARD ============ */
.help-tabs{margin-bottom:12px}

.tour-hole{position:fixed;z-index:400;border-radius:14px;box-shadow:0 0 0 9999px rgba(4,6,10,.72), 0 0 0 3px var(--accent);pointer-events:none;transition:all .28s ease}
.tour-card{position:fixed;z-index:401;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;width:min(340px,calc(100vw - 24px))}
.tour-card h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}

.tour-card .tf{display:flex;align-items:center;gap:8px}
.tour-dots{display:flex;gap:4px;flex:1}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--border2)} .tour-dots i.on{background:var(--accent);width:16px;border-radius:3px}
.tour-center{left:50%;top:50%;transform:translate(-50%,-50%)}
.wiz-prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wiz-prog .bar{flex:1}
.wiz-foot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.wiz-foot .spacer{flex:1}

.wiz-summary{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:430px){.wiz-summary{grid-template-columns:1fr}}

/* ============ CRONOMETRO ============ */
#timerscreen{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}

#timerscreen .thead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}

#routinescreen .rfoot{max-width:640px;margin:0 auto;width:100%}

#timerscreen .serbox{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

  background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
#timerscreen .serlb{font-weight:800;font-size:.88rem}

/* =====================================================================

const APP_VERSION = "3.0.1";

function I(name, cls){
  const p=ICONS[name]||ICONS.info;
  return '<span class="ic'+(cls?" "+cls:"")+'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+"</svg></span>";
}
function fillIcons(root){ (root||document).querySelectorAll("[data-icon]").forEach(n=>{ n.outerHTML=I(n.getAttribute("data-icon"), n.className.replace("ic","").trim()); }); }
/* cabecalho de cartao: icone + titulo + subtitulo + acao */
function cardHead(icon, title, sub, action, tag){
  tag=tag||"h3";
  return '<div class="ch"><span class="ibub">'+I(icon)+'</span><div class="cht"><'+tag+'>'+esc(title)+"</"+tag+">"+(sub?'<small class="muted">'+esc(sub)+"</small>":"")+"</div>"+(action||"")+"</div>";
}
function emptyBox(icon, title, sub, action){
  return '<div class="empty"><span class="ibub grey">'+I(icon)+"</span>"+(title?"<b>"+esc(title)+"</b>":"")+(sub?esc(sub):"")+(action?'<div style="margin-top:10px">'+action+"</div>":"")+"</div>";
}

"legal.title":["Aviso legal e privacidade","Legal notice and privacy"],
"legal.body":["Este aplicativo é de uso pessoal e para fins de estudo e pesquisa. A conferência de postura pela câmera é automática e aproximada, feita no próprio aparelho, sem gravar nem enviar imagens, e não substitui a correção de um profissional. As informações sobre exercícios, alimentação e saúde têm caráter informativo e não substituem avaliação de profissional de educação física, nutricionista ou médico. Antes de iniciar qualquer programa de exercícios ou dieta, recomenda-se orientação profissional. O uso é por conta e risco de quem utiliza, não havendo responsabilidade por lesões, danos à saúde ou perdas de qualquer natureza. Os dados registrados (peso, medidas, fotos, refeições e resultados de exames) ficam armazenados no próprio dispositivo e não são enviados a servidores do aplicativo. A remoção dos dados pode ser feita a qualquer momento em Ajustes. Tratamento de dados realizado exclusivamente para fins particulares e não econômicos, nos termos do art. 4º, I, da Lei nº 13.709/2018 (LGPD).","This application is for personal use and for study and research purposes. The camera posture check is automatic and approximate, runs on the device itself without recording or sending images, and does not replace a professional’s correction. Information about exercise, food and health is informative and does not replace assessment by a physical education professional, dietitian or physician. Professional guidance is recommended before starting any exercise or diet programme. Use is at the user's own risk, with no liability for injury, health damage or losses of any kind. Recorded data (weight, measurements, photos, meals and lab results) is stored on the device itself and is not sent to application servers. Data can be removed at any time in Settings. Data processing carried out exclusively for private, non-economic purposes."],
"footer.legal":["Aviso legal e privacidade","Legal notice and privacy"],

/* ---------- 6. DATAS E FORMATOS ---------- */
const MON = {pt:["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],
             en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const WD  = {pt:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
const WDL = {pt:["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],
             en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]};
function todayISO(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function parseISO(s){ const a=String(s||"").split("-"); return new Date(+a[0],(+a[1]||1)-1,+a[2]||1); }
/* PT: dd/mmm/aaaa  ·  EN: mmm/dd/aaaa */
function fmtDate(iso){
  if(!iso) return "—";
  const d = (iso instanceof Date)?iso:parseISO(iso);
  if(isNaN(d)) return String(iso);
  const dd=String(d.getDate()).padStart(2,"0"), mm=MON[LANG][d.getMonth()], yy=d.getFullYear();
  return LANG==="pt" ? dd+"/"+mm+"/"+yy : mm+"/"+dd+"/"+yy;
}
function fmtShort(iso){ const d=parseISO(iso); return LANG==="pt" ? String(d.getDate()).padStart(2,"0")+"/"+MON[LANG][d.getMonth()] : MON[LANG][d.getMonth()]+"/"+String(d.getDate()).padStart(2,"0"); }
function weekdayName(i,long){ return (long?WDL:WD)[LANG][i]; }
function nDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function num(v,d){ const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?(d===undefined?0:d):n; }
function fmtNum(n,dec){ if(n===null||n===undefined||isNaN(n)) return "—";
  return Number(n).toLocaleString(LANG==="pt"?"pt-BR":"en-US",{minimumFractionDigits:dec||0,maximumFractionDigits:dec===undefined?1:dec}); }
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadRoot(){
  try{ const raw=localStorage.getItem(LSKEY); if(raw) ROOT=JSON.parse(raw); }catch(e){ ROOT=null; }
  if(!ROOT || typeof ROOT!=="object") ROOT={users:{},data:{},ads:[],prefs:{lang:"pt",theme:"dark"},session:null};
  ROOT.users=ROOT.users||{}; ROOT.data=ROOT.data||{}; ROOT.ads=ROOT.ads||[]; ROOT.prefs=ROOT.prefs||{lang:"pt",theme:"dark"};
  return ROOT;
}
function saveRoot(){ try{ localStorage.setItem(LSKEY, JSON.stringify(ROOT)); }catch(e){ toast(LANG==="pt"?"Sem espaço para salvar. Apague fotos antigas.":"No space to save. Delete old photos."); } }
function save(){ if(!GUEST && ROOT.session && ROOT.session.uid){ ROOT.data[ROOT.session.uid]=STATE; saveRoot(); } }
function hashPass(s){ let h=5381; const str="rise"+s; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(36); }

/* ---------- 8. TOAST / MODAL ---------- */
let toastT=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d);
  clearTimeout(toastT); toastT=setTimeout(()=>d.remove(), 2600);
}
function modal(html, opts){
  opts=opts||{};
  if(TOURST.active) tourEnd();
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML='<div class="box'+(opts.wide?" wide":"")+'">'+html+"</div>";
  m.addEventListener("click", e=>{ if(e.target===m && !opts.sticky) m.remove(); });
  document.body.appendChild(m);
  m.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>m.remove()));
  const f=m.querySelector("input,select,textarea"); if(f && window.innerWidth>820) setTimeout(()=>f.focus(),60);
  initAnims(m);
  return m;
}
function confirmBox(msg, onYes){
  const m=modal('<div class="mh"><h3>'+esc(msg)+'</h3></div><div class="row" style="justify-content:flex-end"><button class="btn line" data-close>'+t("common.cancel")+'</button><button class="btn danger" id="cyes">'+t("common.yes")+"</button></div>");
  m.querySelector("#cyes").onclick=()=>{ m.remove(); onYes(); };
}
function mh(title){ return '<div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" data-close>&times;</button></div>'; }

function applyBg(on){
  document.documentElement.setAttribute("data-bg", on?"1":"0");
  ROOT.prefs.bg = on?1:0; saveRoot();
  const b=document.getElementById("bgbtn");
  if(b) b.classList.toggle("on", !!on);
}
function checkBgArt(){
  const img=new Image();
  img.onload=()=>{ BG_OK=true; };
  img.onerror=()=>{ BG_OK=false; applyBg(false);
    const b=document.getElementById("bgbtn"); if(b) b.classList.add("hidden"); };
  img.src="fundo.jpg";
}
let BG_OK=null;
function applyTheme(th){
  document.documentElement.setAttribute("data-theme", th);
  document.querySelector('meta[name=theme-color]').setAttribute("content", th==="dark"?"#0f1115":"#f6f7f9");

const ROLES_ALL=["guest","student","trainer","advertiser","admin"], ROLES_TRAIN=["guest","student","trainer"];
const SECTIONS=[
 {id:"home",     ic:"home",      k:"nav.home",     routes:["home"],                        roles:ROLES_ALL},
 {id:"train",    ic:"dumbbell",  k:"nav.train",    routes:["workout","ex","body","warm"],  roles:ROLES_TRAIN},
 {id:"diet",     ic:"leaf",      k:"nav.diet",     routes:["diet"],                        roles:ROLES_TRAIN},
 {id:"progress", ic:"chart",     k:"nav.progress", routes:["progress"],                    roles:ROLES_TRAIN},
 {id:"ads",      ic:"megaphone", k:"nav.ads",      routes:["ads"],                         roles:["advertiser"]},
 {id:"admin",    ic:"shield",    k:"nav.admin",    routes:["admin"],                       roles:["admin"]},
 {id:"more",     ic:"grid",      k:"nav.more",     routes:["more","scan","ia","coach","set"], roles:ROLES_ALL}

const ROUTES = [
 {id:"home",     ic:"home",      k:"nav.home",     roles:ROLES_ALL},
 {id:"workout",  ic:"dumbbell",  k:"nav.workout",  roles:ROLES_TRAIN},
 {id:"ex",       ic:"book",      k:"nav.ex",       roles:ROLES_TRAIN},
 {id:"body",     ic:"body",      k:"nav.body",     roles:ROLES_TRAIN},
 {id:"warm",     ic:"flame",     k:"nav.warm",     roles:ROLES_TRAIN},
 {id:"diet",     ic:"leaf",      k:"nav.diet",     roles:ROLES_TRAIN},
 {id:"progress", ic:"chart",     k:"nav.progress", roles:ROLES_TRAIN},
 {id:"scan",     ic:"scan",      k:"nav.scan",     roles:ROLES_TRAIN},
 {id:"coach",    ic:"grad",      k:"nav.coach",    roles:["trainer"]},
 {id:"ads",      ic:"megaphone", k:"nav.ads",      roles:["advertiser"]},
 {id:"ia",       ic:"sparkles",  k:"nav.ia",       roles:ROLES_ALL},
 {id:"admin",    ic:"shield",    k:"nav.admin",    roles:["admin"]},
 {id:"set",      ic:"sliders",   k:"nav.set",      roles:ROLES_ALL},
 {id:"more",     ic:"grid",      k:"nav.more",     roles:ROLES_ALL}
];
let ROUTE = "home";
const SUB = {};                 /* subtela escolhida em cada tela (ex.: SUB.progress = "fotos") */
function role(){ return (ROOT.session && ROOT.session.role) || "guest"; }
function sectionOf(routeId){ return SECTIONS.find(s=>s.routes.indexOf(routeId)>=0) || SECTIONS[0]; }
function visibleSections(){ return SECTIONS.filter(s=>s.roles.indexOf(uiRole())>=0); }
function visibleRoutes(){ return ROUTES.filter(r=>r.roles.indexOf(uiRole())>=0); }
function routeInfo(id){ return ROUTES.find(r=>r.id===id); }
function buildNav(){
  const secs=visibleSections(), cur=sectionOf(ROUTE).id;
  const btn=s=>'<button data-go="'+s.routes[0]+'" data-sec="'+s.id+'" class="'+(s.id===cur?"active":"")+'" aria-label="'+esc(t(s.k))+'">'+I(s.ic)+"<span>"+t(s.k)+"</span></button>";
  document.getElementById("tabs").innerHTML = secs.map(btn).join("");
  document.getElementById("bottombar").innerHTML = secs.map(btn).join("");
}
/* controle segmentado da área Treinar */
function subNav(){
  const sec=sectionOf(ROUTE); if(sec.id!=="train") return "";
  const rs=sec.routes.map(routeInfo).filter(r=>r && r.roles.indexOf(uiRole())>=0);
  return '<div class="seg" id="subnav">'+rs.map(r=>'<button data-go="'+r.id+'" class="'+(r.id===ROUTE?"on":"")+'">'+I(r.ic)+"<span>"+t(r.k)+"</span>"+(ROUTE_FEAT[r.id]?lockBadge(ROUTE_FEAT[r.id]):"")+"</button>").join("")+"</div>";
}
/* subtelas dentro de uma tela (Evolução, Ajustes) */
function segBar(route, items){
  const cur=SUB[route]||items[0][0];
  return '<div class="seg">'+items.map(it=>'<button data-go="'+route+'" data-sub="'+it[0]+'" class="'+(cur===it[0]?"on":"")+'">'+(it[2]?I(it[2]):"")+"<span>"+esc(it[1])+"</span></button>").join("")+"</div>";
}
function go(id, sub){
  if(sub) SUB[id]=sub;
  ROUTE=id; buildNav(); render();
  window.scrollTo({top:0,behavior:"smooth"}); maybePopupAd();
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-go]");
  if(b){ const m=b.closest(".modal"); if(m && !b.closest("#screen")) m.remove(); go(b.getAttribute("data-go"), b.getAttribute("data-sub")||undefined); }
});

/* ---------- 12. AJUDANTES DE DADOS ---------- */
function ci(date){ return STATE.checkins.find(c=>c.date===date); }
function ensureCi(date){ let c=ci(date); if(!c){ c={date,weight:null,done:[],mood:2,notes:""}; STATE.checkins.push(c); } return c; }
function missionsToday(d){ const dow=(d?parseISO(d):new Date()).getDay(); return STATE.missions.filter(m=>!m.days||m.days.indexOf(dow)>=0); }
function mTitle(m){ return typeof m.title==="string"?m.title:(m.title[LANG]||m.title.pt); }
function lastWeight(){ const w=STATE.checkins.filter(c=>c.weight).sort((a,b)=>a.date<b.date?1:-1); return w.length?w[0].weight:(STATE.measures.length?STATE.measures[STATE.measures.length-1].weight:null); }
function streak(){
  let n=0, d=new Date();
  for(let i=0;i<400;i++){
    const iso=todayISO(d), c=ci(iso);
    const ok = !!(c && ((c.done&&c.done.length) || STATE.logs.some(l=>l.date===iso)));
    if(ok) n++;
    else if(i>0) break;            /* o dia de hoje ainda pode ser cumprido */
    d.setDate(d.getDate()-1);
  }
  return n;
}
function weekLogs(){ const now=new Date(); const start=new Date(now); start.setDate(now.getDate()-now.getDay());
  const iso=todayISO(start); return STATE.logs.filter(l=>l.date>=iso); }
function mealsOn(date){ return STATE.meals.filter(m=>m.date===date); }
function sumMeals(list){ return list.reduce((a,m)=>({kcal:a.kcal+(m.kcal||0),prot:a.prot+(m.prot||0),carb:a.carb+(m.carb||0),fat:a.fat+(m.fat||0)}),{kcal:0,prot:0,carb:0,fat:0}); }
function workoutToday(){ const dow=new Date().getDay(); return STATE.workouts.find(w=>(w.days||[]).indexOf(dow)>=0); }
function age(){ if(!STATE.profile.birth) return 30; const b=parseISO(STATE.profile.birth); const n=new Date();
  let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a>0&&a<120?a:30; }

/* ---------- 13. RENDERIZADOR ---------- */
const SCREENS = {};
const ROUTE_FEAT={scan:"scan", warm:"warm", diet:"diet", progress:"progress", coach:"coach", ia:"ia"};
function render(){
  const el=document.getElementById("screen");
  const feat=ROUTE_FEAT[ROUTE];
  const sec=sectionOf(ROUTE);
  let top="";
  if(sec.id==="train") top+=subNav();
  else if(sec.id==="more" && ROUTE!=="more") top+='<button class="crumb" data-go="more">'+I("arrowl")+t("nav.more")+"</button>";
  el.classList.remove("screen"); void el.offsetWidth; el.classList.add("screen");
  if(feat && feat!=="ia" && !canUse(feat)){
    el.innerHTML=top+lockedScreen(feat);
    const lk=el.querySelector("#lk_go");
    if(lk) lk.onclick=()=>{ role()==="guest"? loginModal("student") : go("set","conta"); };
    refreshWho(); paintTarja(); return;
  }
  const fn=SCREENS[ROUTE]||SCREENS.home;
  el.innerHTML = top+fn();
  (SCREENS[ROUTE+"_after"]||function(){})();
  initAnims(el);
  refreshWho(); paintTarja();
  if(typeof HELP_ONSCREEN==="function") HELP_ONSCREEN();
}
function refreshWho(){
  const s=ROOT.session||{role:"guest",name:t("role.guest")};
  const nm=s.name||t("role.guest");
  document.getElementById("whonm").textContent=nm;
  document.getElementById("whoav").textContent=(nm[0]||"?").toUpperCase();
}
function showAds(){ return !adsOff(); }

/* ---------- 14. TELA: INICIO ---------- */
/* Por que: a tela de entrada mostra UM próximo passo claro, depois os números do dia e atalhos. */
function nextStepCard(){
  const iso=todayISO(), wt=workoutToday(), doneToday=STATE.logs.some(l=>l.date===iso), c=ci(iso);
  const wz=(typeof wizState==="function")?wizState("setup"):null;
  if(role()!=="guest" && wz && !wz.done && wz.snoozed!==todayISO()){
    const pct=wz.step? Math.round(wz.step/WIZ_SETUP.steps.length*100) : 0;
    return ["wizard",'<div class="card hero">'+cardHead("wand", t("wiz.setupTitle"), t("wiz.setupSub"))+
      '<div class="bar" style="margin:4px 0 12px"><i style="width:'+pct+'%"></i></div>'+
      '<div class="row"><button class="btn" id="wizgo">'+I("play")+(wz.step?t("wiz.resume"):t("wiz.start"))+'</button><button class="btn line sm" id="wizlater">'+t("wu.later")+"</button></div></div>"];
  }
  if(wt && !doneToday){
    return ["workout",'<div class="card hero">'+cardHead("dumbbell", t("home.todayWorkout"), wt.name+" · "+(wt.items||[]).length+" "+t("ex.count"))+
      '<div class="row"><button class="btn" data-run="'+wt.id+'">'+I("play")+t("home.start")+'</button><button class="btn ghost" id="warmfirst">'+I("flame")+t("wu.warmBtn")+"</button></div></div>"];
  }
  if(!STATE.workouts.length){
    return ["first",'<div class="card hero">'+cardHead("dumbbell", t("home.firstWorkout"), t("home.firstWorkoutSub"))+
      '<div class="row"><button class="btn" data-go="workout" data-sub="modelos">'+I("layers")+t("tpl.title")+'</button><button class="btn ghost" data-go="ex">'+I("book")+t("ex.title")+"</button></div></div>"];
  }
  if(!c){
    return ["checkin",'<div class="card hero">'+cardHead("clipboard", t("home.checkin"), t("ck.sub"))+
      '<div class="row"><button class="btn" data-go="progress" data-sub="hoje">'+I("check")+t("home.checkinGo")+"</button></div></div>"];
  }
  return ["done",'<div class="card hero">'+cardHead("check", t("home.allDone"), t("home.allDoneSub"))+
    '<div class="row"><button class="btn ghost" data-go="warm">'+I("flame")+t("wu.title")+'</button><button class="btn line" data-go="progress" data-sub="peso">'+I("chart")+t("nav.progress")+"</button></div></div>"];
}
SCREENS.home = function(){
  const iso=todayISO(), c=ci(iso), ms=missionsToday(), done=c?c.done.length:0;
  const w=lastWeight(), wk=weekLogs().length, kc=sumMeals(mealsOn(iso)).kcal;
  const wt=workoutToday();
  const gnames = (STATE.profile.goals||[]).map(g=>mName(g)).join(" · ");
  const first=(STATE.profile.name||t("role.guest")).split(" ")[0];
  let h='<div class="pagehead"><div><span class="kicker">'+weekdayName(new Date().getDay(),true)+" · "+fmtDate(iso)+'</span><h1>'+t("home.hi")+", "+esc(first)+"</h1></div>"+
    (role()==="guest"?'<button class="btn sm ghost" id="upgrade">'+I("user")+t("guest.upgradeShort")+"</button>":"")+"</div>";
  if(role()==="guest") h+='<p class="tiny muted" style="margin:-6px 0 12px">'+t("guest.warn")+"</p>";
  h+=updateCard();
  const ns=nextStepCard(); h+=ns[1];
  h+='<div class="grid g4" style="margin-bottom:14px">'+
     stat(t("home.weight"), w?fmtNum(w,1):"—", w?"kg":"", "")+
     stat(t("home.streak"), String(streak()), t("home.days"), "")+
     stat(t("home.week"), String(wk), "", "")+
     stat(t("home.kcal"), fmtNum(kc,0), "kcal", STATE.diet.kcal?("/ "+fmtNum(STATE.diet.kcal,0)):"")+
     "</div>";
  h+='<div class="grid g2 collapse top">';
  /* missoes */
  h+='<div class="card">'+cardHead("listcheck", t("home.missions"), done+" "+t("ck.doneOf")+" "+ms.length)+'<div class="list">';
  h+= ms.length? ms.map(m=>'<div class="item mission'+((c&&c.done.indexOf(m.id)>=0)?" done":"")+'" data-mission="'+m.id+'"><span class="bx">✓</span><div class="gr"><div class="t">'+esc(m.icon||"")+" "+esc(mTitle(m))+"</div></div></div>").join("")
       : emptyBox("listcheck", "", t("common.empty"));
  h+='</div><div class="sep"></div><button class="btn '+(c?"ghost":"")+' wide" data-go="progress" data-sub="hoje">'+I(c?"check":"clipboard")+(c?t("home.checkinDone"):t("home.checkin"))+"</button></div>";
  /* atalhos */
  h+='<div class="card">'+cardHead("zap", t("home.quick"), "")+'<div class="tiles">'+
     '<button class="tile" id="timerbtn"><span class="ibub">'+I("timer")+'</span><span class="tl">'+t("tm.short")+"</span></button>"+
     '<button class="tile" data-go="warm"><span class="ibub">'+I("flame")+'</span><span class="tl">'+t("wu.title")+"</span></button>"+
     '<button class="tile" data-go="scan"><span class="ibub">'+I("scan")+'</span><span class="tl">'+t("nav.scan")+"</span></button>"+
     '<button class="tile" data-go="body"><span class="ibub">'+I("body")+'</span><span class="tl">'+t("body.title")+"</span></button>"+
     '<button class="tile" data-go="ex"><span class="ibub">'+I("book")+'</span><span class="tl">'+t("ex.title")+"</span></button>"+
     '<button class="tile" data-go="ia"><span class="ibub">'+I("sparkles")+'</span><span class="tl">'+t("ia.title")+"</span></button>"+
     "</div></div>";
  h+="</div>";
  /* treino de hoje (quando ja feito ou quando o card principal mostra outra coisa) */
  if(wt && ns[0]!=="workout"){ h+='<div class="card">'+cardHead("dumbbell", t("home.todayWorkout"), wt.name+" · "+(wt.items||[]).length+" "+t("ex.count"),
      '<button class="btn sm" data-run="'+wt.id+'">'+I("play")+t("home.start")+"</button>")+"</div>"; }
  /* objetivos + ficha de saude */
  if(!anam().done && role()!=="guest" && ns[0]!=="wizard") h+=anamCard();
  if(gnames || role()!=="guest") h+='<div class="card">'+cardHead("target", t("home.goalsTitle"), gnames||t("home.noGoals"),
      '<button class="btn sm ghost" data-go="body">'+t("home.setGoals")+"</button>")+"</div>";
  return h;
};
function stat(lb,vl,un,dl){ return '<div class="stat"><div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+' <span class="un">'+esc(un||"")+'</span></div>'+(dl?'<div class="dl muted">'+esc(dl)+"</div>":"")+"</div>"; }
SCREENS.home_after = function(){
  const u=document.getElementById("upgrade"); if(u) u.onclick=()=>loginModal("student");
  document.querySelectorAll("[data-mission]").forEach(n=>n.onclick=()=>{
    const id=n.getAttribute("data-mission"), c=ensureCi(todayISO()); const i=c.done.indexOf(id);
    if(i>=0) c.done.splice(i,1); else c.done.push(id); save(); render();
  });
  document.querySelectorAll("[data-run]").forEach(n=>n.onclick=()=>runWorkout(n.getAttribute("data-run")));
  const tb=document.getElementById("timerbtn"); if(tb) tb.onclick=()=>openTimer();
  const anb=document.getElementById("anbtn"); if(anb) anb.onclick=()=>anamModal(1);
  const un=document.getElementById("up_now"); if(un) un.onclick=forceUpdate;
  const wg=document.getElementById("wizgo"); if(wg) wg.onclick=()=>wizRun("setup");
  const wl=document.getElementById("wizlater"); if(wl) wl.onclick=()=>{ const s=wizState("setup"); s.snoozed=todayISO(); save(); render(); };
  const wf=document.getElementById("warmfirst"); if(wf) wf.onclick=()=>{ const w=workoutToday(); const l=buildRoutine("before", autoGroupsFromWorkout(w), 5);
    if(l) runRoutine(expandRoutine(l), t("wu.warmBtn")); else toast(t("wu.noMoves")); };
};

function bodyInfo(){
  const box=document.getElementById("bodyinfo"); if(!box) return;
  if(!BODYSEL.length){ box.innerHTML=""; return; }
  let h="";
  BODYSEL.forEach(id=>{
    const m=MU[id]; if(!m) return;
    const names=(LANG==="pt"?m.pt:m.en);
    const list=EXS.concat(STATE.customEx||[]).filter(x=>x.m===id||x.sec.indexOf(id)>=0);
    h+='<div class="card"><div class="between"><div><h2 style="margin:0">'+esc(names[STATE.termsLevel-1])+'</h2>'+
       '<small class="muted">'+esc(names[0])+" · "+esc(names[1])+" · "+esc(names[2])+"</small></div>"+
       '<button class="iconbtn" data-unsel="'+id+'" title="'+t("common.close")+'">'+I("x")+'</button></div>';
    h+='<div class="sep"></div><div class="exlist">'+ (list.length?list.slice(0,60).map(exCard).join(""):'<div class="empty">'+t("common.empty")+"</div>") +"</div></div>";
  });
  box.innerHTML=h;
  wireExCards();
  box.querySelectorAll("[data-unsel]").forEach(b=>b.onclick=()=>{ BODYSEL=BODYSEL.filter(x=>x!==b.getAttribute("data-unsel")); render(); });
}
SCREENS.body_after = function(){
  document.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{ STATE.termsLevel=+b.getAttribute("data-lvl"); save(); render(); });
  document.querySelectorAll(".msc").forEach(g=>{
    const pick=()=>{ const id=g.getAttribute("data-m"); const i=BODYSEL.indexOf(id);
      if(i>=0) BODYSEL.splice(i,1); else BODYSEL=[id]; render(); };
    g.addEventListener("click",pick);
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); }});
  });
  const q=document.getElementById("goalq");
  if(q) q.oninput=()=>{
    const v=q.value.toLowerCase().trim(); const out=document.getElementById("goalout");
    if(v.length<3){ out.innerHTML=""; return; }
    const hits=new Set();
    GOALS.forEach(g=>{ if(g.k.some(k=>k.length>2 && v.indexOf(k)>=0)) g.m.forEach(m=>hits.add(m)); });
    MUSCLES.forEach(m=>{ if(m.pt.concat(m.en).some(n=>n.toLowerCase().indexOf(v)>=0)) hits.add(m.id); });
    const arr=[...hits];
    out.innerHTML = arr.length
      ? '<small class="muted">'+t("body.goalHits")+'</small><div class="chips" style="margin-top:6px">'+arr.map(id=>'<button class="chip on" data-pickm="'+id+'">'+esc(mName(id))+"</button>").join("")+"</div>"
      : '<small class="muted">'+t("body.noGoal")+"</small>";
    out.querySelectorAll("[data-pickm]").forEach(b=>b.onclick=()=>{ BODYSEL=[b.getAttribute("data-pickm")]; render(); });
  };
  bodyInfo();
};

function filterEx(){

/* ---------- 18. CAMERA E IMAGENS ---------- */
function resizeImage(src, max, cb){
  const img=new Image();
  img.onload=function(){
    let w=img.width,h=img.height; const sc=Math.min(1, max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",0.82));
  };
  img.onerror=function(){ toast(LANG==="pt"?"Não consegui abrir a imagem.":"Could not open the image."); };
  img.src=src;
}
function readFile(file, cb){ const r=new FileReader(); r.onload=()=>resizeImage(r.result,1400,cb); r.readAsDataURL(file); }
let CAMSTREAM=null, CAMFACING="environment";
function stopCam(){ if(CAMSTREAM){ CAMSTREAM.getTracks().forEach(tr=>tr.stop()); CAMSTREAM=null; } }
function pickImage(cb){
  const m=modal(mh(t("common.photo"))+
    '<div id="camwrap"></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="opencam">'+I("camera")+t("sc.camera")+'</button>'+
    '<label class="btn ghost" style="cursor:pointer">'+I("upload")+t("sc.upload")+'<input type="file" accept="image/*" id="fileinp" style="display:none"></label></div>'+
    '<p class="tiny muted" style="margin-top:8px">'+t("sc.tip")+"</p>",{sticky:false});
  m.addEventListener("click",e=>{ if(e.target===m) stopCam(); });
  m.querySelector("[data-close]").addEventListener("click",stopCam);
  m.querySelector("#fileinp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; readFile(f,d=>{ stopCam(); m.remove(); cb(d); }); };
  m.querySelector("#opencam").onclick=()=>startCam(m.querySelector("#camwrap"), d=>{ stopCam(); m.remove(); cb(d); });
}
function startCam(host, cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast(t("sc.noCam")); return; }
  host.innerHTML='<video class="camprev" autoplay playsinline muted></video>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="shoot">'+I("camera")+t("sc.shoot")+'</button>'+
    '<button class="btn line" id="flip">'+I("refresh")+t("sc.switch")+'</button><button class="btn line" id="stopc">'+t("sc.stop")+"</button></div>";
  const v=host.querySelector("video");
  const open=()=>{ stopCam();
    navigator.mediaDevices.getUserMedia({video:{facingMode:CAMFACING,width:{ideal:1280}},audio:false})
      .then(s=>{ CAMSTREAM=s; v.srcObject=s; })
      .catch(()=>{ toast(t("sc.denied")); host.innerHTML=""; });
  };
  open();
  host.querySelector("#flip").onclick=()=>{ CAMFACING=(CAMFACING==="environment")?"user":"environment"; open(); };
  host.querySelector("#stopc").onclick=()=>{ stopCam(); host.innerHTML=""; };
  host.querySelector("#shoot").onclick=()=>{
    if(!v.videoWidth){ toast(t("sc.noCam")); return; }
    const cv=document.createElement("canvas"); cv.width=v.videoWidth; cv.height=v.videoHeight;
    cv.getContext("2d").drawImage(v,0,0);
    resizeImage(cv.toDataURL("image/jpeg",0.9),1400,cb);
  };
}

  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    let i=0; const n=times||3;
    const one=()=>{ const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value= i%2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.35);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.36);
      if(++i<n) setTimeout(one,420); };
    one();
  }catch(e){}
  if(navigator.vibrate) try{ navigator.vibrate([200,100,200,100,300]); }catch(e){}
}

/* ---------- 21. CRONOMETRO DE TELA CHEIA (regressivo e progressivo) ---------- */
const TIMER = {
  mode:"down", total:60, left:60, up:0, running:false, ringing:false,
  endAt:0, startedAt:0, accum:0, tick:null, ringTick:null,
  alarm:true, vibrate:true, awake:true, wake:null, awakeVideo:null, awakeInt:null,
  onEnd:null, el:null, mini:null, autoBack:false, autoT:null
};
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60, p=n=>String(n).padStart(2,"0");
  return h? (h+":"+p(m)+":"+p(s)) : (p(m)+":"+p(s));
}
/* --- manter a tela acesa --- */
function keepAwake(){
  if(!TIMER.awake) return;
  if(navigator.wakeLock && navigator.wakeLock.request){
    navigator.wakeLock.request("screen").then(w=>{ TIMER.wake=w; paintAwake(); })
      .catch(()=>{ awakeFallback(); });
  } else awakeFallback();
}
function awakeFallback(){
  if(TIMER.awakeVideo) return;
  try{
    const cv=document.createElement("canvas"); cv.width=cv.height=2;
    const cx=cv.getContext("2d"); let i=0;
    TIMER.awakeInt=setInterval(()=>{ cx.fillStyle=(i++%2)?"#000000":"#010101"; cx.fillRect(0,0,2,2); },900);
    const st=cv.captureStream(2);
    const v=document.createElement("video");
    v.srcObject=st; v.muted=true; v.defaultMuted=true; v.loop=true;
    v.setAttribute("playsinline",""); v.setAttribute("muted","");
    v.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none";
    document.body.appendChild(v); v.play().catch(()=>{});
    TIMER.awakeVideo=v;
  }catch(e){}
  paintAwake();
}
function releaseAwake(){
  try{ if(TIMER.wake && TIMER.wake.release) TIMER.wake.release(); }catch(e){}
  TIMER.wake=null;
  if(TIMER.awakeInt){ clearInterval(TIMER.awakeInt); TIMER.awakeInt=null; }
  if(TIMER.awakeVideo){ try{ TIMER.awakeVideo.pause(); const st=TIMER.awakeVideo.srcObject;
    if(st) st.getTracks().forEach(tr=>tr.stop()); }catch(e){}
    TIMER.awakeVideo.remove(); TIMER.awakeVideo=null; }
  paintAwake();
}
function awakeActive(){ return !!(TIMER.wake || TIMER.awakeVideo); }
function paintAwake(){
  const n=document.getElementById("tawake");
  if(!n) return;
  if(!TIMER.awake) n.textContent = "💤 "+t("tm.awakeOff");
  else n.textContent = awakeActive()? ("🔆 "+t("tm.awakeOn")) : ("🔆 "+t("tm.awakeWhen"));
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && TIMER.running && TIMER.awake && !awakeActive()) keepAwake();
  if(TIMER.el) paintTimer();
});

/* --- abrir / fechar --- */
function openTimer(seconds, onEnd, autostart, autoBack){
  TIMER.autoBack=!!autoBack;
  if(TIMER.autoT){ clearTimeout(TIMER.autoT); TIMER.autoT=null; }
  if(seconds){ TIMER.mode="down"; TIMER.total=seconds; TIMER.left=seconds; TIMER.endAt=0; TIMER.running=false;
    if(typeof SER!=="undefined"){ clearInterval(SER.tick); SER.tick=null; SER.running=false; SER.done=false; } }
  TIMER.onEnd=onEnd||null;
  if(TIMER.mini){ TIMER.mini.remove(); TIMER.mini=null; }
  if(!TIMER.el){
    const d=document.createElement("div"); d.id="timerscreen"; document.body.appendChild(d); TIMER.el=d; document.body.classList.add("fs");
  }
  buildTimer();
  if(autostart && !TIMER.running) startTimer();
}
function closeTimer(){
  if(TIMER.autoT){ clearTimeout(TIMER.autoT); TIMER.autoT=null; }
  TIMER.autoBack=false;
  if(typeof SER!=="undefined" && SER.tick){ clearInterval(SER.tick); SER.tick=null; SER.running=false; }
  stopRing(); pauseTimer(); releaseAwake();
  if(TIMER.el){ TIMER.el.remove(); TIMER.el=null; }
  if(TIMER.mini){ TIMER.mini.remove(); TIMER.mini=null; }
  document.body.classList.remove("fs");
  TIMER.mode==="up" ? (TIMER.up=0, TIMER.accum=0) : (TIMER.left=TIMER.total);
}
function minimizeTimer(){
  if(TIMER.el){ TIMER.el.remove(); TIMER.el=null; }
  document.body.classList.remove("fs");
  if(!TIMER.mini){
    const b=document.createElement("button"); b.id="timermini";
    b.onclick=()=>openTimer(); document.body.appendChild(b); TIMER.mini=b;
  }
  paintTimer();
}
/* --- controle --- */
function timerValue(){
  if(TIMER.mode==="down"){
    if(TIMER.running) return Math.max(0,(TIMER.endAt-Date.now())/1000);
    return TIMER.left;
  }
  return TIMER.accum + (TIMER.running? (Date.now()-TIMER.startedAt)/1000 : 0);
}
function startTimer(){
  stopRing();
  if(TIMER.mode==="down"){
    if(TIMER.left<=0) TIMER.left=TIMER.total||60;
    TIMER.endAt=Date.now()+TIMER.left*1000;
  } else TIMER.startedAt=Date.now();
  TIMER.running=true;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  keepAwake();
  clearInterval(TIMER.tick);
  TIMER.tick=setInterval(timerStep,200);
  paintTimer();
}
function pauseTimer(){
  if(TIMER.running){
    if(TIMER.mode==="down") TIMER.left=Math.max(0,(TIMER.endAt-Date.now())/1000);
    else TIMER.accum=TIMER.accum+(Date.now()-TIMER.startedAt)/1000;
  }
  TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  paintTimer();
}
function resetTimer(){
  stopRing(); TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  if(TIMER.mode==="down"){ TIMER.left=TIMER.total; TIMER.endAt=0; }
  else { TIMER.up=0; TIMER.accum=0; TIMER.startedAt=0; }
  paintTimer();
}
function setTimerMode(md){
  if(md==="series" && !canUse("series")) return gotItLocked("series");
  if(TIMER.mode===md) return;
  stopRing(); TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  if(typeof SER!=="undefined"){ clearInterval(SER.tick); SER.tick=null; SER.running=false; SER.done=false; }
  TIMER.mode=md;
  if(md==="down"){ TIMER.left=TIMER.total||60; TIMER.endAt=0; }
  else if(md==="up"){ TIMER.accum=0; TIMER.up=0; }
  buildTimer();
}
function adjustTimer(sec){
  if(TIMER.mode!=="down") return;
  const cur=timerValue();
  const v=Math.max(5, Math.min(24*3600, Math.round(cur+sec)));
  TIMER.left=v; TIMER.total=Math.max(TIMER.total,v);
  if(TIMER.running) TIMER.endAt=Date.now()+v*1000;
  paintTimer();
}
function setPreset(sec){
  stopRing(); TIMER.mode="down"; TIMER.total=sec; TIMER.left=sec;
  if(TIMER.running) TIMER.endAt=Date.now()+sec*1000;
  paintTimer();
}
function timerStep(){
  if(TIMER.mode==="down"){
    const v=timerValue();
    if(v<=0.05){
      TIMER.left=0; TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
      startRing();
      if(TIMER.onEnd){ const f=TIMER.onEnd; TIMER.onEnd=null; try{ f(); }catch(e){} }
    }
  }
  paintTimer();
}
/* --- configuracao do alarme --- */
function alarmCfg(){
  STATE.settings=STATE.settings||{};
  const d={mode:"short", shortSec:5, every:60, times:0, sound:true, vibrate:true};
  STATE.settings.alarm=STATE.settings.alarm||{};
  for(const k in d) if(STATE.settings.alarm[k]===undefined) STATE.settings.alarm[k]=d[k];
  return STATE.settings.alarm;
}
/* --- alarme --- */
function startRing(){
  const cfg=alarmCfg();
  TIMER.ringing=true; TIMER.ringCount=0;
  if(TIMER.el) TIMER.el.classList.add("ring");
  const fire=()=>{
    TIMER.ringCount++;
    if(cfg.sound!==false) beep(3);
    if(cfg.vibrate!==false && navigator.vibrate){ try{ navigator.vibrate([300,120,300,120,500]); }catch(e){} }
  };
  clearInterval(TIMER.ringTick); TIMER.ringTick=null;
  if(TIMER.ringStop){ clearTimeout(TIMER.ringStop); TIMER.ringStop=null; }
  fire();
  if(cfg.mode==="short"){
    const secs=Math.max(1,num(cfg.shortSec,5));
    TIMER.ringTick=setInterval(fire,1400);
    TIMER.ringStop=setTimeout(()=>{ stopRing(); if(TIMER.autoBack) closeTimer(); paintTimer(); }, secs*1000);
  } else if(cfg.mode==="repeat"){
    const every=Math.max(5,num(cfg.every,60))*1000, times=num(cfg.times,0);
    TIMER.ringTick=setInterval(()=>{ fire(); if(times>0 && TIMER.ringCount>=times){ stopRing(); paintTimer(); } }, every);
  } else {
    TIMER.ringTick=setInterval(fire,2200);
    if(TIMER.autoBack){ TIMER.ringStop=setTimeout(()=>{ stopRing(); closeTimer(); }, 6500); }
  }
  if(!TIMER.el){
    toast("⏰ "+t("tm.over"));
    const nc=notifCfg();
    if(nc.on && nc.types.descanso.on) notifyNow("RiseONE", t("nt.descansoMsg"), "descanso");
  }
  paintTimer();
}
function stopRing(){
  if(TIMER.ringTick){ clearInterval(TIMER.ringTick); TIMER.ringTick=null; }
  if(TIMER.ringStop){ clearTimeout(TIMER.ringStop); TIMER.ringStop=null; }
  if(navigator.vibrate){ try{ navigator.vibrate(0); }catch(e){} }
  TIMER.ringing=false; TIMER.ringCount=0;
  if(TIMER.el) TIMER.el.classList.remove("ring");
}

      '<div class="sep"></div>'+alarmBlock()+
    "</div>";
  const q=id=>TIMER.el.querySelector(id);

    const p=SER_PRESETS.find(x=>x.id===b.getAttribute("data-spre"));
    if(p){ Object.assign(serCfg(), p.c); save(); buildSeries(); } });
  const bump=(id,d)=>{ const n=TIMER.el.querySelector("#s_"+id); const st=+n.step||1;
    n.value=Math.max(+n.min, Math.min(+n.max, (+n.value||0)+d*st)); commit(); };
  const commit=()=>{ ["prep","work","rest","reps","blocks","blockRest"].forEach(k=>{
      const n=TIMER.el.querySelector("#s_"+k); if(n) c[k]=Math.max(+n.min,Math.min(+n.max,num(n.value,c[k]))); });
    save(); buildSeries(); };
  TIMER.el.querySelectorAll("[data-sdec]").forEach(b=>b.onclick=()=>bump(b.getAttribute("data-sdec"),-1));
  TIMER.el.querySelectorAll("[data-sinc]").forEach(b=>b.onclick=()=>bump(b.getAttribute("data-sinc"),1));
  TIMER.el.querySelectorAll(".sernum input").forEach(n=>n.onchange=commit);
  q("#sgo").onclick=startSeries;
  wireAlarmBlock(TIMER.el);
  paintAwake();
}
function startSeries(){
  SER.list=serBuildList(); SER.total=serTotal(SER.list);
  if(!SER.list.length) return;
  SER.i=0; SER.done=false; SER.lastBeep=-1; SER.started=Date.now();
  SER.left=SER.list[0].s; SER.endAt=Date.now()+SER.left*1000; SER.running=true;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  keepAwake(); beep(1);
  clearInterval(SER.tick); SER.tick=setInterval(serStep,200);
  paintSeriesScreen();
}
function serLeft(){ return SER.running? Math.max(0,(SER.endAt-Date.now())/1000) : SER.left; }
function serRemaining(){
  let rest=serLeft();
  for(let k=SER.i+1;k<SER.list.length;k++) rest+=SER.list[k].s;
  return rest;
}
function serPause(){
  if(SER.running){ SER.left=serLeft(); SER.running=false; clearInterval(SER.tick); SER.tick=null; }
  else { SER.endAt=Date.now()+SER.left*1000; SER.running=true; clearInterval(SER.tick); SER.tick=setInterval(serStep,200); keepAwake(); }
  paintSeries();
}
function serGo(n){
  const i=SER.i+n; if(i<0) return;
  if(i>=SER.list.length){ serFinish(); return; }
  SER.i=i; SER.lastBeep=-1; SER.left=SER.list[i].s; SER.endAt=Date.now()+SER.left*1000;
  if(!SER.running){ SER.running=true; clearInterval(SER.tick); SER.tick=setInterval(serStep,200); }
  paintSeriesScreen();
}
function serStep(){
  const v=serLeft(), r=Math.ceil(v);
  if(r<=3 && r>0 && r!==SER.lastBeep){ SER.lastBeep=r; beep(1); }
  if(v<=0.05){
    if(SER.i>=SER.list.length-1){ serFinish(); return; }
    SER.i++; SER.lastBeep=-1; SER.left=SER.list[SER.i].s; SER.endAt=Date.now()+SER.left*1000;
    beep(SER.list[SER.i].t==="work"?2:1);
    paintSeriesScreen(); return;
  }
  paintSeries();
}
function serFinish(){
  clearInterval(SER.tick); SER.tick=null; SER.running=false; SER.done=true;
  const dur=Math.round((Date.now()-SER.started)/1000);
  STATE.wuLogs=STATE.wuLogs||[];
  STATE.wuLogs.push({id:uid(), date:todayISO(), name:t("tm.series")+" "+serCfg().work+"/"+serCfg().rest, dur, moves:SER.list.filter(x=>x.t==="work").length});
  save(); startRing();
  paintSeriesScreen();
}
function serReset(){
  stopRing(); clearInterval(SER.tick); SER.tick=null;
  SER.running=false; SER.done=false; SER.i=0; SER.list=[];
  buildSeries();
}
function paintSeriesScreen(){

  }
  const it=SER.list[SER.i]||{t:"work",s:0,r:1,b:1}, nx=SER.list[SER.i+1];
  const c=serCfg();
  TIMER.el.innerHTML=
    '<div class="thead"><button class="iconbtn" id="tclose">&times;</button>'+

    '<div class="tmid"><div id="tsub" style="color:'+serColor(it.t)+'">'+serLabel(it.t)+'</div>'+
      '<div id="tdigits" style="color:'+serColor(it.t)+'">00:00</div>'+
      '<div class="tiny muted">'+t("tm.remaining")+" "+fmtClock(serRemaining())+"</div></div>"+
    '<div class="tfoot">'+
      (nx?'<div class="tiny muted" style="text-align:center;margin-bottom:8px">'+t("wu.next")+": "+serLabel(nx.t)+" · "+nx.s+"s</div>":"")+
      '<div class="tctl"><button class="btn ghost" id="sprev">⏮ '+t("wu.prevm")+'</button>'+

      '<div class="tiny muted" id="tawake" style="text-align:center;margin-top:8px"></div></div>';
  const q=id=>TIMER.el.querySelector(id);
  q("#tclose").onclick=()=>{ serReset(); closeTimer(); };
  q("#tmin").onclick=minimizeTimer;
  q("#sfin").onclick=serFinish;
  q("#sprev").onclick=()=>serGo(-1);
  q("#snext").onclick=()=>serGo(1);
  q("#splay").onclick=serPause;
  paintAwake(); paintSeries();
}
function paintSeries(){
  const v=serLeft(), it=SER.list[SER.i];
  if(TIMER.mini) TIMER.mini.innerHTML=(SER.running?I("refresh"):I("pause"))+"<span>"+fmtClock(v)+"</span>";
  if(!TIMER.el || SER.done || !it) return;
  const d=TIMER.el.querySelector("#tdigits"); if(!d) return;
  d.textContent=fmtClock(v);
  const pr=TIMER.el.querySelector("#sprog"); if(pr) pr.style.width=Math.max(0,Math.min(100,v/it.s*100))+"%";
  const pl=TIMER.el.querySelector("#splay"); if(pl) pl.innerHTML=SER.running?("⏸ "+t("tm.pause")):("▶ "+t("tm.resume"));
  const rm=TIMER.el.querySelector(".tmid .tiny"); if(rm) rm.textContent=t("tm.remaining")+" "+fmtClock(serRemaining());
}

function runWorkout(id){
  const w=STATE.workouts.find(x=>x.id===id); if(!w||!(w.items||[]).length){ toast(t("wk.empty")); return; }
  let idx=0, started=Date.now();
  const prog=w.items.map(it=>({exId:it.exId, target:it.sets, reps:it.reps, load:it.load||0, sets:[]}));
  const m=modal("<div id='runbox'></div>",{wide:true,sticky:true});
  function paint(){
    const it=w.items[idx], p=prog[idx], x=allEx().find(e=>e.id===it.exId);
    const eq=EQUIP[x?x.eq:""];
    m.querySelector("#runbox").innerHTML=
      '<div class="mh"><div><span class="pill acc">'+t("wk.running")+'</span><h3 style="margin:.3em 0 0">'+esc(w.name)+"</h3></div><button class='iconbtn' id='rclose'>&times;</button></div>"+
      '<div class="bar" style="margin:6px 0 12px"><i style="width:'+((idx)/w.items.length*100)+'%"></i></div>'+
      (idx===0?'<div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="r_warm">'+I("flame")+t("wu.warmBtn")+"</button></div>":"")+

      '<div><h2 style="margin:0">'+esc(x?exName(x):it.exId)+'</h2><small class="muted">'+esc(x?mName(x.m):"")+" · "+(idx+1)+"/"+w.items.length+"</small></div></div>"+
      '<p class="tiny muted" style="margin:.6em 0 0">'+esc(x?exTip(x):"")+"</p>"+
      (itemNote(it)?'<p class="tiny" style="margin:.4em 0 0;font-weight:700">'+I("info")+" "+esc(itemNote(it))+"</p>":"")+
      (x?photoStrip(x.id):"")+
      ((x&&exWarn(x))?'<p class="tiny" style="color:var(--warn);font-weight:700;margin:.4em 0 0">⚠ '+t("an.warnEx")+": "+esc(exWarn(x))+"</p>":"")+"</div>"+
      '<div class="grid g2"><label class="fld"><span>'+t("wk.reps")+'</span><input id="r_reps" type="text" value="'+esc(p.reps)+'"></label>'+
      '<label class="fld"><span>'+t("wk.load")+' (kg)</span><input id="r_load" type="number" step="0.5" value="'+p.load+'"></label></div>'+
      '<div class="row">'+p.sets.map((s,i)=>'<span class="pill ok">'+(i+1)+": "+s.reps+"×"+fmtNum(s.load,1)+"</span>").join("")+
      '<span class="pill">'+p.sets.length+" / "+p.target+"</span></div>"+
      '<div class="row" style="margin-top:12px"><button class="btn" id="r_set">'+I("check")+t("wk.setDone")+'</button>'+
      '<button class="btn ghost" id="r_rest">'+I("timer")+t("wk.restNow")+" ("+(it.rest||60)+"s)</button>"+
      '<button class="btn line" id="r_prev" '+(idx===0?"disabled":"")+">"+I("chevl")+t("wk.prev")+'</button>'+
      '<button class="btn line" id="r_next" '+(idx>=w.items.length-1?"disabled":"")+">"+t("wk.next")+I("chevr")+'</button>'+
      ((x&&exAnimId(x))?'<button class="btn line" id="r_mir">'+I("video")+t("mir.open")+"</button>":"")+"</div>"+
      '<div class="sep"></div><button class="btn wide" id="r_fin">'+I("check")+t("wk.finish")+"</button>";
    initAnims(m);
    m.querySelector("#rclose").onclick=()=>{ if(confirm(LANG==="pt"?"Sair sem salvar o treino?":"Leave without saving the workout?")) m.remove(); };
    m.querySelector("#r_set").onclick=()=>{
      p.reps=m.querySelector("#r_reps").value; p.load=num(m.querySelector("#r_load").value,0);
      p.sets.push({reps:p.reps, load:p.load});
      if(p.sets.length>=p.target && idx<w.items.length-1){ idx++; paint(); timerModal(it.rest||60); }
      else { paint(); timerModal(it.rest||60); }
    };
    m.querySelector("#r_rest").onclick=()=>timerModal(it.rest||60);
    const rmr=m.querySelector("#r_mir");
    if(rmr) rmr.onclick=()=>openMirror(exAnimId(x), exName(x));
    const rw=m.querySelector("#r_warm");
    if(rw) rw.onclick=()=>{ const l=buildRoutine("before", autoGroupsFromWorkout(w), 5);
      if(l) runRoutine(expandRoutine(l), t("wu.warmBtn")); else toast(t("wu.noMoves")); };
    m.querySelector("#r_prev").onclick=()=>{ if(idx>0){ idx--; paint(); } };
    m.querySelector("#r_next").onclick=()=>{ if(idx<w.items.length-1){ idx++; paint(); } };
    m.querySelector("#r_fin").onclick=()=>{
      const dur=Math.round((Date.now()-started)/1000);
      let vol=0, any=false;
      prog.forEach(p=>p.sets.forEach(s=>{ vol+=(num(s.reps,0)*num(s.load,0)); any=true; }));
      STATE.logs.push({id:uid(), date:todayISO(), workoutId:w.id, name:w.name, dur, volume:Math.round(vol),
        items:prog.map(p=>({exId:p.exId, sets:p.sets}))});
      const c=ensureCi(todayISO());
      const trainMission=STATE.missions.find(mm=>/train|trein/i.test(mTitle(mm)));
      if(trainMission && c.done.indexOf(trainMission.id)<0) c.done.push(trainMission.id);
      save(); m.remove(); go("workout"); offerStretch(w);
    };
  }
  paint();
}

function ringSVG(v,total){
  const pct = total? Math.min(v/total,1.35) : 0, r=52, c=2*Math.PI*r, off=c*(1-Math.min(pct,1));

function calcDiet(){

/* ---------- 25. GRAFICOS (canvas) ---------- */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv,h){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||300;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  return {c,w,h};
}
function lineChart(cv, pts, opts){
  opts=opts||{}; if(!cv) return;
  const H=opts.height||190, {c,w,h}=setupCanvas(cv,H);
  const pad={l:44,r:12,t:12,b:26};
  const gw=w-pad.l-pad.r, gh=h-pad.t-pad.b;
  if(pts.length<2){ c.fillStyle=cssVar("--text3"); c.font="13px sans-serif"; c.textAlign="center";
    c.fillText(opts.emptyMsg||t("pg.needData"), w/2, h/2); return; }
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){ mn-=1; mx+=1; } const padY=(mx-mn)*0.15; mn-=padY; mx+=padY;
  const X=i=>pad.l+(gw*(i/(pts.length-1))), Y=v=>pad.t+gh-((v-mn)/(mx-mn))*gh;
  /* grade */
  c.strokeStyle=cssVar("--grid"); c.lineWidth=1; c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="right";
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Math.round(Y(v))+0.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke();
    c.fillText(fmtNum(v,1), pad.l-7, y+4); }
  /* linha */
  c.strokeStyle=opts.color||cssVar("--s1"); c.lineWidth=2; c.lineJoin="round"; c.lineCap="round";
  c.beginPath(); pts.forEach((p,i)=>{ const x=X(i),y=Y(p.y); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  /* marcas */
  c.fillStyle=opts.color||cssVar("--s1");
  pts.forEach((p,i)=>{ if(pts.length>40 && i%Math.ceil(pts.length/40)) return;
    c.beginPath(); c.arc(X(i),Y(p.y),4,0,7); c.fill();
    c.strokeStyle=cssVar("--surface"); c.lineWidth=2; c.stroke(); });
  /* rotulos de eixo x: primeiro, meio, ultimo */
  c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="center";
  [0,Math.floor((pts.length-1)/2),pts.length-1].forEach(i=>{ c.fillText(pts[i].label, Math.min(Math.max(X(i),24),w-24), h-8); });
  /* rotulos diretos do primeiro e ultimo valor */
  c.fillStyle=cssVar("--text"); c.font="700 12px sans-serif"; c.textAlign="left";
  c.fillText(fmtNum(pts[pts.length-1].y,1), Math.min(X(pts.length-1)+8,w-38), Y(pts[pts.length-1].y)-8);
  /* interacao */
  cv.onmousemove=e=>{
    const r=cv.getBoundingClientRect(), mxp=e.clientX-r.left;
    let idx=Math.round((mxp-pad.l)/gw*(pts.length-1)); idx=Math.max(0,Math.min(pts.length-1,idx));
    const tip=cv.parentNode.querySelector(".chtip");
    if(tip){ tip.style.display="block"; tip.style.left=Math.min(Math.max(X(idx),50),w-50)+"px";
      tip.textContent=pts[idx].label+" · "+fmtNum(pts[idx].y,1)+(opts.unit?(" "+opts.unit):""); }
  };
  cv.onmouseleave=()=>{ const tip=cv.parentNode.querySelector(".chtip"); if(tip) tip.style.display="none"; };
}
function barChart(cv, pts, opts){
  opts=opts||{}; if(!cv) return;
  const H=opts.height||170, {c,w,h}=setupCanvas(cv,H);
  const pad={l:34,r:10,t:22,b:26}, gw=w-pad.l-pad.r, gh=h-pad.t-pad.b;
  if(!pts.length){ c.fillStyle=cssVar("--text3"); c.font="13px sans-serif"; c.textAlign="center"; c.fillText(t("common.empty"), w/2, h/2); return; }
  const mx=Math.max(1,...pts.map(p=>p.y));
  c.strokeStyle=cssVar("--grid"); c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="right";
  for(let i=0;i<=3;i++){ const v=mx*i/3, y=Math.round(pad.t+gh-(v/mx)*gh)+0.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke(); c.fillText(fmtNum(v,0), pad.l-6, y+4); }
  const bw=Math.min(38, gw/pts.length - 6), step=gw/pts.length;
  pts.forEach((p,i)=>{
    const x=pad.l+step*i+(step-bw)/2, bh=Math.max(2,(p.y/mx)*gh), y=pad.t+gh-bh;
    c.fillStyle=opts.color||cssVar("--s1");
    c.beginPath();
    if(c.roundRect) c.roundRect(x,y,bw,bh,[4,4,0,0]); else c.rect(x,y,bw,bh);
    c.fill();
    c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="center";
    c.fillText(p.label, x+bw/2, h-8);
    if(p.y>0){ c.fillStyle=cssVar("--text"); c.font="700 11px sans-serif"; c.fillText(String(p.y), x+bw/2, y-4); }
  });
}
