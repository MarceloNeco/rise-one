<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RiseONE — treino, dieta e evolucao em um so lugar. / RiseONE — workout, diet and progress in one place.">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiseONE">
<title>RiseONE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Cpath d='M14 44 L24 24 L32 36 L40 16 L50 44' fill='none' stroke='%23ff7a2f' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0f1115; --surface:#171a20; --surface2:#1d222a; --surface3:#242a34;
  --border:#2a303b; --text:#f2f4f8; --text2:#a7b0bf; --text3:#7b8494;
  --accent:#ff7a2f; --accent-ink:#1a0c02; --accent-soft:rgba(255,122,47,.14);
  --ok:#2ecc8f; --warn:#ffb020; --bad:#ff5d5d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#262c36;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --radius:16px; --radius-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f5; --surface3:#e4e9f0;
  --border:#dce1e9; --text:#10131a; --text2:#59616f; --text3:#828b99;
  --accent:#d95f0f; --accent-ink:#ffffff; --accent-soft:rgba(217,95,15,.10);
  --ok:#0f9d6a; --warn:#b97b00; --bad:#d63b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e3e7ee;
  --shadow:0 8px 24px rgba(15,20,30,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:700}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem} h4{font-size:.92rem}
p{margin:0 0 .7em}
small{color:var(--text2)}
.muted{color:var(--text2)}
.tiny{font-size:.78rem}
.hidden{display:none !important}
.center{text-align:center}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}

/* ============ AD BANNER ============ */
#adbar{background:linear-gradient(90deg,var(--surface2),var(--surface3));border-bottom:1px solid var(--border);position:relative}
#adbar .adinner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 40px 8px 14px}
#adbar a.adlink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);flex:1;min-width:0}
#adbar .adbox{flex:1;min-width:0;border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;letter-spacing:.04em;font-size:.85rem;color:var(--accent);text-align:center}
#adbar .adtag{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);flex-shrink:0}
#adclose{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--border);
  color:var(--text2);width:28px;height:28px;border-radius:50%;cursor:pointer;line-height:1;font-size:15px}
#adclose:hover{color:var(--text)}

/* ============ HEADER ============ */
header.app{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.hrow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.18rem;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0}
.brand .mark{width:30px;height:30px;flex-shrink:0}
.brand .one{color:var(--accent)}
.spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:38px;height:38px;border-radius:11px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:.15s}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#langbtn{width:auto;padding:0 12px;font-weight:800;font-size:.8rem;letter-spacing:.06em;gap:6px}
#langbtn .flag{font-size:1rem}
.whoami{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:5px 10px;cursor:pointer;max-width:190px}
.whoami .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.75rem;flex-shrink:0}
.whoami .nm{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){
  .hrow{gap:6px;padding:8px 10px}
  .brand{font-size:1rem} .brand .mark{width:26px;height:26px}
  #sharebtn{display:none}
  .iconbtn{width:34px;height:34px;border-radius:9px}
  #langbtn{padding:0 8px}
  .whoami{max-width:112px;padding:4px 7px}
  .whoami .av{width:22px;height:22px;font-size:.7rem}
  .whoami .nm{font-size:.74rem}
}
@media(max-width:380px){ .whoami .nm{display:none} }

/* ============ NAV ============ */
nav.tabs{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text2);padding:7px 13px;border-radius:999px;
  cursor:pointer;white-space:nowrap;font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:.15s}
nav.tabs button:hover{color:var(--text);background:var(--surface)}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button .ic{font-size:1rem}

/* bottom bar (mobile) */
#bottombar{display:none}
@media(max-width:820px){
  nav.tabs{display:none}
  #bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  #bottombar button{flex:1;background:none;border:0;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:4px 2px;cursor:pointer;font-size:.63rem;font-weight:600;border-radius:10px}
  #bottombar button .ic{font-size:1.25rem;line-height:1}
  #bottombar button span:last-child{white-space:normal;line-height:1.05;font-size:.58rem;max-width:100%}
  #bottombar button.active{color:var(--accent)}
  main{padding-bottom:78px !important}
}

/* ============ CARDS / LAYOUT ============ */
main{padding:16px 0 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.card h2,.card h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.g2.collapse,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sep{height:1px;background:var(--border);margin:12px 0}

/* ============ CONTROLS ============ */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:9px 15px;border-radius:11px;
  cursor:pointer;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.line{background:transparent;color:var(--text2);border-color:var(--border)}
.btn.line:hover{color:var(--accent);border-color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:9px}
.btn.xs{padding:3px 8px;font-size:.72rem;border-radius:7px}
.btn.wide{width:100%;justify-content:center}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.fld{display:block;margin-bottom:10px}
label.fld > span{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:4px;font-weight:700}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=email],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 11px;border-radius:999px;
  cursor:pointer;font-size:.8rem;font-weight:600;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--text3)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);
  padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--text2)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer}
.switch input{display:none}
.switch .tr{width:42px;height:24px;border-radius:999px;background:var(--surface3);border:1px solid var(--border);position:relative;transition:.2s;flex-shrink:0}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text3);transition:.2s}
.switch input:checked + .tr{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked + .tr::after{left:20px;background:var(--accent)}

/* ============ STAT TILES ============ */
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.stat .lb{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:700}
.stat .vl{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.stat .un{font-size:.78rem;color:var(--text2);font-weight:600}
.stat .dl{font-size:.74rem;margin-top:2px}

/* ============ BODY MAP ============ */
.bodywrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bodyfig{flex:1;min-width:145px;max-width:300px;text-align:center}
.bodyfig svg{width:100%;height:auto;max-height:440px}
.bodyfig .cap{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:2px}
.msc{fill:var(--surface3);stroke:var(--border);stroke-width:1.2;cursor:pointer;transition:fill .15s,stroke .15s}
.msc:hover{fill:color-mix(in srgb,var(--accent) 45%,var(--surface3));stroke:var(--accent)}
.msc.sel{fill:var(--accent);stroke:var(--accent)}
.bodybase{fill:var(--surface2);stroke:var(--border);stroke-width:1.2}
.bodyline{fill:none;stroke:var(--border);stroke-width:1.2}

/* ============ EXERCISE CARDS ============ */
.exlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ex{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;display:flex;flex-direction:column;gap:7px}
.ex .exh{display:flex;gap:9px;align-items:flex-start}
.ex .eqic{width:44px;height:44px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:4px}
.ex .eqic svg{width:100%;height:100%;display:block}
.ex .nm{font-weight:700;font-size:.92rem;line-height:1.25}
.ex .tech{font-size:.7rem;color:var(--text3);font-style:italic}
.ex .tip{font-size:.8rem;color:var(--text2)}
.ex .exf{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.eqcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.eqcard svg{width:100%;height:70px}
.eqcard img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.eqcard .nm{font-weight:700;font-size:.84rem;margin-top:5px}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(4,6,10,.72);backdrop-filter:blur(3px)}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
  width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px}
.modal .box.wide{max-width:860px}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.modal .mh h2,.modal .mh h3{margin:0}

/* ============ MISC ============ */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px}
.item .gr{flex:1;min-width:0}
.item .t{font-weight:700;font-size:.9rem}
.item .s{font-size:.77rem;color:var(--text2)}
.mission{cursor:pointer;user-select:none}
.mission .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:.9rem;flex-shrink:0;color:transparent;transition:.15s}
.mission.done .bx{background:var(--ok);border-color:var(--ok);color:#03150e}
.mission.done .t{text-decoration:line-through;color:var(--text2)}
.bar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.photo{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.photo img{width:100%;height:170px;object-fit:cover;display:block}
.photo .pd{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;
  padding:16px 8px 6px;font-size:.72rem;font-weight:700}
.photo .px{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border:0;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
canvas.chart{width:100%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--text2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{text-align:center;color:var(--text3);padding:22px 10px;font-size:.87rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:200;background:var(--surface);color:var(--text);
  border:1px solid var(--accent);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);font-size:.86rem;font-weight:600;max-width:90vw}
table.tbl{width:100%;border-collapse:collapse;font-size:.83rem}
table.tbl th,table.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
table.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2)}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.camprev{width:100%;max-height:52vh;background:#000;border-radius:12px;display:block}
.ocrbox{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.8rem;
  white-space:pre-wrap;max-height:180px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.level-badge{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* ============ CRONOMETRO ============ */
#timerscreen{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}
#timerscreen.ring{animation:tflash 1s steps(1,end) infinite}
@keyframes tflash{0%{background:var(--bg)}50%{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}}
#timerscreen .thead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#timerscreen .tmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:38vh}
#tdigits{font-size:clamp(3.6rem,21vw,10.5rem);font-weight:800;line-height:.95;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";text-align:center;word-break:keep-all}
#tdigits.warn{color:var(--warn)} #tdigits.done{color:var(--accent)}
#tsub{font-size:.85rem;color:var(--text2);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
#timerscreen .tbar{width:100%;max-width:640px;height:12px;background:var(--surface3);border-radius:999px;overflow:hidden}
#timerscreen .tbar > i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
#timerscreen .tctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:640px;margin:0 auto;width:100%}
#timerscreen .big{font-size:1.15rem;padding:15px 34px;border-radius:15px;min-width:168px;justify-content:center}
#timerscreen .tfoot{max-width:640px;margin:0 auto;width:100%}
#routinescreen{position:fixed;inset:0;z-index:310;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}
#routinescreen .rhead{display:flex;align-items:center;gap:10px}
#routinescreen .rbar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;margin:10px 0}
#routinescreen .rbar > i{display:block;height:100%;background:var(--accent);width:100%}
#routinescreen .rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#routinescreen .rpose{width:min(46vw,210px);color:var(--accent)}
#rdig{font-size:clamp(2.8rem,15vw,6rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#rdig.warn{color:var(--warn)}
#routinescreen .rfoot{max-width:640px;margin:0 auto;width:100%}
.mvcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px;display:flex;flex-direction:column;gap:4px}
.mvcard .mvpose{width:78px;align-self:center;color:var(--accent)}
.mvcard .nm{font-weight:700;font-size:.9rem;line-height:1.25}
.pose{width:100%;height:auto;display:block}
.pose .pl{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.pose .ph{fill:currentColor}
.pose .pg{fill:none;stroke:var(--text3);stroke-width:2.5;stroke-linecap:round;opacity:.5}
#timermini{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:120;
  background:var(--surface);border:2px solid var(--accent);border-radius:999px;padding:9px 16px;cursor:pointer;
  box-shadow:var(--shadow);font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
@media(min-width:821px){#timermini{bottom:18px}}
footer.app{border-top:1px solid var(--border);padding:16px 0 30px;margin-top:20px;color:var(--text3);font-size:.76rem}

/* ---------- 6. DATAS E FORMATOS ---------- */
const MON = {pt:["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],
             en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const WD  = {pt:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
const WDL = {pt:["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],
             en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]};
function todayISO(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function parseISO(s){ const a=String(s||"").split("-"); return new Date(+a[0],(+a[1]||1)-1,+a[2]||1); }
/* PT: dd/mmm/aaaa  ·  EN: mmm/dd/aaaa */
function fmtDate(iso){
  if(!iso) return "—";
  const d = (iso instanceof Date)?iso:parseISO(iso);
  if(isNaN(d)) return String(iso);
  const dd=String(d.getDate()).padStart(2,"0"), mm=MON[LANG][d.getMonth()], yy=d.getFullYear();
  return LANG==="pt" ? dd+"/"+mm+"/"+yy : mm+"/"+dd+"/"+yy;
}
function fmtShort(iso){ const d=parseISO(iso); return LANG==="pt" ? String(d.getDate()).padStart(2,"0")+"/"+MON[LANG][d.getMonth()] : MON[LANG][d.getMonth()]+"/"+String(d.getDate()).padStart(2,"0"); }
function weekdayName(i,long){ return (long?WDL:WD)[LANG][i]; }
function nDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function num(v,d){ const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?(d===undefined?0:d):n; }
function fmtNum(n,dec){ if(n===null||n===undefined||isNaN(n)) return "—";
  return Number(n).toLocaleString(LANG==="pt"?"pt-BR":"en-US",{minimumFractionDigits:dec||0,maximumFractionDigits:dec===undefined?1:dec}); }
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadRoot(){
  try{ const raw=localStorage.getItem(LSKEY); if(raw) ROOT=JSON.parse(raw); }catch(e){ ROOT=null; }
  if(!ROOT || typeof ROOT!=="object") ROOT={users:{},data:{},ads:[],prefs:{lang:"pt",theme:"dark"},session:null};
  ROOT.users=ROOT.users||{}; ROOT.data=ROOT.data||{}; ROOT.ads=ROOT.ads||[]; ROOT.prefs=ROOT.prefs||{lang:"pt",theme:"dark"};
  return ROOT;
}
function saveRoot(){ try{ localStorage.setItem(LSKEY, JSON.stringify(ROOT)); }catch(e){ toast(LANG==="pt"?"Sem espaço para salvar. Apague fotos antigas.":"No space to save. Delete old photos."); } }
function save(){ if(!GUEST && ROOT.session && ROOT.session.uid){ ROOT.data[ROOT.session.uid]=STATE; saveRoot(); } }
function hashPass(s){ let h=5381; const str="rise"+s; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(36); }

/* ---------- 8. TOAST / MODAL ---------- */
let toastT=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d);
  clearTimeout(toastT); toastT=setTimeout(()=>d.remove(), 2600);
}
function modal(html, opts){
  opts=opts||{};
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML='<div class="box'+(opts.wide?" wide":"")+'">'+html+"</div>";
  m.addEventListener("click", e=>{ if(e.target===m && !opts.sticky) m.remove(); });
  document.body.appendChild(m);
  m.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>m.remove()));
  const f=m.querySelector("input,select,textarea"); if(f && window.innerWidth>820) setTimeout(()=>f.focus(),60);
  return m;
}
function confirmBox(msg, onYes){
  const m=modal('<div class="mh"><h3>'+esc(msg)+'</h3></div><div class="row" style="justify-content:flex-end"><button class="btn line" data-close>'+t("common.cancel")+'</button><button class="btn danger" id="cyes">'+t("common.yes")+"</button></div>");
  m.querySelector("#cyes").onclick=()=>{ m.remove(); onYes(); };
}
function mh(title){ return '<div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" data-close>&times;</button></div>'; }

  document.documentElement.setAttribute("data-theme", th);
  document.querySelector('meta[name=theme-color]').setAttribute("content", th==="dark"?"#0f1115":"#f6f7f9");
  const b=document.getElementById("themebtn"); if(b) b.textContent = th==="dark"?"🌙":"☀️";
  ROOT.prefs.theme=th; saveRoot();
}
function applyLang(lg){
  LANG=lg; ROOT.prefs.lang=lg; saveRoot();

  document.getElementById("langlabel").textContent = lg==="pt"?"PT":"EN";
  document.getElementById("adbox").textContent = t("ad.here");
  document.querySelectorAll("[data-i18n]").forEach(n=>{ n.textContent = t(n.getAttribute("data-i18n")); });
  buildNav(); render();
}

/* ---------- 12. AJUDANTES DE DADOS ---------- */
function ci(date){ return STATE.checkins.find(c=>c.date===date); }
function ensureCi(date){ let c=ci(date); if(!c){ c={date,weight:null,done:[],mood:2,notes:""}; STATE.checkins.push(c); } return c; }
function missionsToday(d){ const dow=(d?parseISO(d):new Date()).getDay(); return STATE.missions.filter(m=>!m.days||m.days.indexOf(dow)>=0); }
function mTitle(m){ return typeof m.title==="string"?m.title:(m.title[LANG]||m.title.pt); }
function lastWeight(){ const w=STATE.checkins.filter(c=>c.weight).sort((a,b)=>a.date<b.date?1:-1); return w.length?w[0].weight:(STATE.measures.length?STATE.measures[STATE.measures.length-1].weight:null); }
function streak(){
  let n=0, d=new Date();
  for(let i=0;i<400;i++){
    const iso=todayISO(d), c=ci(iso);
    const ok = !!(c && ((c.done&&c.done.length) || STATE.logs.some(l=>l.date===iso)));
    if(ok) n++;
    else if(i>0) break;            /* o dia de hoje ainda pode ser cumprido */
    d.setDate(d.getDate()-1);
  }
  return n;
}
function weekLogs(){ const now=new Date(); const start=new Date(now); start.setDate(now.getDate()-now.getDay());
  const iso=todayISO(start); return STATE.logs.filter(l=>l.date>=iso); }
function mealsOn(date){ return STATE.meals.filter(m=>m.date===date); }
function sumMeals(list){ return list.reduce((a,m)=>({kcal:a.kcal+(m.kcal||0),prot:a.prot+(m.prot||0),carb:a.carb+(m.carb||0),fat:a.fat+(m.fat||0)}),{kcal:0,prot:0,carb:0,fat:0}); }
function workoutToday(){ const dow=new Date().getDay(); return STATE.workouts.find(w=>(w.days||[]).indexOf(dow)>=0); }
function age(){ if(!STATE.profile.birth) return 30; const b=parseISO(STATE.profile.birth); const n=new Date();
  let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a>0&&a<120?a:30; }

     MUSCLES.map(m=>'<option value="'+m.id+'"'+(EXF.m===m.id?" selected":"")+">"+esc(mName(m.id))+"</option>").join("")+"</select></label>";

       const ph=STATE.equipPhotos&&STATE.equipPhotos[e.id];
       return '<div class="eqcard">'+(ph?'<img src="'+ph+'" alt="">':e.svg)+'<div class="nm">'+esc(LANG==="pt"?e.pt:e.en)+"</div>"+
         '<div class="row" style="justify-content:center;margin-top:6px"><button class="btn xs line" data-eqphoto="'+e.id+'">📷 '+t("ex.takephoto")+'</button>'+
         '<button class="btn xs ghost" data-eqex="'+e.id+'">'+t("body.seeEx")+"</button></div></div>";

function filterEx(){
  const q=EXF.q.toLowerCase().trim();
  return allEx().filter(x=>{
    if(EXF.m && x.m!==EXF.m && x.sec.indexOf(EXF.m)<0) return false;
    if(EXF.eq && x.eq!==EXF.eq) return false;
    if(!q) return true;

function resizeImage(src, max, cb){
  const img=new Image();
  img.onload=function(){
    let w=img.width,h=img.height; const sc=Math.min(1, max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",0.82));
  };
  img.onerror=function(){ toast(LANG==="pt"?"Não consegui abrir a imagem.":"Could not open the image."); };
  img.src=src;
}
function readFile(file, cb){ const r=new FileReader(); r.onload=()=>resizeImage(r.result,1400,cb); r.readAsDataURL(file); }
let CAMSTREAM=null, CAMFACING="environment";
function stopCam(){ if(CAMSTREAM){ CAMSTREAM.getTracks().forEach(tr=>tr.stop()); CAMSTREAM=null; } }
function pickImage(cb){
  const m=modal(mh(t("common.photo"))+

function startCam(host, cb){

/* ---------- 20. SOM DE ALARME ---------- */
let AC=null;
function beep(times){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    let i=0; const n=times||3;
    const one=()=>{ const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value= i%2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.35);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.36);
      if(++i<n) setTimeout(one,420); };
    one();
  }catch(e){}
  if(navigator.vibrate) try{ navigator.vibrate([200,100,200,100,300]); }catch(e){}
}

/* ---------- 21. CRONOMETRO DE TELA CHEIA (regressivo e progressivo) ---------- */
const TIMER = {
  mode:"down", total:60, left:60, up:0, running:false, ringing:false,
  endAt:0, startedAt:0, accum:0, tick:null, ringTick:null,
  alarm:true, vibrate:true, awake:true, wake:null, awakeVideo:null, awakeInt:null,
  onEnd:null, el:null, mini:null, autoBack:false, autoT:null
};
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60, p=n=>String(n).padStart(2,"0");
  return h? (h+":"+p(m)+":"+p(s)) : (p(m)+":"+p(s));
}
/* --- manter a tela acesa --- */
function keepAwake(){
  if(!TIMER.awake) return;
  if(navigator.wakeLock && navigator.wakeLock.request){
    navigator.wakeLock.request("screen").then(w=>{ TIMER.wake=w; paintAwake(); })
      .catch(()=>{ awakeFallback(); });
  } else awakeFallback();
}
function awakeFallback(){
  if(TIMER.awakeVideo) return;
  try{
    const cv=document.createElement("canvas"); cv.width=cv.height=2;
    const cx=cv.getContext("2d"); let i=0;
    TIMER.awakeInt=setInterval(()=>{ cx.fillStyle=(i++%2)?"#000000":"#010101"; cx.fillRect(0,0,2,2); },900);
    const st=cv.captureStream(2);
    const v=document.createElement("video");
    v.srcObject=st; v.muted=true; v.defaultMuted=true; v.loop=true;
    v.setAttribute("playsinline",""); v.setAttribute("muted","");
    v.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none";
    document.body.appendChild(v); v.play().catch(()=>{});
    TIMER.awakeVideo=v;
  }catch(e){}
  paintAwake();
}
function releaseAwake(){
  try{ if(TIMER.wake && TIMER.wake.release) TIMER.wake.release(); }catch(e){}
  TIMER.wake=null;
  if(TIMER.awakeInt){ clearInterval(TIMER.awakeInt); TIMER.awakeInt=null; }
  if(TIMER.awakeVideo){ try{ TIMER.awakeVideo.pause(); const st=TIMER.awakeVideo.srcObject;
    if(st) st.getTracks().forEach(tr=>tr.stop()); }catch(e){}
    TIMER.awakeVideo.remove(); TIMER.awakeVideo=null; }
  paintAwake();
}
function awakeActive(){ return !!(TIMER.wake || TIMER.awakeVideo); }
function paintAwake(){
  const n=document.getElementById("tawake");
  if(!n) return;
  if(!TIMER.awake) n.textContent = "💤 "+t("tm.awakeOff");
  else n.textContent = awakeActive()? ("🔆 "+t("tm.awakeOn")) : ("🔆 "+t("tm.awakeWhen"));
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && TIMER.running && TIMER.awake && !awakeActive()) keepAwake();
  if(TIMER.el) paintTimer();
});

/* --- abrir / fechar --- */
function openTimer(seconds, onEnd, autostart, autoBack){
  TIMER.autoBack=!!autoBack;
  if(TIMER.autoT){ clearTimeout(TIMER.autoT); TIMER.autoT=null; }
  if(seconds){ TIMER.mode="down"; TIMER.total=seconds; TIMER.left=seconds; TIMER.endAt=0; TIMER.running=false; }
  TIMER.onEnd=onEnd||null;
  if(TIMER.mini){ TIMER.mini.remove(); TIMER.mini=null; }
  if(!TIMER.el){
    const d=document.createElement("div"); d.id="timerscreen"; document.body.appendChild(d); TIMER.el=d;
  }
  buildTimer();
  if(autostart && !TIMER.running) startTimer();
}
function closeTimer(){
  if(TIMER.autoT){ clearTimeout(TIMER.autoT); TIMER.autoT=null; }
  TIMER.autoBack=false;
  stopRing(); pauseTimer(); releaseAwake();
  if(TIMER.el){ TIMER.el.remove(); TIMER.el=null; }
  if(TIMER.mini){ TIMER.mini.remove(); TIMER.mini=null; }
  TIMER.mode==="up" ? (TIMER.up=0, TIMER.accum=0) : (TIMER.left=TIMER.total);
}
function minimizeTimer(){
  if(TIMER.el){ TIMER.el.remove(); TIMER.el=null; }
  if(!TIMER.mini){
    const b=document.createElement("button"); b.id="timermini";
    b.onclick=()=>openTimer(); document.body.appendChild(b); TIMER.mini=b;
  }
  paintTimer();
}
/* --- controle --- */
function timerValue(){
  if(TIMER.mode==="down"){
    if(TIMER.running) return Math.max(0,(TIMER.endAt-Date.now())/1000);
    return TIMER.left;
  }
  return TIMER.accum + (TIMER.running? (Date.now()-TIMER.startedAt)/1000 : 0);
}
function startTimer(){
  stopRing();
  if(TIMER.mode==="down"){
    if(TIMER.left<=0) TIMER.left=TIMER.total||60;
    TIMER.endAt=Date.now()+TIMER.left*1000;
  } else TIMER.startedAt=Date.now();
  TIMER.running=true;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  keepAwake();
  clearInterval(TIMER.tick);
  TIMER.tick=setInterval(timerStep,200);
  paintTimer();
}
function pauseTimer(){
  if(TIMER.running){
    if(TIMER.mode==="down") TIMER.left=Math.max(0,(TIMER.endAt-Date.now())/1000);
    else TIMER.accum=TIMER.accum+(Date.now()-TIMER.startedAt)/1000;
  }
  TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  paintTimer();
}
function resetTimer(){
  stopRing(); TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  if(TIMER.mode==="down"){ TIMER.left=TIMER.total; TIMER.endAt=0; }
  else { TIMER.up=0; TIMER.accum=0; TIMER.startedAt=0; }
  paintTimer();
}
function setTimerMode(md){
  if(TIMER.mode===md) return;
  stopRing(); TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  TIMER.mode=md;
  if(md==="down"){ TIMER.left=TIMER.total||60; TIMER.endAt=0; } else { TIMER.accum=0; TIMER.up=0; }
  buildTimer();
}
function adjustTimer(sec){
  if(TIMER.mode!=="down") return;
  const cur=timerValue();
  const v=Math.max(5, Math.min(24*3600, Math.round(cur+sec)));
  TIMER.left=v; TIMER.total=Math.max(TIMER.total,v);
  if(TIMER.running) TIMER.endAt=Date.now()+v*1000;
  paintTimer();
}
function setPreset(sec){
  stopRing(); TIMER.mode="down"; TIMER.total=sec; TIMER.left=sec;
  if(TIMER.running) TIMER.endAt=Date.now()+sec*1000;
  paintTimer();
}
function timerStep(){
  if(TIMER.mode==="down"){
    const v=timerValue();
    if(v<=0.05){
      TIMER.left=0; TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
      startRing();
      if(TIMER.onEnd){ const f=TIMER.onEnd; TIMER.onEnd=null; try{ f(); }catch(e){} }
    }
  }
  paintTimer();
}
/* --- alarme --- */
function startRing(){
  TIMER.ringing=true;
  if(TIMER.el) TIMER.el.classList.add("ring");
  const fire=()=>{ if(TIMER.alarm) beep(3); if(TIMER.vibrate && navigator.vibrate){ try{ navigator.vibrate([300,120,300,120,500]); }catch(e){} } };
  fire(); clearInterval(TIMER.ringTick); TIMER.ringTick=setInterval(fire,2200);
  if(!TIMER.el) toast("⏰ "+t("tm.over"));
  if(TIMER.autoBack){
    if(TIMER.autoT) clearTimeout(TIMER.autoT);
    TIMER.autoT=setTimeout(()=>{ TIMER.autoT=null; stopRing(); closeTimer(); }, 6500);
  }
  paintTimer();
}
function stopRing(){
  if(TIMER.ringTick){ clearInterval(TIMER.ringTick); TIMER.ringTick=null; }
  if(navigator.vibrate){ try{ navigator.vibrate(0); }catch(e){} }
  TIMER.ringing=false;
  if(TIMER.el) TIMER.el.classList.remove("ring");
}
/* --- desenho --- */
const TPRESETS=[15,30,45,60,90,120,180,300,600];
function preLabel(s){
  if(s<60) return s+"s";
  const m=Math.floor(s/60), r=s%60;
  return r? (m+":"+String(r).padStart(2,"0")) : (m+" min");
}
function buildTimer(){
  if(!TIMER.el) return;
  const down=TIMER.mode==="down";
  TIMER.el.innerHTML=
    '<div class="thead"><button class="iconbtn" id="tclose" title="'+t("common.close")+'">&times;</button>'+
      '<div class="chips"><button class="chip'+(down?" on":"")+'" data-tmode="down">⏳ '+t("tm.down")+'</button>'+
      '<button class="chip'+(down?"":" on")+'" data-tmode="up">⏱ '+t("tm.up")+"</button></div>"+
      '<span class="spacer" style="flex:1"></span>'+
      '<button class="btn line sm" id="tmin">▁ '+t("tm.min")+"</button></div>"+
    '<div class="tmid"><div id="tsub">'+t("tm.title")+'</div><div id="tdigits">00:00</div>'+
      '<div class="tbar"><i id="tprog" style="width:100%"></i></div>'+

      '<div class="tiny muted" id="tawake" style="text-align:center;margin-top:8px"></div>'+

  q("#tawk").onchange=e=>{ TIMER.awake=e.target.checked; if(TIMER.awake){ if(TIMER.running) keepAwake(); } else releaseAwake(); paintAwake(); };

function paintTimer(){
  const v=timerValue(), down=TIMER.mode==="down";
  if(TIMER.mini) TIMER.mini.innerHTML='<span>'+(TIMER.ringing?"⏰":(TIMER.running?"⏱":"⏸"))+"</span><span>"+fmtClock(v)+"</span>";
  if(!TIMER.el) return;
  const d=TIMER.el.querySelector("#tdigits"); if(!d) return;
  d.textContent = (down && v<=0 && TIMER.ringing) ? t("tm.over") : fmtClock(v);
  d.className = (down && v<=0) ? "done" : ((down && v<=10 && TIMER.running) ? "warn" : "");
  const pr=TIMER.el.querySelector("#tprog");
  if(pr) pr.style.width = down ? (TIMER.total? Math.max(0,Math.min(100,v/TIMER.total*100)):0)+"%"
                               : Math.min(100,(v%60)/60*100)+"%";
  const sub=TIMER.el.querySelector("#tsub");
  if(sub) sub.textContent = TIMER.ringing? t("tm.over") : (TIMER.running? t("tm.running") : t("tm.paused"));
  const go=TIMER.el.querySelector("#tgo");
  if(go) go.innerHTML = TIMER.running? ("⏸ "+t("tm.pause")) : ((down? (v<TIMER.total && v>0):(v>0))? ("▶ "+t("tm.resume")) : ("▶ "+t("tm.start")));
  const rg=TIMER.el.querySelector("#tring"); if(rg) rg.style.display = TIMER.ringing? "flex":"none";
}

function runWorkout(id){
  const w=STATE.workouts.find(x=>x.id===id); if(!w||!(w.items||[]).length){ toast(t("wk.empty")); return; }
  let idx=0, started=Date.now();
  const prog=w.items.map(it=>({exId:it.exId, target:it.sets, reps:it.reps, load:it.load||0, sets:[]}));
  const m=modal("<div id='runbox'></div>",{wide:true,sticky:true});
  function paint(){
    const it=w.items[idx], p=prog[idx], x=allEx().find(e=>e.id===it.exId);
    const eq=EQUIP[x?x.eq:""];
    m.querySelector("#runbox").innerHTML=
      '<div class="mh"><div><span class="pill acc">'+t("wk.running")+'</span><h3 style="margin:.3em 0 0">'+esc(w.name)+"</h3></div><button class='iconbtn' id='rclose'>&times;</button></div>"+
      '<div class="bar" style="margin:6px 0 12px"><i style="width:'+((idx)/w.items.length*100)+'%"></i></div>'+
      (idx===0?'<div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="r_warm">🤸 '+t("wu.warmBtn")+"</button></div>":"")+
      '<div class="card tight" style="margin:0 0 12px"><div class="row nowrap">'+(eq?'<div class="eqic" style="width:52px;height:52px">'+eq.svg+"</div>":"")+
      '<div><h2 style="margin:0">'+esc(x?exName(x):it.exId)+'</h2><small class="muted">'+esc(x?mName(x.m):"")+" · "+(idx+1)+"/"+w.items.length+"</small></div></div>"+
      '<p class="tiny muted" style="margin:.6em 0 0">'+esc(x?exTip(x):"")+"</p></div>"+
      '<div class="grid g2"><label class="fld"><span>'+t("wk.reps")+'</span><input id="r_reps" type="text" value="'+esc(p.reps)+'"></label>'+
      '<label class="fld"><span>'+t("wk.load")+' (kg)</span><input id="r_load" type="number" step="0.5" value="'+p.load+'"></label></div>'+
      '<div class="row">'+p.sets.map((s,i)=>'<span class="pill ok">'+(i+1)+": "+s.reps+"×"+fmtNum(s.load,1)+"</span>").join("")+
      '<span class="pill">'+p.sets.length+" / "+p.target+"</span></div>"+
      '<div class="row" style="margin-top:12px"><button class="btn" id="r_set">✓ '+t("wk.setDone")+'</button>'+
      '<button class="btn ghost" id="r_rest">⏱ '+t("wk.restNow")+" ("+(it.rest||60)+"s)</button>"+
      '<button class="btn line" id="r_prev" '+(idx===0?"disabled":"")+">← "+t("wk.prev")+'</button>'+
      '<button class="btn line" id="r_next" '+(idx>=w.items.length-1?"disabled":"")+">"+t("wk.next")+' →</button></div>'+
      '<div class="sep"></div><button class="btn wide" id="r_fin">🏁 '+t("wk.finish")+"</button>";
    m.querySelector("#rclose").onclick=()=>{ if(confirm(LANG==="pt"?"Sair sem salvar o treino?":"Leave without saving the workout?")) m.remove(); };
    m.querySelector("#r_set").onclick=()=>{
      p.reps=m.querySelector("#r_reps").value; p.load=num(m.querySelector("#r_load").value,0);
      p.sets.push({reps:p.reps, load:p.load});
      if(p.sets.length>=p.target && idx<w.items.length-1){ idx++; paint(); timerModal(it.rest||60); }
      else { paint(); timerModal(it.rest||60); }
    };
    m.querySelector("#r_rest").onclick=()=>timerModal(it.rest||60);
    const rw=m.querySelector("#r_warm");
    if(rw) rw.onclick=()=>{ const l=buildRoutine("before", autoGroupsFromWorkout(w), 5);
      if(l) runRoutine(expandRoutine(l), t("wu.warmBtn")); else toast(t("wu.noMoves")); };
    m.querySelector("#r_prev").onclick=()=>{ if(idx>0){ idx--; paint(); } };
    m.querySelector("#r_next").onclick=()=>{ if(idx<w.items.length-1){ idx++; paint(); } };
    m.querySelector("#r_fin").onclick=()=>{
      const dur=Math.round((Date.now()-started)/1000);
      let vol=0, any=false;
      prog.forEach(p=>p.sets.forEach(s=>{ vol+=(num(s.reps,0)*num(s.load,0)); any=true; }));
      STATE.logs.push({id:uid(), date:todayISO(), workoutId:w.id, name:w.name, dur, volume:Math.round(vol),
        items:prog.map(p=>({exId:p.exId, sets:p.sets}))});
      const c=ensureCi(todayISO());
      const trainMission=STATE.missions.find(mm=>/train|trein/i.test(mTitle(mm)));
      if(trainMission && c.done.indexOf(trainMission.id)<0) c.done.push(trainMission.id);
      save(); m.remove(); go("workout"); offerStretch(w);
    };
  }
  paint();
}

function ringSVG(v,total){
  const pct = total? Math.min(v/total,1.35) : 0, r=52, c=2*Math.PI*r, off=c*(1-Math.min(pct,1));
  const over = total && v>total;
  return '<svg viewBox="0 0 130 130" role="img" aria-label="'+esc(t("dt.kcal"))+'">'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="13"/>'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="'+(over?"var(--warn)":"var(--s1)")+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 65 65)"/>'+
    '<text x="65" y="60" text-anchor="middle" fill="var(--text)" font-size="21" font-weight="800">'+fmtNum(v,0)+"</text>"+
    '<text x="65" y="78" text-anchor="middle" fill="var(--text2)" font-size="11">'+(total?("/ "+fmtNum(total,0)+" kcal"):"kcal")+"</text></svg>";
}
function macroBar(lb,v,total,col){
  const p = total? Math.min(v/total*100,100):0;
  return '<div style="margin-bottom:9px"><div class="between tiny"><span>'+esc(lb)+'</span><span class="muted">'+fmtNum(v,0)+" / "+(total?fmtNum(total,0):"—")+" g</span></div>"+
    '<div class="bar"><i style="width:'+p+'%;background:'+col+'"></i></div></div>';
}

function calcDiet(){

  const tdee=Math.round(bmr*f);

    '<p class="tiny muted">'+t("dt.calcNote")+"</p>"+
    '<div class="grid g3"><div class="stat"><div class="lb">TMB</div><div class="vl">'+fmtNum(bmr,0)+"</div></div>"+

    '<option value="0" selected>'+(LANG==="pt"?"Manter":"Maintain")+"</option>"+
    '<option value="0.15">'+(LANG==="pt"?"Ganhar massa (+15%)":"Gain muscle (+15%)")+"</option></select></label>"+
    '<div class="row" style="justify-content:flex-end"><button class="btn line" data-close>'+t("common.cancel")+'</button><button class="btn" id="cd_ok">'+t("common.save")+"</button></div>");
  m.querySelector("#cd_ok").onclick=()=>{
    const adj=parseFloat(m.querySelector("#cd_g").value);
    const kcal=Math.round(tdee*(1+adj)), prot=Math.round(w*(adj<0?2.2:1.8)), fat=Math.round(w*0.9);
    const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
    STATE.diet={kcal, restKcal:Math.round(kcal*0.92), prot, carb, fat, water:STATE.diet.water||8};
    save(); m.remove(); render(); toast(t("common.saved"));
  };
}

/* ---------- 25. GRAFICOS (canvas) ---------- */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv,h){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||300;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  return {c,w,h};
}
function lineChart(cv, pts, opts){
  opts=opts||{}; if(!cv) return;
  const H=opts.height||190, {c,w,h}=setupCanvas(cv,H);
  const pad={l:44,r:12,t:12,b:26};
  const gw=w-pad.l-pad.r, gh=h-pad.t-pad.b;
  if(pts.length<2){ c.fillStyle=cssVar("--text3"); c.font="13px sans-serif"; c.textAlign="center";
    c.fillText(opts.emptyMsg||t("pg.needData"), w/2, h/2); return; }
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){ mn-=1; mx+=1; } const padY=(mx-mn)*0.15; mn-=padY; mx+=padY;
  const X=i=>pad.l+(gw*(i/(pts.length-1))), Y=v=>pad.t+gh-((v-mn)/(mx-mn))*gh;
  /* grade */
  c.strokeStyle=cssVar("--grid"); c.lineWidth=1; c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="right";
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Math.round(Y(v))+0.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke();
    c.fillText(fmtNum(v,1), pad.l-7, y+4); }
  /* linha */
  c.strokeStyle=opts.color||cssVar("--s1"); c.lineWidth=2; c.lineJoin="round"; c.lineCap="round";
  c.beginPath(); pts.forEach((p,i)=>{ const x=X(i),y=Y(p.y); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  /* marcas */
  c.fillStyle=opts.color||cssVar("--s1");
  pts.forEach((p,i)=>{ if(pts.length>40 && i%Math.ceil(pts.length/40)) return;
    c.beginPath(); c.arc(X(i),Y(p.y),4,0,7); c.fill();
    c.strokeStyle=cssVar("--surface"); c.lineWidth=2; c.stroke(); });
  /* rotulos de eixo x: primeiro, meio, ultimo */
  c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="center";
  [0,Math.floor((pts.length-1)/2),pts.length-1].forEach(i=>{ c.fillText(pts[i].label, Math.min(Math.max(X(i),24),w-24), h-8); });
  /* rotulos diretos do primeiro e ultimo valor */
  c.fillStyle=cssVar("--text"); c.font="700 12px sans-serif"; c.textAlign="left";
  c.fillText(fmtNum(pts[pts.length-1].y,1), Math.min(X(pts.length-1)+8,w-38), Y(pts[pts.length-1].y)-8);
  /* interacao */
  cv.onmousemove=e=>{
    const r=cv.getBoundingClientRect(), mxp=e.clientX-r.left;
    let idx=Math.round((mxp-pad.l)/gw*(pts.length-1)); idx=Math.max(0,Math.min(pts.length-1,idx));
    const tip=cv.parentNode.querySelector(".chtip");
    if(tip){ tip.style.display="block"; tip.style.left=Math.min(Math.max(X(idx),50),w-50)+"px";
      tip.textContent=pts[idx].label+" · "+fmtNum(pts[idx].y,1)+(opts.unit?(" "+opts.unit):""); }
  };
  cv.onmouseleave=()=>{ const tip=cv.parentNode.querySelector(".chtip"); if(tip) tip.style.display="none"; };
}
function barChart(cv, pts, opts){
  opts=opts||{}; if(!cv) return;
  const H=opts.height||170, {c,w,h}=setupCanvas(cv,H);
  const pad={l:34,r:10,t:22,b:26}, gw=w-pad.l-pad.r, gh=h-pad.t-pad.b;
  if(!pts.length){ c.fillStyle=cssVar("--text3"); c.font="13px sans-serif"; c.textAlign="center"; c.fillText(t("common.empty"), w/2, h/2); return; }
  const mx=Math.max(1,...pts.map(p=>p.y));
  c.strokeStyle=cssVar("--grid"); c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="right";
  for(let i=0;i<=3;i++){ const v=mx*i/3, y=Math.round(pad.t+gh-(v/mx)*gh)+0.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke(); c.fillText(fmtNum(v,0), pad.l-6, y+4); }
  const bw=Math.min(38, gw/pts.length - 6), step=gw/pts.length;
  pts.forEach((p,i)=>{
    const x=pad.l+step*i+(step-bw)/2, bh=Math.max(2,(p.y/mx)*gh), y=pad.t+gh-bh;
    c.fillStyle=opts.color||cssVar("--s1");
    c.beginPath();
    if(c.roundRect) c.roundRect(x,y,bw,bh,[4,4,0,0]); else c.rect(x,y,bw,bh);
    c.fill();
    c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="center";
    c.fillText(p.label, x+bw/2, h-8);
    if(p.y>0){ c.fillStyle=cssVar("--text"); c.font="700 11px sans-serif"; c.fillText(String(p.y), x+bw/2, y-4); }
  });
}

/* ---------- 27. OCR / VISAO COMPUTACIONAL ---------- */
let SCANMODE="label", SCANIMG=null, SCANTEXT="", SCANFOUND=null;
const OCR_CDN=["https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js",
               "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"];
function loadTesseract(cb){
  if(window.Tesseract){ cb(true); return; }
  let i=0;
  const tryNext=()=>{
    if(i>=OCR_CDN.length){ cb(false); return; }
    const s=document.createElement("script");
    s.src=OCR_CDN[i++]; s.async=true;
    s.onload=()=>cb(!!window.Tesseract);
    s.onerror=tryNext;
    document.head.appendChild(s);
  };
  tryNext();
}
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function firstNum(s){ const m=String(s).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(",",".")):null; }
function grab(txt, res){ for(const r of res){ const m=txt.match(r); if(m){ const v=parseFloat(String(m[1]).replace(",",".")); if(!isNaN(v)) return v; } } return null; }

function parseLabel(raw){
  const x=norm(raw).replace(/ /g," ");
  const o={};
  o.portion = grab(x,[/por[cç]?ao[^\d]{0,24}(\d+(?:[.,]\d+)?)\s*(?:g|ml)/, /serving size[^\d]{0,24}(\d+(?:[.,]\d+)?)/]);
  o.kcal = grab(x,[/valor energetico[^\d]{0,40}(\d+(?:[.,]\d+)?)\s*kcal/, /(\d+(?:[.,]\d+)?)\s*kcal/, /calorie[s]?[^\d]{0,24}(\d+(?:[.,]\d+)?)/]);
  o.prot = grab(x,[/proteina[s]?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /protein[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.carb = grab(x,[/carboidrato[s]?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /carbohydrate[s]?[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.fat  = grab(x,[/gorduras? totai?s?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /total fat[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /gordura[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.fiber= grab(x,[/fibra[s]? alimentar[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /fiber[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.sodium=grab(x,[/sodio[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /sodium[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  return (o.kcal||o.prot||o.carb||o.fat)?o:null;
}
function parseScale(raw){
  const lines=norm(raw).split(/\n+/); const o={};
  lines.forEach(l=>{
    const n=firstNum(l); if(n===null) return;
    if(/%|gordura|fat/.test(l) && n>3 && n<70 && o.fat===undefined) o.fat=n;
    else if(/(massa|muscle|musculo|lean)/.test(l) && o.muscle===undefined) o.muscle=n;
    else if(/(kg|peso|weight)/.test(l) && n>20 && n<350 && o.weight===undefined) o.weight=n;
  });
  if(o.weight===undefined){ const all=(norm(raw).match(/\d+(?:[.,]\d+)?/g)||[]).map(v=>parseFloat(v.replace(",",".")));
    const cand=all.filter(v=>v>=30&&v<=250); if(cand.length) o.weight=cand[0]; }
  return (o.weight!==undefined||o.fat!==undefined)?o:null;
}
const TAPEKEYS=[["waist",["cintura","waist"]],["hip",["quadril","hip"]],["chest",["peito","torax","chest"]],
  ["arm",["braco","biceps","arm"]],["thigh",["coxa","thigh"]],["calf",["panturrilha","calf"]],
  ["weight",["peso","weight"]],["fat",["gordura","fat"]]];
function parseTape(raw){
  const x=norm(raw); const o={}; let any=false;
  TAPEKEYS.forEach(([k,words])=>{
    for(const w of words){ const m=x.match(new RegExp(w+"[^\\d]{0,18}(\\d+(?:[.,]\\d+)?)")); if(m){ o[k]=parseFloat(m[1].replace(",",".")); any=true; break; } }
  });
  return any?o:null;
}
function parseSheet(raw){
  const lines=String(raw).split(/\n+/).map(l=>l.trim()).filter(l=>l.length>3);
  const found=[];
  lines.forEach(l=>{
    const nl=norm(l);
    let best=null,bestScore=0;
    allEx().forEach(x=>{
      [norm(x.pt),norm(x.en)].forEach(nm=>{
        if(!nm) return;
        const words=nm.split(/\s+/).filter(w=>w.length>3);
        if(!words.length) return;
        const hit=words.filter(w=>nl.indexOf(w)>=0).length/words.length;
        if(hit>bestScore){ bestScore=hit; best=x; }
      });
    });
    if(best && bestScore>=0.5){
      const sr=l.match(/(\d+)\s*[xX×]\s*(\d+)/);
      const kg=l.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|quilos?)/i);
      found.push({exId:best.id, name:exName(best), sets:sr?+sr[1]:3, reps:sr?String(sr[2]):"12", load:kg?parseFloat(kg[1].replace(",",".")):0, line:l});
    }
  });
  return found.length?found:null;
}
function parseExam(raw){
  const lines=String(raw).split(/\n+/).map(l=>l.trim()).filter(l=>/\d/.test(l)&&l.length>4);
  const out=[];
  lines.forEach(l=>{
    const m=l.match(/^([A-Za-zÀ-ÿ\s\.\-\/()]{3,40}?)[\s:.\-]+(\d+(?:[.,]\d+)?)\s*([A-Za-z%\/µ]{0,12})/);
    if(m) out.push({name:m[1].trim(), value:m[2].replace(",","."), unit:(m[3]||"").trim(), ref:""});
  });
  return out.length?out.slice(0,25):null;
}

SCREENS.scan_after = function(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ SCANMODE=b.getAttribute("data-mode"); SCANFOUND=null; SCANTEXT=""; render(); });
  document.getElementById("opencam2").onclick=()=>startCam(document.getElementById("camwrap2"), d=>{ stopCam(); document.getElementById("camwrap2").innerHTML=""; runOCR(d); });
  document.getElementById("fileinp2").onchange=e=>{ const f=e.target.files[0]; if(f) readFile(f, runOCR); };
  if(SCANTEXT) paintScan();
};
function runOCR(dataUrl){
  SCANIMG=dataUrl; SCANTEXT=""; SCANFOUND=null;
  const out=document.getElementById("scanout");
  out.innerHTML='<div class="card"><img src="'+dataUrl+'" style="width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:var(--surface2)">'+
    '<div class="sep"></div><p id="ocrst">⏳ '+t("sc.loadingEngine")+'</p><div class="bar"><i id="ocrbar" style="width:6%"></i></div></div>';
  loadTesseract(ok=>{
    if(!ok){ out.querySelector("#ocrst").textContent="⚠ "+t("sc.engineFail"); manualFallback(); return; }
    out.querySelector("#ocrst").textContent="⏳ "+t("sc.reading");
    const lg = LANG==="pt" ? "por" : "eng";
    window.Tesseract.recognize(dataUrl, lg, {logger:m=>{
      const b=document.getElementById("ocrbar");
      if(b && m.progress) b.style.width=Math.max(6,Math.round(m.progress*100))+"%";
    }}).then(r=>{ SCANTEXT=(r&&r.data&&r.data.text)||""; paintScan(); })
      .catch(()=>{ out.querySelector("#ocrst").textContent="⚠ "+t("sc.engineFail"); manualFallback(); });
  });
}
function manualFallback(){
  const out=document.getElementById("scanout");
  const d=document.createElement("div"); d.className="card";
  d.innerHTML='<h3>'+t("sc.found")+"</h3><p class='tiny muted'>"+t("sc.engineFail")+"</p>"+
    '<button class="btn" id="manbtn">'+t("common.add")+"</button>";
  out.appendChild(d);
  d.querySelector("#manbtn").onclick=()=>manualFor(SCANMODE,{});
}
function manualFor(mode, pre){
  if(mode==="label") mealModal(pre);
  else if(mode==="scale"||mode==="tape") measureModal(pre);
  else if(mode==="exam") examModal(pre);
  else toast(t("common.empty"));
}
function paintScan(){
  const out=document.getElementById("scanout");
  let parsed=null, body="";
  if(SCANMODE==="label") parsed=parseLabel(SCANTEXT);
  else if(SCANMODE==="scale") parsed=parseScale(SCANTEXT);
  else if(SCANMODE==="tape") parsed=parseTape(SCANTEXT);
  else if(SCANMODE==="sheet") parsed=parseSheet(SCANTEXT);
  else if(SCANMODE==="exam") parsed=parseExam(SCANTEXT);
  SCANFOUND=parsed;
  if(SCANMODE==="label" && parsed){
    body='<div class="grid g4">'+
      stat("kcal", parsed.kcal!==null&&parsed.kcal!==undefined?fmtNum(parsed.kcal,0):"—","","")+
      stat(t("dt.prot"), parsed.prot!=null?fmtNum(parsed.prot,1):"—","g","")+
      stat(t("dt.carb"), parsed.carb!=null?fmtNum(parsed.carb,1):"—","g","")+
      stat(t("dt.fat"), parsed.fat!=null?fmtNum(parsed.fat,1):"—","g","")+"</div>"+
      (parsed.portion?'<p class="tiny muted">'+t("dt.qty")+": "+fmtNum(parsed.portion,0)+" g</p>":"");
  } else if((SCANMODE==="scale"||SCANMODE==="tape") && parsed){
    body='<div class="grid g4">'+Object.keys(parsed).map(k=>stat(scLabel(k), fmtNum(parsed[k],1), k==="fat"?"%":(k==="weight"?"kg":"cm"),"")).join("")+"</div>";
  } else if(SCANMODE==="sheet" && parsed){
    body='<table class="tbl"><thead><tr><th>'+t("ex.title")+'</th><th class="num">'+t("wk.sets")+'</th><th class="num">'+t("wk.reps")+'</th><th class="num">'+t("wk.load")+"</th></tr></thead><tbody>"+
      parsed.map(p=>"<tr><td>"+esc(p.name)+'</td><td class="num">'+p.sets+'</td><td class="num">'+esc(p.reps)+'</td><td class="num">'+(p.load?fmtNum(p.load,1)+" kg":"—")+"</td></tr>").join("")+"</tbody></table>";
  } else if(SCANMODE==="exam" && parsed){
    body='<table class="tbl"><thead><tr><th>'+t("pg.examName")+'</th><th class="num">'+t("pg.value")+"</th><th>"+t("pg.unit")+"</th></tr></thead><tbody>"+
      parsed.map(p=>"<tr><td>"+esc(p.name)+'</td><td class="num">'+esc(p.value)+"</td><td>"+esc(p.unit)+"</td></tr>").join("")+"</tbody></table>";
  } else if(SCANMODE==="free"){ body='<div class="ocrbox">'+esc(SCANTEXT||"")+"</div>"; }
  else body='<p class="muted">'+t("sc.nothing")+"</p>";
  out.innerHTML='<div class="card"><h3>🔎 '+t("sc.found")+"</h3>"+body+
    (parsed&&SCANMODE!=="free"?'<div class="sep"></div><div class="row"><button class="btn" id="scok">'+t("sc.confirm")+'</button><button class="btn line" id="scman">'+t("common.edit")+"</button></div>":
      '<div class="sep"></div><button class="btn ghost" id="scman">'+t("common.add")+"</button>")+
    "</div>"+
    (SCANTEXT?'<div class="card"><h4>'+t("sc.raw")+'</h4><div class="ocrbox">'+esc(SCANTEXT)+"</div></div>":"");
  const ok=out.querySelector("#scok"); if(ok) ok.onclick=commitScan;
  out.querySelector("#scman").onclick=()=>manualFor(SCANMODE, prefillFrom(parsed));
}
function scLabel(k){ return {waist:t("pg.waist"),hip:t("pg.hip"),chest:t("pg.chest"),arm:t("pg.arm"),thigh:t("pg.thigh"),
  calf:t("pg.calf"),weight:t("home.weight"),fat:t("pg.fat"),muscle:(LANG==="pt"?"Massa magra":"Lean mass")}[k]||k; }
function prefillFrom(p){
  if(!p) return {};
  if(SCANMODE==="label") return {kcal:p.kcal,prot:p.prot,carb:p.carb,fat:p.fat,qty:p.portion||100};
  if(SCANMODE==="scale"||SCANMODE==="tape") return p;
  if(SCANMODE==="exam") return p[0]||{};
  return {};
}
function commitScan(){
  const p=SCANFOUND; if(!p) return;
  if(SCANMODE==="label"){ mealModal({kcal:p.kcal||0,prot:p.prot||0,carb:p.carb||0,fat:p.fat||0,qty:p.portion||100}); return; }
  if(SCANMODE==="scale"||SCANMODE==="tape"){ measureModal(p); return; }
  if(SCANMODE==="exam"){
    p.forEach(e=>STATE.exams.push({id:uid(),date:todayISO(),name:e.name,value:e.value,unit:e.unit,ref:""}));
    save(); toast(t("common.saved")); go("progress"); return;
  }
  if(SCANMODE==="sheet"){
    const w={id:uid(), name:(LANG==="pt"?"Treino da ficha ":"Sheet workout ")+fmtShort(todayISO()), days:[],
      items:p.map(i=>({exId:i.exId,sets:i.sets,reps:i.reps,load:i.load,rest:60}))};
    STATE.workouts.push(w); save(); toast(t("common.saved")); go("workout"); return;
  }
}

function cloudConnect(provider, clientId){
  /* Arquitetura pronta: com o Client ID informado, o fluxo OAuth do provedor e aberto.
     Sem Client ID, o app segue funcionando com backup em arquivo. */
  if(provider==="gdrive"){
    const redirect=location.origin+location.pathname;
    const url="https://accounts.google.com/o/oauth2/v2/auth?client_id="+encodeURIComponent(clientId)+
      "&redirect_uri="+encodeURIComponent(redirect)+"&response_type=token&scope="+
      encodeURIComponent("https://www.googleapis.com/auth/drive.file")+"&prompt=consent";
    window.open(url,"_blank","noopener");
    toast(LANG==="pt"?"Autorize na janela do Google e volte ao app.":"Authorise in the Google window and return to the app.");
  } else if(provider==="onedrive"){
    const redirect=location.origin+location.pathname;
    const url="https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id="+encodeURIComponent(clientId)+
      "&response_type=token&redirect_uri="+encodeURIComponent(redirect)+"&scope="+encodeURIComponent("Files.ReadWrite offline_access");
    window.open(url,"_blank","noopener");
    toast(LANG==="pt"?"Autorize na janela da Microsoft e volte ao app.":"Authorise in the Microsoft window and return to the app.");
  } else toast(t("st.cloudPending"));
}
function cloudCaptureToken(){
  const h=location.hash||"";
  if(h.indexOf("access_token=")>=0){
    const tk=new URLSearchParams(h.slice(1)).get("access_token");
    if(tk){ sessionStorage.setItem("riseone.cloudtoken",tk);
      if(STATE){ STATE.settings.cloud.connected=true; save(); }
      history.replaceState(null,"",location.pathname+location.search);
      toast(LANG==="pt"?"Nuvem conectada nesta sessão.":"Cloud connected for this session."); }
  }
}
function backupBlob(){
  const data={app:"RiseONE", version:APP_VERSION, exported:new Date().toISOString(), state:STATE};
  return new Blob([JSON.stringify(data)],{type:"application/json"});
}
function exportBackup(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(backupBlob());
  a.download="riseone-backup-"+todayISO()+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(t("common.saved"));
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      const st=d.state||d; if(!st.profile) throw 0;
      STATE=Object.assign(defaultState(), st); save(); boot(); toast(t("common.saved"));
    }catch(e){ toast(t("tr.badCode")); } };
  r.readAsText(file);
}

    (p.w||[]).forEach(w=>STATE.workouts.push({id:uid(), name:w.name, days:w.days||[], items:w.items||[], fromCoach:true}));
    if(p.d && p.d.kcal) STATE.diet=Object.assign({},STATE.diet,p.d);

  }catch(e){ toast(t("tr.badCode")); }

function loginModal(preset){
  const cards=[["guest","👤",t("role.guest"),t("login.guest.d")],["student","🏃",t("role.student"),t("login.student.d")],
    ["trainer","🧑‍🏫",t("role.trainer"),t("login.trainer.d")],["advertiser","📣",t("role.advertiser"),t("login.adv.d")]];
  const m=modal('<div class="mh"><h2 style="margin:0">Rise<span style="color:var(--accent)">ONE</span></h2><button class="iconbtn" data-close>&times;</button></div>'+
    '<p class="muted">'+t("login.title")+"</p><div id='lgbody'></div>",{wide:false,sticky:false});
  const body=m.querySelector("#lgbody");
  function pickRole(){
    body.innerHTML='<div class="grid g2 collapse">'+cards.map(c=>
      '<button class="chip" data-role="'+c[0]+'" style="text-align:left;padding:12px;border-radius:12px">'+
      '<div style="font-size:1.4rem">'+c[1]+'</div><div style="font-weight:800">'+c[2]+'</div><div class="tiny" style="font-weight:400;opacity:.85">'+c[3]+"</div></button>").join("")+"</div>";
    body.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{
      const r=b.getAttribute("data-role");
      if(r==="guest"){ ROOT.session={role:"guest",name:t("role.guest"),uid:null}; saveRoot(); m.remove(); boot(); }
      else authForm(r);
    });
  }
  function authForm(r){
    const existing=Object.values(ROOT.users).filter(u=>u.role===r);
    let mode = existing.length? "in":"up";
    const paint=()=>{
      body.innerHTML='<div class="pill acc" style="margin-bottom:10px">'+t("role."+(r==="advertiser"?"advertiser":r))+"</div>"+
        (mode==="in"
          ? '<label class="fld"><span>'+t("login.name")+'</span><select id="lg_u">'+existing.map(u=>'<option value="'+u.id+'">'+esc(u.name)+"</option>").join("")+"</select></label>"
          : '<label class="fld"><span>'+t("login.name")+'</span><input id="lg_n" type="text"></label>')+
        '<label class="fld"><span>'+t("login.pass")+'</span><input id="lg_p" type="password"></label>'+
        (mode==="up"?'<label class="fld"><span>'+t("login.pass2")+'</span><input id="lg_p2" type="password"></label>':"")+
        '<div class="row"><button class="btn" id="lg_go">'+(mode==="in"?t("login.enter"):t("login.create"))+"</button>"+
        '<button class="btn line sm" id="lg_sw">'+(mode==="in"?t("login.new"):t("login.have"))+"</button></div>"+
        '<div class="sep"></div><div class="row"><button class="btn ghost sm" id="lg_bio">🔒 '+t("login.bio")+'</button><button class="btn ghost sm" id="lg_soc">🟦 '+t("login.social")+"</button></div>"+
        '<p class="tiny muted" style="margin-top:8px">'+t("login.soon")+"</p>"+
        '<div class="sep"></div><button class="btn line sm" id="lg_back">← '+t("common.back")+"</button>";
      body.querySelector("#lg_sw").onclick=()=>{ mode=(mode==="in")?"up":"in"; if(mode==="in"&&!existing.length){ toast(t("login.none")); mode="up"; } paint(); };
      body.querySelector("#lg_back").onclick=pickRole;
      body.querySelector("#lg_bio").onclick=bioLogin;
      body.querySelector("#lg_soc").onclick=()=>toast(t("login.soon"));
      body.querySelector("#lg_go").onclick=()=>{
        const p=body.querySelector("#lg_p").value;
        if(mode==="up"){
          const n=body.querySelector("#lg_n").value.trim();
          if(!n) return toast(t("login.noname"));
          if(p.length<4) return toast(t("login.short"));
          if(p!==body.querySelector("#lg_p2").value) return toast(t("login.nomatch"));
          if(Object.values(ROOT.users).some(u=>u.name.toLowerCase()===n.toLowerCase()&&u.role===r)) return toast(t("login.exists"));
          const id=uid();
          ROOT.users[id]={id, name:n, role:r, pass:hashPass(p)};
          ROOT.data[id]=defaultState(n);
          ROOT.session={role:r, name:n, uid:id};
          saveRoot(); m.remove(); boot();
        } else {
          const id=body.querySelector("#lg_u").value, u=ROOT.users[id];
          if(!u || u.pass!==hashPass(p)) return toast(t("login.wrong"));
          ROOT.session={role:u.role, name:u.name, uid:u.id};
          saveRoot(); m.remove(); boot();
        }
      };
    };
    paint();
  }
  function bioLogin(){
    if(!window.PublicKeyCredential){ toast(t("login.soon")); return; }
    toast(t("login.soon"));
  }
  if(preset) authForm(preset); else pickRole();
  return m;
}

/* ---------- 36. MONTAR E EXPANDIR ROTINAS ---------- */
const PURPOSE_TYPES={before:["warm"], after:["stretch"], daily:["stretch","mob"], aero:["aero","warm"], mob:["mob"]};
const PART_GROUPS=[
  ["superior",{pt:"Parte de cima",en:"Upper body"},["peitoral","dorsal","ombro-frente","ombro-lado","ombro-tras","trapezio","romboides","biceps","triceps","antebraco"]],
  ["core",{pt:"Barriga e lombar",en:"Core and lower back"},["abdomen","obliquos","lombar"]],
  ["pernas",{pt:"Pernas",en:"Legs"},["quadriceps","posterior","panturrilha","adutores"]],
  ["gluteo",{pt:"Glúteos e quadril",en:"Glutes and hips"},["gluteo","abdutores"]],
  ["cardio",{pt:"Fôlego (aeróbico)",en:"Cardio"},["cardio"]]
];
function partLabel(g){ return LANG==="pt"?g[1].pt:g[1].en; }
function expandRoutine(list){
  const out=[];
  list.forEach(it=>{
    const mv=MOVI[it[0]]; if(!mv) return;
    const sec=it[1]||mv.sec;
    if(mv.side){ out.push({mv,sec,side:"L"}); out.push({mv,sec,side:"R"}); }
    else out.push({mv,sec,side:null});
  });
  return out;
}
function routineSeconds(list){ return expandRoutine(list).reduce((a,x)=>a+x.sec,0); }
function buildRoutine(purpose, groups, minutes){
  const types=PURPOSE_TYPES[purpose]||["warm"];
  let want=[];
  groups.forEach(gid=>{ const g=PART_GROUPS.find(x=>x[0]===gid); if(g) want=want.concat(g[2]); });
  const all=MOVES.filter(m=>m.type.some(tp=>types.indexOf(tp)>=0));
  let pick=all.filter(m=>!want.length || m.mus.some(x=>want.indexOf(x)>=0));
  if(!pick.length) pick=all;
  /* aquecimento comeca pelo que eleva a temperatura */
  if(purpose==="before"||purpose==="aero"){
    pick.sort((a,b)=>(b.mus.indexOf("cardio")>=0?1:0)-(a.mus.indexOf("cardio")>=0?1:0));
  }
  const target=minutes*60, chosen=[], used={};
  let total=0, i=0;
  while(total<target && i<pick.length){
    const m=pick[i++]; used[m.id]=1; chosen.push([m.id,m.sec]); total+=m.sec*(m.side?2:1);
  }
  /* faltou tempo? completa com movimentos gerais do mesmo tipo */
  if(total<target*0.85){
    const rest=all.filter(m=>!used[m.id]);
    let j=0;
    while(total<target && j<rest.length){
      const m=rest[j++]; used[m.id]=1; chosen.push([m.id,m.sec]); total+=m.sec*(m.side?2:1);
    }
  }
  if(!chosen.length) return null;
  return chosen;
}


/* ---------- 37. TELA: AQUECER & ALONGAR ---------- */
let WUF={purpose:"before", groups:[], minutes:5, kind:"", libType:"", libPart:""};
function autoGroupsFromWorkout(w){
  if(!w||!(w.items||[]).length) return [];
  const mus=new Set();
  w.items.forEach(it=>{ const x=allEx().find(e=>e.id===it.exId); if(x){ mus.add(x.m); (x.sec||[]).forEach(m=>mus.add(m)); } });
  const gs=[];
  PART_GROUPS.forEach(g=>{ if(g[2].some(m=>mus.has(m))) gs.push(g[0]); });
  return gs.filter(g=>g!=="cardio");
}
function fmtMin(sec){ const m=Math.round(sec/60); return m<1? (sec+"s") : (m+" min"); }

     '<div class="grid gauto">'+mvs.map(m=>
       '<div class="mvcard"><div class="mvpose">'+poseSVG(m.pose)+"</div>"+
       '<div class="nm">'+esc(mvName(m))+'</div><div class="tiny muted">'+esc(mvTip(m))+"</div>"+

/* ---------- 38. PLAYER GUIADO DE ROTINA ---------- */
const RUN={list:[],i:0,left:0,endAt:0,running:false,tick:null,el:null,title:"",started:0,intro:false,lastBeep:-1,done:false};
function runRoutine(list,title){
  if(!list||!list.length){ toast(t("wu.noMoves")); return; }
  closeRoutine(true);
  RUN.list=list; RUN.i=0; RUN.title=title||t("wu.title"); RUN.started=Date.now(); RUN.done=false;
  RUN.intro=true; RUN.left=6; RUN.endAt=Date.now()+6000; RUN.running=true; RUN.lastBeep=-1;
  const d=document.createElement("div"); d.id="routinescreen"; document.body.appendChild(d); RUN.el=d;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  keepAwake();
  buildRoutineUI();
  clearInterval(RUN.tick); RUN.tick=setInterval(routineStep,200);
}
function closeRoutine(silent){
  clearInterval(RUN.tick); RUN.tick=null; RUN.running=false;
  if(RUN.el){ RUN.el.remove(); RUN.el=null; }
  if(!silent) releaseAwake();
}
function routineLeft(){ return RUN.running? Math.max(0,(RUN.endAt-Date.now())/1000) : RUN.left; }
function routineGo(n){
  const i=RUN.i+n;
  if(i<0) return;
  if(i>=RUN.list.length){ finishRoutine(); return; }
  RUN.i=i; RUN.intro=false; RUN.lastBeep=-1;
  RUN.left=RUN.list[i].sec; RUN.endAt=Date.now()+RUN.left*1000;
  if(!RUN.running){ RUN.running=true; clearInterval(RUN.tick); RUN.tick=setInterval(routineStep,200); }
  buildRoutineUI();
}
function routinePause(){
  if(RUN.running){ RUN.left=routineLeft(); RUN.running=false; clearInterval(RUN.tick); RUN.tick=null; }
  else { RUN.endAt=Date.now()+RUN.left*1000; RUN.running=true; clearInterval(RUN.tick); RUN.tick=setInterval(routineStep,200); keepAwake(); }
  paintRoutine();
}
function routineStep(){
  const v=routineLeft(), r=Math.ceil(v);
  if(r<=3 && r>0 && r!==RUN.lastBeep){ RUN.lastBeep=r; beep(1); }
  if(v<=0.05){
    if(RUN.intro){ RUN.intro=false; RUN.i=0; RUN.lastBeep=-1;
      RUN.left=RUN.list[0].sec; RUN.endAt=Date.now()+RUN.left*1000; beep(2); buildRoutineUI(); return; }
    if(RUN.i>=RUN.list.length-1){ beep(3); finishRoutine(); return; }
    RUN.i++; RUN.lastBeep=-1; RUN.left=RUN.list[RUN.i].sec; RUN.endAt=Date.now()+RUN.left*1000;
    beep(2); buildRoutineUI(); return;
  }
  paintRoutine();
}
function finishRoutine(){
  clearInterval(RUN.tick); RUN.tick=null; RUN.running=false; RUN.done=true;
  const dur=Math.round((Date.now()-RUN.started)/1000);
  STATE.wuLogs=STATE.wuLogs||[];
  STATE.wuLogs.push({id:uid(), date:todayISO(), name:RUN.title, dur, moves:RUN.list.length});
  save();
  if(navigator.vibrate){ try{ navigator.vibrate([200,100,200,100,400]); }catch(e){} }
  if(RUN.el) RUN.el.innerHTML=
    '<div class="rhead"><span class="spacer" style="flex:1"></span><button class="iconbtn" id="rxclose">&times;</button></div>'+
    '<div class="rmid" style="text-align:center"><div style="font-size:4rem">🎉</div>'+
    '<h1 style="margin:.2em 0">'+t("wu.done")+'</h1><p class="muted">'+t("wu.doneSub")+"</p>"+
    '<div class="row" style="justify-content:center"><span class="pill acc">'+fmtMin(dur)+'</span><span class="pill">'+RUN.list.length+" "+t("wu.moves")+"</span></div></div>"+
    '<div class="rfoot"><button class="btn wide big" id="rxdone">'+t("common.ok")+"</button></div>";
  if(RUN.el){ RUN.el.querySelector("#rxclose").onclick=()=>closeRoutine(); RUN.el.querySelector("#rxdone").onclick=()=>{ closeRoutine(); if(ROUTE==="warm") render(); }; }
}
function buildRoutineUI(){
  if(!RUN.el) return;
  const intro=RUN.intro, it=RUN.list[Math.max(0,RUN.i)], nx=RUN.list[RUN.i+1];
  const shown = intro? RUN.list[0] : it;
  RUN.el.innerHTML=
    '<div class="rhead"><button class="iconbtn" id="rclose2">&times;</button>'+
      '<div style="flex:1;min-width:0"><div class="tiny muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(RUN.title)+"</div>"+
      '<strong>'+(intro?t("wu.getready"):((RUN.i+1)+" "+t("wu.of")+" "+RUN.list.length))+"</strong></div>"+
      '<button class="btn line sm" id="rfin">'+t("wu.finish")+"</button></div>"+
    '<div class="rbar"><i id="rprog"></i></div>'+
    '<div class="rmid">'+
      '<div class="rpose">'+poseSVG(shown.mv.pose)+"</div>"+
      '<h2 id="rname" style="margin:.2em 0;text-align:center">'+esc(mvName(shown.mv))+"</h2>"+
      (shown.side?'<span class="pill acc">'+t(shown.side==="L"?"wu.left":"wu.right")+"</span>":"")+
      '<div id="rdig">00:00</div>'+
      '<p class="muted" style="text-align:center;max-width:520px;margin:0 auto">'+esc(mvTip(shown.mv))+"</p>"+
    "</div>"+
    '<div class="rfoot">'+
      (nx?'<div class="tiny muted" style="text-align:center;margin-bottom:8px">'+t("wu.next")+": "+esc(mvName(nx.mv))+"</div>":"")+
      '<div class="tctl"><button class="btn ghost" id="rprev">⏮ '+t("wu.prevm")+'</button>'+
      '<button class="btn big" id="rplay">⏸ '+t("tm.pause")+'</button>'+
      '<button class="btn ghost" id="rnext">'+t("wu.skip")+" ⏭</button></div>"+
      '<div class="tiny muted" id="rawake" style="text-align:center;margin-top:8px"></div>'+
    "</div>";
  const q=id=>RUN.el.querySelector(id);
  q("#rclose2").onclick=()=>closeRoutine();
  q("#rfin").onclick=()=>finishRoutine();
  q("#rprev").onclick=()=>{ if(RUN.intro) return; RUN.i>0? routineGo(-1) : routineGo(0); };
  q("#rnext").onclick=()=>{ RUN.intro? routineGo(0) : routineGo(1); };
  q("#rplay").onclick=routinePause;
  paintRoutine();
}
function paintRoutine(){
  if(!RUN.el) return;
  const v=routineLeft(), d=RUN.el.querySelector("#rdig"); if(!d) return;
  d.textContent=fmtClock(v);
  d.className = v<=3 ? "warn":"";
  const tot = RUN.intro? 6 : (RUN.list[RUN.i]?RUN.list[RUN.i].sec:1);
  const pr=RUN.el.querySelector("#rprog"); if(pr) pr.style.width=Math.max(0,Math.min(100,v/tot*100))+"%";
  const pl=RUN.el.querySelector("#rplay");
  if(pl) pl.innerHTML = RUN.running? ("⏸ "+t("tm.pause")) : ("▶ "+t("tm.resume"));
  const aw=RUN.el.querySelector("#rawake");
  if(aw) aw.textContent = awakeActive()? ("🔆 "+t("tm.awakeOn")) : "";
}

/* ---------- 32. INICIALIZACAO ---------- */
function boot(){
  loadRoot();
  LANG = ROOT.prefs.lang || "pt";
  applyTheme(ROOT.prefs.theme || "dark");
  document.documentElement.lang = LANG==="pt"?"pt-BR":"en";
  document.getElementById("langlabel").textContent = LANG==="pt"?"PT":"EN";
  document.getElementById("vertxt").textContent = "v"+APP_VERSION;
  document.querySelectorAll("[data-i18n]").forEach(n=>{ n.textContent=t(n.getAttribute("data-i18n")); });

  const s=ROOT.session;
  if(!s){ STATE=defaultState(); GUEST=true; buildNav(); render(); paintAd(); loginModal(); return; }
  if(s.role==="guest"){ GUEST=true; STATE=STATE&&GUEST?STATE:defaultState(t("role.guest")); }
  else { GUEST=false; STATE=Object.assign(defaultState(s.name), ROOT.data[s.uid]||{});
         STATE.settings=Object.assign(defaultState().settings, STATE.settings||{});
         STATE.settings.cloud=Object.assign({provider:"",clientId:"",connected:false}, STATE.settings.cloud||{});
         STATE.diet=Object.assign({kcal:0,prot:0,carb:0,fat:0,water:8,restKcal:0}, STATE.diet||{});
         STATE.profile=Object.assign(defaultState().profile, STATE.profile||{});
         if(!STATE.profile.name) STATE.profile.name=s.name; }
  if(ROUTE!=="home" && visibleRoutes().every(r=>r.id!==ROUTE)) ROUTE="home";
  buildNav(); render(); paintAd(); cloudCaptureToken();
}
