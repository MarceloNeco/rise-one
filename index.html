/* ---------- 59. TABELA CID (consulta, offline, com tamanho e limpeza) ---------- */
/* Por que fica em arquivo separado e em gaveta propria: e uma tabela de consulta, nao um dado da pessoa.
   Assim da para baixar, medir o quanto ocupa e apagar sem encostar no resto. */
const CIDKEY="riseone.cid";
let CIDDB=null;
function cidRead(){
  if(CIDDB) return CIDDB;
  try{ const s=localStorage.getItem(CIDKEY); if(s){ CIDDB=JSON.parse(s); return CIDDB; } }catch(e){}
  return null;
}
function cidBytes(){
  try{ const s=localStorage.getItem(CIDKEY); return s? s.length*2 : 0; }catch(e){ return 0; }
}
function fmtBytes(n){
  if(!n) return "0 KB";
  if(n<1024) return n+" B";
  if(n<1024*1024) return (n/1024).toFixed(1).replace(".",LANG==="pt"?",":".")+" KB";
  return (n/1048576).toFixed(1).replace(".",LANG==="pt"?",":".")+" MB";
}
function cidClear(){
  try{ localStorage.removeItem(CIDKEY); }catch(e){}
  CIDDB=null;
}
function cidLoad(cb){
  if(location.protocol==="file:"){ cb(false); return; }
  fetch("cid.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.itens){ cb&&cb(false); return; }
    CIDDB=j;
    try{ localStorage.setItem(CIDKEY, JSON.stringify(j)); }catch(e){}
    cb&&cb(true);
  }).catch(()=>cb&&cb(false));
}
function cidSearch(q){
  const db=cidRead(); if(!db) return [];
  q=String(q||"").toLowerCase().trim();
  if(q.length<2) return db.itens.slice(0,25);
  return db.itens.filter(i=>(i.cid+" "+i.pt+" "+i.en+" "+zoneName(i.zona)).toLowerCase().indexOf(q)>=0).slice(0,60);
}
function cidCard(){
  const db=cidRead();
  let h='<details class="fold" id="cidfold"><summary>'+I("book")+t("cid.title")+"</summary><div class='fb'>";
  h+='<p class="tiny muted">'+t("cid.sub")+"</p>";
  if(!db){
    h+='<div class="row"><button class="btn line" id="cidget">'+I("download")+t("cid.download")+"</button></div>";
  } else {
    h+='<div class="row" style="align-items:center"><span class="pill">'+db.itens.length+" "+t("cid.codes")+'</span><span class="pill">'+fmtBytes(cidBytes())+'</span>'+
       '<button class="btn xs ghost" id="cidref">'+I("refresh")+t("cid.refresh")+'</button>'+
       '<button class="btn xs line" id="ciddel">'+I("trash")+t("cid.clear")+"</button></div>";
    h+='<div class="warnbox tiny" style="margin:10px 0">'+I("alert")+"<div>"+t("cid.check")+"</div></div>";
    h+='<div class="help-q" style="margin:8px 0">'+I("search")+'<input type="search" id="cidq" placeholder="'+t("cid.searchph")+'"></div>';
    h+='<div class="cidlist" id="cidlist">'+cidRows(cidSearch(""))+"</div>";
  }
  h+="</div></details>";
  return h;
}
function cidRows(list){
  if(!list.length) return '<p class="tiny muted">'+t("cid.noHits")+"</p>";
  return list.map(i=>'<div class="cidrow"><b>'+esc(i.cid)+"</b><span>"+esc(LANG==="pt"?i.pt:i.en)+'</span><small class="muted">'+esc(zoneName(i.zona))+" · TUSS: "+(i.tuss?esc(i.tuss):"—")+"</small></div>").join("");
}
function wireCid(){
  const g=document.getElementById("cidget");
  if(g) g.onclick=()=>{ g.disabled=true; g.textContent=t("cid.loading"); cidLoad(ok=>{ toast(ok?t("cid.ready"):t(location.protocol==="file:"?"cid.fileOnly":"cid.fail")); render(); }); };
  const r=document.getElementById("cidref");
  if(r) r.onclick=()=>cidLoad(ok=>{ toast(ok?t("cid.ready"):t("cid.fail")); render(); });
  const d=document.getElementById("ciddel");
  if(d) d.onclick=()=>confirmBox(t("cid.clearAsk"),()=>{ cidClear(); toast(t("common.done")); render(); });
  const q=document.getElementById("cidq");
  if(q) q.oninput=()=>{ document.getElementById("cidlist").innerHTML=cidRows(cidSearch(q.value)); };
}

/* ---------- 60. CAMERA: ZOOM, TEMPORIZADOR, PRIVACIDADE E PROJECAO ---------- */
/* Por que: a foto do rótulo quase sempre sai tremida ou longe demais. Aqui a pessoa aproxima,
   usa o temporizador para não mexer no aparelho na hora do clique, e pode borrar o fundo antes
   de fotografar em lugar público. */
const CAM2={zoom:1, timer:0, privacy:false, track:null, hasZoom:false, zmin:1, zmax:4, host:null, busy:false, focusModes:[], hasTorch:false, torch:false, meterT:null, poi:false};
/* foco: pede foco contínuo ao abrir; ao tocar na imagem, um foco único naquele ponto (quando o aparelho deixa) */
function camFocusContinuous(){
  if(!CAM2.track || CAM2.focusModes.indexOf("continuous")<0) return;
  try{ CAM2.track.applyConstraints({advanced:[{focusMode:"continuous"}]}); }catch(e){}
}
function camFocusOnce(px,py){
  if(!CAM2.track) return;
  const adv={};
  if(CAM2.focusModes.indexOf("single-shot")>=0) adv.focusMode="single-shot";
  else if(CAM2.focusModes.indexOf("manual")<0 && CAM2.focusModes.indexOf("continuous")>=0) adv.focusMode="continuous";
  if(CAM2.poi && px!==undefined) adv.pointsOfInterest=[{x:Math.max(0,Math.min(1,px)), y:Math.max(0,Math.min(1,py))}];
  if(!Object.keys(adv).length) return;
  try{ CAM2.track.applyConstraints({advanced:[adv]}).then(()=>{ setTimeout(camFocusContinuous, 1800); }).catch(()=>{}); }catch(e){}
}
function camTorch(on){
  if(!CAM2.track || !CAM2.hasTorch) return;
  CAM2.torch=!!on;
  try{ CAM2.track.applyConstraints({advanced:[{torch:CAM2.torch}]}); }catch(e){}
  const b=CAM2.host && CAM2.host.querySelector("#camtorch"); if(b) b.classList.toggle("on", CAM2.torch);
}
/* medidor de nitidez ao vivo: a mesma medida da foto, só que na prévia, duas vezes por segundo */
function camMeterStart(v){
  if(CAM2.meterT) clearInterval(CAM2.meterT);
  CAM2.meterT=setInterval(()=>{
    const box=CAM2.host && CAM2.host.querySelector("#camfocus"); if(!box || !v.videoWidth) return;
    const s=sharpnessOf(v,200); if(s===null) return;
    const ok=s>=BLUR_MIN;
    box.classList.toggle("ok",ok); box.classList.toggle("bad",!ok);
    box.querySelector("i").style.width=Math.max(4,Math.min(100,Math.round(s/(BLUR_MIN*2.2)*100)))+"%";
    box.querySelector("span").textContent=ok? t("cam.sharp") : t("cam.blurry");
  },500);
}
function camZoomApply(v){
  CAM2.zoom=Math.max(CAM2.zmin, Math.min(CAM2.zmax, v));
  const vd=CAM2.host && CAM2.host.querySelector("video");
  if(CAM2.hasZoom && CAM2.track){
    try{ CAM2.track.applyConstraints({advanced:[{zoom:CAM2.zoom}]}); if(vd) vd.style.transform=""; return; }catch(e){}
  }
  /* sem zoom de verdade no aparelho: aproxima na tela mesmo (a foto sai recortada igual) */
  if(vd) vd.style.transform="scale("+CAM2.zoom.toFixed(2)+")";
  paintCamBar();
}
function paintCamBar(){
  const n=CAM2.host && CAM2.host.querySelector("#camzlv");
  if(n) n.textContent=CAM2.zoom.toFixed(1)+"×";
  const p=CAM2.host && CAM2.host.querySelector("#campriv");
  if(p) p.classList.toggle("on", CAM2.privacy);
  const vd=CAM2.host && CAM2.host.querySelector("video");
  if(vd) vd.classList.toggle("blur", CAM2.privacy);
  const tb=CAM2.host && CAM2.host.querySelectorAll("[data-camt]");
  if(tb) tb.forEach(b=>b.classList.toggle("on", +b.getAttribute("data-camt")===CAM2.timer));
}
/* mede o foco da imagem: variancia do Laplaciano. Numero baixo = foto borrada. */
function sharpnessOf(src, W){
  W=W||320;
  const sw=src.videoWidth||src.naturalWidth||src.width, shh=src.videoHeight||src.naturalHeight||src.height;
  if(!sw||!shh) return null;
  const H=Math.max(1,Math.round(shh/sw*W));
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const cx=cv.getContext("2d"); cx.drawImage(src,0,0,W,H);
  let d;
  try{ d=cx.getImageData(0,0,W,H).data; }catch(e){ return null; }
  const g=new Float32Array(W*H);
  for(let i=0,j=0;i<d.length;i+=4,j++) g[j]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  let sum=0, sum2=0, n=0;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const k=y*W+x;
    const L=g[k-W]+g[k+W]+g[k-1]+g[k+1]-4*g[k];
    sum+=L; sum2+=L*L; n++;
  }
  if(!n) return null;
  const mean=sum/n;
  return sum2/n-mean*mean;
}
function sharpness(dataUrl, cb){
  const im=new Image();
  im.onload=()=>cb(sharpnessOf(im,320));
  im.onerror=()=>cb(null);
  im.src=dataUrl;
}
const BLUR_MIN=45;   /* abaixo disso a leitura erra muito; valor medido em fotos de rotulo */
/* tira a foto, confere o foco e so entrega quando estiver boa (ou quando a pessoa insistir) */
function shootChecked(dataUrl, cb){
  sharpness(dataUrl, v=>{
    if(v===null || v>=BLUR_MIN){ cb(dataUrl); return; }
    const m=modal('<div class="mh"><div class="row nowrap"><span class="ibub warn">'+I("alert")+'</span><div><h3 style="margin:0">'+t("cam.blurT")+'</h3><small class="muted">'+t("cam.blurS")+"</small></div></div></div>"+
      '<img src="'+dataUrl+'" class="blurshot">'+
      '<ul class="bul tiny">'+["cam.blur1","cam.blur2","cam.blur3"].map(k=>"<li>"+t(k)+"</li>").join("")+"</ul>"+
      '<div class="row" style="justify-content:flex-end"><button class="btn line" id="bl_any">'+t("cam.useAnyway")+'</button>'+
      '<button class="btn" id="bl_new">'+I("camera")+t("cam.again")+"</button></div>");
    m.querySelector("#bl_any").onclick=()=>{ m.remove(); cb(dataUrl); };
    m.querySelector("#bl_new").onclick=()=>{ m.remove(); };
  });
}
/* camera completa: usada pelo leitor e por quem precisar de uma foto boa */
function startCam2(host, cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast(t("sc.noCam")); return; }
  CAM2.host=host; CAM2.zoom=1; CAM2.busy=false;
  host.innerHTML='<div class="camstage"><video class="camprev" autoplay playsinline muted></video><div class="camring" id="camring"></div><div class="camcount" id="camcount"></div></div>'+
    '<div class="camctl">'+
      '<button class="iconbtn" id="camzout" title="'+t("cam.zoomOut")+'">'+I("zoomout")+'</button>'+
      '<span class="camz" id="camzlv">1.0×</span>'+
      '<button class="iconbtn" id="camzin" title="'+t("cam.zoomIn")+'">'+I("zoomin")+'</button>'+
      '<button class="iconbtn" id="camflip" title="'+t("sc.switch")+'">'+I("flip")+'</button>'+
      '<button class="iconbtn hidden" id="camfoc" title="'+t("cam.focus")+'" aria-label="'+t("cam.focus")+'">'+I("target")+'</button>'+
      '<button class="iconbtn hidden" id="camtorch" title="'+t("cam.torch")+'" aria-label="'+t("cam.torch")+'">'+I("zap")+'</button>'+
      '<button class="iconbtn" id="campriv" title="'+t("cam.privacy")+'">'+I("eye")+"</button></div>"+
    '<div class="camfocus" id="camfocus" aria-live="polite"><div class="bar"><i style="width:4%"></i></div><span>'+t("cam.focusHint")+"</span></div>"+
    '<div class="chips" style="margin:8px 0"><span class="kicker" style="align-self:center;margin-right:4px">'+t("cam.timer")+"</span>"+
      [0,3,10].map(n=>'<button class="chip'+(CAM2.timer===n?" on":"")+'" data-camt="'+n+'">'+(n?n+"s":t("cam.noTimer"))+"</button>").join("")+"</div>"+
    '<div class="row"><button class="btn" id="camshoot">'+I("camera")+t("sc.shoot")+'</button>'+
    '<button class="btn line" id="camstop">'+t("sc.stop")+"</button></div>"+
    '<p class="tiny muted" style="margin-top:8px">'+t("cam.privacyNote")+"</p>";
  const v=host.querySelector("video");
  const open=()=>{
    stopCam();
    navigator.mediaDevices.getUserMedia({video:{facingMode:CAMFACING,width:{ideal:1920},height:{ideal:1440}},audio:false})
      .then(s=>{
        CAMSTREAM=s; v.srcObject=s;
        CAM2.track=s.getVideoTracks()[0];
        let cap={};
        try{ cap=CAM2.track.getCapabilities? CAM2.track.getCapabilities() : {}; }catch(e){}
        CAM2.hasZoom=!!(cap && cap.zoom);
        CAM2.zmin=CAM2.hasZoom? (cap.zoom.min||1) : 1;
        CAM2.zmax=CAM2.hasZoom? (cap.zoom.max||4) : 3;
        CAM2.zoom=CAM2.zmin; camZoomApply(CAM2.zoom);
        /* foco e lanterna só aparecem quando o aparelho tem (detecção de recurso, não de marca) */
        CAM2.focusModes=(cap && cap.focusMode)||[]; CAM2.poi=!!(cap && cap.pointsOfInterest); CAM2.hasTorch=!!(cap && cap.torch); CAM2.torch=false;
        const fb=host.querySelector("#camfoc"); if(fb) fb.classList.toggle("hidden", !CAM2.focusModes.length);
        const tb2=host.querySelector("#camtorch"); if(tb2) tb2.classList.toggle("hidden", !CAM2.hasTorch);
        camFocusContinuous(); camMeterStart(v); paintCamBar();
      })
      .catch(()=>{ toast(t("sc.denied")); host.innerHTML=""; });
  };
  open();
  /* quando o zoom e so na tela, recorta de verdade o pedaco que a pessoa esta vendo */
  const cropZoom=(src,W,H)=>{
    const cv=document.createElement("canvas");
    const z=(!CAM2.hasZoom && CAM2.zoom>1)? CAM2.zoom : 1;
    const sw=W/z, sh=H/z;
    cv.width=Math.round(sw); cv.height=Math.round(sh);
    cv.getContext("2d").drawImage(src,(W-sw)/2,(H-sh)/2,sw,sh,0,0,cv.width,cv.height);
    return cv;
  };
  const grabFrame=()=>{
    if(!v.videoWidth){ toast(t("sc.noCam")); return; }
    const cv=cropZoom(v, v.videoWidth, v.videoHeight);
    resizeImage(cv.toDataURL("image/jpeg",0.92),2000, d=>shootChecked(d,cb));
  };
  /* foto cheia (ImageCapture.takePhoto): sai da câmera em resolução de foto, não de vídeo. Se falhar, usa o quadro do vídeo */
  const grab=()=>{
    if(window.ImageCapture && CAM2.track && !CAM2.privacy){
      let done=false;
      const fallback=()=>{ if(done) return; done=true; grabFrame(); };
      const timer=setTimeout(fallback, 2500);
      try{
        new ImageCapture(CAM2.track).takePhoto().then(blob=>{
          const im=new Image();
          im.onload=()=>{ if(done) return; done=true; clearTimeout(timer); URL.revokeObjectURL(im.src);
            const cv=cropZoom(im, im.naturalWidth, im.naturalHeight);
            resizeImage(cv.toDataURL("image/jpeg",0.92),2000, d=>shootChecked(d,cb)); };
          im.onerror=()=>{ clearTimeout(timer); fallback(); };
          im.src=URL.createObjectURL(blob);
        }).catch(()=>{ clearTimeout(timer); fallback(); });
      }catch(e){ clearTimeout(timer); fallback(); }
      return;
    }
    grabFrame();
  };
  const count=(n)=>{
    const el=host.querySelector("#camcount");
    CAM2.busy=true;
    const tick=()=>{
      if(n<=0){ el.textContent=""; CAM2.busy=false; try{ beep(2); }catch(e){} grab(); return; }
      el.textContent=n; try{ beep(1); }catch(e){}
      n--; setTimeout(tick,1000);
    };
    tick();
  };
  host.querySelector("#camshoot").onclick=()=>{ if(CAM2.busy) return; CAM2.timer? count(CAM2.timer) : grab(); };
  host.querySelector("#camstop").onclick=()=>{ stopCam(); host.innerHTML=""; };
  host.querySelector("#camflip").onclick=()=>{ CAMFACING=(CAMFACING==="environment")?"user":"environment"; open(); };
  host.querySelector("#camzin").onclick=()=>camZoomApply(CAM2.zoom+(CAM2.hasZoom?(CAM2.zmax-CAM2.zmin)/6:0.25));
  host.querySelector("#camzout").onclick=()=>camZoomApply(CAM2.zoom-(CAM2.hasZoom?(CAM2.zmax-CAM2.zmin)/6:0.25));
  host.querySelector("#campriv").onclick=()=>{ CAM2.privacy=!CAM2.privacy; paintCamBar(); };
  host.querySelectorAll("[data-camt]").forEach(b=>b.onclick=()=>{ CAM2.timer=+b.getAttribute("data-camt"); paintCamBar(); });
  /* toque na imagem = foco naquele ponto, com o anel mostrando onde */
  const stage=host.querySelector(".camstage"), ring=host.querySelector("#camring");
  stage.addEventListener("pointerdown", e=>{
    const r=stage.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
    ring.style.left=(px*100)+"%"; ring.style.top=(py*100)+"%"; ring.classList.add("on"); setTimeout(()=>ring.classList.remove("on"),900);
    camFocusOnce(px,py);
  });
  const fb=host.querySelector("#camfoc"); if(fb) fb.onclick=()=>{ ring.style.left="50%"; ring.style.top="50%"; ring.classList.add("on"); setTimeout(()=>ring.classList.remove("on"),900); camFocusOnce(0.5,0.5); };
  const tb2=host.querySelector("#camtorch"); if(tb2) tb2.onclick=()=>camTorch(!CAM2.torch);
  paintCamBar();
}
/* ---- projetar na TV ---- */
/* O navegador não manda vídeo para a TV por conta própria. O que dá para fazer, de verdade:
   1) janelinha flutuante (picture-in-picture), que a maioria das TVs pega no espelhamento;
   2) tela cheia, para quem espelha o celular inteiro;
   3) Chrome no computador: o próprio menu "Transmitir" da página.
   Nada aqui inventa conexão com a TV: o app só prepara a imagem. */
function canPiP(){ return !!(document.pictureInPictureEnabled); }
function projectVideo(vd){
  if(!vd){ toast(t("tv.noVideo")); return; }
  if(canPiP() && vd.requestPictureInPicture){
    vd.requestPictureInPicture().catch(()=>fullscreenEl(vd.parentElement||vd));
    return;
  }
  fullscreenEl(vd.parentElement||vd);
}
function fullscreenEl(el){
  if(!el) return;
  const f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(f) try{ f.call(el); }catch(e){ toast(t("tv.noFull")); }
  else toast(t("tv.noFull"));
}

  modal('<div class="mh"><div class="row nowrap"><span class="ibub">'+I("cast")+'</span><h3 style="margin:0">'+t("tv.title")+"</h3></div></div>"+

    "<p class='tiny muted'>"+t("tv.note")+"</p>");
}

/* ---------- 61. LEITURA DE ROTULO: INGREDIENTES, ADITIVOS E SEMAFORO ---------- */
/* Por que: a tabela nutricional sozinha diz pouco. Quem compra quer saber, em dois segundos,
   se aquilo é comida ou é fórmula — e o que está escondido atrás de "INS 621". */
/* Aditivos citados com mais frequência nos rótulos brasileiros. A lista é de consulta:
   [numero INS, nome PT, nome EN, papel]. papel: cor|sabor|adocante|conservante|emulsificante|espessante|acidulante|outro */
const ADITIVOS=[
 ["102","Tartrazina (amarelo)","Tartrazine (yellow)","cor"],
 ["110","Amarelo crepúsculo","Sunset yellow","cor"],
 ["122","Azorrubina","Azorubine","cor"],
 ["129","Vermelho 40","Allura red","cor"],

const ADIT_IDX={}; ADITIVOS.forEach(a=>ADIT_IDX[a[0]]=a);
function aditName(a){ return LANG==="pt"?a[1]:a[2]; }
function papelName(p){ return t("rt.papel."+p); }
/* palavras que aparecem no rótulo mesmo sem o número INS */
const ADIT_WORDS=[
 [/aromatizante|aroma (?:natural|artificial|identico)/,"sabor"],
 [/corante/,"cor"],
 [/conservador|conservante/,"conservante"],
 [/emulsificante|emulsionante/,"emulsificante"],
 [/espessante|estabilizante/,"espessante"],
 [/edulcorante|adocante/,"adocante"],
 [/realcador de sabor/,"sabor"],
 [/antiumectante|antioxidante|acidulante|regulador de acidez|humectante/,"outro"]
];
const DIETAS=[
 ["diet",   /\bdiet\b/],
 ["light",  /\blight\b/],
 ["zero",   /\bzero\b|sem a[cç]ucar|no added sugar|sugar[- ]free/],
 ["lowcarb",/low ?carb|baixo carboidrato/],
 ["semlac", /sem lactose|zero lactose|lactose[- ]free/],
 ["semglu", /sem gluten|gluten[- ]free|nao contem gluten/],
 ["vegano", /\bvegano\b|\bvegan\b/],
 ["vegetar",/vegetariano|vegetarian/],
 ["integr", /\bintegral\b|whole ?grain|whole ?wheat/],
 ["organ",  /\borganico\b|\borganic\b/]
];
function dietaName(k){ return t("rt.dieta."+k); }
/* limites do rótulo frontal brasileiro (RDC 429/2020 e IN 75/2020, checados em 1/9/2026).
   Valores por 100 g (sólido) e por 100 ml (líquido). Confira a norma antes de usar como laudo. */
const ALTO_EM={ solido:{acucar:15, gordSat:6, sodio:600}, liquido:{acucar:7.5, gordSat:3, sodio:300} };
/* A tabela nutricional so vale a partir do cabecalho dela. Sem isso, "bicarbonato de sodio
   (INS 500ii)" da lista de ingredientes viraria "500 mg de sodio". */
function nutriText(raw){
  const lines=String(raw).split(/\n/);
  const i=lines.findIndex(l=>/informa[çc][ãa]o nutri|tabela nutricional|nutrition facts|valor energ[ée]tico|por[çc][ãa]o de|serving size/i.test(l));
  if(i>=0) return lines.slice(i).join("\n");
  return lines.filter(l=>!/ingredientes?\s*:/i.test(l)).join("\n");
}
function parseRotulo(raw){
  const full=norm(raw).replace(/\s+/g," ");
  const nt=nutriText(raw);
  const x=norm(nt).replace(/\s+/g," ");
  const o=parseLabel(nt) || {};
  /* embalagem e porção */
  o.pack   = grab(x,[/conteudo(?: liquido)?[^\d]{0,20}(\d+(?:[.,]\d+)?)\s*(?:g|ml|kg|l)\b/, /peso liquido[^\d]{0,20}(\d+(?:[.,]\d+)?)/, /net (?:weight|content)[^\d]{0,20}(\d+(?:[.,]\d+)?)/]);
  o.packUnit = (x.match(/conteudo(?: liquido)?[^\d]{0,20}\d+(?:[.,]\d+)?\s*(kg|ml|g|l)\b/)||[])[1]||"";
  o.portions = grab(x,[/(\d+(?:[.,]\d+)?)\s*por[cç]oes? por embalagem/, /about (\d+) servings/]);
  o.sugar  = grab(x,[/a[cç]ucares? totai?s?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /total sugars?[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.addSugar=grab(x,[/a[cç]ucares? adicionados?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /added sugars?[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.satFat = grab(x,[/gorduras? saturadas?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /saturated fat[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.transFat=grab(x,[/gorduras? trans[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /trans fat[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.liquido = /\bml\b|\blitro\b|\blitros\b/.test(full);
  /* marca: a primeira linha curta em maiúsculas costuma ser a marca */
  const lines=String(raw).split(/\n+/).map(l=>l.trim()).filter(l=>l.length>2);
  const cand=lines.slice(0,6).find(l=>l.length<=28 && /[A-ZÀ-Ý]{3}/.test(l) && l===l.toUpperCase() && !/\d{2,}/.test(l));
  o.brand = cand || "";
  /* lista de ingredientes */
  const mi=full.match(/ingredientes?\s*:?\s*([^]*?)(?:\.|alergicos|contem|pode conter|informa[cç]ao nutri|tabela nutricional|valor energetico|$)/);
  o.ingRaw = mi? mi[1].trim() : "";
  o.ings = o.ingRaw? o.ingRaw.split(/,|;/).map(s=>s.trim()).filter(s=>s.length>1&&s.length<60).slice(0,40) : [];
  /* aditivos: pelo numero INS e pelas palavras do rotulo */
  const found={};
  (full.match(/ins\s*[-:]?\s*(\d{3}[a-z]{0,2})/g)||[]).forEach(m=>{
    const n=(m.match(/(\d{3}[a-z]{0,2})/)||[])[1];
    if(!n) return;
    const a=ADIT_IDX[n]||ADIT_IDX[n.replace(/[a-z]+$/,"")];
    found["ins"+n]={num:n, nome:a?aditName(a):("INS "+n), papel:a?a[3]:"outro"};
  });
  ADIT_WORDS.forEach(([re,papel])=>{ if(re.test(full) && !Object.values(found).some(f=>f.papel===papel)) found["w"+papel]={num:"", nome:papelName(papel), papel}; });
  o.aditivos=Object.values(found);
  /* selos que a embalagem anuncia */
  o.dietas=DIETAS.filter(d=>d[1].test(full)).map(d=>d[0]);
  /* "alto em" pelo limite do rotulo frontal */
  const lim=o.liquido? ALTO_EM.liquido : ALTO_EM.solido;
  const p100=v=>{
    if(v==null) return null;
    if(!o.portion || o.portion<=0) return v;       /* ja parece ser por 100 */
    return v/o.portion*100;
  };
  o.altoEm=[];
  const sg=p100(o.addSugar!=null?o.addSugar:o.sugar), sf=p100(o.satFat), sd=o.sodium!=null? p100(o.sodium) : null;
  if(sg!=null && sg>=lim.acucar) o.altoEm.push("acucar");
  if(sf!=null && sf>=lim.gordSat) o.altoEm.push("gordSat");
  if(sd!=null && sd>=lim.sodio) o.altoEm.push("sodio");
  o.por100={acucar:sg, gordSat:sf, sodio:sd};
  o.rag=ragRotulo(o);
  return (o.kcal!=null||o.ings.length||o.aditivos.length)? o : null;
}
/* Semáforo. O critério é do app e está escrito na tela — não é classificação oficial.
   Verde: pouca coisa na lista e nenhum aditivo cosmético.
   Amarelo: lista média, ou um aditivo cosmético, ou um "alto em".
   Vermelho: dois ou mais aditivos cosméticos, ou dois ou mais "alto em". */
const COSMETICO=["cor","sabor","adocante","emulsificante","espessante"];
function ragRotulo(o){
  const cos=o.aditivos.filter(a=>COSMETICO.indexOf(a.papel)>=0).length;
  const alto=(o.altoEm||[]).length;
  const n=o.ings.length;
  let pts=0;
  if(cos>=2) pts+=2; else if(cos===1) pts+=1;
  if(alto>=2) pts+=2; else if(alto===1) pts+=1;
  if(n>10) pts+=1;
  if(o.transFat!=null && o.transFat>0) pts+=1;
  const cor = pts>=3? "r" : (pts>=1? "a" : "g");
  return {cor, cos, alto, pts};
}
function ragLabel(c){ return t(c==="g"?"rt.ragG":(c==="a"?"rt.ragA":"rt.ragR")); }
function rotuloCard(o){

  if((o.altoEm||[]).length){

  const nutri=[["kcal","kcal",""],["prot",t("dt.prot"),"g"],["carb",t("dt.carb"),"g"],["fat",t("dt.fat"),"g"],
               ["sugar",t("rt.acucar"),"g"],["satFat",t("rt.gordSat"),"g"],["fiber",t("rt.fibra"),"g"],["sodium",t("rt.sodio"),"mg"]];

  }
  if(o.pack||o.portions){
    h+='<p class="tiny muted" style="margin-top:8px">'+
      (o.pack?t("rt.pack")+": "+fmtNum(o.pack,0)+" "+(o.packUnit||"g"):"")+
      (o.portions?" · "+t("rt.portions")+": "+fmtNum(o.portions,0):"")+"</p>";
  }
  if(o.dietas.length){
    h+='<div class="sep"></div><span class="kicker">'+t("rt.selos")+'</span><div class="chips" style="margin-top:6px">'+
      o.dietas.map(d=>'<span class="chip on">'+I("check")+esc(dietaName(d))+"</span>").join("")+"</div>"+
      '<p class="tiny muted">'+t("rt.selosNote")+"</p>";
  }
  if(o.aditivos.length){
    h+='<div class="sep"></div><span class="kicker">'+t("rt.aditivos")+" ("+o.aditivos.length+")</span>"+
      '<div class="list" style="margin-top:6px">'+o.aditivos.map(a=>
        '<div class="item"><span class="pill'+(COSMETICO.indexOf(a.papel)>=0?" warn":"")+'">'+esc(a.num?"INS "+a.num:"—")+'</span>'+
        '<div class="gr"><div class="t">'+esc(a.nome)+'</div><div class="s">'+esc(papelName(a.papel))+"</div></div></div>").join("")+"</div>";
  }
  if(o.ings.length){
    h+='<details class="fold" style="margin-top:12px"><summary>'+I("file")+t("rt.ings")+' <span class="pill" style="margin-left:6px">'+o.ings.length+"</span></summary><div class='fb'>"+
      '<ol class="bul tiny">'+o.ings.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ol>"+
      '<p class="tiny muted">'+t("rt.ingsNote")+"</p></div></details>";
  }
  h+=nutForYouHTML(o);
  h+='<p class="tiny muted" style="margin-top:12px">'+t("rt.criterio")+"</p>";
  h+="</div>";
  return h;
}

/* Por que: ultrassom, ecocardiograma, tomografia e teste ergométrico não são tabela de valores
   — são texto. Antes o app tentava tirar números deles e produzia linhas sem sentido ("O rim
   direito mede 10,5"). Agora o laudo é guardado como está escrito, com a data e o nome do exame.
   O app não interpreta, não classifica e não diz se está bom ou ruim: ele guarda e mostra. */
function laudos(){ STATE.laudos=STATE.laudos||[]; return STATE.laudos; }

/* ---------- IMPORTAR EXAMES DE UM ARQUIVO ----------
   Diferente de "Restaurar backup", que troca tudo: aqui os exames e laudos do arquivo são
   ACRESCENTADOS ao que já existe. Nada é apagado, e repetido não entra duas vezes. */
/* ---------- IMPORTAR O ARQUIVO DO LAUDO ----------
   Entrada única: PDF do laboratório, foto do papel ou o .json que o app exporta.
   O botão decide o caminho sozinho — quem chega com o PDF na mão não precisa
   descobrir que isso mora na tela da câmera. */
function exArquivo(file){
  if(!file) return;
  const nome=(file.name||"").toLowerCase(), tipo=(file.type||"").toLowerCase();
  if(/\.json$/.test(nome) || /json/.test(tipo)) return exImportar(file);
  if(/\.pdf$/.test(nome) || /pdf/.test(tipo))   return exArquivoPDF(file);
  if(/^image\//.test(tipo) || /\.(jpe?g|png|webp|heic|bmp)$/.test(nome)){
    /* foto do papel: a tela da câmera já tem o leitor e a pré-visualização */
    SCANMODE="exam"; go("scan");
    setTimeout(()=>{ try{ lerArquivoExame(file); }catch(e){ toast(t("ex.imBad")); } },400);
    return;
  }
  toast(t("ex.imTipo"));
}
function exArquivoPDF(file){
  if(typeof precisaConta==="function" && !precisaConta()) return;
  const m=modal(mh(t("ex.lendo"))+'<p id="ex_st" class="muted">'+t("pdf.opening")+"</p>"+
    '<div class="bar"><i id="ex_bar" style="width:8%"></i></div>',{sticky:true});
  const passo=(txt,pc)=>{ const a=m.querySelector("#ex_st"), b=m.querySelector("#ex_bar");
    if(a) a.textContent=txt; if(b) b.style.width=pc+"%"; };
  file.arrayBuffer()
    .then(buf=>pdfExtrair(buf,(i,n)=>passo(t("pdf.reading").replace("{i}",i).replace("{n}",n), Math.round(i/n*85))))
    .then(r=>{
      if(r.escaneado){ m.remove(); toast(t("ex.imScan")); SCANMODE="exam"; go("scan"); return; }
      m.remove(); exConfirmaTexto(r.texto, file.name||"");
    })
    .catch(()=>{ m.remove(); toast(t("pdf.fail")); });
}
/* mostra o que foi lido e só guarda depois do "sim" */

      itens.map(i=>"<tr><td>"+esc(i.name)+'</td><td class="num">'+esc(i.value)+" "+esc(i.unit||"")+"</td><td>"+esc(i.ref||"—")+"</td></tr>").join("")+

  const m=modal(mh(t("ex.imTitulo"))+corpo,{wide:true});

function exImportar(file){

    const chave=e=>[e.date,norm(e.name||""),String(e.value)].join("|");
    const ja={}; STATE.exams.forEach(e=>ja[chave(e)]=1);
    let nEx=0, nLd=0;

      const k=chave(e); if(ja[k]) return; ja[k]=1;

                        unit:String(e.unit||"").slice(0,16), ref:String(e.ref||"").slice(0,40)});
      nEx++;
    });
    lista.forEach(l=>{
      if(!l || !l.texto) return;
      const antes=STATE.laudos.length;
      laudoSave({data:l.data||l.date, titulo:l.titulo, texto:l.texto});
      if(STATE.laudos.length>antes) nLd++;
    });
    save(); render();
    toast(t("ex.imOk").replace("{e}",nEx).replace("{l}",nLd));
  };
  r.readAsText(file);
}

/* Qual indicador a linha cita. A comparacao e' com o NOME do exame, ancorada em palavra
   inteira — do contrario "Altura" viraria TGP (por causa do "alt") e "CAD-RADS" viraria
   calcio. Empate: ganha a palavra mais longa, senao "HDL - Colesterol" viraria colesterol. */
function palavraInteira(hay, needle){
  const i=hay.indexOf(needle);
  if(i<0) return -1;
  const antes=i? hay[i-1] : " ", depois=hay[i+needle.length] || " ";
  const letra=/[a-z0-9]/;
  return (letra.test(antes) || letra.test(depois))? -1 : i;
}
function indOf(nome){
  const n=" "+norm(nome).replace(/[^a-z0-9]+/g," ").trim()+" ";
  let best=null, bestLen=0;
  INDICADORES.forEach(([id,words,un])=>{
    words.forEach(w=>{
      const ww=" "+norm(w).replace(/[^a-z0-9]+/g," ").trim()+" ";
      if(n.indexOf(ww)<0) return;
      if(ww.length>bestLen){ best={id,unit:un,word:w}; bestLen=ww.length; }
    });
  });
  return best;
}

function indName(id){ return IND_NOMES[id] || id; }

/* ---------- LEITURA DO LAUDO ----------
   O laudo de laboratorio e' uma tabela: NOME ....... VALOR UNIDADE ....... FAIXA.
   A leitura respeita tres regras, e todas existem por causa de erro que ja aconteceu:
     1) o nome vem no COMECO da linha e nao tem numero dentro. Assim "2- Teste ergometrico"
        e "hidronefrose. O rim direito mede 10,5 cm" nunca viram exame;
     2) o nome casa com o dicionario por palavra inteira. Assim "Altura" nao vira TGP;
     3) nome desconhecido so' entra se a unidade for de laboratorio E houver faixa impressa.
        Assim o numero do CRBM de quem assinou nao vira ferritina.
   A faixa e' guardada como esta' escrita no papel — o app nao converte nem interpreta. */
const EX_IGNORAR=/^\s*(nome|unidade|idade|sexo|g[eê]nero|prontu[aá]rio|exame|convênio|data|hora|peso|altura)\s*:|paciente|data (da )?coleta|data de nasc|nascimento|\bdn\b|convenio|conv[eê]nio|requisitante|solicitante|assinado eletronicamente|\bcrm\b|\bcrbm\b|\bcrf\b|protocolo|amostra|material\s*:|m[eé]todo|metodo|liberado|p[aá]gina|laborat[oó]rio|cnpj|endere[cç]o|telefone|assinatura|\bcpf\b|\brg\b|\bfap\b|respons[aá]vel|atendimento ao|intervalo de refer[eê]ncia\s*$|legenda|resultado\s*$|observa[cç]/i;
/* unidades que existem em laudo de laboratorio */
const EX_UNID=/^(mg\/dl|g\/dl|g\/l|%|u\/l|ui\/l|mui\/ml|mui\/l|µui\/ml|uui\/ml|ui\/ml|meq\/l|mmol\/l|µmol\/l|umol\/l|nmol\/l|ng\/ml|ng\/dl|pg\/ml|pg|µg\/dl|ug\/dl|µg\/l|ug\/l|mg\/l|fl|s|seg|ml\/min(\/1[,.]73m2)?|mm\/h|mm3|\/mm³|\/µl|\/ul|10\^\d+\/µl|10\^\d+\/ul|x10\^\d+\/µl)$/i;
function exUnidOk(u){ return EX_UNID.test(String(u).replace(/\s/g,"")); }
function exNum(v){ return String(v).replace(/\.(?=\d{3}\b)/g,"").replace(",","."); }
function exNumOk(v){ const n=exNum(v); return /^-?\d+(\.\d+)?$/.test(n) && isFinite(parseFloat(n)); }
/* a faixa fica como esta' impressa: "13,0 a 17,0 g/dL", "< 190 mg/dL", "até 1,00" */
function exFaixa(resto){
  const r=String(resto).replace(/\s+/g," ").trim();
  let m=r.match(/(-?\d+(?:[.,]\d+)?\s*(?:a|à|at[ée]|-|–|to)\s*-?\d+(?:[.,]\d+)?(?:\s*[^\s,;)]{1,12}(?:\s[A-Za-zµμ]{1,3}\b)?)?)/i);
  if(m) return m[1].trim();
  m=r.match(/((?:at[eé]|menor que|inferior a|<|≤)\s*-?\d+(?:[.,]\d+)?(?:\s*[^\s,;)]{1,12})?)/i);
  if(m) return m[1].trim();
  m=r.match(/((?:maior que|superior a|>|≥)\s*-?\d+(?:[.,]\d+)?(?:\s*[^\s,;)]{1,12})?)/i);
  if(m) return m[1].trim();
  return "";
}
/* data do laudo, do proprio cabecalho */
function exData(raw){
  const t=String(raw);
  let m=t.match(/data\s*(?:da\s*)?(?:coleta|do exame|de realiza[cç][aã]o)[^\d]{0,20}(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/i)
      || t.match(/coleta\/recebimento\s*:?\s*(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/i)
      || t.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if(!m) return "";
  const d=("0"+m[1]).slice(-2), mo=("0"+m[2]).slice(-2);
  return m[3]+"-"+mo+"-"+d;
}
/* No PDF o nome do exame as vezes quebra em duas linhas: "Contagem de" numa, "Plaquetas"
   na seguinte. Sem juntar, o exame entra com nome pela metade e vira outro exame. */
const EX_CONECTOR=/\s(de|da|do|dos|das|e|em|com|por|-|–)$/i;
function exNomeCompleto(nome, proxima){
  const p=String(proxima||"").trim().replace(/[:\s]+$/,"");
  /* a continuacao e' uma linha curta so' de letras, sem valor nenhum */
  if(!p || /\d/.test(p) || p.length>34 || !/^[A-Za-zÀ-ÿ]/.test(p)) return nome;
  if(EX_IGNORAR.test(p)) return nome;
  const junto=(nome+" "+p).trim();
  const a=indOf(nome), b=indOf(junto);
  /* junta quando o nome inteiro e' reconhecido (ou melhor reconhecido) que a metade,
     ou quando a metade termina em conector ("Contagem de", "Atividade de") */
  if(b && (!a || b.word.length>a.word.length)) return junto;
  if(!a && EX_CONECTOR.test(" "+nome)) return junto;
  return nome;
}
/* todos os pares "numero + unidade" de um pedaco de linha, na ordem em que aparecem */
function exPares(str){
  const out=[], re=/(-?\d[\d.]*(?:,\d+)?)\s*([^\s]{0,14})/g;
  let m; while((m=re.exec(str))) out.push({v:m[1], u:(m[2]||"").replace(/[.,;:)]+$/,""), fim:re.lastIndex});
  return out;
}
/* Qual numero da linha e' o resultado. Uma linha de laudo costuma ter varios:
   "Leucócitos 100 % 6.260 /µL 100 % 4.000 a 10.000 /µL". Ganha, nesta ordem:
   o que esta' na unidade do proprio exame, depois o primeiro com unidade de laboratorio,
   depois o primeiro de todos. */
function exEscolhe(pares, unidEsperada){
  if(!pares.length) return null;
  if(unidEsperada){
    const alvo=norm(unidEsperada).replace(/\s/g,"");
    const bate=pares.find(q=>norm(q.u).replace(/\s/g,"")===alvo);
    if(bate) return bate;
  }
  return pares.find(q=>exUnidOk(q.u)) || pares[0];
}
/* Alguns laudos escrevem em bloco: o nome do exame numa linha, "Resultado: 96 mg/dL" na
   seguinte e "Valores de referência: 70 a 99" na outra. O bloco so' abre quando a linha e'
   SO' o nome de um exame conhecido, e so' fecha na primeira linha que traz um valor. */
const EX_REFLINE=/^\s*(valor(es)?\s+de\s+refer|refer[eê]ncias?|desej[aá]vel|desejavel|normal\s*:|\bvr\s*:|intervalo)/i;
const EX_SOVALOR=/^\s*(resultado|valor|result)?\s*:?\s*(-?\d.*)$/i;
/* Alguns laudos escrevem "(Vide Intervalo de Referência Abaixo)" na linha do resultado e
   colocam a faixa numa "Tabela de Referência - <exame>" mais adiante. Isso lê essas tabelas.
   So' entram as linhas de faixa NEUTRA ("Com jejum:", "Normal:", "Desejável:"). Tabela de
   risco ou de meta ("Baixo Risco:", "Extremo:", "Meta") fica de fora de proposito: ali o
   numero depende do risco de cada pessoa, e quem define isso e' o medico, nao o app. */
const EX_TAB_NEUTRA=/^\s*(com jejum|sem jejum|normal|desej[aá]vel|[oó]timo|refer[eê]ncia|valores? de refer)\s*:/i;
function exTabelasRef(raw){
  const linhas=String(raw).split(/\r?\n/);
  const mapa={};
  linhas.forEach((l,i)=>{
    const m=l.match(/tabela de refer[eê]ncia\s*[-–:]\s*(.{3,60})$/i);
    if(!m) return;
    const ind=indOf(m[1].trim());
    if(!ind || mapa[ind.id]) return;
    for(let k=i+1;k<Math.min(i+8,linhas.length);k++){
      const l2=linhas[k].trim();
      if(!l2) continue;
      if(/gr[aá]fico|hist[oó]rico/i.test(l2)) break;
      if(!EX_TAB_NEUTRA.test(l2)) continue;
      const f=exFaixa(l2.replace(EX_TAB_NEUTRA,""));
      if(f){ mapa[ind.id]=f; break; }
    }
  });
  return mapa;
}
function parseExame(raw){
  const tabelas=exTabelasRef(raw);
  const linhas=String(raw).split(/\r?\n/);
  const out=[], vistos={};
  let ctx=null, ultimo=null, ctxIdade=0;
  linhas.forEach((l,idx)=>{
    if(!l || l.trim().length<4) return;
    /* linha de referencia: nunca vira exame, so' preenche a faixa do ultimo */
    if(EX_REFLINE.test(l)){
      const f=exFaixa(l.replace(EX_REFLINE,""));
      if(f && ultimo && !ultimo.ref) ultimo.ref=f;
      return;
    }
    if(EX_IGNORAR.test(l)) return;
    /* linha que e' so' o nome de um exame conhecido: abre o bloco */
    /* "HEMOGLOBINA GLICADA (HbA1c)" e' so' nome: o numero esta' dentro do parenteses do nome */
    const semPar=l.replace(/\([^)]*\)/g," ");
    if(!/(^|[\s:])-?\d/.test(semPar) && l.trim().length<=60){
      const so=indOf(l.trim());
      if(so){ ctx=so; ctxIdade=0; return; }
      if(ctx && ++ctxIdade>3) ctx=null;
      return;
    }
    /* dentro de um bloco aberto, "Resultado: 96 mg/dL" pertence ao exame do bloco */
    if(ctx && ++ctxIdade<=3){
      const mv=l.match(EX_SOVALOR);
      if(mv){
        const pares=exPares(mv[2]).filter(q=>exNumOk(q.v));
        const esc=exEscolhe(pares, ctx.unit);
        if(esc && !vistos[ctx.id]){
          vistos[ctx.id]=1;
          const it={ind:ctx.id, name:indName(ctx.id), value:exNum(esc.v),
                    unit:exUnidOk(esc.u)? esc.u : ctx.unit||"", ref:exFaixa(mv[2].slice(esc.fim)), line:l.trim()};
          out.push(it); ultimo=it;
        }
        ctx=null; return;
      }
    } else ctx=null;
    /* Duas diagramacoes: a do PDF, com colunas separadas por 2 ou mais espacos ou ":",
       e a da foto lida pela camera, onde as colunas viram um espaco so'. A segunda so'
       vale quando o nome e' um exame conhecido — senao qualquer frase viraria exame. */
    let m=l.match(/^\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s\-\.\/\(\)]{2,54}?)(?:\s{2,}|\s*:\s*)(-?\d.*)$/);
    let frouxo=false;
    if(!m){ m=l.match(/^\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s\-\.\/\(\)0-9]{2,54}?)\s+(-?\d.*)$/); frouxo=true; }
    if(!m) return;
    let nome=m[1].trim().replace(/[\s:\.]+$/,"");
    nome=exNomeCompleto(nome, linhas[idx+1]).replace(/[\s:\-\.]+$/,"");
    if((nome.match(/[A-Za-zÀ-ÿ]/g)||[]).length<3) return;
    const ind=indOf(nome);
    if(frouxo && !ind) return;
    const pares=exPares(m[2]).filter(q=>exNumOk(q.v));
    const esc=exEscolhe(pares, ind? ind.unit : "");
    if(!esc) return;
    const valor=esc.v;
    const unid=exUnidOk(esc.u)? esc.u : "";
    const resto=m[2].slice(esc.fim);
    const faixa=exFaixa(resto);
    /* nome que o dicionario nao conhece so' entra com unidade de laboratorio E faixa impressa */
    if(!ind && !(unid && faixa)) return;
    const key=ind? ind.id : "x"+norm(nome);
    if(vistos[key]) return;
    vistos[key]=1;
    const it={ind:ind?ind.id:"", name:ind? indName(ind.id) : nome,
              value:exNum(valor), unit:unid||(ind?ind.unit:""), ref:faixa, line:l.trim()};
    out.push(it); ultimo=it; ctx=null;
  });
  /* faixa que ficou vazia e existe numa "Tabela de Referência" do mesmo laudo */
  out.forEach(it=>{ if(!it.ref && it.ind && tabelas[it.ind]) it.ref=tabelas[it.ind]; });
  return out.length? out.slice(0,60) : null;
}
/* ---------- LAUDO DESCRITIVO (ultrassom, eco, tomografia, ergometria) ----------
   Nao e' tabela de valores: e' texto. O app guarda o texto como esta' escrito, com a data
   e o nome do exame, e nao interpreta nada. */
const LAUDO_TITULOS=/(ultrassonografia|ultrassom|ecocardiograma|eletrocardiograma|tomografia|angio[\s-]?tc|resson[aâ]ncia|radiografia|raio[\s-]?x|densitometria|teste ergom[eé]trico|ergometria|endoscopia|colonoscopia|mamografia|doppler|cintilografia)/i;
const LAUDO_SECAO=/^\s*(conclus(?:[aã]o|[oõ]es)(?:\s+e\s+coment[aá]rios?)?|impress[aã]o(?:\s+diagn[oó]stica)?|opini[aã]o|coment[aá]rios?|sum[aá]rio|an[aá]lise|parecer)\s*:?\s*$/i;
/* o texto da conclusao para quando chega no rodape ou numa secao que nao e' conclusao */
const LAUDO_FIM=/^\s*(observa[cç][oõ]es?|nota\s*:|refer[eê]ncias?|laudado por|assinado|respons[aá]vel t[eé]cnico|m[eé]dico\s|dr\(a\)|crm)/i;
/* no texto do laudo o filtro e' mais leve: la' "protocolo" e "metodo" fazem parte da frase */
const LAUDO_IGNORAR=/^\s*(nome|unidade|idade|sexo|g[eê]nero|prontu[aá]rio|conv[eê]nio|data|hora|peso|altura|m[eé]dico|solicitante|requisitante|paciente)\s*:|^\s*p[aá]gina\b|cnpj|\bcrm\b|assinado eletronicamente/i;
function parseLaudo(raw){
  const t=String(raw);
  /* se o papel e' uma tabela de laboratorio, ele nao e' laudo descritivo: a mencao de
     "colonoscopia" no meio de uma lista de exames nao transforma um hemograma em laudo */
  const tab=parseExame(t);
  if(tab && tab.length>=5) return null;
  const mt=t.match(LAUDO_TITULOS);
  if(!mt) return null;
  const linhas=t.split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim());
  /* titulo: a linha mais parecida com nome de exame */
  let titulo="";
  for(const l of linhas){ if(l.length>6 && l.length<90 && LAUDO_TITULOS.test(l)){ titulo=l; break; } }
  if(!titulo) titulo=mt[1];
  /* conclusao: o bloco depois de "CONCLUSÃO"/"IMPRESSÃO" */
  let i=-1;
  for(let k=0;k<linhas.length;k++){
    if(LAUDO_SECAO.test(linhas[k])){ i=k+1; break; }
    const inline=linhas[k].match(/^(conclus[aã]o|impress[aã]o(?: diagn[oó]stica)?|opini[aã]o)\s*:\s*(.+)$/i);
    if(inline){ i=k; break; }
  }
  let texto="";
  if(i>=0){
    const bloco=[];
    const inline=linhas[i].match(/^(conclus[aã]o|impress[aã]o(?: diagn[oó]stica)?|opini[aã]o)\s*:\s*(.+)$/i);
    if(inline) bloco.push(inline[2]);
    for(let k=inline?i+1:i; k<linhas.length && bloco.join(" ").length<1200; k++){
      const l=linhas[k];
      if(!l) { if(bloco.length) break; else continue; }
      if(LAUDO_FIM.test(l)) break;
      if(LAUDO_IGNORAR.test(l)) continue;
      bloco.push(l);
    }
    texto=bloco.join("\n").trim();
  }
  if(!texto){
    texto=linhas.filter(l=>l.length>25 && !LAUDO_IGNORAR.test(l)).slice(0,14).join("\n");
  }
  if(!texto) return null;
  return {tipo:"laudo", titulo:titulo.slice(0,90), data:exData(t), texto:texto.slice(0,2500)};
}
/* agrupa o historico por indicador, para virar um grafico por linha */
/* ---------- COMPARAR COM A FAIXA DO PRÓPRIO LAUDO ----------
   O RiseONE não classifica exame. O que ele faz aqui é aritmética: pega a faixa que o SEU
   laboratório imprimiu ao lado do resultado e diz se o número caiu dentro, fora ou na beira
   dela — que é a mesma legenda que o laudo já traz. Sem faixa impressa, não diz nada.
   Isso não é diagnóstico, não considera o seu histórico nem os seus remédios, e não
   substitui a leitura do médico. */
function exFaixaNum(ref){
  const r=String(ref||"").replace(/\s+/g," ").trim();
  if(!r) return null;
  const n=x=>parseFloat(exNum(x));
  let m=r.match(/(-?\d[\d.]*(?:,\d+)?)\s*(?:a|à|at[ée]|-|–|to)\s*(-?\d[\d.]*(?:,\d+)?)/i);
  if(m){ const lo=n(m[1]), hi=n(m[2]); if(isFinite(lo)&&isFinite(hi)&&hi>lo) return {min:lo,max:hi}; }
  m=r.match(/(?:inferior a|menor que|abaixo de|at[ée]|<|≤)\s*(-?\d[\d.]*(?:,\d+)?)/i);
  if(m){ const hi=n(m[1]); if(isFinite(hi)) return {max:hi}; }
  m=r.match(/(?:superior a|maior que|acima de|>|≥)\s*(-?\d[\d.]*(?:,\d+)?)/i);
  if(m){ const lo=n(m[1]); if(isFinite(lo)) return {min:lo}; }
  return null;
}
/* "" = sem faixa impressa · dentro · borda · abaixo · acima */
function exStatus(valor, ref){
  const f=exFaixaNum(ref); if(!f) return "";
  const v=parseFloat(String(valor).replace(",",".")); if(!isFinite(v)) return "";
  if(f.min!=null && v<f.min) return "abaixo";
  if(f.max!=null && v>f.max) return "acima";
  /* "na borda" = dentro da faixa, mas nos 5% finais de cada ponta */
  const larg=(f.min!=null&&f.max!=null)? (f.max-f.min) : Math.abs(f.max!=null?f.max:f.min);
  const m=larg*0.05;
  if(f.min!=null && v<=f.min+m) return "borda";
  if(f.max!=null && v>=f.max-m) return "borda";
  return "dentro";
}
const EX_ST_CLS={dentro:"ok", borda:"warn", abaixo:"bad", acima:"bad"};
function exStatusPill(valor, ref){
  const st=exStatus(valor, ref); if(!st) return "";
  return '<span class="pill xs '+EX_ST_CLS[st]+'" title="'+esc(t("ex.stTitle"))+'">'+t("ex.st_"+st)+"</span>";
}
function examSeries(){
  const by={};
  (STATE.exams||[]).forEach(e=>{
    const ind=indOf(e.name);
    const key=ind? ind.id : norm(e.name);
    const v=parseFloat(String(e.value).replace(",","."));
    if(isNaN(v)) return;
    (by[key]=by[key]||{key, name: ind? indName(ind.id) : e.name, unit:e.unit||(ind?ind.unit:""), pts:[]}).pts.push({d:e.date, v, ref:e.ref||""});
  });
  const peso={acima:0, abaixo:0, borda:1, dentro:2, "":3};
  return Object.values(by).map(s=>{
      s.pts.sort((a,b)=>a.d<b.d?-1:1);
      const u=s.pts[s.pts.length-1];
      s.st=exStatus(u.v, u.ref);
      return s; })
    .filter(s=>s.pts.length>0)
    /* quem saiu da faixa vem primeiro, depois quem tem mais leituras */
    .sort((a,b)=>(peso[a.st]-peso[b.st]) || (b.pts.length-a.pts.length) || (a.name<b.name?-1:1));
}
function examChart(s){
  if(s.pts.length<2) return "";
  const W=320,H=90,P=10;
  const ultima=s.pts[s.pts.length-1];
  const f=exFaixaNum(ultima.ref) || exFaixaNum((s.pts.find(p=>p.ref)||{}).ref);
  const vs=s.pts.map(p=>p.v).slice();
  /* a faixa entra na escala, para dar para ver o quanto o ponto ficou fora dela */
  if(f){ if(f.min!=null) vs.push(f.min); if(f.max!=null) vs.push(f.max); }
  let mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  const folga=((mx-mn)||Math.abs(mx)||1)*0.12; mn-=folga; mx+=folga;
  const span=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/Math.max(1,s.pts.length-1);
  const y=v=>H-P-((v-mn)/span)*(H-2*P);
  const d=s.pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  let faixa="";
  if(f){
    const yTopo=(f.max!=null)? y(f.max) : 0;
    const yBase=(f.min!=null)? y(f.min) : H;
    faixa='<rect class="exband" x="0" y="'+Math.min(yTopo,yBase).toFixed(1)+'" width="'+W+'" height="'+Math.abs(yBase-yTopo).toFixed(1)+'"/>';
    if(f.max!=null) faixa+='<line class="exlim" x1="0" y1="'+y(f.max).toFixed(1)+'" x2="'+W+'" y2="'+y(f.max).toFixed(1)+'"/>';
    if(f.min!=null) faixa+='<line class="exlim" x1="0" y1="'+y(f.min).toFixed(1)+'" x2="'+W+'" y2="'+y(f.min).toFixed(1)+'"/>';
  }
  return '<svg class="exchart" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(s.name)+'">'+
    faixa+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    s.pts.map((p,i)=>{
      const st=exStatus(p.v, p.ref||ultima.ref);
      return '<circle class="expt '+(st||"")+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+((st==="abaixo"||st==="acima")?4.2:3)+'"/>';
    }).join("")+"</svg>";
}

      " "+exStatusPill(last.v, last.ref)+"</div>"+

/* numero grande nao precisa de casa decimal; numero pequeno precisa de duas */
function exDec(v){ const a=Math.abs(v); return a>=1000? 0 : (a>=10? 1 : 2); }

/* ---------- 63. CARTEIRINHA DO PLANO DE SAUDE ---------- */
/* Por que: na hora do atendimento ninguem acha a carteirinha. Fica no aparelho, com a foto,
   e o numero grande para ditar no balcao. Nada disso sai do aparelho. */
function cards(){ STATE.cards=STATE.cards||[]; return STATE.cards; }
function parseCarteirinha(raw){
  const x=norm(raw);
  const o={};
  /* numero do cartao: a maior sequencia de digitos (aceita espaco e ponto no meio) */
  const nums=(String(raw).match(/\d[\d\s.\-]{9,25}\d/g)||[]).map(s=>s.replace(/[^\d]/g,""));
  nums.sort((a,b)=>b.length-a.length);
  o.numero = nums.length? nums[0] : "";
  /* validade */
  const val=x.match(/valid(?:ade|o ate|o até)[^\d]{0,12}(\d{2}[\/\-.]\d{2,4}(?:[\/\-.]\d{2,4})?)/) || x.match(/(\d{2}\/\d{4})/);
  o.validade = val? val[1] : "";
  /* operadora e produto: linhas em maiuscula, curtas */
  const lines=String(raw).split(/\n+/).map(l=>l.trim()).filter(l=>l.length>2 && !/^\d+$/.test(l));
  const caps=lines.filter(l=>l.length<=34 && l===l.toUpperCase() && /[A-ZÀ-Ý]{3}/.test(l));
  o.operadora = caps[0]||"";
  o.produto = (x.match(/(?:plano|produto|acomoda[cç][aã]o)\s*:?\s*([^\n]{3,34})/)||[])[1]||caps[1]||"";
  /* nome do titular: linha em maiuscula com pelo menos duas palavras e sem numero */
  o.titular = (caps.find(l=>/\s/.test(l) && !/\d/.test(l) && l.split(/\s+/).length>=2 && l!==o.operadora)||"");
  o.ans = (x.match(/ans[^\d]{0,10}(\d{5,6})/)||[])[1]||"";
  return (o.numero||o.operadora)? o : null;
}
function cardSave(o, img){

           numero:o.numero||"", validade:o.validade||"", titular:o.titular||"", ans:o.ans||"", nota:""};
  cards().push(c); save();
  return c;
}

/* Por que: a pessoa atualiza e não sabe o que ganhou. A bolinha no botão de ajuda some
   assim que ela lê — e o que ela já leu fica guardado por versão. */
let NEWS=null, NEWSTRIED=false;
function newsSeen(){ return (ROOT.prefs && ROOT.prefs.newsSeen) || ""; }
function markNewsSeen(v){ ROOT.prefs.newsSeen=v||APP_VERSION; saveRoot(); paintNewsDot(); }
function loadNews(cb){
  if(NEWS){ cb(NEWS); return; }
  if(NEWSTRIED){ cb(null); return; }
  NEWSTRIED=true;
  /* aberto solto no computador (file:) o navegador nao deixa ler arquivo vizinho */
  if(location.protocol==="file:"){ cb(null); return; }
  fetch("versoes.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    NEWS=(j&&j.versoes)?j:null; cb(NEWS); paintNewsDot();
  }).catch(()=>cb(null));
}
function hasNews(){ return !!(NEWS && NEWS.versoes.length && cmpVer(NEWS.versoes[0].v, newsSeen())>0); }
function paintNewsDot(){
  const b=document.getElementById("helpbtn"); if(!b) return;
  let d=b.querySelector(".badge");
  if(hasNews()){ if(!d){ d=document.createElement("span"); d.className="badge"; b.appendChild(d); } }
  else if(d) d.remove();
}

    return '<div class="verrow'+(novo?" new":"")+'"><h4>'+(novo?'<span class="dot-new"></span>':"")+"v"+esc(v.v)+
      '<small class="muted" style="font-weight:600">'+(v.data?fmtDate(v.data):"")+"</small></h4>"+

  const m=modal('<div class="mh"><div class="row nowrap"><span class="ibub">'+I("sparkles")+'</span><div><h2 style="margin:0">'+t("nw.title")+'</h2><small class="muted">'+t("nw.sub")+"</small></div></div></div>"+

/* ---------- 65. AS DUAS VISTAS DO MOVIMENTO ---------- */
/* Por que: o ângulo muda tudo. De frente você confere a altura e a abertura dos braços;
   de lado, o ângulo do cotovelo e se a coluna está reta. Então o app mostra as duas.
   Quatro fotos paradas (frente início/fim e lado início/fim) e, embaixo, os dois bonecos
   se mexendo lado a lado, no mesmo movimento.
   Movimento deitado, de bruços, de quatro apoios, ou que só acontece no plano de frente
   (inclinação lateral, por exemplo) tem uma vista só, e o app diz isso. */
function animPlanes(id){
  const d=ANIM[id]; if(!d) return [];
  const base=d.plano||"lado";
  const outra=(base==="frente")?"lado":"frente";
  return d.v2? [{v:"base",k:base},{v:"alt",k:outra}] : [{v:"base",k:base}];
}
function planeName(k){ return t(k==="frente"?"vw.front":"vw.side"); }
function exViewer(animId){
  if(!animId || !ANIM[animId]) return "";
  const pl=animPlanes(animId);
  const still=(p,frame)=>'<figure class="vwcell">'+animSVG(animId,{view:p.v,frame:frame})+
    '<figcaption class="viewcap">'+esc(planeName(p.k))+" · "+t(frame?"vw.end":"vw.start")+"</figcaption></figure>";
  const moving=(p)=>'<figure class="vwcell mv">'+animSVG(animId,{view:p.v})+
    '<figcaption class="viewcap">'+esc(planeName(p.k))+"</figcaption></figure>";
  let h='<div class="exviews">';
  h+='<div class="vwstills'+(pl.length>1?"":" one")+'">'+pl.map(p=>still(p,0)+still(p,1)).join("")+"</div>";
  h+='<div class="vwmoves'+(pl.length>1?"":" one")+'">'+pl.map(moving).join("")+"</div>";
  h+="</div>";
  h+='<p class="tiny muted" style="text-align:center;margin:.2em 0 .8em">'+
     t(pl.length>1?"vw.note":"vw.noteOne").replace("{v}",planeName(pl[0].k).toLowerCase())+"</p>";
  return h;
}

/* aceita qualquer formato de endereço do YouTube e devolve só o código de 11 caracteres */

/* ---------- 67. TABELA TUSS/TISS ---------- */
/* Por que fica assim: a TUSS é da ANS, é grande e muda com o tempo. O app NÃO inventa código
   nenhum — ele só sabe ler a tabela oficial e guardar no aparelho.
   Caminhos possíveis, do mais simples para o mais trabalhoso:
     1) o arquivo tuss.json publicado junto com o site (quem monta é o administrador, aqui dentro);
     2) sincronizar com um endereço que você configura (funciona quando o servidor de lá deixa —
        muitos sites do governo bloqueiam a leitura direta pelo navegador, e o app avisa quando isso
        acontece em vez de fingir que deu certo);
     3) importar o arquivo da ANS que você baixou (CSV) e deixar o app montar o tuss.json.
   A tabela 22 (procedimentos) tem cerca de 6 mil linhas e cabe bem. A tabela 19 (OPME) passa de
   um milhão de linhas e não cabe num site estático — por isso ela fica de fora. */
const TUSSKEY="riseone.tuss";
let TUSSDB=null;
function tussRead(){
  if(TUSSDB) return TUSSDB;
  try{ const s=localStorage.getItem(TUSSKEY); if(s){ TUSSDB=JSON.parse(s); return TUSSDB; } }catch(e){}
  return null;
}
function tussBytes(){ try{ const s=localStorage.getItem(TUSSKEY); return s? s.length*2 : 0; }catch(e){ return 0; } }
function tussClear(){ try{ localStorage.removeItem(TUSSKEY); }catch(e){} TUSSDB=null; }
function tussSave(db){
  TUSSDB=db;
  try{ localStorage.setItem(TUSSKEY, JSON.stringify(db)); return true; }
  catch(e){ toast(t("tu.tooBig")); return false; }
}
/* --- rede: só sincronizar no Wi-Fi, se a pessoa pedir isso --- */
function netCfg(){
  STATE.settings=STATE.settings||{};
  STATE.settings.rede=Object.assign({soWifi:true, url:""}, STATE.settings.rede||{});
  return STATE.settings.rede;
}
function netInfo(){
  const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(!c) return {tipo:"", economia:false, sabe:false};
  return {tipo:c.type||"", efetivo:c.effectiveType||"", economia:!!c.saveData, sabe:!!(c.type||c.saveData)};
}
function netName(){
  const n=netInfo();
  if(!n.sabe) return t("tu.netUnknown");
  if(n.economia) return t("tu.netSave");
  if(n.tipo==="wifi"||n.tipo==="ethernet") return t("tu.netWifi");
  if(n.tipo==="cellular") return t("tu.netData")+(n.efetivo?" ("+n.efetivo+")":"");
  return n.tipo;
}
function podeBaixarGrande(){
  const c=netCfg(); if(!c.soWifi) return true;
  const n=netInfo();
  if(!n.sabe) return true;                 /* o aparelho não conta: não dá para bloquear às cegas */
  if(n.economia) return false;
  return !(n.tipo==="cellular");
}
/* --- ler o arquivo --- */
function tussFetch(url, cb){
  fetch(url,{cache:"no-store"}).then(r=>{
    if(!r.ok) throw new Error("http "+r.status);
    return r.json();
  }).then(j=>{
    if(!j || !j.itens || !j.itens.length) throw new Error("vazio");
    j.baixadoEm=todayISO();
    cb(tussSave(j)? j : null, "");
  }).catch(err=>cb(null, String(err&&err.message||err)));
}
function tussSync(cb){
  if(location.protocol==="file:"){ cb(null, "file"); return; }
  const c=netCfg();
  if(!podeBaixarGrande()){ cb(null, "rede"); return; }
  tussFetch((c.url||"tuss.json")+"?ts="+Date.now(), cb);
}
function tussSearch(q){
  const db=tussRead(); if(!db) return [];
  q=norm(q||"").trim();
  if(!q) return db.itens.slice(0,25);
  const so=/^\d+$/.test(q);
  return db.itens.filter(i=> so? String(i.cod).indexOf(q)===0 : norm(i.desc).indexOf(q)>=0 ).slice(0,60);
}
/* --- importar o arquivo da ANS (CSV) --- */
function csvLinhas(txt){
  const sep = (txt.split("\n")[0].split(";").length > txt.split("\n")[0].split(",").length) ? ";" : ",";
  return txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
    const out=[]; let cur="", dentro=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(ch==='"'){ if(dentro && l[i+1]==='"'){ cur+='"'; i++; } else dentro=!dentro; }
      else if(ch===sep && !dentro){ out.push(cur); cur=""; }
      else cur+=ch;
    }
    out.push(cur);
    return out.map(c=>c.trim());
  });
}
function tussFromCSV(txt, meta){
  const linhas=csvLinhas(txt);
  if(linhas.length<2) return null;
  /* acha a coluna do código e a da descrição pelo cabeçalho; se não achar, usa as duas primeiras */
  const cab=linhas[0].map(c=>norm(c));
  let ic=cab.findIndex(c=>/codigo|termo|cod\b/.test(c));
  let id=cab.findIndex(c=>/descricao|termo|nome/.test(c) && cab.indexOf(c)!==ic);
  if(ic<0) ic=0;
  if(id<0||id===ic) id=(ic===0?1:0);
  const itens=[];
  const vistos={};
  for(let i=1;i<linhas.length;i++){
    const l=linhas[i];
    const cod=(l[ic]||"").replace(/[^0-9A-Za-z.\-]/g,"");
    const desc=(l[id]||"").trim();
    if(!cod || !desc || vistos[cod]) continue;
    vistos[cod]=1;
    itens.push({cod:cod, desc:desc});
  }
  if(!itens.length) return null;
  return Object.assign({
    _leia_me:"Tabela TUSS da ANS, convertida pelo próprio RiseONE a partir do arquivo oficial. Confira sempre na fonte antes de usar em pedido ou reembolso.",
    fonte:"ANS — Terminologia Unificada da Saúde Suplementar (TUSS)",
    tabela:"", versao:"", referencia:"", conferido:false, baixadoEm:todayISO()
  }, meta||{}, {itens:itens});
}

/* ---------- 68. MÚSICA, RELÓGIO/CINTA E TV ---------- */
/* O que dá e o que não dá, sem enrolação:
   MÚSICA — nenhum site controla o Spotify que está tocando no celular. O que existe de verdade é
   abrir o app da música num toque e voltar. E a voz do treinador NÃO para a música: o navegador não
   pede o áudio só para ele, então a música continua e a voz entra por cima (o celular abaixa o
   volume dela por um instante, sozinho).
   RELÓGIO/CINTA — um site não instala nada no relógio. Mas o navegador do Android lê, por Bluetooth,
   qualquer cinta ou pulseira que publique o serviço padrão de frequência cardíaca. É isso que o app
   usa: batimento ao vivo durante o treino. No iPhone não funciona: o Safari não tem Bluetooth na web.
   TV — ver a seção 69. */
/* (a parte da música ficou na seção 71, por ter crescido) */
/* --- batimento por Bluetooth --- */
const HR={dev:null, ch:null, bpm:0, em:0, max:0, serie:[], ligado:false};
function hasBLE(){ return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }
function hrCfg(){
  STATE.settings=STATE.settings||{};
  STATE.settings.hr=Object.assign({fcMax:0, autoLigar:false}, STATE.settings.hr||{});
  return STATE.settings.hr;
}
/* 220 menos a idade é uma CONTA APROXIMADA, não um exame. Serve de referência e pode ser trocada. */
function fcMax(){
  const c=hrCfg();
  if(c.fcMax>0) return c.fcMax;
  const b=STATE.profile&&STATE.profile.birth;
  if(!b) return 0;
  const idade=Math.floor((Date.now()-new Date(b).getTime())/31557600000);
  return (idade>5 && idade<100)? (220-idade) : 0;
}
const HR_ZONAS=[[50,60,"z1"],[60,70,"z2"],[70,80,"z3"],[80,90,"z4"],[90,101,"z5"]];
function hrZona(bpm){
  const m=fcMax(); if(!m||!bpm) return null;
  const pc=bpm/m*100;
  const z=HR_ZONAS.find(z=>pc>=z[0]&&pc<z[1]);
  return z? {id:z[2], pc:Math.round(pc)} : (pc<50? {id:"z0",pc:Math.round(pc)} : {id:"z5",pc:Math.round(pc)});
}
function hrParse(dv){
  /* formato padrão do serviço de frequência cardíaca (Bluetooth SIG):
     byte 0 = sinalizadores; bit 0 diz se o valor vem em 1 ou em 2 bytes */
  const flags=dv.getUint8(0);
  return (flags & 0x01)? dv.getUint16(1, true) : dv.getUint8(1);
}
function hrConnect(){
  if(!hasBLE()){ hrHelpModal(); return Promise.resolve(false); }
  return navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}], optionalServices:["battery_service"]})
    .then(d=>{ HR.dev=d; d.addEventListener("gattserverdisconnected", hrLost); return d.gatt.connect(); })
    .then(sv=>sv.getPrimaryService("heart_rate"))
    .then(s=>s.getCharacteristic("heart_rate_measurement"))
    .then(ch=>{ HR.ch=ch; return ch.startNotifications(); })
    .then(ch=>{
      ch.addEventListener("characteristicvaluechanged", e=>{
        const bpm=hrParse(e.target.value);
        if(!bpm) return;
        HR.bpm=bpm; HR.em=Date.now();
        if(bpm>HR.max) HR.max=bpm;
        HR.serie.push([Math.round(Date.now()/1000), bpm]);
        if(HR.serie.length>5000) HR.serie.splice(0,1000);
        paintHR();
      });
      HR.ligado=true; paintHR(); toast(t("hr.on"));
      return true;
    })
    .catch(err=>{ if(String(err&&err.name)!=="NotFoundError") toast(t("hr.fail")); return false; });
}
function hrLost(){ HR.ligado=false; HR.ch=null; paintHR(); toast(t("hr.lost")); }
function hrDisconnect(){
  try{ if(HR.ch) HR.ch.stopNotifications(); }catch(e){}
  try{ if(HR.dev && HR.dev.gatt.connected) HR.dev.gatt.disconnect(); }catch(e){}
  HR.ligado=false; HR.ch=null; paintHR();
}
function hrBadge(){
  if(!HR.ligado && !HR.bpm) return "";
  const z=hrZona(HR.bpm);
  return '<span class="hrbadge'+(z?" "+z.id:"")+'" id="hrbadge">'+I("heart")+"<b>"+(HR.bpm||"--")+"</b><small>bpm</small>"+
    (z?'<i>'+z.pc+"%</i>":"")+"</span>";
}
function paintHR(){
  document.querySelectorAll("#hrbadge").forEach(n=>{ n.outerHTML=hrBadge(); });
  const c=document.getElementById("hrcard"); if(c) c.innerHTML=hrCardInner();
  fillIcons(document);
}
function hrCardInner(){
  const m=fcMax(), z=hrZona(HR.bpm);
  let h='<div class="row" style="align-items:center">';
  h+='<span class="hrbig'+(z?" "+z.id:"")+'">'+(HR.bpm||"--")+'<small>bpm</small></span>';
  h+='<div class="gr"><div class="t">'+(HR.ligado? t("hr.on") : t("hr.off"))+"</div>"+
     '<div class="s">'+(m? (t("hr.maxIs")+" "+m+" bpm"+(z?" · "+t("hr."+z.id)+" · "+z.pc+"%":"")) : t("hr.noMax"))+"</div></div>";
  h+='<span class="spacer"></span>';
  h+= HR.ligado? '<button class="btn sm line" id="hr_off">'+t("hr.disconnect")+"</button>"
               : '<button class="btn sm" id="hr_on">'+I("heart")+t("hr.connect")+"</button>";
  h+="</div>";
  if(HR.max) h+='<p class="tiny muted" style="margin-top:8px">'+t("hr.session").replace("{m}",HR.max).replace("{n}",HR.serie.length)+"</p>";
  return h;
}
function hrCard(){
  if(!hasBLE()) return '<div class="card">'+cardHead("heart", t("hr.title"), t("hr.sub"))+
    '<p class="muted">'+t("hr.noBLE")+'</p><button class="btn line sm" id="hr_help">'+I("help")+t("hr.helpBtn")+"</button></div>";
  const c=hrCfg();
  let h='<div class="card">'+cardHead("heart", t("hr.title"), t("hr.sub"));
  h+='<div id="hrcard">'+hrCardInner()+"</div>";
  h+='<div class="sep"></div><label class="fld"><span>'+t("hr.fcMax")+'</span><input type="number" id="hr_max" inputmode="numeric" placeholder="'+(fcMax()||"—")+'" value="'+(c.fcMax||"")+'"></label>';
  h+='<p class="tiny muted">'+t("hr.fcMaxNote")+"</p>";
  h+='<div class="row"><button class="btn xs ghost" id="hr_help">'+I("help")+t("hr.helpBtn")+"</button></div></div>";

/* ---------- 69. PROJETAR NA TV ---------- */
/* Entendendo o que acontece, em ordem do melhor para o pior:

   1) TRANSMITIR DE VERDADE (Presentation API). O navegador tem uma ponte pronta com Chromecast e
      Google TV. O app pede "abra esta página na TV", o Chrome mostra a lista de aparelhos, a TV
      carrega a página tv-riseone.html sozinha e o celular passa a mandar o que ela deve mostrar.
      A TV fica com a imagem grande; o celular continua livre. Funciona no Chrome e no Edge.
      Não é espelhamento: é a TV abrindo a página por conta própria.

   2) AirPlay / transmitir vídeo (Remote Playback API). Serve para <video> com arquivo. A imagem da
      câmera do espelho NÃO entra aqui: o navegador bloqueia transmissão de câmera ao vivo.

   3) JANELINHA FLUTUANTE (picture-in-picture). A imagem sai do app e vira uma janela por cima de
      tudo. Quem estiver espelhando a tela do celular vê essa janela na TV.

   4) TELA CHEIA. Último recurso, para quem espelha o celular inteiro.

   O app tenta nessa ordem e diz qual deu certo. */
const TV={req:null, conn:null, ligada:false, ultimo:null};
function tvSuportaCast(){ return typeof PresentationRequest!=="undefined" && location.protocol==="https:"; }
function tvSuportaRemoto(v){ return !!(v && v.remote && typeof v.remote.prompt==="function" && !(v.srcObject)); }
function tvPage(){ return location.href.replace(/[^/]*$/, "") + "tv-riseone.html"; }
function tvConectar(){
  if(!tvSuportaCast()) return Promise.reject(new Error("sem-cast"));
  TV.req = new PresentationRequest([tvPage()]);
  return TV.req.start().then(conn=>{
    TV.conn=conn; TV.ligada=true;
    conn.addEventListener("close", tvSolta);
    conn.addEventListener("terminate", tvSolta);
    conn.addEventListener("connect", ()=>{ tvManda(TV.ultimo||{tipo:"espera"}); });
    setTimeout(()=>tvManda(TV.ultimo||{tipo:"espera"}), 800);
    paintTvBtn();
    return conn;
  });
}
function tvSolta(){ TV.ligada=false; TV.conn=null; paintTvBtn(); }
function tvDesligar(){ try{ if(TV.conn) TV.conn.terminate(); }catch(e){} tvSolta(); }
function tvManda(msg){
  TV.ultimo=msg;
  if(!TV.conn) return;
  try{ TV.conn.send(JSON.stringify(Object.assign({lang:LANG}, msg))); }catch(e){}
}
/* A TV nao tem o codigo do app: ela recebe o desenho pronto. Aqui montamos um SVG
   independente, com os DOIS quadros guardados em data-a / data-b — a TV so alterna entre eles. */
function tvFigura(id, vista){
  const d=ANIM[id]; if(!d) return "";
  const src=(vista==="alt" && d.v2)? d.v2 : d;
  const plano=(vista==="alt")? ((d.plano==="frente")?"lado":"frente") : (d.plano||"lado");
  const quadro=fr=>{
    const L=(cls,w,a,b)=>(a&&b)? '<line class="'+cls+'" stroke-width="'+w+'" stroke-linecap="round" x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"/>' : "";
    let g="";
    if(d.ground!==false){
      const pts=["f","f2","k","k2","p"].map(j=>fr[j]).filter(Boolean);
      if(pts.length){
        const xs=pts.map(pp=>pp[0]);
        const cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
        const larg=Math.max(13,(Math.max.apply(null,xs)-Math.min.apply(null,xs))*0.62+9);
        g+='<ellipse class="asom" cx="'+cx.toFixed(1)+'" cy="104.5" rx="'+larg.toFixed(1)+'" ry="2.6"/>';
      }
      g+='<line class="agr" x1="8" y1="104" x2="92" y2="104"/>';
    }
    g+='<g class="aeqg">'+(d.eq? eqLayer(d,fr,vista) : "")+"</g>";
    g+='<g class="aout">'+OSSOS.map(o=>L("bo",(o[2]+OSSO_BORDA).toFixed(1),fr[o[0]],fr[o[1]])).join("")+"</g>";
    g+='<g class="abody">'+OSSOS.map(o=>L("bi",o[2].toFixed(1),fr[o[0]],fr[o[1]])).join("")+"</g>";
    /* tenis: mesmo criterio do app */
    g+='<g class="ashoe">'+[[fr.k,fr.f],[fr.k2,fr.f2]].map(par=>{
      const k=par[0], f=par[1]; if(!k||!f) return "";
      const dx=f[0]-k[0], dy=f[1]-k[1], M=Math.hypot(dx,dy)||1, ux=dx/M, uy=dy/M;
      const h=fr.h||[50,0];
      const fora=(Math.abs(f[0]-h[0])<3)? 1 : (f[0]<h[0]? -1 : 1);
      let px,py,comp,gr;
      if(plano==="frente"){ px=0; py=1; comp=2.4; gr=9.6; }
      else if(f[1]>92 && Math.abs(ux)>0.25){ px=fora; py=0.22; comp=6.0; gr=7.4; }
      else { const s1=-uy,t1=ux, sg=(Math.abs(s1)<0.05)?1:(s1*fora>0?1:-1);
             px=s1*sg+ux*0.25; py=t1*sg+uy*0.25; comp=6.2; gr=7.6; }
      const nl=Math.hypot(px,py)||1;
      return '<line class="sh" stroke-width="'+gr+'" stroke-linecap="round" x1="'+(f[0]-ux).toFixed(1)+'" y1="'+(f[1]-uy).toFixed(1)+'" x2="'+(f[0]+px/nl*comp).toFixed(1)+'" y2="'+(f[1]+py/nl*comp).toFixed(1)+'"/>';
    }).join("")+"</g>";
    if(fr.h) g+='<circle class="phb" cx="'+fr.h[0].toFixed(1)+'" cy="'+fr.h[1].toFixed(1)+'" r="'+(CABECA_R+1.3)+'"/>'+
                '<circle class="ph" cx="'+fr.h[0].toFixed(1)+'" cy="'+fr.h[1].toFixed(1)+'" r="'+CABECA_R+'"/>';
    /* o peso na mao vem por cima do corpo, igual ao app */
    if(d.eq) g+='<g class="aeqg">'+eqLayerFrente(d,fr,vista)+"</g>";
    return g;
  };
  const a=quadro(src.a), b=quadro(src.b);
  return '<svg viewBox="0 0 100 110" preserveAspectRatio="xMidYMid meet" data-a="'+esc(a)+'" data-b="'+esc(b)+'">'+a+"</svg>";
}
function tvVista(id, qual){
  const d=ANIM[id]; if(!d) return "";
  const base=d.plano||"lado";
  if(qual===base) return tvFigura(id,"base");
  return d.v2? tvFigura(id,"alt") : "";
}

/* ---------- 70. LER O PDF DO LABORATÓRIO ---------- */
/* Por que: quase todo laudo chega em PDF, por e-mail. Fotografar a tela do celular para depois
   tentar ler a foto é o caminho mais errado que existe — o texto já está lá dentro, escrito.
   Então: se o PDF tiver texto (quase todos têm), o app lê o texto direto, sem OCR e sem erro.
   Se for um PDF escaneado (só imagem), aí sim ele desenha a página e passa o OCR por cima. */
const PDF_CDN=["https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs",
               "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs"];
let PDFLIB=null;
function loadPdfLib(){
  if(PDFLIB) return Promise.resolve(PDFLIB);
  let i=0;
  const tenta=()=>{
    if(i>=PDF_CDN.length) return Promise.reject(new Error("sem-pdfjs"));
    const url=PDF_CDN[i++];
    return import(/* webpackIgnore: true */ url).then(mod=>{
      const lib=mod.getDocument? mod : (mod.default||mod);
      try{ lib.GlobalWorkerOptions.workerSrc = url.replace(/pdf\.min\.mjs$/,"pdf.worker.min.mjs"); }catch(e){}
      PDFLIB=lib; return lib;
    }).catch(()=>tenta());
  };
  return tenta();
}
/* devolve {texto, paginas, escaneado} */
function pdfExtrair(arrayBuffer, onProgresso){
  return loadPdfLib().then(lib=>lib.getDocument({data:arrayBuffer}).promise).then(doc=>{
    const n=Math.min(doc.numPages, 12);   /* laudo longo: 12 páginas já é muito */
    let texto="";
    const passo=(i)=>{
      if(i>n) return Promise.resolve();
      onProgresso && onProgresso(i,n);
      return doc.getPage(i).then(pg=>pg.getTextContent()).then(tc=>{
        /* junta por linha: o pdf.js entrega pedaços soltos com a posição de cada um */
        const linhas={};
        tc.items.forEach(it=>{
          const y=Math.round((it.transform&&it.transform[5])||0);
          (linhas[y]=linhas[y]||[]).push([(it.transform&&it.transform[4])||0, it.str]);
        });
        Object.keys(linhas).map(Number).sort((a,b)=>b-a).forEach(y=>{
          texto += linhas[y].sort((a,b)=>a[0]-b[0]).map(p=>p[1]).join(" ").replace(/\s+/g," ").trim()+"\n";
        });
        return passo(i+1);
      });
    };
    return passo(1).then(()=>({texto:texto, paginas:doc.numPages, escaneado:texto.replace(/\s/g,"").length<40, doc:doc}));
  });
}
/* PDF só de imagem: desenha a primeira página e devolve a foto para o OCR */
function pdfPrimeiraPagina(doc, cb){
  doc.getPage(1).then(pg=>{
    const vp=pg.getViewport({scale:2});
    const cv=document.createElement("canvas");
    cv.width=Math.min(1600,Math.round(vp.width)); cv.height=Math.round(vp.height*cv.width/vp.width);
    const ctx=cv.getContext("2d");
    return pg.render({canvasContext:ctx, viewport:pg.getViewport({scale:cv.width/vp.width*2})}).promise
      .then(()=>cb(cv.toDataURL("image/jpeg",0.92)));
  }).catch(()=>cb(null));
}
/* entrada única: a pessoa escolhe um arquivo e o app decide o caminho */
function lerArquivoExame(file){
  const out=document.getElementById("scanout");
  const aviso=(txt,barra)=>{ if(out) out.innerHTML='<div class="card"><p id="ocrst">'+esc(txt)+"</p>"+(barra?'<div class="bar"><i id="ocrbar" style="width:'+barra+'%"></i></div>':"")+"</div>"; };
  if(!/pdf$/i.test(file.type||"") && !/\.pdf$/i.test(file.name||"")){
    readFile(file, d=>shootChecked(d, runOCR));
    return;
  }
  aviso(t("pdf.opening"), 8);
  file.arrayBuffer().then(buf=>pdfExtrair(buf,(i,n)=>aviso(t("pdf.reading").replace("{i}",i).replace("{n}",n), Math.round(i/n*90))))
    .then(r=>{
      if(!r.escaneado){
        SCANIMG=null; SCANTEXT=r.texto; SCANFOUND=null;
        toast(t("pdf.ok").replace("{n}",r.paginas));
        paintScan();
        return;
      }
      aviso(t("pdf.scanned"), 40);
      pdfPrimeiraPagina(r.doc, d=>{ if(d) runOCR(d); else { toast(t("pdf.fail")); manualFallback(); } });
    })
    .catch(()=>{ toast(t("pdf.fail")); if(out) out.innerHTML=""; manualFallback(); });
}

/* ---------- 71. MÚSICA DO TREINO ---------- */
/* O que dá e o que não dá, com a razão:
   ABRIR a playlist num toque — dá, e é o melhor caminho: a música toca no app do Spotify, continua
   com a tela apagada e a voz do treinador entra por cima sem parar nada.
   TOCAR DENTRO DO APP — dá, com o tocador oficial do Spotify embutido. Sem conta logada no navegador
   ele toca trechos de 30 segundos; com a conta logada, toca inteiro. Ele para quando você troca de
   app ou apaga a tela, porque quem manda aí é o navegador.
   BUSCAR PLAYLIST PÚBLICA DENTRO DO APP — NÃO dá. A busca do Spotify exige login de desenvolvedor,
   e um app nessa condição atende no máximo 5 pessoas (e o dono precisa ser Premium). Passar disso
   exige empresa registrada com 250 mil usuários por mês. Então o app não promete o que não cumpre:
   ele traz uma lista de sugestões e o botão de buscar abre a busca do próprio Spotify. */
const MUS_APPS=[
 {id:"spotify", nome:"Spotify",       re:/open\.spotify\.com|^spotify:/i, embed:true},
 {id:"deezer",  nome:"Deezer",        re:/deezer\.com/i,                  embed:true},
 {id:"ytmusic", nome:"YouTube Music", re:/music\.youtube\.com/i,          embed:false},
 {id:"apple",   nome:"Apple Music",   re:/music\.apple\.com/i,            embed:false},
 {id:"outro",   nome:"",              re:/^https?:\/\//i,                 embed:false}
];
let MUSICAS=[], MUS_TRIED=false;
function loadMusicas(cb){
  if(MUS_TRIED){ cb&&cb(); return; }
  MUS_TRIED=true;
  if(location.protocol==="file:"){ cb&&cb(); return; }
  fetch("musicas.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
    if(j && j.listas) MUSICAS=j.listas.filter(x=>x&&x.url);
    cb&&cb();
  }).catch(()=>{ cb&&cb(); });
}
function musCfg(){
  STATE.settings=STATE.settings||{};
  const c=STATE.settings.musica=Object.assign({ativa:"", embed:false, listas:[]}, STATE.settings.musica||{});
  /* quem vinha da versão 3.2.0 tinha uma playlist só, num campo url */
  if(c.url){ c.listas.push({id:uid(), nome:c.nome||"", url:c.url}); delete c.url; delete c.nome; save(); }
  if(!Array.isArray(c.listas)) c.listas=[];
  return c;
}
function musApp(url){ return MUS_APPS.find(x=>x.re.test(String(url||""))) || null; }
function musAppNome(url){ const a=musApp(url); return a? (a.nome||t("mu.other")) : ""; }
/* tira os códigos de rastreio que o Spotify cola no link de compartilhar (si, pi, utm_*) */
function musLimpaUrl(url){
  const u=String(url||"").trim();
  const m=u.match(/^(https?:\/\/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(?:playlist|album|track|artist|show|episode)\/[A-Za-z0-9]+)/i);
  if(m) return m[1];
  try{
    const o=new URL(u);
    ["si","pi","utm_source","utm_medium","utm_campaign","nd","_branch_match_id","context"].forEach(k=>o.searchParams.delete(k));
    return o.toString().replace(/\?$/,"");
  }catch(e){ return u; }
}
function musEmbedUrl(url){
  const s=String(url||"").match(/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/i);
  if(s) return "https://open.spotify.com/embed/"+s[1].toLowerCase()+"/"+s[2]+"?utm_source=generator";
  const d=String(url||"").match(/deezer\.com\/(?:[a-z]{2}\/)?(playlist|album|track)\/(\d+)/i);
  if(d) return "https://widget.deezer.com/widget/dark/"+d[1].toLowerCase()+"/"+d[2];
  return "";
}
/* todas as playlists: as sugeridas que vêm com o site + as que a pessoa guardou */
function musTodas(){
  const c=musCfg();
  const sug=MUSICAS.map((x,i)=>({id:"sug:"+(x.id||i), nome:x.nome||"", url:x.url, sug:true}));
  return sug.concat(c.listas.map(x=>({id:x.id, nome:x.nome||"", url:x.url, sug:false})));
}
function musNome(p, i){
  if(p.nome) return p.nome;

  return p.sug? (t("mu.sugN").replace("{n}", (i==null?"":i+1))) : (a||t("mu.play"));
}
function musAtiva(){
  const c=musCfg(), todas=musTodas();

function musBtn(cls){

}
/* tocador embutido, quando a pessoa liga e o serviço permite */
function musPlayer(){
  const c=musCfg(); if(!c.embed) return "";
  const p=musAtiva(); if(!p) return "";
  const u=musEmbedUrl(p.url);
  if(!u) return '<p class="tiny muted">'+t("mu.noEmbed").replace("{a}", musAppNome(p.url)||t("mu.other"))+"</p>";
  return '<div class="musplayer"><iframe src="'+esc(u)+'" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="'+esc(musNome(p,0))+'"></iframe></div>';
}
function musLinha(p, i){

    '<a class="iconbtn" target="_blank" rel="noopener" href="'+esc(p.url)+'" title="'+t("mu.open")+'">'+I("arrowr")+"</a>"+
    (p.sug?"":'<button class="iconbtn" data-muse="'+esc(p.id)+'" title="'+t("common.edit")+'">'+I("edit")+"</button>"+
             '<button class="iconbtn" data-musd="'+esc(p.id)+'" title="'+t("common.del")+'">'+I("trash")+"</button>")+

}
function musCard(admin){
  const c=musCfg(), todas=musTodas();

  h+='<div class="warnbox" style="margin-top:12px">'+I("info")+"<div>"+t("mu.how")+"</div></div>";

  if(admin){
    h+='<div class="sep"></div><span class="kicker">'+t("mu.admTitle")+'</span><p class="tiny muted">'+t("mu.admHow")+"</p>"+
       '<div class="row"><button class="btn line sm" id="mu_dl">'+I("download")+t("mu.admDownload")+"</button></div>";
  }

function musEditModal(id){
  const c=musCfg();
  const p=id? c.listas.find(x=>x.id===id) : null;
  const m=modal(mh(p? t("common.edit") : t("mu.add"))+
    '<label class="fld"><span>'+t("mu.link")+'</span><input type="url" id="mu_u" inputmode="url" placeholder="https://open.spotify.com/playlist/..." value="'+esc(p?p.url:"")+'"></label>'+
    '<label class="fld"><span>'+t("mu.name")+'</span><input type="text" id="mu_n" placeholder="'+t("mu.namePh")+'" value="'+esc(p?p.nome:"")+'"></label>'+

  m.querySelector("#mu_ok").onclick=()=>{
