/* ---------- 72. LUPA: BUSCA EM TUDO, COM RESULTADO CLICÁVEL ---------- */
/* Por que: a busca que existia ficava escondida dentro da Ajuda e só explicava palavras.
   Esta procura em tudo que o app tem — telas, exercícios, alongamentos, dores, códigos, treinos,
   ajustes, novidades — e cada linha do resultado LEVA até lá num toque. */
const BUSCA={q:"", sel:0, el:null};
function buscaGrupos(){
  return {
    tela:      {ic:"grid",     k:"bs.gTela"},
    exercicio: {ic:"dumbbell", k:"bs.gEx"},
    movimento: {ic:"stretch",  k:"bs.gMov"},
    dor:       {ic:"heart",    k:"bs.gDor"},
    cid:       {ic:"file",     k:"bs.gCid"},
    tuss:      {ic:"file",     k:"bs.gTuss"},
    treino:    {ic:"clipboard",k:"bs.gTreino"},
    ajuda:     {ic:"help",     k:"bs.gAjuda"},
    versao:    {ic:"sparkles", k:"bs.gVersao"}
  };
}
const SET_BUSCA=[["perfil","st.tabProfile"],["pref","st.tabPrefs"],["avisos","nt.short"],["conta","st.tabAccount"],["dados","st.tabData"],["sobre","st.about"]];
function buscaTudo(q){
  q=norm(q).trim();
  if(q.length<2) return [];
  const bate=(...partes)=>norm(partes.filter(Boolean).join(" ")).indexOf(q)>=0;
  const r=[];
  /* telas */
  visibleRoutes().forEach(x=>{ if(bate(t(x.k))) r.push({g:"tela", ic:x.ic, t:t(x.k), s:"", go:()=>go(x.id)}); });
  SET_BUSCA.forEach(([sub,k])=>{ if(bate(t(k), t("st.title"))) r.push({g:"tela", ic:"sliders", t:t("st.title")+" · "+t(k), s:"", go:()=>go("set",sub)}); });
  [["pv.title","dados"],["ac.title","pref"],["vz.title","pref"],["mu.title","pref"],["hr.title","pref"],["fav.title","pref"],["nw.title","sobre"]]
    .forEach(([k,sub])=>{ if(bate(t(k))) r.push({g:"tela", ic:"sliders", t:t(k), s:t("st.title"), go:()=>go("set",sub)}); });
  /* exercícios */
  allEx().forEach(x=>{
    if(bate(exName(x), x.pt, x.en, x.gpt, x.gen, mName(x.m), eqName(x.eq)))
      r.push({g:"exercicio", ic:"dumbbell", t:exName(x), s:mName(x.m)+" · "+eqName(x.eq), go:()=>videoModal(x.id)});
  });
  /* aquecimento e alongamento */
  MOVES.forEach(m=>{ if(bate(mvName(m), m.pt, m.en)) r.push({g:"movimento", ic:"stretch", t:mvName(m), s:(m.type||[]).map(k=>t("wu.t."+k)||k).join(" · "), go:()=>moveVideo(m.id)}); });
  /* dor e alívio */
  if(typeof CONDS!=="undefined") CONDS.forEach(c=>{
    if(bate(condName(c), c.pt, c.en, c.cid, zoneName(c.zona)))
      r.push({g:"dor", ic:"heart", t:condName(c), s:zoneName(c.zona)+" · CID "+c.cid,
        go:()=>{ FIS.zone=c.zona; FIS.open=c.id; FIS.q=""; go("fisio"); }});
  });
  /* tabelas carregadas no aparelho */
  const cid=(typeof cidRead==="function")? cidRead() : null;
  if(cid) cid.itens.forEach(i=>{ if(bate(i.cid, i.pt, i.en)) r.push({g:"cid", ic:"file", t:i.cid+" — "+(LANG==="pt"?i.pt:i.en), s:zoneName(i.zona), go:()=>{ FIS.cidOpen=true; go("fisio"); }}); });
  const tu=(typeof tussRead==="function")? tussRead() : null;
  if(tu) tu.itens.forEach(i=>{ if(bate(i.cod, i.desc)) r.push({g:"tuss", ic:"file", t:i.cod+" — "+i.desc, s:"TUSS", go:()=>{ FIS.tussOpen=true; go("fisio"); }}); });
  /* treinos da pessoa */
  (STATE.workouts||[]).forEach(w=>{ if(bate(w.name)) r.push({g:"treino", ic:"clipboard", t:w.name, s:(w.items||[]).length+" "+t("ex.count"), go:()=>go("workout")}); });
  /* ajuda e glossário */
  GLOSS.forEach(g=>{ if(bate(g[0].join(" "), g[1], g[2], g[3], g[4]))
    r.push({g:"ajuda", ic:"book", t:LANG==="pt"?g[1]:g[2], s:(LANG==="pt"?g[3]:g[4]).replace(/<[^>]*>/g,"").slice(0,90),
      go:()=>{ if(g[5]) go(g[5], g[6]||undefined); else openHelp("busca"); }}); });
  Object.keys(HELP).forEach(k=>HELP[k].forEach(it=>{
    if(bate(it[1], it[2], it[3], it[4])){
      const rt=k.split("/")[0], sb=k.split("/")[1], ri=routeInfo(rt);
      r.push({g:"ajuda", ic:it[0]||"help", t:(LANG==="pt"?it[1]:it[2]), s:ri?t(ri.k):"", go:()=>go(rt, sb||undefined)});
    }
  }));
  /* novidades */
  if(typeof NEWS!=="undefined" && NEWS) NEWS.versoes.forEach(v=>{
    const itens=(LANG==="pt"?v.pt:v.en)||[];
    itens.forEach(i=>{ if(bate(i, "v"+v.v)) r.push({g:"versao", ic:"sparkles", t:"v"+v.v, s:i.slice(0,110), go:()=>go("set","sobre")}); });
  });
  /* exato primeiro, depois começo da palavra, depois o resto */
  r.forEach(x=>{ const n=norm(x.t); x._p = (n===q)?0 : (n.indexOf(q)===0?1:2); });
  r.sort((a,b)=>a._p-b._p);
  return r.slice(0,60);
}
function buscaHTML(lista){
  if(!BUSCA.q.trim()) return '<p class="tiny muted" style="padding:6px 2px">'+t("bs.hint")+"</p>";
  if(BUSCA.q.trim().length<2) return '<p class="tiny muted" style="padding:6px 2px">'+t("bs.min")+"</p>";
  if(!lista.length) return emptyBox("search", t("bs.noneT"), t("bs.noneS"));
  const G=buscaGrupos();
  let h="", grupo="";
  lista.forEach((x,i)=>{
    if(x.g!==grupo){ grupo=x.g; h+='<div class="bsgrupo">'+I(G[grupo].ic)+t(G[grupo].k)+"</div>"; }
    h+='<button class="bsrow'+(i===BUSCA.sel?" sel":"")+'" data-bs="'+i+'">'+I(x.ic)+
       '<span class="bt"><b>'+esc(x.t)+"</b>"+(x.s?"<small>"+esc(x.s)+"</small>":"")+"</span>"+I("arrowr")+"</button>";
  });
  return h;
}
function openBusca(inicial){
  /* nunca empilhar duas buscas */
  document.querySelectorAll(".modal.busca").forEach(n=>n.remove());
  BUSCA.q=inicial||""; BUSCA.sel=0;
  const m=modal('<div class="mh"><div class="help-q" style="flex:1;margin:0">'+I("search")+
      '<input type="search" id="bsq" autocomplete="off" placeholder="'+t("bs.ph")+'" value="'+esc(BUSCA.q)+'"></div>'+
      '<button class="iconbtn" data-close aria-label="'+t("common.close")+'">'+I("x")+"</button></div>"+
    '<div class="bsres" id="bsres"></div>'+
    '<p class="tiny muted" style="margin:8px 0 0">'+t("bs.tip")+"</p>", {wide:true});
  m.classList.add("busca");
  BUSCA.el=m;
  const res=m.querySelector("#bsres"), inp=m.querySelector("#bsq");
  let lista=[];
  const pinta=()=>{
    lista=buscaTudo(BUSCA.q);
    if(BUSCA.sel>=lista.length) BUSCA.sel=0;
    res.innerHTML=buscaHTML(lista);
    fillIcons(res);
    res.querySelectorAll("[data-bs]").forEach(b=>b.onclick=()=>{
      const x=lista[+b.getAttribute("data-bs")]; if(!x) return;
      m.remove(); try{ x.go(); }catch(e){}
    });
    const s=res.querySelector(".bsrow.sel"); if(s && s.scrollIntoView) s.scrollIntoView({block:"nearest"});
  };
  inp.oninput=()=>{ BUSCA.q=inp.value; BUSCA.sel=0; pinta(); };
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); BUSCA.sel=Math.min(BUSCA.sel+1, Math.max(0,lista.length-1)); pinta(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); BUSCA.sel=Math.max(0, BUSCA.sel-1); pinta(); }
    else if(e.key==="Enter"){ const x=lista[BUSCA.sel]; if(x){ m.remove(); try{ x.go(); }catch(err){} } }
  };
  setTimeout(()=>inp.focus(), 60);
  pinta();
  return m;
}

/* ---------- 40b. O DESENHO DO BONECO (traço com volume) ---------- */
/* Não é GIF nem vídeo: é um desenho vetorial. O app guarda só a posição das articulações em duas
   poses e desenha o traço na hora, passando de uma para a outra. Por isso ocupa alguns bytes em vez
   de megabytes, fica nítido em qualquer tela e acompanha a cor do tema.
   Aqui ficam a espessura de cada osso, o contorno que dá volume, o tênis e a sombra no chão. */
/* [de, para, espessura] — a ordem importa: o que vem depois fica por cima */
const OSSOS=[
  ["h","n",  7.6],   /* pescoço */
  ["n","s", 12.4],   /* tronco alto */
  ["s","p", 12.4],   /* tronco baixo */
  ["p","k", 10.2],   /* coxa */
  ["k","f",  8.4],   /* perna */
  ["p","k2",10.2],
  ["k2","f2", 8.4],
  ["s","e",  8.2],   /* braço */
  ["e","w",  6.8],   /* antebraço */
  ["s","e2", 8.2],
  ["e2","w2",6.8]
];
const OSSO_BORDA=2.8;      /* o contorno é o mesmo traço, um pouco mais grosso, por baixo */
const CABECA_R=8.6;
/* monta os elementos uma vez; depois só mexemos nas coordenadas a cada quadro */
function skelHTML(){
  const linha=(cls,i)=>'<line class="'+cls+'" data-o="'+i+'" stroke-linecap="round"/>';
  let h='<g class="aout">'+OSSOS.map((o,i)=>linha("bo",i)).join("")+"</g>";
  h+='<g class="abody">'+OSSOS.map((o,i)=>linha("bi",i)).join("")+"</g>";
  h+='<g class="ashoe"><line class="sh" data-pe="0" stroke-linecap="round"/><line class="sh" data-pe="1" stroke-linecap="round"/></g>';
  h+='<circle class="phb" r="'+(CABECA_R+1.3)+'"/><circle class="ph" r="'+CABECA_R+'"/>';
  return h;
}
function sombraHTML(){ return '<ellipse class="asom" rx="0" ry="0"/>'; }
/* desenha um quadro: só atualiza atributos, nunca recria elementos (é o que roda 60 vezes por segundo) */
function paintAnimSVG(svg, fr, d, vista){
  const set=(n,a,b)=>{
    if(!a||!b){ n.setAttribute("visibility","hidden"); return; }
    n.removeAttribute("visibility");
    n.setAttribute("x1",a[0].toFixed(1)); n.setAttribute("y1",a[1].toFixed(1));
    n.setAttribute("x2",b[0].toFixed(1)); n.setAttribute("y2",b[1].toFixed(1));
  };
  const out=svg.querySelectorAll(".aout line"), body=svg.querySelectorAll(".abody line");
  OSSOS.forEach((o,i)=>{
    const a=fr[o[0]], b=fr[o[1]];
    if(out[i]){ out[i].setAttribute("stroke-width",(o[2]+OSSO_BORDA).toFixed(1)); set(out[i],a,b); }
    if(body[i]){ body[i].setAttribute("stroke-width",o[2].toFixed(1)); set(body[i],a,b); }
  });
  const hd=svg.querySelector("circle.ph"), hb=svg.querySelector("circle.phb");
  [hd,hb].forEach(c=>{ if(c && fr.h){ c.setAttribute("cx",fr.h[0].toFixed(1)); c.setAttribute("cy",fr.h[1].toFixed(1)); } });
  /* tênis: um traço curto perpendicular à canela, apontando para onde o pé aponta.
     Visto de frente o pé vem na direção de quem olha, então vira um calço curtinho. */
  const plano = (vista==="alt") ? ((d.plano==="frente")?"lado":"frente") : (d.plano||"lado");
  const dir = (d.pe===undefined? 1 : d.pe);
  const sapatos=svg.querySelectorAll(".ashoe line");
  [[fr.k,fr.f],[fr.k2,fr.f2]].forEach((par,i)=>{
    const n=sapatos[i]; if(!n) return;
    const k=par[0], f=par[1];
    if(!k||!f){ n.setAttribute("visibility","hidden"); return; }
    n.removeAttribute("visibility");
    const dx=f[0]-k[0], dy=f[1]-k[1], L=Math.hypot(dx,dy)||1;
    const ux=dx/L, uy=dy/L;
    /* para que lado aponta a ponta do pé: para longe da cabeça; empatou, usa o padrão do desenho */
    const h=fr.h||[50,0];
    const fora = (Math.abs(f[0]-h[0])<3)? dir : (f[0]<h[0]? -1 : 1);
    let px, py, comp, grossura;
    if(plano==="frente"){ px=0; py=1; comp=2.4; grossura=9.6; }       /* de frente o pé vem na direção de quem olha */
    else if(f[1]>92 && Math.abs(ux)>0.25){ px=fora; py=0.22; comp=6.0; grossura=7.4; }  /* pé apoiado no chão */
    else {
      const s1=-uy, t1=ux;                                            /* perpendicular à canela */
      const sg=(Math.abs(s1)<0.05)? dir : (s1*fora>0? 1 : -1);
      px=s1*sg+ux*0.25; py=t1*sg+uy*0.25; comp=6.2; grossura=7.6;
    }
    const nl=Math.hypot(px,py)||1;
    n.setAttribute("stroke-width", grossura.toFixed(1));
    n.setAttribute("x1",(f[0]-ux*1.0).toFixed(1)); n.setAttribute("y1",(f[1]-uy*1.0).toFixed(1));
    n.setAttribute("x2",(f[0]+px/nl*comp).toFixed(1)); n.setAttribute("y2",(f[1]+py/nl*comp).toFixed(1));
  });
  /* sombra: uma elipse no chão, embaixo do ponto mais baixo do corpo */
  const som=svg.querySelector(".asom");
  if(som){
    if(d && d.ground===false){ som.setAttribute("rx","0"); }
    else {
      const pts=["f","f2","k","k2","w","w2","p"].map(j=>fr[j]).filter(Boolean);
      if(!pts.length){ som.setAttribute("rx","0"); }
      else{
        const xs=pts.map(p=>p[0]);
        const cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
        const larg=Math.max(13, (Math.max.apply(null,xs)-Math.min.apply(null,xs))*0.62+9);
        som.setAttribute("cx",cx.toFixed(1)); som.setAttribute("cy","104.5");
        som.setAttribute("rx",larg.toFixed(1)); som.setAttribute("ry","2.6");
      }
    }
  }
  const eq=svg.querySelector(".aeqg");
  if(eq && d && d.eq){
    eq.innerHTML=eqLayer(d,fr,vista);
    const ef=svg.querySelector(".aeqf2");
    if(ef) ef.innerHTML=eqLayerFrente(d,fr,vista);
  }
}

/* ---------- 32. INICIALIZACAO ---------- */
function boot(){
  loadRoot();
  LANG = ROOT.prefs.lang || "pt";
  applyTheme(ROOT.prefs.theme || "dark");
  applyBg(ROOT.prefs.bg===undefined ? true : !!ROOT.prefs.bg);
  applyA11y(); assistApply();
  document.documentElement.lang = LANG==="pt"?"pt-BR":"en";
  paintLangBtn();
  document.getElementById("vertxt").textContent = "v"+APP_VERSION;
  document.querySelectorAll("[data-i18n]").forEach(n=>{ n.textContent=t(n.getAttribute("data-i18n")); });

  const s=ROOT.session;
  if(!s){ STATE=defaultState(); GUEST=true; buildNav(); render(); paintAd();
          gateDisclaimer(()=>{ loginModal(); popupBeforeLogin(); }); return; }
  if(s.role==="guest"){ GUEST=true; STATE=STATE&&GUEST?STATE:defaultState(t("role.guest")); }
  else { GUEST=false; STATE=Object.assign(defaultState(s.name), ROOT.data[s.uid]||{});
         STATE.anam=Object.assign(defaultAnam(), STATE.anam||{});
         STATE.settings=Object.assign(defaultState().settings, STATE.settings||{});
         STATE.settings.cloud=Object.assign({provider:"",clientId:"",connected:false}, STATE.settings.cloud||{});
         STATE.diet=Object.assign({kcal:0,prot:0,carb:0,fat:0,water:8,restKcal:0}, STATE.diet||{});
         STATE.profile=Object.assign(defaultState().profile, STATE.profile||{});
         if(!STATE.profile.name) STATE.profile.name=s.name; }
  if(ROUTE!=="home" && visibleRoutes().every(r=>r.id!==ROUTE)) ROUTE="home";
  buildNav(); render(); paintAd(); cloudCaptureToken();
  gateDisclaimer(()=>{ maybeWelcome(); popupAfterLogin(); });
}

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && TOURST.active){ tourEnd(); return; }
  if(e.key==="Escape" && ASSIST.open){ assistClose(); return; }
  if(e.key==="Escape"){
    const abertas=[...document.querySelectorAll(".modal:not([data-sticky])")];
    if(abertas.length){ abertas[abertas.length-1].remove(); return; }
    closeDrawer(); return;
  }
  /* Ctrl+K / Cmd+K abre a busca; "/" tambem, desde que nao esteja escrevendo num campo */
  const dig=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"");
  if((e.key==="k"||e.key==="K") && (e.ctrlKey||e.metaKey)){ e.preventDefault(); openBusca(""); return; }
  if(e.key==="/" && !dig && !document.querySelector(".modal")){ e.preventDefault(); openBusca(""); }
});
