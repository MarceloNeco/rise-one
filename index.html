<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RiseONE — treino, dieta e evolucao em um so lugar. / RiseONE — workout, diet and progress in one place.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://storage.googleapis.com https://generativelanguage.googleapis.com https://api.openai.com https://api.anthropic.com https://www.googleapis.com; frame-src https://www.youtube.com https://open.spotify.com https://widget.deezer.com https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiseONE">
<title>RiseONE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0e1014; --surface:#15181e; --surface2:#1b1f26; --surface3:#242a34;
  --border:rgba(255,255,255,.075); --border2:rgba(255,255,255,.14);
  --text:#f3f5f8; --text2:#aab2bf; --text3:#7a8493;
  --accent:#ff7a2f; --accent2:#ffb257; --accent-ink:#1a0c02; --accent-soft:rgba(255,122,47,.14); --accent-line:rgba(255,122,47,.45);
  --ok:#2ecc8f; --ok-soft:rgba(46,204,143,.14); --warn:#ffb020; --warn-soft:rgba(255,176,32,.14); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.14);
  --s1:#4a90e8; --s2:#e8623a; --s3:#22b37f; --grid:#262c36;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tap:44px;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f4f5f8; --surface:#ffffff; --surface2:#f1f3f7; --surface3:#e6e9ef;
  --border:#e4e7ed; --border2:#d3d8e1;
  --text:#121519; --text2:#5b6470; --text3:#8a93a1;
  --accent:#e2600f; --accent2:#f5993a; --accent-ink:#ffffff; --accent-soft:rgba(226,96,15,.10); --accent-line:rgba(226,96,15,.4);
  --ok:#0f9d6a; --ok-soft:rgba(15,157,106,.12); --warn:#b97b00; --warn-soft:rgba(185,123,0,.12); --bad:#d63b3b; --bad-soft:rgba(214,59,59,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e3e7ee;
  --shadow:0 10px 30px rgba(15,20,30,.10); --shadow-sm:0 1px 4px rgba(15,20,30,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* ---- arte de fundo ---- */
#bgart{position:fixed;inset:0;z-index:-2;pointer-events:none;display:none;
  background:url("fundo.jpg") center center / cover no-repeat}
#bgart::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 62% 70% at 50% 45%, rgba(14,16,20,.82) 0%, rgba(14,16,20,.64) 55%, rgba(14,16,20,.34) 100%)}
html[data-bg="1"] #bgart{display:block}
html[data-bg="1"] body{background:transparent}
html[data-bg="1"] .card{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px)}
html[data-bg="1"] .stat,html[data-bg="1"] .item,html[data-bg="1"] .ex,html[data-bg="1"] .mvcard,html[data-bg="1"] .eqcard,html[data-bg="1"] .tile{
  background:color-mix(in srgb,var(--surface2) 80%,transparent)}
html[data-bg="1"] header.app{background:color-mix(in srgb,var(--bg) 76%,transparent)}
html[data-bg="1"] #bottombar{background:color-mix(in srgb,var(--bg) 90%,transparent)}
html[data-bg="1"] footer.app{background:color-mix(in srgb,var(--bg) 70%,transparent)}
html[data-theme="light"] #bgart{background-image:url("fundo-claro.jpg")}
html[data-theme="light"] #bgart::after{
  background:radial-gradient(ellipse 58% 66% at 50% 45%, rgba(255,242,230,.82) 0%, rgba(255,242,230,.48) 55%, rgba(255,242,230,.12) 100%)}
html[data-theme="light"][data-bg="1"]{
  --bg:#fff2e6; --surface:#fffaf4; --surface2:#fdf0e3; --surface3:#f8e4d2;
  --border:#f0dcc6; --border2:#e6c9ac; --text2:#6b6158; --text3:#93877c; --grid:#f0dcc6}
html[data-theme="light"][data-bg="1"] .card{background:color-mix(in srgb,var(--surface) 90%,transparent)}
html[data-theme="light"][data-bg="1"] .stat,html[data-theme="light"][data-bg="1"] .item,
html[data-theme="light"][data-bg="1"] .ex,html[data-theme="light"][data-bg="1"] .mvcard,
html[data-theme="light"][data-bg="1"] .eqcard,html[data-theme="light"][data-bg="1"] .tile{background:color-mix(in srgb,var(--surface2) 90%,transparent)}
html[data-theme="light"][data-bg="1"] header.app{background:color-mix(in srgb,var(--bg) 86%,transparent)}
@media (max-width:900px){
  #bgart{background-image:url("fundo-celular.jpg")}
  html[data-theme="light"] #bgart{background-image:url("fundo-claro-celular.jpg")}
}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0 0 .35em;line-height:1.22;font-weight:800;letter-spacing:-.015em}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.02rem} h4{font-size:.92rem}
p{margin:0 0 .7em}
small{color:var(--text2)}
.muted{color:var(--text2)}
.tiny{font-size:.8rem}
.hidden{display:none !important}
.center{text-align:center}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:800}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px;border-radius:8px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.ic svg{width:1.2em;height:1.2em;display:block}
.ibub{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ibub svg{width:20px;height:20px}
.ibub.ok{background:var(--ok-soft);color:var(--ok)} .ibub.warn{background:var(--warn-soft);color:var(--warn)} .ibub.grey{background:var(--surface3);color:var(--text2)}

/* ============ FAIXA DO TOPO: [PT|EN] · [IA] · [ANÚNCIO] · [carrossel] · [×] ============ */
#topbar{display:flex;align-items:stretch;background:var(--surface2);border-bottom:1px solid var(--border);min-height:38px}
#topbar .tb{background:transparent;border:0;border-right:1px solid var(--border);color:var(--text2);padding:0 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.78rem;letter-spacing:.04em;white-space:nowrap;transition:.15s}
#topbar .tb:hover{color:var(--text);background:var(--surface3)}
#langbtn .lg{opacity:.55} #langbtn .lg.on{opacity:1;color:var(--accent)} #langbtn i{font-style:normal;opacity:.35;margin:0 2px}
#iabtn{color:var(--accent)}
#iabtn svg{width:15px;height:15px}
#adbar{flex:1;display:flex;align-items:stretch;min-width:0;min-height:52px}
#adbar .adtag{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text3);padding:6px 4px;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
#adbar .adviewport{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#adbar .adtrack{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;will-change:transform;
  animation:adscroll 40s linear infinite;padding:0 8px}
#adbar .adtrack.static{animation:none}
#adbar:hover .adtrack,#adbar.paused .adtrack{animation-play-state:paused}
@keyframes adscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#adbar .aditem{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px 12px 5px 6px;flex-shrink:0;transition:border-color .15s}
#adbar .aditem:hover{border-color:var(--accent)}
#adbar .adimg{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--surface3)}
#adbar .adem{display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem}
#adbar .adtxt{display:flex;flex-direction:column;line-height:1.15}
#adbar .adtxt b{font-size:.8rem}
#adbar .adtxt b em{font-style:normal;font-size:.6rem;color:var(--accent);margin-left:4px;text-transform:uppercase;letter-spacing:.06em}
#adbar .adtxt small{font-size:.72rem;color:var(--text2)}
#adclose{background:transparent;border:0;border-left:1px solid var(--border);color:var(--text2);width:38px;cursor:pointer;font-size:18px;flex-shrink:0}
#adclose:hover{color:var(--text)}
body.fs #topbar{display:none}
@media(max-width:560px){ #adbar .adtxt small{display:none} #adbar .adtag{font-size:.5rem} #topbar .tb{padding:0 9px} }
/* pop-up de anuncio */
.adpop-wrap{z-index:150}
.adpop{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:640px;overflow:hidden}
.adpop-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.adpop-head .tiny{flex:1;text-align:right}
.adpop-body{display:flex;gap:18px;padding:18px;align-items:center}
.adpop-art{flex:0 0 38%;display:flex;align-items:center;justify-content:center}
.adpop-art img{width:100%;max-width:190px;border-radius:16px}
.adpop-em{font-size:4.2rem;line-height:1}
.adpop-txt{flex:1;min-width:0}
@media(max-width:560px){ .adpop-body{flex-direction:column;text-align:center} .adpop-art{flex-basis:auto} .adpop-art img{max-width:120px} .adpop-em{font-size:3.4rem} }
/* tarja do modo de teste (ver como visitante / membro / premium) */
#tarja{background:var(--warn);color:#1a1200;font-weight:800;font-size:.8rem;text-align:center;padding:6px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
#tarja button{background:#1a1200;color:#fff;border:0;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:800;cursor:pointer}

/* ============ HEADER ============ */
header.app{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.hrow{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0;color:var(--text)}
.brand .mark{width:32px;height:32px;flex-shrink:0}
.brand .one{color:var(--accent)}
.spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:40px;height:40px;border-radius:12px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:.15s;flex-shrink:0}
.iconbtn svg{width:19px;height:19px}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#helpbtn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);border-radius:999px;width:auto;padding:0 12px 0 8px;gap:6px;font-weight:800;font-size:.82rem}
#helpbtn img{width:22px;height:22px;border-radius:50%;display:block}
#helpbtn:hover{background:var(--accent);color:var(--accent-ink)}
.whoami{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;max-width:200px;height:40px}
.whoami .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}
.whoami .nm{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){
  .hrow{gap:8px;padding:8px 12px;min-height:54px}
  .brand{font-size:1.05rem} .brand .mark{width:28px;height:28px}
  #helpbtn .hl{display:none} #helpbtn{padding:0;width:40px;justify-content:center}
  .whoami{max-width:140px}
  .whoami .nm{font-size:.78rem}
}
@media(max-width:380px){ .whoami .nm{display:none} .whoami{padding:4px} }

/* ============ NAV (5 areas) ============ */
nav.tabs{max-width:1040px;margin:0 auto;display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--text2);padding:8px 14px;border-radius:999px;
  cursor:pointer;white-space:nowrap;font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:7px;transition:.15s}
nav.tabs button:hover{color:var(--text);background:var(--surface)}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button svg{width:18px;height:18px}
/* barra de baixo (celular) */
#bottombar{display:none}
@media(max-width:820px){
  nav.tabs{display:none}
  #bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  #bottombar button{flex:1;background:none;border:0;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px 3px;cursor:pointer;font-size:.66rem;font-weight:700;border-radius:12px;max-width:110px}
  #bottombar button .ic{width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:.15s}
  #bottombar button svg{width:22px;height:22px}
  #bottombar button span:last-child{white-space:nowrap;line-height:1.05;font-size:.64rem;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  #bottombar button.active{color:var(--accent)}
  #bottombar button.active .ic{background:var(--accent-soft)}
  main{padding-bottom:86px !important}
}
/* sub-navegacao (controle segmentado) */
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;background:transparent;border:0;color:var(--text2);padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;
  font-size:.86rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;min-height:38px}
.seg button svg{width:17px;height:17px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
html[data-theme="dark"] .seg button.on{background:var(--surface3)}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:.84rem;font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;padding:0;margin-bottom:10px}
.crumb:hover{color:var(--accent)}
.crumb svg{width:16px;height:16px}

/* ============ CARDS / LAYOUT ============ */
main{padding:18px 0 40px}
.screen{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card.tight{padding:12px}
.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface) 70%);border-color:var(--accent-line)}
.card.soft{border-style:dashed;box-shadow:none}
.card h2,.card h3{display:flex;align-items:center;gap:8px}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ch .cht{flex:1;min-width:0}
.ch h2,.ch h3{margin:0}
.ch small{display:block;margin-top:1px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.grid.top{align-items:start}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media(max-width:760px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.g2.collapse,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sep{height:1px;background:var(--border);margin:14px 0}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{margin:0}
.pagehead small{display:block;margin-top:2px}
details.fold{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);margin-top:12px}
details.fold > summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:8px;user-select:none}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);transform:rotate(45deg);transition:.2s}
details.fold[open] > summary::after{transform:rotate(-135deg)}
details.fold > .fb{padding:0 14px 14px}

/* ============ CONTROLS ============ */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:0 16px;min-height:var(--tap);border-radius:12px;
  cursor:pointer;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;text-decoration:none;line-height:1.2}
.btn svg{width:18px;height:18px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--text);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.line{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn.line:hover{color:var(--accent);border-color:var(--accent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn.xs{min-height:30px;padding:0 10px;font-size:.76rem;border-radius:8px}
.btn.xs svg,.btn.sm svg{width:15px;height:15px}
.btn.wide{width:100%}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:5px;font-weight:800}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=email],input[type=search],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:10px 12px;outline:none;transition:.15s;min-height:var(--tap)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:80px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);padding:0 13px;min-height:36px;border-radius:999px;
  cursor:pointer;font-size:.84rem;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:15px;height:15px}
.chip:hover{color:var(--text);border-color:var(--text3)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);
  padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:800;color:var(--text2);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:32px}
.switch input{display:none}
.switch .tr{width:46px;height:27px;border-radius:999px;background:var(--surface3);border:1px solid var(--border2);position:relative;transition:.2s;flex-shrink:0}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--text3);transition:.2s}
.switch input:checked + .tr{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .tr::after{left:22px;background:#fff}

/* ============ STAT TILES ============ */
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;min-width:0}
.stat .lb{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .vl{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.15}
.stat .un{font-size:.78rem;color:var(--text2);font-weight:700}
.stat .dl{font-size:.76rem;margin-top:2px}

/* ============ TILES (atalhos e central "Mais") ============ */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:8px;color:var(--text);transition:.15s;min-height:96px;position:relative}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .tl{font-weight:800;font-size:.9rem;line-height:1.2}
.tile .td{font-size:.76rem;color:var(--text2);line-height:1.3}
.tile .lk{position:absolute;top:10px;right:10px}
.tile.row{flex-direction:row;align-items:center;min-height:0;gap:12px}
.tile.row .tl{margin:0}
@media(max-width:400px){ .tiles{grid-template-columns:repeat(2,1fr)} .tile{padding:12px 10px} }

/* ============ BODY MAP ============ */
.bodywrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bodyfig{flex:1;min-width:145px;max-width:300px;text-align:center}
.bodyfig svg{width:100%;height:auto;max-height:440px}
.bodyfig .cap{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-top:2px}
.msc{fill:var(--surface3);stroke:var(--border2);stroke-width:1.2;cursor:pointer;transition:fill .15s,stroke .15s}
.msc:hover{fill:color-mix(in srgb,var(--accent) 45%,var(--surface3));stroke:var(--accent)}
.msc.sel{fill:var(--accent);stroke:var(--accent)}
.bodybase{fill:var(--surface2);stroke:var(--border2);stroke-width:1.2}
.bodyline{fill:none;stroke:var(--border2);stroke-width:1.2}

/* ============ EXERCISE CARDS ============ */
.exlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ex{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:7px}
.ex .exh{display:flex;gap:10px;align-items:flex-start}
.ex .eqic{width:68px;height:74px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;color:var(--accent)}
.ex .eqic svg{width:100%;height:100%;display:block}
.exbig{width:min(52vw,230px);margin:0 auto;color:var(--accent)}
.runfig{width:100px;flex-shrink:0;color:var(--accent)}
.ex .nm{font-weight:800;font-size:.94rem;line-height:1.25}
.ex .tech{font-size:.72rem;color:var(--text3);font-style:italic}
.ex .tip{font-size:.82rem;color:var(--text2)}
.ex .exf{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.eqcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.eqcard svg{width:100%;height:70px}
.eqcard img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.eqcard .nm{font-weight:800;font-size:.84rem;margin-top:5px}
/* fotos de posicao (fotos-exercicios.jpg, opcional) */
.ph{display:inline-block;width:68px;height:68px;border-radius:10px;background-image:url("fotos-exercicios.jpg");background-size:600% 600%;background-repeat:no-repeat;flex-shrink:0;border:1px solid var(--border)}
.phrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phrow .ph{width:110px;height:110px;border-radius:12px}
.phrow .arrow{color:var(--text3);font-size:1.2rem}
.phrow.big .ph{width:min(38vw,170px);height:min(38vw,170px)}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(4,6,10,.72);backdrop-filter:blur(3px);animation:fadein .18s ease}
.modal .box{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px}
.modal .box.wide{max-width:860px}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal .mh h2,.modal .mh h3{margin:0}
@media(max-width:600px){
  .modal{align-items:flex-end;padding:0}
  .modal .box{max-width:none;border-radius:22px 22px 0 0;max-height:94vh;padding:14px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetup .25s ease}
  .modal .box::before{content:"";display:block;width:40px;height:4px;border-radius:999px;background:var(--border2);margin:0 auto 12px}
}
@keyframes sheetup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

/* ============ MISC ============ */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;display:flex;align-items:center;gap:12px;min-height:var(--tap)}
.item .gr{flex:1;min-width:0}
.item .t{font-weight:800;font-size:.92rem}
.item .s{font-size:.78rem;color:var(--text2)}
button.item{width:100%;text-align:left;font:inherit;color:inherit}
.item.link{cursor:pointer;transition:.15s}
.item.link:hover{border-color:var(--accent)}
.item.link::after{content:"";width:8px;height:8px;border-right:2px solid var(--text3);border-top:2px solid var(--text3);transform:rotate(45deg);flex-shrink:0;margin-right:4px}
.item.admrow{flex-direction:column;align-items:stretch;gap:7px}
.item.admrow .admhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem}
.item.admrow .s{font-size:.78rem;color:var(--text2)}
.item.admrow .chips{gap:6px}
.mission{cursor:pointer;user-select:none}
.mission .bx{width:28px;height:28px;border-radius:9px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-size:.9rem;flex-shrink:0;color:transparent;transition:.15s}
.mission.done .bx{background:var(--ok);border-color:var(--ok);color:#03150e}
.mission.done .t{text-decoration:line-through;color:var(--text2)}
.bar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.photo img{width:100%;height:170px;object-fit:cover;display:block}
.photo .pd{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;
  padding:16px 8px 6px;font-size:.72rem;font-weight:800}
.photo .px{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:0;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}
canvas.chart{width:100%;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--text2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.empty{text-align:center;color:var(--text3);padding:22px 10px;font-size:.88rem}
.empty .ibub{margin:0 auto 8px;width:46px;height:46px;border-radius:14px}
.empty b{display:block;color:var(--text2);font-size:.95rem;margin-bottom:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;background:var(--surface);color:var(--text);
  border:1px solid var(--accent);border-radius:14px;padding:11px 18px;box-shadow:var(--shadow);font-size:.88rem;font-weight:700;max-width:90vw;animation:fadein .2s}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--border)}
table.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2)}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.camprev{width:100%;max-height:52vh;background:#000;border-radius:12px;display:block}
.ocrbox{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.8rem;
  white-space:pre-wrap;max-height:180px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.level-badge{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.yt{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.optionlist{display:flex;flex-direction:column;gap:8px}
.optionlist .opt{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;text-align:left;color:var(--text);transition:.15s;min-height:56px}
.optionlist .opt:hover{border-color:var(--accent)}
.optionlist .opt.on{border-color:var(--accent);background:var(--accent-soft)}
.optionlist .opt .ot{font-weight:800;font-size:.94rem} .optionlist .opt .od{font-size:.78rem;color:var(--text2)}

/* ============ CENTRAL DE AJUDA, TUTORIAL E WIZARD ============ */
.help-tabs{margin-bottom:12px}
.help-q{position:relative}
.help-q input{padding-left:40px}
.help-q svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.help-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px}
.help-item .ht{font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.help-item .hd{font-size:.86rem;color:var(--text2);line-height:1.5}
.help-item .hd b{color:var(--text)}
.tour-hole{position:fixed;z-index:400;border-radius:14px;box-shadow:0 0 0 9999px rgba(4,6,10,.72), 0 0 0 3px var(--accent);pointer-events:none;transition:all .28s ease}
.tour-card{position:fixed;z-index:401;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;width:min(340px,calc(100vw - 24px))}
.tour-card h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}
.tour-card p{font-size:.88rem;color:var(--text2);margin:0 0 12px;line-height:1.5}
.tour-card .tf{display:flex;align-items:center;gap:8px}
.tour-dots{display:flex;gap:4px;flex:1}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--border2)} .tour-dots i.on{background:var(--accent);width:16px;border-radius:3px}
.tour-center{left:50%;top:50%;transform:translate(-50%,-50%)}
.wiz-prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wiz-prog .bar{flex:1}
.wiz-foot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.wiz-foot .spacer{flex:1}
.wiz-step{animation:fadein .2s}
.wiz-summary{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(max-width:430px){.wiz-summary{grid-template-columns:1fr}}

/* ============ CRONOMETRO ============ */
#timerscreen{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}
#timerscreen.ring{animation:tflash 1s steps(1,end) infinite}
@keyframes tflash{0%{background:var(--bg)}50%{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}}
#timerscreen .thead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#timerscreen .tmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:38vh}
#tdigits{font-size:clamp(3.6rem,21vw,10.5rem);font-weight:800;line-height:.95;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";text-align:center;word-break:keep-all}
#tdigits.warn{color:var(--warn)} #tdigits.done{color:var(--accent)}
#tsub{font-size:.85rem;color:var(--text2);text-transform:uppercase;letter-spacing:.16em;font-weight:800}
#timerscreen .tbar{width:100%;max-width:640px;height:12px;background:var(--surface3);border-radius:999px;overflow:hidden}
#timerscreen .tbar > i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
#timerscreen .tctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:640px;margin:0 auto;width:100%}
#timerscreen .big{font-size:1.15rem;padding:15px 34px;border-radius:16px;min-width:168px;justify-content:center}
#timerscreen .tfoot{max-width:640px;margin:0 auto;width:100%}
#routinescreen{position:fixed;inset:0;z-index:310;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}
#routinescreen .rhead{display:flex;align-items:center;gap:10px}
#routinescreen .rbar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;margin:10px 0}
#routinescreen .rbar > i{display:block;height:100%;background:var(--accent);width:100%}
#routinescreen .rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#routinescreen .rpose{width:min(46vw,210px);color:var(--accent)}
#rdig{font-size:clamp(2.8rem,15vw,6rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#rdig.warn{color:var(--warn)}
#routinescreen .rfoot{max-width:640px;margin:0 auto;width:100%}
.mvcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:4px}
.mvcard .mvpose{width:78px;align-self:center;color:var(--accent)}
.mvcard .nm{font-weight:800;font-size:.9rem;line-height:1.25}
.pose{width:100%;height:auto;display:block}
.pose .pl{fill:none;stroke:var(--eq-person);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.pose .ph{fill:var(--eq-person)}
.pose .pg{fill:none;stroke:var(--text3);stroke-width:2.5;stroke-linecap:round;opacity:.5}
.pose .aeq{stroke:var(--text2);stroke-width:4;stroke-linecap:round;fill:none}
.pose .aeqp{stroke:var(--text2);stroke-width:5;stroke-linecap:round;fill:none}
.pose .aeqb{stroke:var(--text3);stroke-width:3;stroke-linecap:round;fill:none;opacity:.75}
.pose .aeqc{stroke:var(--text3);stroke-width:1.6;stroke-dasharray:3 3;fill:none}
.pose .agr{stroke:var(--text3);stroke-width:2.5;stroke-linecap:round;opacity:.45}
.pose .aar{fill:none;stroke:var(--warn);stroke-width:2.6;stroke-linecap:round;opacity:.95}
.pose .aarh{fill:var(--warn);stroke:none}
#timerscreen .serbox{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#timerscreen .serrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
#timerscreen .serlb{font-weight:800;font-size:.88rem}
#timerscreen .sernum{display:flex;align-items:center;gap:6px}
#timerscreen .sernum input{width:74px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;min-height:38px}
#timerscreen .sernum .btn{width:36px;min-height:36px;justify-content:center;font-size:1.1rem;padding:0}
#mirrorscreen{position:fixed;inset:0;z-index:320;background:#000;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#mirrorscreen .mhead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);color:var(--text)}
#mirrorscreen .mstage{position:relative;flex:1;overflow:hidden;background:#000}
#mirrorscreen video,#mirrorscreen canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#mirrorscreen .mguide{position:absolute;right:8px;bottom:8px;width:min(34vw,180px);opacity:.85;
  color:#ffb020;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8));pointer-events:none}
#mirrorscreen .mfb{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#mirrorscreen .mfb span{background:rgba(0,0,0,.62);border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:800;max-width:92%}
#mirrorscreen .mok{color:#2ecc8f}
#mirrorscreen .mbad{color:#ff7a7a}
#mirrorscreen .mwarn{color:#ffc44d}
#mirrorscreen .mfoot{background:var(--bg);color:var(--text);padding:10px 12px}
#timermini{position:fixed;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:120;
  background:var(--surface);border:2px solid var(--accent);border-radius:999px;padding:9px 16px;cursor:pointer;
  box-shadow:var(--shadow);font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;color:var(--text)}
@media(min-width:821px){#timermini{bottom:18px}}
footer.app{border-top:1px solid var(--border);padding:16px 0 30px;margin-top:20px;color:var(--text3);font-size:.78rem}
footer.app .wrap{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}

/* ============ ACESSIBILIDADE (WCAG 2.2 AA) — controles na mão de quem usa ============ */
/* Por que: quem enxerga pouco, quem usa o celular no sol ou quem se incomoda com movimento
   precisa mudar o app, não a vida. Tudo em rem, então mexer na raiz muda a tela inteira. */
html{font-size:100%}
html[data-fs="1"]{font-size:112%}
html[data-fs="2"]{font-size:125%}
html[data-fs="3"]{font-size:140%}
html[data-fs="-1"]{font-size:92%}
html[data-contrast="1"]{
  --border:rgba(255,255,255,.34); --border2:rgba(255,255,255,.55);
  --text2:#e6eaf0; --text3:#c7ced8; --surface2:#20252e; --surface3:#2c323d}
html[data-theme="light"][data-contrast="1"]{
  --border:#7d8794; --border2:#5a626d; --text2:#20262e; --text3:#3b434d; --surface2:#e9ecf2; --surface3:#dbe0e8}
html[data-contrast="1"] .card,html[data-contrast="1"] .item,html[data-contrast="1"] .tile,
html[data-contrast="1"] .stat,html[data-contrast="1"] .chip,html[data-contrast="1"] .btn{border-width:2px}
html[data-contrast="1"] .muted,html[data-contrast="1"] small,html[data-contrast="1"] .tiny{color:var(--text2)}
html[data-links="1"] a,html[data-links="1"] .btn.line,html[data-links="1"] .crumb{text-decoration:underline}
html[data-motion="0"] *,html[data-motion="0"] *::before,html[data-motion="0"] *::after{
  animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
html[data-read="1"] #bgart{display:none !important}
html[data-read="1"] .card{box-shadow:none;background:var(--surface);backdrop-filter:none}
html[data-read="1"] body{background:var(--bg)}
html[data-read="1"] .tile,html[data-read="1"] .stat{box-shadow:none}
html[data-read="1"] #adbar .adimg{display:none}
/* a faixa do topo e o cabecalho sao fixos: sem isso eles cobrem o campo que acabou de
   receber foco pelo teclado (WCAG 2.4.11 Focus Not Obscured) */
html{scroll-padding-top:150px}
@media(max-width:820px){ html{scroll-padding-top:120px} }
.skip{position:absolute;left:-9999px;top:0;z-index:500;background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;border-radius:0 0 12px 0;font-weight:800}
.skip:focus{left:0}
.a11yrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a11yrow .btn{min-width:52px;justify-content:center}
.fssample{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}

/* ============ VETORES: pessoa laranja · aparelho azul · peso e elástico branco ============ */
/* Por que: separar quem se mexe do que está parado ajuda a entender a figura num relance. */
:root{--eq-machine:#5aa9ff; --eq-weight:#ffffff; --eq-person:var(--accent)}
html[data-theme="light"]{--eq-machine:#1f6fd0; --eq-weight:#4a5261; --eq-person:var(--accent)}
.pose .pl{stroke:var(--eq-person)}
.pose .ph{fill:var(--eq-person)}

.pose .aeq{stroke:var(--eq-weight);stroke-width:4.2}
.pose .aeqp{stroke:var(--eq-weight);stroke-width:5.4}
.pose .aeqb{stroke:var(--eq-machine);stroke-width:3.4;opacity:1}
.pose .aeqc{stroke:var(--eq-machine);stroke-width:1.8;stroke-dasharray:3 3}
.pose .aeqm{stroke:var(--eq-machine);stroke-width:3.4;fill:none}
.poselegend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:.72rem;color:var(--text2);margin-top:4px}
.poselegend span{display:inline-flex;align-items:center;gap:5px}
.poselegend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ============ DUAS VISÕES (frente e lado) ============ */
.viewbox{position:relative}
.viewgrid > div{flex:1;max-width:200px;text-align:center}
.viewcap{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);font-weight:800;margin-top:2px}
.viewctl{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.viewctl .chip{min-height:32px;font-size:.78rem}

/* ============ DOR & FISIOTERAPIA ============ */
.painwrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.painfig{flex:1;min-width:150px;max-width:280px;text-align:center}
.painfig svg{width:100%;height:auto;max-height:420px}
.bodylimb{fill:none;stroke:var(--surface2);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.zone{fill:color-mix(in srgb,var(--text3) 26%,transparent);stroke:var(--border2);stroke-width:1.2;cursor:pointer;transition:fill .15s,stroke .15s}
.zone:hover,.zone:focus-visible{fill:color-mix(in srgb,var(--accent) 45%,transparent);stroke:var(--accent);outline:none}
.zone.sel{fill:var(--accent);stroke:var(--accent)}
.zone title{pointer-events:none}
.conddet{border-top:1px dashed var(--border2);margin-top:2px;padding-top:12px}
.conddet .lead{margin:0 0 10px;color:var(--text2);line-height:1.5}
.carebox{display:flex;gap:9px;align-items:flex-start;background:var(--warn-soft);border:1px solid rgba(255,176,32,.35);border-radius:var(--radius-sm);padding:10px 12px;margin:0 0 10px;font-size:.85rem;line-height:1.45}
.carebox .ic{color:var(--warn);flex-shrink:0}
.codebox{background:var(--surface3);border-radius:var(--radius-xs);padding:7px 10px;margin:0 0 12px;display:inline-block}
.cidlist{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
.cidrow{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.85rem;align-items:baseline}
.cidrow b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-weight:800}
.cidrow small{grid-column:2;font-size:.72rem}
.condcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:6px}
.condcard .cn{font-weight:800;font-size:.95rem}
.condcard .cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.74rem;color:var(--accent);font-weight:800}
.warnbox{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--radius-sm);padding:12px 14px;font-size:.86rem;display:flex;gap:10px;align-items:flex-start}
.warnbox .ic{color:var(--warn);flex-shrink:0}
.warnbox b{color:var(--text)}

/* ============ SEMÁFORO (RAG) DO RÓTULO ============ */
.rag{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);font-size:.88rem;line-height:1.4}
.rag .dot{width:18px;height:18px;border-radius:50%;display:inline-block;flex-shrink:0}
.rag b{font-size:.98rem}
.rag small{color:var(--text2)}
.rag.g{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)} .rag.g .dot{background:var(--ok)} .rag.g b{color:var(--ok)}
.rag.a{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)} .rag.a .dot{background:var(--warn)} .rag.a b{color:var(--warn)}
.rag.r{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)} .rag.r .dot{background:var(--bad)} .rag.r b{color:var(--bad)}
.altoem{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.altoem .ae{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:52px;padding:8px 14px;border:3px solid var(--text);border-radius:6px;font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;max-width:170px}
.pill.xs{font-size:.66rem;padding:1px 7px}
.exind{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.exind .nm{font-weight:700;font-size:.88rem;margin-bottom:2px}
.exind .vl{font-size:1.3rem;font-weight:800;line-height:1.2}
.exind .vl small{font-size:.66rem;color:var(--text2);font-weight:600}
.exind .dl{font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:999px;vertical-align:middle}
.exind .dl.up{color:var(--warn);background:var(--warn-soft)}
.exind .dl.dn{color:var(--s1);background:color-mix(in srgb,var(--s1) 14%,transparent)}
.exchart{width:100%;height:64px;display:block;margin:6px 0 4px;overflow:visible}
.plcard{background:linear-gradient(140deg,var(--surface3),var(--surface2));border:1px solid var(--border2);border-radius:var(--radius-sm);padding:14px}
.plcard img{width:100%;max-height:120px;object-fit:cover;border-radius:var(--radius-xs);margin-bottom:10px;border:1px solid var(--border)}
.plcard .op{font-weight:800;font-size:.95rem}
.plcard .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.12rem;font-weight:800;letter-spacing:.04em;margin:8px 0 4px;word-break:break-all}
.camstage{position:relative;overflow:hidden;border-radius:var(--radius-sm);background:#000}
.camstage video{display:block;width:100%;transition:transform .18s ease;transform-origin:center}
.camstage video.blur{filter:blur(9px) saturate(.7)}
.camcount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5rem;font-weight:900;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.7);pointer-events:none}
.camctl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.camctl .iconbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.camz{font-weight:800;font-size:.85rem;min-width:46px;text-align:center}
.blurshot{width:100%;max-height:30vh;object-fit:contain;border-radius:var(--radius-sm);background:var(--surface2);margin:10px 0}
@media (max-width:520px){ .altoem .ae{flex:1 1 44%} }
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.taglist .pill{font-size:.72rem}

/* ============ CÂMERA: zoom, temporizador e privacidade ============ */
#mirrorscreen .mzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
#mirrorscreen .mzoom .iconbtn{background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.25);color:#fff}
#mirrorscreen .mcount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(4rem,22vw,10rem);font-weight:800;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8);pointer-events:none}
#mirrorscreen video.blur{filter:blur(12px)}
#mirrorscreen .mstage.privacy::after{content:"";position:absolute;inset:0;pointer-events:none;
  backdrop-filter:blur(14px);-webkit-mask-image:radial-gradient(ellipse 34% 62% at 50% 48%,transparent 60%,#000 78%);
  mask-image:radial-gradient(ellipse 34% 62% at 50% 48%,transparent 60%,#000 78%)}

/* ============ NOVIDADES / VERSÕES ============ */
.verlist{display:flex;flex-direction:column;gap:12px}
.verrow{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.verrow.new{border-color:var(--accent)}
.verrow h4{margin:0 0 2px;display:flex;align-items:center;gap:8px}
.verrow ul{margin:8px 0 0;padding-left:20px}
.verrow li{margin-bottom:4px;font-size:.88rem;color:var(--text2)}
.dot-new{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0}
#helpbtn .badge,#bottombar .badge{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
#helpbtn{position:relative}

/* ============ CONSENTIMENTO / LGPD ============ */
.consentlist .item{align-items:flex-start}
.consentlist .item .gr{padding-right:8px}
.legalbody{font-size:.88rem;line-height:1.65;max-height:56vh;overflow:auto;padding-right:6px}
.legalbody h4{margin:16px 0 6px}
.legalbody p{margin:0 0 .7em}
.legalbody ul{margin:0 0 .8em;padding-left:20px}
.legalbody li{margin-bottom:.3em;color:var(--text2)}

/* ============ VOZ ============ */
.voicebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.speaking{animation:spk 1.1s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:1}50%{opacity:.45}}
.vlist{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:6px;background:var(--surface2)}
.vlist button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.86rem;min-height:40px}
.vlist button:hover{background:var(--surface3)}
.vlist button.on{background:var(--accent-soft);color:var(--accent);font-weight:800}
.vlist .vl{display:block;font-size:.72rem;color:var(--text3)}

.eqpick{display:flex;flex-wrap:wrap;gap:8px}
.eqchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:.82rem;font-weight:600;cursor:pointer;min-height:40px;transition:border-color .15s,background .15s,color .15s}
.eqchip:hover{border-color:var(--accent-line);color:var(--text)}
.eqchip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.eqchipic{width:26px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--text3);flex-shrink:0}
.eqchip.on .eqchipic{color:var(--accent)}
.eqchipic svg{width:100%;height:100%}
.eqchipic img{width:24px;height:20px;object-fit:cover;border-radius:4px}
/* ---- gaveta lateral (☰) ---- */
.iconbtn.menu{flex-shrink:0}
body.noscroll{overflow:hidden}
#drawerback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;transition:opacity .2s ease}
#drawerback.show{opacity:1}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);z-index:81;background:var(--surface);
 border-right:1px solid var(--border2);box-shadow:var(--shadow);display:flex;flex-direction:column;
 transform:translateX(-102%);transition:transform .22s cubic-bezier(.22,.8,.3,1);overscroll-behavior:contain}
#drawer.show{transform:translateX(0)}
#drawer.hidden,#drawerback.hidden{display:none}
#drawer .dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border)}
#drawer .dtitle{font-weight:900;font-size:1.05rem}
#drawer .dtitle .one{color:var(--accent)}
#drawer .dbody{flex:1;overflow:auto;padding:10px 0 24px}
.dgroup{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.dg{display:flex;align-items:center;gap:8px;padding:6px 14px 4px;font-size:.7rem;font-weight:800;
 text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.dg .ic{width:14px;height:14px}
.ditem{display:flex;align-items:center;gap:11px;width:100%;min-height:46px;padding:8px 14px;background:none;
 border:0;border-left:3px solid transparent;color:var(--text2);font:inherit;font-size:.92rem;font-weight:600;
 text-align:left;cursor:pointer;transition:background .13s,color .13s}
.ditem:hover,.ditem:focus-visible{background:var(--surface2);color:var(--text);outline:none}
.ditem.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:800}
.ditem.on .ic{color:var(--accent)}
.ditem.big{font-size:1rem;font-weight:800;min-height:52px}
.ditem .ic{width:20px;height:20px;flex:0 0 20px}
.ditem .dl{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){ #drawer,#drawerback{transition:none} }
html[data-motion="0"] #drawer, html[data-motion="0"] #drawerback{transition:none}
.exviews{margin:4px 0 6px}
.vwstills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vwstills.one{grid-template-columns:repeat(2,1fr);max-width:340px;margin:0 auto}
.vwmoves{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.vwmoves.one{grid-template-columns:1fr;max-width:260px;margin-left:auto;margin-right:auto}
.vwcell{margin:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 6px}
.vwcell.mv{background:var(--surface3);border-color:var(--border2)}
.vwcell svg.pose{max-height:180px}
.vwcell.mv svg.pose{max-height:230px}
.viewcap{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);text-align:center;margin-top:4px;line-height:1.25}
.vwcell.mv .viewcap{font-size:.72rem;color:var(--accent)}
@media (max-width:640px){
  .vwstills{grid-template-columns:repeat(2,1fr)}
  .vwcell svg.pose{max-height:140px}
  .vwcell.mv svg.pose{max-height:170px}
}
.exdetail{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){ .exdetail.has-fotos{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)} }
.exfotos{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px}
.exfotos .phgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.exfotos .ph{width:96px;height:96px;border-radius:10px}
@media (min-width:760px){ .exfotos .phgrid{flex-direction:column;align-items:center} .exfotos .ph{width:100%;max-width:160px;height:150px} }
.eqic .eqmine{width:34px;height:34px;object-fit:cover;border-radius:7px;border:1px solid var(--border);margin-top:4px}
.eqic .ph{width:34px;height:34px;border-radius:7px;margin-top:4px}
.eqic.big{width:120px;height:120px;margin:0 auto}
.vdempty{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.vdempty .ic{color:var(--text3);flex-shrink:0}
.vdlist{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto}
.vdrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--border);font-size:.85rem}
.vdrow .nm{flex:1;min-width:0}
.hrbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--surface3);border:1px solid var(--border2);font-size:.82rem;font-weight:700}
.hrbadge .ic{color:var(--bad);width:15px;height:15px}
.hrbadge b{font-size:1rem}
.hrbadge small{color:var(--text3);font-size:.66rem;font-weight:600}
.hrbadge i{font-style:normal;font-size:.7rem;color:var(--text2)}
.hrbig{font-size:2.3rem;font-weight:900;line-height:1;min-width:110px}
.hrbig small{font-size:.72rem;color:var(--text3);font-weight:700;margin-left:4px}
.hrbadge.z1,.hrbig.z1{color:var(--s1)} .hrbadge.z2,.hrbig.z2{color:var(--ok)}
.hrbadge.z3,.hrbig.z3{color:var(--warn)} .hrbadge.z4,.hrbig.z4{color:var(--accent)}
.hrbadge.z5,.hrbig.z5{color:var(--bad)}
.iconbtn.on,[data-tvbtn].on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.bsres{max-height:58vh;overflow:auto;margin-top:6px}
.bsgrupo{display:flex;align-items:center;gap:7px;padding:10px 4px 4px;font-size:.68rem;font-weight:800;
 text-transform:uppercase;letter-spacing:.06em;color:var(--text3);position:sticky;top:0;background:var(--surface);z-index:1}
.bsgrupo .ic{width:13px;height:13px}
.bsrow{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:8px 10px;border:0;
 border-radius:var(--radius-sm);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.bsrow:hover,.bsrow.sel,.bsrow:focus-visible{background:var(--surface2);outline:none}
.bsrow.sel{box-shadow:inset 0 0 0 1px var(--accent-line)}
.bsrow>.ic{flex:0 0 19px;width:19px;height:19px}
.bsrow>.ic:first-child{color:var(--accent)}
.bsrow>.ic:last-child{color:var(--text3);width:15px;height:15px;flex-shrink:0}
.bsrow .bt{flex:1;min-width:0;display:block}
.bsrow b{display:block;font-size:.92rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsrow small{display:block;font-size:.74rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muslist{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.musrow{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);padding:4px}
.musrow.on{border-color:var(--accent-line);background:var(--accent-soft)}
.musrow .pick{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;color:var(--text);
 font:inherit;text-align:left;cursor:pointer;padding:8px 6px;min-height:44px}
.musrow .pick .ic{color:var(--text3);flex-shrink:0}
.musrow.on .pick .ic{color:var(--accent)}
.musrow .pick span{flex:1;min-width:0}
.musrow b{display:block;font-size:.9rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.musrow small{display:block;font-size:.72rem;color:var(--text2)}
.musplayer{margin-top:10px;border-radius:12px;overflow:hidden;background:var(--surface3)}
.musplayer iframe{width:100%;height:152px;border:0;display:block}
/* ---- boneco com volume: contorno por baixo, corpo por cima, tênis e sombra ---- */
:root{--eq-shoe:#8fa0b6; --eq-shoe-edge:#5d6b7e; --eq-edge:#a8430c; --eq-machine-dk:#3f7fc4; --eq-machine-edge:#1d4f86; --eq-weight-edge:#7d8796}
html[data-theme="light"]{--eq-shoe:#6c7c92; --eq-shoe-edge:#48566a; --eq-edge:#8a3406; --eq-machine-dk:#15568f; --eq-machine-edge:#0c3358; --eq-weight-edge:#3c4453}
.pose .aout line{stroke:var(--eq-edge);fill:none}
.pose .abody line{stroke:var(--eq-person);fill:none}
.pose .phb{fill:var(--eq-edge)}
.pose .ph{fill:var(--eq-person)}
.pose .ashoe line{stroke:var(--eq-shoe);paint-order:stroke;stroke-linejoin:round}
.pose .asom{fill:#000;opacity:.3}
html[data-contrast="1"] .pose .aout line,html[data-contrast="1"] .pose .phb{stroke:#000;fill:#000}
@media print{ #topbar,header.app,#bottombar,footer.app,#timermini{display:none} }
/* aparelhos: peca cheia (azul) e peso (branco) */
.pose .aeqf{fill:var(--eq-machine);stroke:var(--eq-machine-edge);stroke-width:1.2;stroke-linejoin:round}
.pose .aeqfb{fill:var(--eq-machine-dk);stroke:var(--eq-machine-edge);stroke-width:1.2;stroke-linejoin:round}
.pose .aeqo{fill:none;stroke:var(--eq-machine);stroke-width:3}
.pose .aeqw{fill:var(--eq-weight);stroke:var(--eq-weight-edge);stroke-width:1.2;stroke-linejoin:round}
.pose .aeqwd{fill:var(--eq-weight-edge);stroke:none}
[data-contrast="1"] .pose .aeqf,[data-contrast="1"] .pose .aeqfb{stroke-width:2}
.exresgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.exres{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:center}

<script>
/* ---------- SOCORRO: a tela nunca fica preta sem saida ----------
   Se em 9 segundos nada tiver sido desenhado — script que nao carregou, atualizacao
   publicada pela metade, arquivo guardado pelo navegador que veio corrompido — este
   trecho (que e' o primeiro a rodar e nao depende de mais nada) mostra um aviso de
   verdade, com um botao que apaga o que o navegador guardou e recarrega. */
(function () {
  var pronto = false, mostrado = false, erro = "";
  window.RISE_OK = function () { pronto = true; };
  window.addEventListener("error", function (e) { if (!erro) erro = (e && e.message) || "erro no script"; });
  function ok() {
    if (pronto) return true;
    var s = document.getElementById("screen");
    return !!(s && s.children.length);
  }
  function limpar(botao) {
    botao.disabled = true; botao.textContent = "Limpando…";
    var fim = function () { location.reload(); };
    var ps = [];
    try { if (window.caches && caches.keys) ps.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) ps.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
    if (!ps.length) return fim();
    Promise.all(ps).then(fim, fim);
    setTimeout(fim, 4000);
  }
  function socorro() {
    if (mostrado || ok()) return;
    mostrado = true;
    var d = document.createElement("div");
    d.setAttribute("role", "alert");
    d.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#0f1115;color:#f3f5f8;"
      + "font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;"
      + "justify-content:center;padding:24px;box-sizing:border-box;text-align:center";
    d.innerHTML = '<div style="max-width:440px">'
      + '<div style="font-size:1.5rem;font-weight:800;margin-bottom:10px">Rise<span style="color:#ff7a2f">ONE</span></div>'
      + '<p style="margin:0 0 6px"><b>O app não abriu nesta tentativa.</b></p>'
      + '<p style="margin:0 0 18px;color:#aab2bf;font-size:.92rem">Quase sempre é a cópia que o navegador guardou, '
      + 'que ficou desencontrada com a versão publicada. O botão abaixo apaga essa cópia e carrega de novo. '
      + 'Seus treinos, fotos e medidas não são apagados.</p>'
      + '<button id="rs_limpa" style="background:#ff7a2f;color:#12141a;border:0;border-radius:12px;padding:13px 22px;'
      + 'font-size:1rem;font-weight:800;cursor:pointer">Limpar e abrir de novo</button>'
      + '<p style="margin:16px 0 0;color:#7a8493;font-size:.8rem">Se continuar assim, feche e abra o navegador, '
      + 'ou segure Ctrl (⌘ no Mac) e clique em recarregar.</p>'
      + (erro ? '<p style="margin:10px 0 0;color:#7a8493;font-size:.72rem;word-break:break-word">' + String(erro).slice(0, 180) + '</p>' : "")
      + "</div>";
    (document.body || document.documentElement).appendChild(d);
    var b = d.querySelector("#rs_limpa");
    b.onclick = function () { limpar(b); };
  }
  setTimeout(socorro, 9000);
  window.addEventListener("error", function () { setTimeout(socorro, 2500); });
})();
</script>

function I(name, cls){
  const p=ICONS[name]||ICONS.info;
  return '<span class="ic'+(cls?" "+cls:"")+'" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+"</svg></span>";
}
function fillIcons(root){ (root||document).querySelectorAll("[data-icon]").forEach(n=>{ n.outerHTML=I(n.getAttribute("data-icon"), n.className.replace("ic","").trim()); }); }
/* cabecalho de cartao: icone + titulo + subtitulo + acao */
function cardHead(icon, title, sub, action, tag){
  tag=tag||"h3";
  return '<div class="ch"><span class="ibub">'+I(icon)+'</span><div class="cht"><'+tag+'>'+esc(title)+"</"+tag+">"+(sub?'<small class="muted">'+esc(sub)+"</small>":"")+"</div>"+(action||"")+"</div>";
}
function emptyBox(icon, title, sub, action){
  return '<div class="empty"><span class="ibub grey">'+I(icon)+"</span>"+(title?"<b>"+esc(title)+"</b>":"")+(sub?esc(sub):"")+(action?'<div style="margin-top:10px">'+action+"</div>":"")+"</div>";
}

"legal.title":["Aviso legal e privacidade","Legal notice and privacy"],
"legal.body":["Este aplicativo é de uso pessoal e para fins de estudo e pesquisa. A conferência de postura pela câmera é automática e aproximada, feita no próprio aparelho, sem gravar nem enviar imagens, e não substitui a correção de um profissional. As informações sobre exercícios, alimentação e saúde têm caráter informativo e não substituem avaliação de profissional de educação física, nutricionista ou médico. Antes de iniciar qualquer programa de exercícios ou dieta, recomenda-se orientação profissional. O uso é por conta e risco de quem utiliza, não havendo responsabilidade por lesões, danos à saúde ou perdas de qualquer natureza. Os dados registrados (peso, medidas, fotos, refeições e resultados de exames) ficam armazenados no próprio dispositivo e não são enviados a servidores do aplicativo. A remoção dos dados pode ser feita a qualquer momento em Ajustes. Tratamento de dados realizado exclusivamente para fins particulares e não econômicos, nos termos do art. 4º, I, da Lei nº 13.709/2018 (LGPD).","This application is for personal use and for study and research purposes. The camera posture check is automatic and approximate, runs on the device itself without recording or sending images, and does not replace a professional’s correction. Information about exercise, food and health is informative and does not replace assessment by a physical education professional, dietitian or physician. Professional guidance is recommended before starting any exercise or diet programme. Use is at the user's own risk, with no liability for injury, health damage or losses of any kind. Recorded data (weight, measurements, photos, meals and lab results) is stored on the device itself and is not sent to application servers. Data can be removed at any time in Settings. Data processing carried out exclusively for private, non-economic purposes."],
"footer.legal":["Aviso legal e privacidade","Legal notice and privacy"],

"pv.lawSub":["Por que podemos guardar isso, e sob quais regras","Why this may be stored, and under which rules"],
"pv.lawBody":["<p><b>Quem é quem.</b> Você é o titular dos dados. Como tudo fica no seu aparelho e o RiseONE não tem servidor, não há transferência de dados para um controlador — quem decide e guarda é você. Se você ligar a cópia na nuvem ou o assistente de IA, o serviço que você escolher passa a ser um operador dos dados que você mandar para ele, sob os termos daquele serviço.</p><p><b>Dados sensíveis.</b> Peso, medidas, exames, dores e a ficha de saúde são dados pessoais sensíveis de saúde. Por isso cada finalidade é autorizada separadamente, na hora em que ela aparece, e pode ser desligada depois.</p><p><b>Regras consideradas</b> (verificadas em 1º de setembro de 2026, sem garantia de vigência depois desta data): Lei nº 13.709/2018 (LGPD), artigos 7º, 11, 18 e 46; Regulamento (UE) 2016/679 (GDPR), artigos 6º, 9º, 15 a 20 e 32; Lei nº 12.965/2014 (Marco Civil da Internet).</p><p><b>Como conferir se ainda valem:</b> consulte o texto atualizado da LGPD no Planalto (planalto.gov.br), as orientações da ANPD (gov.br/anpd) e, para o GDPR, o EUR-Lex (eur-lex.europa.eu). Recomendamos reconferir a cada seis meses ou quando o app for atualizado.</p>","<p><b>Who is who.</b> You are the data subject. Since everything stays on your device and RiseONE has no server, there is no transfer to a controller — you decide and you store. If you turn on cloud backup or the AI assistant, the service you choose becomes a processor of whatever you send it, under that service's own terms.</p><p><b>Sensitive data.</b> Weight, measurements, lab results, pains and the health form are sensitive personal health data. That is why each purpose is authorised separately, at the moment it comes up, and can be switched off later.</p><p><b>Rules considered</b> (checked on 1 September 2026, with no guarantee they remain in force after that date): Brazilian Law 13,709/2018 (LGPD), articles 7, 11, 18 and 46; Regulation (EU) 2016/679 (GDPR), articles 6, 9, 15–20 and 32; Brazilian Law 12,965/2014 (Internet Civil Framework).</p><p><b>How to check they still apply:</b> see the current LGPD text at planalto.gov.br, the ANPD guidance at gov.br/anpd and, for the GDPR, EUR-Lex at eur-lex.europa.eu. We suggest re-checking every six months or whenever the app is updated.</p>"],

"vz.helpBody":["<p><b>Não sai som</b> — confira nesta ordem:</p><ol><li>Volume alto e modo silencioso desligado.</li><li>O app aberto na frente: muitos celulares cortam a voz quando a tela apaga.</li><li>Toque em “Testar”. Se não falar, toque em “Procurar vozes de novo”.</li><li>Deixe em “Padrão do aparelho”: é a opção que funciona em mais celulares.</li></ol><p><b>Instalei uma voz nova e ela não aparece na lista</b> — o navegador guarda a lista antiga até ser fechado de vez:</p><ol><li>Escolha o mecanismo novo em Configurações › (buscar) “conversão de texto em voz” › Mecanismo preferido. Na Samsung o menu se chama “Configurações de Leitura de texto Samsung” — não é o TalkBack.</li><li>Configurações › Aplicativos › Chrome (ou Edge) › <b>Forçar parada</b>.</li><li>Abra o app de novo e toque em “Procurar vozes de novo”.</li><li>Se ainda vier a voz antiga, reinicie o aparelho.</li></ol><p>Para conferir fora do app, abra a página <b>TESTE-VOZ-riseone.html</b>, publicada no mesmo endereço.</p>","<p><b>No sound</b> — check in this order:</p><ol><li>Volume up and silent mode off.</li><li>The app in the foreground: many phones cut the voice when the screen turns off.</li><li>Tap “Test”. If nothing is said, tap “Look for voices again”.</li><li>Leave it on “Device default”: that is the option that works on the most phones.</li></ol><p><b>I installed a new voice and it does not show up</b> — the browser keeps the old list until it is fully closed:</p><ol><li>Pick the new engine in Settings › (search) “text-to-speech” › Preferred engine. On Samsung the menu is called “Samsung text-to-speech settings” — not TalkBack.</li><li>Settings › Apps › Chrome (or Edge) › <b>Force stop</b>.</li><li>Open the app again and tap “Look for voices again”.</li><li>If the old voice still comes up, restart the device.</li></ol><p>To check outside the app, open the <b>TESTE-VOZ-riseone.html</b> page, published at the same address.</p>"],
"vz.layerNote":["O RiseONE usa a voz do próprio aparelho, e não uma voz baixada da internet. O motivo: aqui as frases são curtas e mudam a cada série, então guardar áudio pronto não ajudaria — e assim a voz sai na hora, sem internet e sem gastar cota de nenhum serviço.","RiseONE uses the device's own voice rather than a downloaded internet voice. The reason: here the phrases are short and change with every set, so caching audio would not help — and this way the voice comes out instantly, offline and without spending any service quota."],

"hr.helpBtn":["O que funciona e o que não funciona","What works and what doesn't"],
"hr.helpT":["Relógio, pulseira e cinta","Watch, band and strap"],
"hr.helpBody":["<p><b>Funciona:</b> qualquer cinta peitoral ou pulseira que publique o serviço padrão de frequência cardíaca do Bluetooth — Polar, Garmin HRM, Wahoo, Coospo, Magene e a maioria das pulseiras baratas. O app pede para você escolher o aparelho na lista do navegador e passa a receber o batimento ao vivo.</p><p><b>Não funciona:</b> Apple Watch e Galaxy Watch não deixam um site ler o batimento deles — eles só falam com o app do próprio fabricante. Para usar o relógio, a saída é exportar o treino no app do relógio e importar aqui.</p><p><b>Onde funciona:</b> Chrome no Android, no computador e no ChromeOS. No iPhone e no iPad, nenhum navegador tem Bluetooth para sites.</p><p><b>Por que não existe um app de relógio do RiseONE:</b> um site publicado no GitHub Pages não vira aplicativo de relógio. Isso exigiria um app nativo na loja, que é outro projeto.</p>","<p><b>Works:</b> any chest strap or band that publishes the standard Bluetooth heart rate service — Polar, Garmin HRM, Wahoo, Coospo, Magene and most cheap bands. The app asks you to pick the device from the browser's list and then receives the beat live.</p><p><b>Does not work:</b> Apple Watch and Galaxy Watch do not let a website read their heart rate — they only talk to their maker's own app. To use the watch, export the workout in the watch's app and import it here.</p><p><b>Where it works:</b> Chrome on Android, on the desktop and on ChromeOS. On iPhone and iPad, no browser has Bluetooth for websites.</p><p><b>Why there is no RiseONE watch app:</b> a site published on GitHub Pages does not become a watch app. That would need a native app in the store, which is a different project.</p>"],

"tv.canCast":["Este navegador transmite para Chromecast e Google TV","This browser can cast to Chromecast and Google TV"],
"tv.cantCast":["Este navegador não transmite; dá para usar a janelinha ou o espelhamento","This browser cannot cast; you can use the floating window or screen mirroring"],
"tv.body2":["<p><b>Como funciona de verdade.</b> O RiseONE não vira vídeo para a TV. Ele faz melhor: pede ao navegador que a <b>própria TV abra uma página do app</b> (a <code>tv-riseone.html</code>) e depois manda, pelo Wi-Fi, o que ela deve mostrar — o nome do exercício, os dois bonecos e o cronômetro, tudo em letra grande. A TV desenha sozinha; o celular continua livre para você marcar as séries.</p><p><b>O que você faz:</b> toque em Procurar a TV, escolha o aparelho na lista que o navegador mostra e pronto. TV e celular precisam estar no mesmo Wi-Fi.</p><p><b>Onde funciona:</b> Chrome e Edge, com Chromecast ou Google TV. No iPhone, e em qualquer TV sem Chromecast, o app cai para a janelinha flutuante ou para a tela cheia, e aí quem leva a imagem até a TV é o espelhamento do próprio aparelho (Android: Transmitir; iPhone: Espelhamento de Tela).</p><p><b>Por que não dá para transmitir a câmera do espelho:</b> o navegador bloqueia transmitir imagem de câmera ao vivo, por segurança. O espelho continua no celular.</p>","<p><b>How it actually works.</b> RiseONE does not turn into a video for the TV. It does something better: it asks the browser to have <b>the TV itself open one of the app's pages</b> (<code>tv-riseone.html</code>) and then sends it, over Wi-Fi, what to show — the exercise name, both figures and the countdown, all in large type. The TV draws it by itself; your phone stays free to log your sets.</p><p><b>What you do:</b> tap Look for the TV, pick the device from the list the browser shows, and that is it. TV and phone must be on the same Wi-Fi.</p><p><b>Where it works:</b> Chrome and Edge, with Chromecast or Google TV. On iPhone, and on any TV without Chromecast, the app falls back to the floating window or full screen, and then your own device's mirroring carries the image to the TV (Android: Cast; iPhone: Screen Mirroring).</p><p><b>Why the camera mirror cannot be cast:</b> the browser blocks casting a live camera image, for safety. The mirror stays on the phone.</p>"]

"st.creditsBody":["<p>O RiseONE não embute nenhuma biblioteca. Três serviços são carregados só quando você usa a função: <b>Tesseract.js</b> (ler o texto das fotos), <b>MediaPipe</b> (postura no espelho) e <b>pdf.js</b> (ler o PDF do laboratório) — todos com licença Apache-2.0.</p><p>Vídeo e música abrem no YouTube e no app de música que você escolher: o RiseONE guarda apenas o link e não hospeda nem redistribui conteúdo.</p><p><b>CID-10</b>: redação resumida, lista inicial de consulta. <b>TUSS</b>: tabela da ANS, importada por quem publica o site. <b>Limites de “alto em”</b>: RDC 429/2020 e IN 75/2020. O arquivo <code>CREDITOS.md</code>, publicado junto com o app, traz a lista completa com licença e origem de cada coisa.</p>","<p>RiseONE embeds no library. Three services load only when you use the feature: <b>Tesseract.js</b> (reading text from photos), <b>MediaPipe</b> (posture in the mirror) and <b>pdf.js</b> (reading the lab PDF) — all Apache-2.0.</p><p>Video and music open in YouTube and in the music app you choose: RiseONE stores only the link and hosts or redistributes nothing.</p><p><b>ICD-10</b>: shortened wording, an initial reference list. <b>TUSS</b>: the ANS table, imported by whoever publishes the site. <b>“High in” limits</b>: Brazilian RDC 429/2020 and IN 75/2020. The <code>CREDITOS.md</code> file, published with the app, has the full list with each item's licence and origin.</p>"],

function eqHave(id){ return !!(STATE.equipHave && STATE.equipHave[id]); }
function eqSetHave(id,on){ STATE.equipHave=STATE.equipHave||{}; if(on) STATE.equipHave[id]=1; else delete STATE.equipHave[id]; save(); }
/* desenho técnico do aparelho: quando existe o arquivo aparelhos/<id>.png (sem fundo), ele cobre o ícone; senão fica o ícone */
function eqFig(e){
  const mine=STATE.equipPhotos&&STATE.equipPhotos[e.id];
  return '<div class="eqfig">'+e.svg+'<img src="aparelhos/'+e.id+'.png" alt="" loading="lazy" onload="this.classList.add(\'ok\')" onerror="this.remove()">'+(mine?'<img class="eqmine2" src="'+mine+'" alt="">':"")+"</div>";
}
function eqBusca(q, grupo){
  const x=norm(q).trim();
  return Object.values(EQUIP).filter(e=>{
    const tg=EQ_TAGS[e.id]||{g:[],k:""};
    if(grupo && tg.g.indexOf(grupo)<0) return false;
    if(!x) return true;
    const hay=norm(e.id+" "+e.pt+" "+e.en+" "+tg.k+" "+tg.g.map(g=>t("eq.g."+g)).join(" "));
    return x.split(/\s+/).every(w=>hay.indexOf(w)>=0);
  });
}
/* ficha do aparelho: desenho grande (ampliável), nome, "tenho", exercícios e foto da própria academia */
function eqModal(id){
  const e=EQUIP[id]; if(!e) return;
  const tg=EQ_TAGS[id]||{g:[]};
  const m=modal(mh(LANG==="pt"?e.pt:e.en)+
    '<div class="eqbig" id="eqbig">'+eqFig(e)+"</div>"+
    '<div class="row" style="margin-top:8px"><button class="btn xs line" id="eqzoom">'+I("zoomin")+t("eq.zoom")+'</button><a class="btn xs ghost" id="eqopen" href="aparelhos/'+e.id+'.png" target="_blank" rel="noopener">'+I("upload")+t("eq.open")+"</a></div>"+
    '<div class="chips" style="margin:10px 0">'+tg.g.map(g=>'<span class="chip">'+t("eq.g."+g)+"</span>").join("")+"</div>"+
    '<label class="switch"><input type="checkbox" id="eqhave" '+(eqHave(id)?"checked":"")+'><span class="tr"></span><span>'+t("eq.have")+"</span></label>"+
    '<div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn sm line" id="eqphoto">'+I("camera")+t("ex.takephoto")+'</button><button class="btn sm" id="eqex">'+t("body.seeEx")+"</button></div>",{wide:true});
  m.querySelector("#eqzoom").onclick=()=>m.querySelector("#eqbig").classList.toggle("zoom");
  m.querySelector("#eqhave").onchange=ev=>{ eqSetHave(id, ev.target.checked); if(ROUTE==="ex") render(); };
  m.querySelector("#eqex").onclick=()=>{ m.remove(); EXF.eqs=[id]; EXF.eq=""; EXF.q=""; EXF.eqOpen=false; go("ex"); };
  m.querySelector("#eqphoto").onclick=()=>pickImage(dataUrl=>{ STATE.equipPhotos=STATE.equipPhotos||{}; STATE.equipPhotos[id]=dataUrl; save(); m.remove(); eqModal(id); toast(t("common.saved")); });
  /* sem o arquivo do desenho, o link "abrir" não faz sentido */
  const probe=new Image(); probe.onerror=()=>{ const a=m.querySelector("#eqopen"); if(a) a.remove(); }; probe.src="aparelhos/"+e.id+".png";
}
