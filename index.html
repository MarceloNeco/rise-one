/* ---------- 6. DATAS E FORMATOS ---------- */
const MON = {pt:["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],
             en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const WD  = {pt:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
const WDL = {pt:["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],
             en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]};
function todayISO(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function parseISO(s){ const a=String(s||"").split("-"); return new Date(+a[0],(+a[1]||1)-1,+a[2]||1); }
/* PT: dd/mmm/aaaa  ·  EN: mmm/dd/aaaa */
function fmtDate(iso){
  if(!iso) return "—";
  const d = (iso instanceof Date)?iso:parseISO(iso);
  if(isNaN(d)) return String(iso);
  const dd=String(d.getDate()).padStart(2,"0"), mm=MON[LANG][d.getMonth()], yy=d.getFullYear();
  return LANG==="pt" ? dd+"/"+mm+"/"+yy : mm+"/"+dd+"/"+yy;
}
function fmtShort(iso){ const d=parseISO(iso); return LANG==="pt" ? String(d.getDate()).padStart(2,"0")+"/"+MON[LANG][d.getMonth()] : MON[LANG][d.getMonth()]+"/"+String(d.getDate()).padStart(2,"0"); }
function weekdayName(i,long){ return (long?WDL:WD)[LANG][i]; }
function nDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function num(v,d){ const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?(d===undefined?0:d):n; }
function fmtNum(n,dec){ if(n===null||n===undefined||isNaN(n)) return "—";
  return Number(n).toLocaleString(LANG==="pt"?"pt-BR":"en-US",{minimumFractionDigits:dec||0,maximumFractionDigits:dec===undefined?1:dec}); }
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function loadRoot(){
  try{ const raw=localStorage.getItem(LSKEY); if(raw) ROOT=JSON.parse(raw); }catch(e){ ROOT=null; }
  if(!ROOT || typeof ROOT!=="object") ROOT={users:{},data:{},ads:[],prefs:{lang:"pt",theme:"dark"},session:null};
  ROOT.users=ROOT.users||{}; ROOT.data=ROOT.data||{}; ROOT.ads=ROOT.ads||[]; ROOT.prefs=ROOT.prefs||{lang:"pt",theme:"dark"};
  return ROOT;
}

function save(){ if(!GUEST && ROOT.session && ROOT.session.uid){ ROOT.data[ROOT.session.uid]=STATE; saveRoot(); return true; } return false; }

/* ---------- 8. TOAST / MODAL ---------- */
let toastT=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d);
  clearTimeout(toastT); toastT=setTimeout(()=>d.remove(), 2600);
}
function modal(html, opts){
  opts=opts||{};
  if(TOURST.active) tourEnd();
  const m=document.createElement("div"); m.className="modal"; m.setAttribute("data-nav","1");
  m.innerHTML='<div class="box'+(opts.wide?" wide":"")+'">'+html+"</div>";
  navPush({layer:"modal"});
  m.addEventListener("click", e=>{ if(e.target===m && !opts.sticky) m.remove(); });
  document.body.appendChild(m);
  m.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>m.remove()));
  if(opts.sticky) m.setAttribute("data-sticky","1");
  const f=m.querySelector("input,select,textarea"); if(f && window.innerWidth>820) setTimeout(()=>f.focus(),60);
  initAnims(m);
  return m;
}
function confirmBox(msg, onYes){
  const m=modal('<div class="mh"><h3>'+esc(msg)+'</h3></div><div class="row" style="justify-content:flex-end"><button class="btn line" data-close>'+t("common.cancel")+'</button><button class="btn danger" id="cyes">'+t("common.yes")+"</button></div>");
  m.querySelector("#cyes").onclick=()=>{ m.remove(); onYes(); };
}
function mh(title){ return '<div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" data-close>&times;</button></div>'; }

/* ---------- 11c. VOLTAR DO CELULAR: navega dentro do app ---------- */
/* Por que: o Voltar do aparelho saía do app e caía no Portal. Cada tela, janela, gaveta e tela cheia ganha
   uma entrada no histórico; no popstate fecha-se só a camada de cima. Abas não se empilham (ficam uma camada
   acima do Início); só a área Mais empilha suas subtelas. Na tela inicial, o primeiro Voltar avisa e só o segundo sai.
   Regras: nada de pushState espalhado — só aqui (navPush/navDrop). Entrada criada sem toque da pessoa é ignorada
   pelo Chrome, por isso a entrada de guarda nasce no primeiro toque. */
const NAV={skip:0, popping:false, depth:0, guard:false, after:[]};
function navPush(st){ if(NAV.skip>0){ NAV.after.push(()=>navPush(st)); return; } try{ history.pushState(Object.assign({rise:1},st),""); }catch(e){} }
function navReplace(st){ if(NAV.skip>0){ NAV.after.push(()=>navReplace(st)); return; } try{ history.replaceState(Object.assign({rise:1},st),""); }catch(e){} }
/* fechou pelo botão da tela: tira a entrada do histórico sem disparar o fechamento de novo */
function navDrop(layer){ const s=history.state; if(!NAV.popping && s && s.rise && s.layer===layer){ NAV.skip++; history.back(); } }
function navGuard(){ if(NAV.guard) return; NAV.guard=true; navPush({guard:1}); }
function navRoute(de, para, sub){
  if(NAV.popping) return;
  if(para==="home"){ if(NAV.depth>0){ const n=NAV.depth; NAV.depth=0; NAV.skip+=n; history.go(-n); } return; }
  const empilha = NAV.depth===0 || (de==="more" && sectionOf(para).id==="more");
  if(empilha){ NAV.depth++; navPush({route:para, sub:sub||null, depth:NAV.depth}); }
  else navReplace({route:para, sub:sub||null, depth:NAV.depth});
}
window.addEventListener("popstate", e=>{
  if(NAV.skip>0){ NAV.skip--; if(NAV.skip===0){ const fs=NAV.after; NAV.after=[]; fs.forEach(f=>f()); } return; }
  const st=e.state||{};
  NAV.popping=true;
  try{
    if(TOURST.active){ tourEnd(); return; }
    const modais=[...document.querySelectorAll("body > .modal")];
    if(modais.length){ modais[modais.length-1].remove(); return; }
    if(document.querySelector("#mirrorscreen")){ closeMirror(); return; }
    if(document.querySelector("#routinescreen")){ closeRoutine(); return; }
    if(document.querySelector("#timerscreen")){ minimizeTimer(); return; }
    const d=document.getElementById("drawer");
    if(d && !d.classList.contains("hidden")){ closeDrawer(); return; }
    if(typeof ASSIST!=="undefined" && ASSIST.open) assistClose();
    if(st.route){ NAV.depth=st.depth||1; ROUTE=st.route; if(st.sub) SUB[ROUTE]=st.sub; buildNav(); render(); window.scrollTo({top:0}); return; }
    NAV.depth=0;
    if(ROUTE!=="home"){ ROUTE="home"; buildNav(); render(); window.scrollTo({top:0}); }
    if(!st.guard){ NAV.guard=false; toast(t("as.exit")); }   /* chegou na primeira entrada: o próximo Voltar sai */
  } finally { NAV.popping=false; }
});
try{ history.replaceState({rise:1, inicio:1},""); }catch(e){}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev, navGuard, {once:false, capture:true}));
/* janela fechada por qualquer caminho (botão, Esc, código): a entrada dela sai do histórico */
new MutationObserver(ms=>{ if(NAV.popping) return; ms.forEach(m=>m.removedNodes.forEach(n=>{ if(n.nodeType===1 && n.classList && n.classList.contains("modal") && n.getAttribute("data-nav")) navDrop("modal"); })); }).observe(document.body,{childList:true});

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-go]");
  if(b){ const m=b.closest(".modal"); if(m && !b.closest("#screen")) m.remove(); go(b.getAttribute("data-go"), b.getAttribute("data-sub")||undefined); }

function ci(date){ return STATE.checkins.find(c=>c.date===date); }
function ensureCi(date){ let c=ci(date); if(!c){ c={date,weight:null,done:[],mood:2,notes:""}; STATE.checkins.push(c); } return c; }
function missionsToday(d){ const dow=(d?parseISO(d):new Date()).getDay(); return STATE.missions.filter(m=>!m.days||m.days.indexOf(dow)>=0); }
function mTitle(m){ return typeof m.title==="string"?m.title:(m.title[LANG]||m.title.pt); }
function lastWeight(){ const w=STATE.checkins.filter(c=>c.weight).sort((a,b)=>a.date<b.date?1:-1); return w.length?w[0].weight:(STATE.measures.length?STATE.measures[STATE.measures.length-1].weight:null); }
function streak(){
  let n=0, d=new Date();
  for(let i=0;i<400;i++){
    const iso=todayISO(d), c=ci(iso);
    const ok = !!(c && ((c.done&&c.done.length) || STATE.logs.some(l=>l.date===iso)));
    if(ok) n++;
    else if(i>0) break;            /* o dia de hoje ainda pode ser cumprido */
    d.setDate(d.getDate()-1);
  }
  return n;
}
function weekLogs(){ const now=new Date(); const start=new Date(now); start.setDate(now.getDate()-now.getDay());
  const iso=todayISO(start); return STATE.logs.filter(l=>l.date>=iso); }
function mealsOn(date){ return STATE.meals.filter(m=>m.date===date); }
function sumMeals(list){ return list.reduce((a,m)=>({kcal:a.kcal+(m.kcal||0),prot:a.prot+(m.prot||0),carb:a.carb+(m.carb||0),fat:a.fat+(m.fat||0)}),{kcal:0,prot:0,carb:0,fat:0}); }
function workoutToday(){ const dow=new Date().getDay(); return STATE.workouts.find(w=>(w.days||[]).indexOf(dow)>=0); }
function age(){ if(!STATE.profile.birth) return 30; const b=parseISO(STATE.profile.birth); const n=new Date();
  let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a>0&&a<120?a:30; }

function wireEqPicker(){
  document.querySelectorAll("[data-eqpick]").forEach(b=>b.onclick=()=>{
    const id=b.getAttribute("data-eqpick");
    EXF.eqs=EXF.eqs||[];
    if(!id){ EXF.eqs=[]; EXF.soMeus=false; }
    else { const i=EXF.eqs.indexOf(id); if(i>=0) EXF.eqs.splice(i,1); else EXF.eqs.push(id); }
    EXF.eq="";
    render();
  });
  const c=document.getElementById("eqclr");
  if(c) c.onclick=()=>{ EXF.eqs=[]; render(); };
  const mn=document.getElementById("eqmine");
  if(mn) mn.onclick=()=>{ EXF.soMeus=!EXF.soMeus; EXF.eqs=[]; render(); };
}
function filterEx(){
  const q=EXF.q.toLowerCase().trim();
  return allEx().filter(x=>{
    if(EXF.m && x.m!==EXF.m && x.sec.indexOf(EXF.m)<0) return false;
    if(EXF.eq && x.eq!==EXF.eq) return false;
    if(EXF.eqs && EXF.eqs.length && EXF.eqs.indexOf(x.eq)<0) return false;
    if(EXF.soMeus && x.eq!=="livre" && !eqHave(x.eq)) return false;
    if(!q) return true;
    const hay=(x.pt+" "+x.en+" "+x.gpt+" "+x.gen+" "+mName(x.m,1)+" "+mName(x.m,2)+" "+mName(x.m,3)+" "+eqName(x.eq)).toLowerCase();
    if(hay.indexOf(q)>=0) return true;
    return GOALS.some(g=>g.k.some(k=>k.length>2 && q.indexOf(k)>=0) && (g.m.indexOf(x.m)>=0||x.sec.some(s=>g.m.indexOf(s)>=0)));
  });
}

/* ---------- 18. CAMERA E IMAGENS ---------- */
function resizeImage(src, max, cb){
  const img=new Image();
  img.onload=function(){
    let w=img.width,h=img.height; const sc=Math.min(1, max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",0.82));
  };
  img.onerror=function(){ toast(LANG==="pt"?"Não consegui abrir a imagem.":"Could not open the image."); };
  img.src=src;
}
function readFile(file, cb){ const r=new FileReader(); r.onload=()=>resizeImage(r.result,1400,cb); r.readAsDataURL(file); }
let CAMSTREAM=null, CAMFACING="environment";
function stopCam(){ if(CAMSTREAM){ CAMSTREAM.getTracks().forEach(tr=>tr.stop()); CAMSTREAM=null; } if(typeof CAM2!=="undefined" && CAM2.meterT){ clearInterval(CAM2.meterT); CAM2.meterT=null; } }
function pickImage(cb){
  const m=modal(mh(t("common.photo"))+
    '<div id="camwrap"></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="opencam">'+I("camera")+t("sc.camera")+'</button>'+
    '<label class="btn ghost" style="cursor:pointer">'+I("upload")+t("sc.upload")+'<input type="file" accept="image/*" id="fileinp" style="display:none"></label></div>'+
    '<p class="tiny muted" style="margin-top:8px">'+t("sc.tip")+"</p>",{sticky:false});
  m.addEventListener("click",e=>{ if(e.target===m) stopCam(); });
  m.querySelector("[data-close]").addEventListener("click",stopCam);
  m.querySelector("#fileinp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; readFile(f,d=>{ stopCam(); m.remove(); cb(d); }); };
  m.querySelector("#opencam").onclick=()=>startCam(m.querySelector("#camwrap"), d=>{ stopCam(); m.remove(); cb(d); });
}
function startCam(host, cb){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast(t("sc.noCam")); return; }
  host.innerHTML='<video class="camprev" autoplay playsinline muted></video>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="shoot">'+I("camera")+t("sc.shoot")+'</button>'+
    '<button class="btn line" id="flip">'+I("refresh")+t("sc.switch")+'</button><button class="btn line" id="stopc">'+t("sc.stop")+"</button></div>";
  const v=host.querySelector("video");
  const open=()=>{ stopCam();
    navigator.mediaDevices.getUserMedia({video:{facingMode:CAMFACING,width:{ideal:1280}},audio:false})
      .then(s=>{ CAMSTREAM=s; v.srcObject=s; })
      .catch(()=>{ toast(t("sc.denied")); host.innerHTML=""; });
  };
  open();
  host.querySelector("#flip").onclick=()=>{ CAMFACING=(CAMFACING==="environment")?"user":"environment"; open(); };
  host.querySelector("#stopc").onclick=()=>{ stopCam(); host.innerHTML=""; };
  host.querySelector("#shoot").onclick=()=>{
    if(!v.videoWidth){ toast(t("sc.noCam")); return; }
    const cv=document.createElement("canvas"); cv.width=v.videoWidth; cv.height=v.videoHeight;
    cv.getContext("2d").drawImage(v,0,0);
    resizeImage(cv.toDataURL("image/jpeg",0.9),1400,cb);
  };
}

/* ---------- 20. SOM DE ALARME ---------- */
let AC=null;
function beep(times){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    let i=0; const n=times||3;
    const one=()=>{ const o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value= i%2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.35);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+0.36);
      if(++i<n) setTimeout(one,420); };
    one();
  }catch(e){}
  if(navigator.vibrate) try{ navigator.vibrate([200,100,200,100,300]); }catch(e){}
}

/* ---------- 21. CRONOMETRO DE TELA CHEIA (regressivo e progressivo) ---------- */
const TIMER = {
  mode:"down", total:60, left:60, up:0, running:false, ringing:false,
  endAt:0, startedAt:0, accum:0, tick:null, ringTick:null,
  alarm:true, vibrate:true, awake:true, wake:null, awakeVideo:null, awakeInt:null,
  onEnd:null, el:null, mini:null, autoBack:false, autoT:null
};
function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60, p=n=>String(n).padStart(2,"0");
  return h? (h+":"+p(m)+":"+p(s)) : (p(m)+":"+p(s));
}
/* --- manter a tela acesa --- */
function keepAwake(){
  if(!TIMER.awake) return;
  if(navigator.wakeLock && navigator.wakeLock.request){
    navigator.wakeLock.request("screen").then(w=>{ TIMER.wake=w; paintAwake(); })
      .catch(()=>{ awakeFallback(); });
  } else awakeFallback();
}
function awakeFallback(){
  if(TIMER.awakeVideo) return;
  try{
    const cv=document.createElement("canvas"); cv.width=cv.height=2;
    const cx=cv.getContext("2d"); let i=0;
    TIMER.awakeInt=setInterval(()=>{ cx.fillStyle=(i++%2)?"#000000":"#010101"; cx.fillRect(0,0,2,2); },900);
    const st=cv.captureStream(2);
    const v=document.createElement("video");
    v.srcObject=st; v.muted=true; v.defaultMuted=true; v.loop=true;
    v.setAttribute("playsinline",""); v.setAttribute("muted","");
    v.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none";
    document.body.appendChild(v); v.play().catch(()=>{});
    TIMER.awakeVideo=v;
  }catch(e){}
  paintAwake();
}
function releaseAwake(){
  try{ if(TIMER.wake && TIMER.wake.release) TIMER.wake.release(); }catch(e){}
  TIMER.wake=null;
  if(TIMER.awakeInt){ clearInterval(TIMER.awakeInt); TIMER.awakeInt=null; }
  if(TIMER.awakeVideo){ try{ TIMER.awakeVideo.pause(); const st=TIMER.awakeVideo.srcObject;
    if(st) st.getTracks().forEach(tr=>tr.stop()); }catch(e){}
    TIMER.awakeVideo.remove(); TIMER.awakeVideo=null; }
  paintAwake();
}
function awakeActive(){ return !!(TIMER.wake || TIMER.awakeVideo); }
function paintAwake(){
  const n=document.getElementById("tawake");
  if(!n) return;
  if(!TIMER.awake) n.textContent = "💤 "+t("tm.awakeOff");
  else n.textContent = awakeActive()? ("🔆 "+t("tm.awakeOn")) : ("🔆 "+t("tm.awakeWhen"));
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && TIMER.running && TIMER.awake && !awakeActive()) keepAwake();
  if(TIMER.el) paintTimer();
});

/* --- abrir / fechar --- */
function openTimer(seconds, onEnd, autostart, autoBack){
  TIMER.autoBack=!!autoBack;
  if(TIMER.autoT){ clearTimeout(TIMER.autoT); TIMER.autoT=null; }
  if(seconds){ TIMER.mode="down"; TIMER.total=seconds; TIMER.left=seconds; TIMER.endAt=0; TIMER.running=false;
    if(typeof SER!=="undefined"){ clearInterval(SER.tick); SER.tick=null; SER.running=false; SER.done=false; } }
  TIMER.onEnd=onEnd||null;
  if(TIMER.mini){ TIMER.mini.remove(); TIMER.mini=null; }
  if(!TIMER.el){
    const d=document.createElement("div"); d.id="timerscreen"; document.body.appendChild(d); TIMER.el=d; document.body.classList.add("fs"); navPush({layer:"fs"});
  }
  buildTimer();
  if(autostart && !TIMER.running) startTimer();
}
function closeTimer(){
  if(TIMER.autoT){ clearTimeout(TIMER.autoT); TIMER.autoT=null; }
  TIMER.autoBack=false;
  if(typeof SER!=="undefined" && SER.tick){ clearInterval(SER.tick); SER.tick=null; SER.running=false; }
  stopRing(); pauseTimer(); releaseAwake();
  if(TIMER.el){ TIMER.el.remove(); TIMER.el=null; navDrop("fs"); }
  if(TIMER.mini){ TIMER.mini.remove(); TIMER.mini=null; }
  document.body.classList.remove("fs");
  TIMER.mode==="up" ? (TIMER.up=0, TIMER.accum=0) : (TIMER.left=TIMER.total);
}
function minimizeTimer(){
  if(TIMER.el){ TIMER.el.remove(); TIMER.el=null; navDrop("fs"); }
  document.body.classList.remove("fs");
  if(!TIMER.mini){
    const b=document.createElement("button"); b.id="timermini";
    b.onclick=()=>openTimer(); document.body.appendChild(b); TIMER.mini=b;
  }
  paintTimer();
}
/* --- controle --- */
function timerValue(){
  if(TIMER.mode==="down"){
    if(TIMER.running) return Math.max(0,(TIMER.endAt-Date.now())/1000);
    return TIMER.left;
  }
  return TIMER.accum + (TIMER.running? (Date.now()-TIMER.startedAt)/1000 : 0);
}
function startTimer(){
  stopRing();
  if(TIMER.mode==="down"){
    if(TIMER.left<=0) TIMER.left=TIMER.total||60;
    TIMER.endAt=Date.now()+TIMER.left*1000;
  } else TIMER.startedAt=Date.now();
  TIMER.running=true;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  keepAwake();
  clearInterval(TIMER.tick);
  TIMER.tick=setInterval(timerStep,200);
  paintTimer();
}
function pauseTimer(){
  if(TIMER.running){
    if(TIMER.mode==="down") TIMER.left=Math.max(0,(TIMER.endAt-Date.now())/1000);
    else TIMER.accum=TIMER.accum+(Date.now()-TIMER.startedAt)/1000;
  }
  TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  paintTimer();
}
function resetTimer(){
  stopRing(); TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  if(TIMER.mode==="down"){ TIMER.left=TIMER.total; TIMER.endAt=0; }
  else { TIMER.up=0; TIMER.accum=0; TIMER.startedAt=0; }
  paintTimer();
}
function setTimerMode(md){
  if(md==="series" && !canUse("series")) return gotItLocked("series");
  if(TIMER.mode===md) return;
  stopRing(); TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
  if(typeof SER!=="undefined"){ clearInterval(SER.tick); SER.tick=null; SER.running=false; SER.done=false; }
  TIMER.mode=md;
  if(md==="down"){ TIMER.left=TIMER.total||60; TIMER.endAt=0; }
  else if(md==="up"){ TIMER.accum=0; TIMER.up=0; }
  buildTimer();
}
function adjustTimer(sec){
  if(TIMER.mode!=="down") return;
  const cur=timerValue();
  const v=Math.max(5, Math.min(24*3600, Math.round(cur+sec)));
  TIMER.left=v; TIMER.total=Math.max(TIMER.total,v);
  if(TIMER.running) TIMER.endAt=Date.now()+v*1000;
  paintTimer();
}
function setPreset(sec){
  stopRing(); TIMER.mode="down"; TIMER.total=sec; TIMER.left=sec;
  if(TIMER.running) TIMER.endAt=Date.now()+sec*1000;
  paintTimer();
}
function timerStep(){
  if(TIMER.mode==="down"){
    const v=timerValue();
    if(v<=0.05){
      TIMER.left=0; TIMER.running=false; clearInterval(TIMER.tick); TIMER.tick=null;
      startRing();
      if(TIMER.onEnd){ const f=TIMER.onEnd; TIMER.onEnd=null; try{ f(); }catch(e){} }
    }
  }
  paintTimer();
}
/* --- configuracao do alarme --- */
function alarmCfg(){
  STATE.settings=STATE.settings||{};
  const d={mode:"short", shortSec:5, every:60, times:0, sound:true, vibrate:true};
  STATE.settings.alarm=STATE.settings.alarm||{};
  for(const k in d) if(STATE.settings.alarm[k]===undefined) STATE.settings.alarm[k]=d[k];
  return STATE.settings.alarm;
}
/* --- alarme --- */
function startRing(){
  const cfg=alarmCfg();
  TIMER.ringing=true; TIMER.ringCount=0;
  if(TIMER.el) TIMER.el.classList.add("ring");
  const fire=()=>{
    TIMER.ringCount++;
    if(cfg.sound!==false) beep(3);
    if(cfg.vibrate!==false && navigator.vibrate){ try{ navigator.vibrate([300,120,300,120,500]); }catch(e){} }
  };
  clearInterval(TIMER.ringTick); TIMER.ringTick=null;
  if(TIMER.ringStop){ clearTimeout(TIMER.ringStop); TIMER.ringStop=null; }
  fire();
  if(cfg.mode==="short"){
    const secs=Math.max(1,num(cfg.shortSec,5));
    TIMER.ringTick=setInterval(fire,1400);
    TIMER.ringStop=setTimeout(()=>{ stopRing(); if(TIMER.autoBack) closeTimer(); paintTimer(); }, secs*1000);
  } else if(cfg.mode==="repeat"){
    const every=Math.max(5,num(cfg.every,60))*1000, times=num(cfg.times,0);
    TIMER.ringTick=setInterval(()=>{ fire(); if(times>0 && TIMER.ringCount>=times){ stopRing(); paintTimer(); } }, every);
  } else {
    TIMER.ringTick=setInterval(fire,2200);
    if(TIMER.autoBack){ TIMER.ringStop=setTimeout(()=>{ stopRing(); closeTimer(); }, 6500); }
  }
  if(!TIMER.el){
    toast("⏰ "+t("tm.over"));
    const nc=notifCfg();
    if(nc.on && nc.types.descanso.on) notifyNow("RiseONE", t("nt.descansoMsg"), "descanso");
  }
  paintTimer();
}
function stopRing(){
  if(TIMER.ringTick){ clearInterval(TIMER.ringTick); TIMER.ringTick=null; }
  if(TIMER.ringStop){ clearTimeout(TIMER.ringStop); TIMER.ringStop=null; }
  if(navigator.vibrate){ try{ navigator.vibrate(0); }catch(e){} }
  TIMER.ringing=false; TIMER.ringCount=0;
  if(TIMER.el) TIMER.el.classList.remove("ring");
}

const SER={list:[],i:0,running:false,endAt:0,left:0,tick:null,started:0,done:false,lastBeep:-1,total:0};
const SER_PRESETS=[
 {id:"tabata", pt:"Tabata", en:"Tabata", c:{prep:10,work:20,rest:10,reps:8,blocks:1,blockRest:60}},
 {id:"3030",   pt:"30/30",  en:"30/30",  c:{prep:10,work:30,rest:30,reps:10,blocks:1,blockRest:60}},
 {id:"4515",   pt:"45/15",  en:"45/15",  c:{prep:10,work:45,rest:15,reps:8,blocks:1,blockRest:60}},
 {id:"emom",   pt:"EMOM 1 min", en:"EMOM 1 min", c:{prep:10,work:40,rest:20,reps:10,blocks:1,blockRest:60}},
 {id:"forca",  pt:"Força 4×8", en:"Strength 4×8", c:{prep:15,work:40,rest:90,reps:4,blocks:3,blockRest:120}}
];
function serCfg(){
  STATE.settings=STATE.settings||{};
  const d={prep:10,work:30,rest:15,reps:8,blocks:1,blockRest:60};
  STATE.settings.ser=STATE.settings.ser||{};
  for(const k in d) if(STATE.settings.ser[k]===undefined) STATE.settings.ser[k]=d[k];
  return STATE.settings.ser;
}
function serBuildList(){
  const c=serCfg(), list=[];
  if(c.prep>0) list.push({t:"prep",s:c.prep,r:0,b:1});
  for(let b=1;b<=Math.max(1,c.blocks);b++){
    for(let r=1;r<=Math.max(1,c.reps);r++){
      list.push({t:"work",s:c.work,r,b});
      if(r<c.reps && c.rest>0) list.push({t:"rest",s:c.rest,r,b});
    }
    if(b<c.blocks && c.blockRest>0) list.push({t:"brest",s:c.blockRest,r:0,b});
  }
  return list;
}
function serTotal(list){ return (list||serBuildList()).reduce((a,x)=>a+x.s,0); }
function serColor(t2){ return {prep:"var(--warn)",work:"var(--accent)",rest:"var(--s1)",brest:"var(--s3)"}[t2]||"var(--accent)"; }
function serLabel(t2){ return {prep:t("tm.prep"),work:t("tm.work"),rest:t("tm.rest"),brest:t("tm.blockRest")}[t2]||""; }
function numRow(id,label,val,min,max,step,unit){
  return '<div class="serrow"><span class="serlb">'+esc(label)+'</span>'+
    '<div class="sernum"><button class="btn ghost sm" data-sdec="'+id+'">−</button>'+
    '<input type="number" id="s_'+id+'" value="'+val+'" min="'+min+'" max="'+max+'" step="'+step+'">'+
    '<button class="btn ghost sm" data-sinc="'+id+'">+</button><span class="tiny muted">'+(unit||"")+"</span></div></div>";
}
function buildSeries(){
  if(!TIMER.el) return;
  if(SER.running || SER.done){ paintSeriesScreen(); return; }
  const c=serCfg(), list=serBuildList();
  TIMER.el.innerHTML=
    '<div class="thead"><button class="iconbtn" id="tclose" title="'+t("common.close")+'">&times;</button>'+
      modeChips()+'<span class="spacer" style="flex:1"></span>'+
      '<button class="btn line sm" id="tmin">▁ '+t("tm.min")+"</button></div>"+
    '<div class="tfoot" style="flex:1;overflow:auto">'+
      '<p class="tiny muted" style="text-align:center">'+t("tm.serSub")+"</p>"+
      '<div class="tiny muted" style="text-align:center;margin:10px 0 5px">'+t("tm.preset")+"</div>"+
      '<div class="chips" style="justify-content:center;margin-bottom:14px">'+
      SER_PRESETS.map(p=>'<button class="chip" data-spre="'+p.id+'">'+(LANG==="pt"?p.pt:p.en)+"</button>").join("")+"</div>"+
      '<div class="serbox">'+
        numRow("prep",t("tm.prep"),c.prep,0,300,5,"s")+
        numRow("work",t("tm.work"),c.work,5,3600,5,"s")+
        numRow("rest",t("tm.rest"),c.rest,0,3600,5,"s")+
        numRow("reps",t("tm.reps"),c.reps,1,99,1,"")+
        numRow("blocks",t("tm.blocks"),c.blocks,1,20,1,"")+
        (c.blocks>1?numRow("blockRest",t("tm.blockRest"),c.blockRest,0,3600,10,"s"):"")+
      "</div>"+
      '<div class="row" style="justify-content:center;margin:14px 0"><span class="pill acc">'+t("tm.totalTime")+": "+fmtClock(serTotal(list))+'</span>'+
      '<span class="pill">'+list.filter(x=>x.t==="work").length+" × "+t("tm.work")+"</span></div>"+
      '<button class="btn big wide" id="sgo">▶ '+t("tm.serStart")+"</button>"+
      '<div class="sep"></div>'+alarmBlock()+
    "</div>";
  const q=id=>TIMER.el.querySelector(id);
  q("#tclose").onclick=closeTimer;
  q("#tmin").onclick=minimizeTimer;
  TIMER.el.querySelectorAll("[data-tmode]").forEach(b=>b.onclick=()=>setTimerMode(b.getAttribute("data-tmode")));
  TIMER.el.querySelectorAll("[data-spre]").forEach(b=>b.onclick=()=>{
    const p=SER_PRESETS.find(x=>x.id===b.getAttribute("data-spre"));
    if(p){ Object.assign(serCfg(), p.c); save(); buildSeries(); } });
  const bump=(id,d)=>{ const n=TIMER.el.querySelector("#s_"+id); const st=+n.step||1;
    n.value=Math.max(+n.min, Math.min(+n.max, (+n.value||0)+d*st)); commit(); };
  const commit=()=>{ ["prep","work","rest","reps","blocks","blockRest"].forEach(k=>{
      const n=TIMER.el.querySelector("#s_"+k); if(n) c[k]=Math.max(+n.min,Math.min(+n.max,num(n.value,c[k]))); });
    save(); buildSeries(); };
  TIMER.el.querySelectorAll("[data-sdec]").forEach(b=>b.onclick=()=>bump(b.getAttribute("data-sdec"),-1));
  TIMER.el.querySelectorAll("[data-sinc]").forEach(b=>b.onclick=()=>bump(b.getAttribute("data-sinc"),1));
  TIMER.el.querySelectorAll(".sernum input").forEach(n=>n.onchange=commit);
  q("#sgo").onclick=startSeries;
  wireAlarmBlock(TIMER.el);
  paintAwake();
}
function startSeries(){
  SER.list=serBuildList(); SER.total=serTotal(SER.list);
  if(!SER.list.length) return;
  SER.i=0; SER.done=false; SER.lastBeep=-1; SER.started=Date.now();
  SER.left=SER.list[0].s; SER.endAt=Date.now()+SER.left*1000; SER.running=true;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  keepAwake(); beep(1);
  clearInterval(SER.tick); SER.tick=setInterval(serStep,200);
  paintSeriesScreen();
}
function serLeft(){ return SER.running? Math.max(0,(SER.endAt-Date.now())/1000) : SER.left; }
function serRemaining(){
  let rest=serLeft();
  for(let k=SER.i+1;k<SER.list.length;k++) rest+=SER.list[k].s;
  return rest;
}
function serPause(){
  if(SER.running){ SER.left=serLeft(); SER.running=false; clearInterval(SER.tick); SER.tick=null; }
  else { SER.endAt=Date.now()+SER.left*1000; SER.running=true; clearInterval(SER.tick); SER.tick=setInterval(serStep,200); keepAwake(); }
  paintSeries();
}
function serGo(n){
  const i=SER.i+n; if(i<0) return;
  if(i>=SER.list.length){ serFinish(); return; }
  SER.i=i; SER.lastBeep=-1; SER.left=SER.list[i].s; SER.endAt=Date.now()+SER.left*1000;
  if(!SER.running){ SER.running=true; clearInterval(SER.tick); SER.tick=setInterval(serStep,200); }
  paintSeriesScreen();
}
function serStep(){
  const v=serLeft(), r=Math.ceil(v);
  if(r<=3 && r>0 && r!==SER.lastBeep){ SER.lastBeep=r; beep(1); }
  if(v<=0.05){
    if(SER.i>=SER.list.length-1){ serFinish(); return; }
    SER.i++; SER.lastBeep=-1; SER.left=SER.list[SER.i].s; SER.endAt=Date.now()+SER.left*1000;
    beep(SER.list[SER.i].t==="work"?2:1);
    paintSeriesScreen(); return;
  }
  paintSeries();
}
function serFinish(){
  clearInterval(SER.tick); SER.tick=null; SER.running=false; SER.done=true;
  const dur=Math.round((Date.now()-SER.started)/1000);
  STATE.wuLogs=STATE.wuLogs||[];
  STATE.wuLogs.push({id:uid(), date:todayISO(), name:t("tm.series")+" "+serCfg().work+"/"+serCfg().rest, dur, moves:SER.list.filter(x=>x.t==="work").length});
  save(); startRing();
  paintSeriesScreen();
}
function serReset(){
  stopRing(); clearInterval(SER.tick); SER.tick=null;
  SER.running=false; SER.done=false; SER.i=0; SER.list=[];
  buildSeries();
}
function paintSeriesScreen(){

  }

    '<div class="tmid"><div id="tsub" style="color:'+serColor(it.t)+'">'+serLabel(it.t)+'</div>'+

      (nx?'<div class="tiny muted" style="text-align:center;margin-bottom:8px">'+t("wu.next")+": "+serLabel(nx.t)+" · "+nx.s+"s</div>":"")+

  const q=id=>TIMER.el.querySelector(id);

function paintSeries(){

      (itemNote(it)?'<p class="tiny" style="margin:.4em 0 0;font-weight:700">'+I("info")+" "+esc(itemNote(it))+"</p>":"")+
      (x?photoStrip(x.id):"")+
      ((x&&exWarn(x))?'<p class="tiny" style="color:var(--warn);font-weight:700;margin:.4em 0 0">⚠ '+t("an.warnEx")+": "+esc(exWarn(x))+"</p>":"")+"</div>"+
      '<div class="grid g2"><label class="fld"><span>'+t("wk.reps")+'</span><input id="r_reps" type="text" value="'+esc(p.reps)+'"></label>'+

      if(p.sets.length>=p.target && idx<w.items.length-1){ idx++; paint(); timerModal(it.rest||60); }
      else { paint(); timerModal(it.rest||60); }
    };
    m.querySelector("#r_rest").onclick=()=>timerModal(it.rest||60);
    const rmr=m.querySelector("#r_mir");
    if(rmr) rmr.onclick=()=>openMirror(exAnimId(x), exName(x));
    const rw=m.querySelector("#r_warm");
    if(rw) rw.onclick=()=>{ const l=buildRoutine("before", autoGroupsFromWorkout(w), 5);
      if(l) runRoutine(expandRoutine(l), t("wu.warmBtn")); else toast(t("wu.noMoves")); };
    const rtv=m.querySelector("#r_tv"); if(rtv) rtv.onclick=()=>tvProjetar();
    if(x) tvMostraExercicio(x);
    paintTvBtn();
    m.querySelector("#r_prev").onclick=()=>{ if(idx>0){ idx--; paint(); } };
    m.querySelector("#r_next").onclick=()=>{ if(idx<w.items.length-1){ idx++; paint(); } };
    m.querySelector("#r_fin").onclick=()=>{
      const dur=Math.round((Date.now()-started)/1000);
      let vol=0, any=false;
      prog.forEach(p=>p.sets.forEach(s=>{ vol+=(num(s.reps,0)*num(s.load,0)); any=true; }));
      STATE.logs.push(Object.assign({id:uid(), date:todayISO(), workoutId:w.id, name:w.name, dur, volume:Math.round(vol),
        items:prog.map(p=>({exId:p.exId, sets:p.sets}))},
        HR.max? {fcMax:HR.max, fcMedia:Math.round(HR.serie.reduce((a,x)=>a+x[1],0)/Math.max(1,HR.serie.length))} : {}));
      const c=ensureCi(todayISO());
      const trainMission=STATE.missions.find(mm=>/train|trein/i.test(mTitle(mm)));
      if(trainMission && c.done.indexOf(trainMission.id)<0) c.done.push(trainMission.id);
      save(); m.remove(); go("workout"); offerStretch(w);
    };
  }
  paint();
}

function ringSVG(v,total){
  const pct = total? Math.min(v/total,1.35) : 0, r=52, c=2*Math.PI*r, off=c*(1-Math.min(pct,1));
  const over = total && v>total;
  return '<svg viewBox="0 0 130 130" role="img" aria-label="'+esc(t("dt.kcal"))+'">'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="13"/>'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="'+(over?"var(--warn)":"var(--s1)")+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 65 65)"/>'+
    '<text x="65" y="60" text-anchor="middle" fill="var(--text)" font-size="21" font-weight="800">'+fmtNum(v,0)+"</text>"+
    '<text x="65" y="78" text-anchor="middle" fill="var(--text2)" font-size="11">'+(total?("/ "+fmtNum(total,0)+" kcal"):"kcal")+"</text></svg>";
}
function macroBar(lb,v,total,col){
  const p = total? Math.min(v/total*100,100):0;
  return '<div style="margin-bottom:9px"><div class="between tiny"><span>'+esc(lb)+'</span><span class="muted">'+fmtNum(v,0)+" / "+(total?fmtNum(total,0):"—")+" g</span></div>"+
    '<div class="bar"><i style="width:'+p+'%;background:'+col+'"></i></div></div>';
}

function calcDiet(){

  const bmr = 10*w + 6.25*hgt - 5*a + (male?5:-161);

  const tdee=Math.round(bmr*f);

    '<p class="tiny muted">'+t("dt.calcNote")+"</p>"+
    '<div class="grid g3"><div class="stat"><div class="lb">TMB</div><div class="vl">'+fmtNum(bmr,0)+"</div></div>"+
    '<div class="stat"><div class="lb">'+(LANG==="pt"?"Gasto diário":"Daily burn")+'</div><div class="vl">'+fmtNum(tdee,0)+"</div></div>"+
    '<div class="stat"><div class="lb">'+t("home.weight")+'</div><div class="vl">'+fmtNum(w,1)+"</div></div></div>"+
    '<label class="fld" style="margin-top:12px"><span>'+(LANG==="pt"?"Objetivo":"Goal")+'</span><select id="cd_g">'+
    '<option value="-0.2">'+(LANG==="pt"?"Emagrecer (-20%)":"Lose fat (-20%)")+"</option>"+
    '<option value="0" selected>'+(LANG==="pt"?"Manter":"Maintain")+"</option>"+
    '<option value="0.15">'+(LANG==="pt"?"Ganhar massa (+15%)":"Gain muscle (+15%)")+"</option></select></label>"+
    '<div class="row" style="justify-content:flex-end"><button class="btn line" data-close>'+t("common.cancel")+'</button><button class="btn" id="cd_ok">'+t("common.save")+"</button></div>");
  m.querySelector("#cd_ok").onclick=()=>{
    const adj=parseFloat(m.querySelector("#cd_g").value);
    const kcal=Math.round(tdee*(1+adj)), prot=Math.round(w*(adj<0?2.2:1.8)), fat=Math.round(w*0.9);
    const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
    STATE.diet={kcal, restKcal:Math.round(kcal*0.92), prot, carb, fat, water:STATE.diet.water||8};
    save(); m.remove(); render(); toast(t("common.saved"));
  };
}

/* ---------- 24b. ALIMENTOS, PRATOS E SUGESTÕES (inspirado no Desrotulando) ---------- */
/* Por que: ler o rótulo é só o começo. A pessoa quer guardar o alimento com a tabela dele, calcular a
   porção, saber se cabe na meta, ver se tem algo que ela evita, e receber ideias de prato e de dia
   inteiro que respeitem as restrições. Tudo roda no aparelho; a IA só entra se a pessoa pedir. */
const NUT_OBJ=["emagrecer","pressao","diabetes","criancas","massa"];
/* restrições: id e o que denuncia na lista de ingredientes (texto sem acento, minúsculo) */
const NUT_RESTR=[
 ["gluten",   /gluten|trigo|cevada|centeio|malte|\baveia\b|\bpao\b|\bpaes\b|macarrao|biscoito|bolacha|\bbolo\b|torrada|cerveja|farinha(?! de arroz| de mandioca| de milho)/],
 ["lactose",  /lactose|\bleite\b|soro de leite|whey|queijo|manteiga|iogurte|creme de leite|caseina|\bnata\b|requeij/],
 ["leite",    /\bleite\b|soro de leite|whey|queijo|manteiga|iogurte|creme de leite|caseina|\bnata\b|requeij|lactose/],
 ["animal",   /\bcarne|frango|peixe|\bovos?\b|\bleite\b|gelatina|\bmel\b|banha|manteiga|queijo|whey|caseina|albumina|iogurte|atum|salm|tilapia|camar|bacon|presunto|linguica|salsicha|bovin|patinho|contrafile|\bbife\b|\bcoxa\b|peito de|requeij/],
 ["ovo",      /\bovos?\b|albumina|\bgema\b|clara de ovo|maionese/],
 ["soja",     /\bsoja\b|lecitina de soja|\btofu\b|shoyu|\bmiss?o\b/],
 ["amendoim", /amendoim|peanut/],
 ["castanhas",/castanha|\bnozes\b|\bnoz\b|amendoa|avela|pistache|macadamia|\bpeca\b/],
 ["frutosmar",/peixe|camar|frutos do mar|\batum\b|sardinha|salm|bacalhau|tilapia|\blula\b|polvo|marisco|mexilh/],
 ["acucar",   /acucar|xarope|glicose|frutose|maltodextrina|\bmel\b|dextrose|sacarose|glucose|refrigerante|chocolate/]
];
function dietPrefs(){ STATE.diet.prefs=STATE.diet.prefs||{objetivos:[],restricoes:[]}; return STATE.diet.prefs; }
function nutTags(text){ const x=norm(text||""); return NUT_RESTR.filter(r=>r[1].test(x)).map(r=>r[0]); }
/* um alimento "olhável" de qualquer origem: da tabela comum (linha do FOODS) ou dos meus */
function nutBase(i){ const f=FOODS[i]; return {id:"b:"+i, nome:foodName(f), nomePT:f[0], por100:{kcal:f[2],prot:f[3],carb:f[4],fat:f[5]}, tags:nutTags(f[0]), base:true}; }
function nutFind(id){
  if(String(id).indexOf("b:")===0) return nutBase(+String(id).slice(2));
  const f=STATE.foods.find(x=>x.id===id); if(!f) return null;
  return Object.assign({}, f, {tags:nutTags(f.nome+" "+(f.ingRaw||"")+" "+(f.ings||[]).join(" "))});
}
function nutAll(){ return STATE.foods.map(f=>nutFind(f.id)).concat(FOODS.map((f,i)=>nutBase(i))); }
function nutScale(por100, g){ const k=(g||0)/100, o={}; ["kcal","prot","carb","fat","fiber","sugar","satFat","sodium"].forEach(key=>{ if(por100[key]!=null) o[key]=por100[key]*k; }); return o; }
function nutKcalLeft(){
  const d=STATE.diet, isTrain=!!workoutToday(), alvo=(isTrain||!d.restKcal)?d.kcal:d.restKcal;
  if(!alvo) return null;
  return {alvo, resta:Math.max(0, alvo-sumMeals(mealsOn(todayISO())).kcal)};
}
/* rótulo lido → alimento (valores do rótulo são por porção; guardamos por 100 g) */
function foodFromLabel(o){
  const k=(o.portion&&o.portion>0)? 100/o.portion : 1;
  const por100={}; [["kcal","kcal"],["prot","prot"],["carb","carb"],["fat","fat"],["fiber","fiber"],["sugar","sugar"],["satFat","satFat"],["sodium","sodium"]].forEach(([a,b])=>{ if(o[a]!=null) por100[b]=Math.round(o[a]*k*10)/10; });
  return {nome:"", marca:o.brand||"", porcao:o.portion||0, por100, ingRaw:o.ingRaw||"", ings:o.ings||[], selos:o.dietas||[], rag:o.rag?o.rag.cor:"", altoEm:o.altoEm||[], fonte:"rotulo"};
}

const NUT_SLOTS=[["bf",0.25],["lu",0.35],["sn2",0.12],["di",0.28]];
function pratoItens(pr){
  /* prato pronto: itens por nome da tabela comum; prato meu: itens por id */
  return (pr.itens||[]).map(it=>{
    if(Array.isArray(it)){ const i=FOODS.findIndex(f=>f[0]===it[0]); return i<0? null : {f:nutBase(i), g:it[1]}; }
    const f=nutFind(it.id); return f? {f, g:it.g} : null;
  }).filter(Boolean);
}
function pratoNome(pr){ return pr.nome || (LANG==="pt"?pr.pt:pr.en); }
function pratoTotais(pr, fator){
  fator=fator||1; const tot={kcal:0,prot:0,carb:0,fat:0,g:0}, tags=new Set();
  pratoItens(pr).forEach(({f,g})=>{ const o=nutScale(f.por100, g*fator); tot.kcal+=o.kcal||0; tot.prot+=o.prot||0; tot.carb+=o.carb||0; tot.fat+=o.fat||0; tot.g+=g*fator; (f.tags||[]).forEach(x=>tags.add(x)); });
  tot.tags=[...tags]; return tot;
}
/* nota do prato para o perfil: restrição ferida = fora; objetivo atendido = pontos; perto da meta da refeição = pontos */
function pratoNota(pr, slot, alvoSlot){
  const pr2=dietPrefs(), tot=pratoTotais(pr), motivos=[];
  if(tot.tags.some(x=>pr2.restricoes.indexOf(x)>=0)) return null;
  let n=0;
  const ob=pr2.objetivos;
  const ultra=pratoItens(pr).some(x=>/refrigerante|acucar|cerveja/.test(norm(x.f.nomePT||x.f.nome)));
  if(ob.indexOf("emagrecer")>=0){ if(tot.kcal<=450){ n+=2; motivos.push("nu.wLowKcal"); } if(tot.prot/Math.max(1,tot.kcal)*100>=6){ n+=1; } }
  if(ob.indexOf("massa")>=0 && tot.prot>=25){ n+=2; motivos.push("nu.wProt"); }
  if(ob.indexOf("diabetes")>=0){ if(tot.carb<=45){ n+=2; motivos.push("nu.wLowCarb"); } if(tot.tags.indexOf("acucar")<0){ n+=1; motivos.push("nu.wNoSugar"); } }
  if(ob.indexOf("pressao")>=0 && !ultra){ n+=1; motivos.push("nu.wFresh"); }
  if(ob.indexOf("criancas")>=0 && pr.kids){ n+=2; motivos.push("nu.wKids"); }
  if(slot && pr.slots && pr.slots.indexOf(slot)>=0) n+=2;
  if(alvoSlot){ const d=Math.abs(tot.kcal-alvoSlot)/alvoSlot; if(d<0.2){ n+=2; motivos.push("nu.wFits"); } else if(d<0.45) n+=1; }
  return {n, motivos:[...new Set(motivos)], tot};
}
function pratosTodos(){ return STATE.dishes.map(d=>Object.assign({meu:true}, d)).concat(PRATOS); }
function sugerirPratos(slot){
  const left=nutKcalLeft(); const alvo=left? Math.round(left.alvo*((NUT_SLOTS.find(x=>x[0]===slot)||[0,0.3])[1])) : 0;
  return pratosTodos().map(pr=>{ const nt=pratoNota(pr, slot, alvo); return nt? {pr, nt} : null; }).filter(Boolean).sort((a,b)=>b.nt.n-a.nt.n).slice(0,6);
}
let NUT_SLOT="lu", NUT_SEED=0;
function planoDoDia(seed){
  const left=nutKcalLeft(); if(!left) return null;
  const usados=new Set(), plano=[];
  NUT_SLOTS.forEach(([slot,pct])=>{
    const alvo=left.alvo*pct;
    const lista=pratosTodos().map(pr=>{ const nt=pratoNota(pr, slot, alvo); return nt? {pr,nt} : null; }).filter(x=>x && !usados.has(x.pr.id)).sort((a,b)=>b.nt.n-a.nt.n);
    if(!lista.length) return;
    const esc2=lista[Math.min(lista.length-1, (seed||0)%Math.min(3,lista.length))];
    usados.add(esc2.pr.id);
    const fator=Math.max(0.7, Math.min(1.4, alvo/Math.max(1,esc2.nt.tot.kcal)));
    plano.push({slot, pr:esc2.pr, fator, tot:pratoTotais(esc2.pr, fator)});
  });
  const total=plano.reduce((a,x)=>({kcal:a.kcal+x.tot.kcal, prot:a.prot+x.tot.prot, carb:a.carb+x.tot.carb, fat:a.fat+x.tot.fat}),{kcal:0,prot:0,carb:0,fat:0});
  return {plano, total, alvo:left.alvo};
}

/* ---------- 25. GRAFICOS (canvas) ---------- */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function setupCanvas(cv,h){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||300;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  return {c,w,h};
}
function lineChart(cv, pts, opts){
  opts=opts||{}; if(!cv) return;
  const H=opts.height||190, {c,w,h}=setupCanvas(cv,H);
  const pad={l:44,r:12,t:12,b:26};
  const gw=w-pad.l-pad.r, gh=h-pad.t-pad.b;
  if(pts.length<2){ c.fillStyle=cssVar("--text3"); c.font="13px sans-serif"; c.textAlign="center";
    c.fillText(opts.emptyMsg||t("pg.needData"), w/2, h/2); return; }
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){ mn-=1; mx+=1; } const padY=(mx-mn)*0.15; mn-=padY; mx+=padY;
  const X=i=>pad.l+(gw*(i/(pts.length-1))), Y=v=>pad.t+gh-((v-mn)/(mx-mn))*gh;
  /* grade */
  c.strokeStyle=cssVar("--grid"); c.lineWidth=1; c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="right";
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Math.round(Y(v))+0.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke();
    c.fillText(fmtNum(v,1), pad.l-7, y+4); }
  /* linha */
  c.strokeStyle=opts.color||cssVar("--s1"); c.lineWidth=2; c.lineJoin="round"; c.lineCap="round";
  c.beginPath(); pts.forEach((p,i)=>{ const x=X(i),y=Y(p.y); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  /* marcas */
  c.fillStyle=opts.color||cssVar("--s1");
  pts.forEach((p,i)=>{ if(pts.length>40 && i%Math.ceil(pts.length/40)) return;
    c.beginPath(); c.arc(X(i),Y(p.y),4,0,7); c.fill();
    c.strokeStyle=cssVar("--surface"); c.lineWidth=2; c.stroke(); });
  /* rotulos de eixo x: primeiro, meio, ultimo */
  c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="center";
  [0,Math.floor((pts.length-1)/2),pts.length-1].forEach(i=>{ c.fillText(pts[i].label, Math.min(Math.max(X(i),24),w-24), h-8); });
  /* rotulos diretos do primeiro e ultimo valor */
  c.fillStyle=cssVar("--text"); c.font="700 12px sans-serif"; c.textAlign="left";
  c.fillText(fmtNum(pts[pts.length-1].y,1), Math.min(X(pts.length-1)+8,w-38), Y(pts[pts.length-1].y)-8);
  /* interacao */
  cv.onmousemove=e=>{
    const r=cv.getBoundingClientRect(), mxp=e.clientX-r.left;
    let idx=Math.round((mxp-pad.l)/gw*(pts.length-1)); idx=Math.max(0,Math.min(pts.length-1,idx));
    const tip=cv.parentNode.querySelector(".chtip");
    if(tip){ tip.style.display="block"; tip.style.left=Math.min(Math.max(X(idx),50),w-50)+"px";
      tip.textContent=pts[idx].label+" · "+fmtNum(pts[idx].y,1)+(opts.unit?(" "+opts.unit):""); }
  };
  cv.onmouseleave=()=>{ const tip=cv.parentNode.querySelector(".chtip"); if(tip) tip.style.display="none"; };
}
function barChart(cv, pts, opts){
  opts=opts||{}; if(!cv) return;
  const H=opts.height||170, {c,w,h}=setupCanvas(cv,H);
  const pad={l:34,r:10,t:22,b:26}, gw=w-pad.l-pad.r, gh=h-pad.t-pad.b;
  if(!pts.length){ c.fillStyle=cssVar("--text3"); c.font="13px sans-serif"; c.textAlign="center"; c.fillText(t("common.empty"), w/2, h/2); return; }
  const mx=Math.max(1,...pts.map(p=>p.y));
  c.strokeStyle=cssVar("--grid"); c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="right";
  for(let i=0;i<=3;i++){ const v=mx*i/3, y=Math.round(pad.t+gh-(v/mx)*gh)+0.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke(); c.fillText(fmtNum(v,0), pad.l-6, y+4); }
  const bw=Math.min(38, gw/pts.length - 6), step=gw/pts.length;
  pts.forEach((p,i)=>{
    const x=pad.l+step*i+(step-bw)/2, bh=Math.max(2,(p.y/mx)*gh), y=pad.t+gh-bh;
    c.fillStyle=opts.color||cssVar("--s1");
    c.beginPath();
    if(c.roundRect) c.roundRect(x,y,bw,bh,[4,4,0,0]); else c.rect(x,y,bw,bh);
    c.fill();
    c.fillStyle=cssVar("--text3"); c.font="11px sans-serif"; c.textAlign="center";
    c.fillText(p.label, x+bw/2, h-8);
    if(p.y>0){ c.fillStyle=cssVar("--text"); c.font="700 11px sans-serif"; c.fillText(String(p.y), x+bw/2, y-4); }
  });
}

SCREENS.progress_after = function(){
  if(typeof wireCards==="function") wireCards();
  const $=id=>document.getElementById(id);
  wireGuestBanner();
  if($("ck_d")) $("ck_d").onchange=()=>{
    const v=$("ck_d").value;
    if(v && v>todayISO()){ toast(t("pg.future")); $("ck_d").value=pgDia(); return; }
    PG_DIA=v||""; render();
  };
  if($("ck_hoje")) $("ck_hoje").onclick=()=>{ PG_DIA=""; render(); };
  document.querySelectorAll("[data-godia]").forEach(n=>n.onclick=()=>{
    PG_DIA=n.getAttribute("data-godia"); go("progress","hoje");
  });
  /* check-in */
  document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-mood]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });
  document.querySelectorAll("[data-mission]").forEach(n=>n.onclick=()=>{
    const c=ensureCi(pgDia()), id=n.getAttribute("data-mission"), i=c.done.indexOf(id);
    if(i>=0) c.done.splice(i,1); else c.done.push(id);
    n.classList.toggle("done"); save(); });
  if($("ck_s")) $("ck_s").onclick=()=>{
    const dia=pgDia(), c=ensureCi(dia);
    c.weight=num($("ck_w").value,null)||null;
    const mo=document.querySelector("[data-mood].on"); c.mood=mo?+mo.getAttribute("data-mood"):2;
    c.notes=$("ck_n").value;
    const gravou=save();
    render();
    if(gravou) toast(t("ck.saved")+" \u00b7 "+fmtDate(dia)); else precisaConta();
  };
  /* graficos */
  if($("cw")){
    const wpts=STATE.checkins.filter(x=>x.weight).sort((a,b)=>a.date<b.date?1:-1).slice(0,60).reverse().map(x=>({y:x.weight,label:fmtShort(x.date)}));
    lineChart($("cw"), wpts, {unit:"kg"});
    const weeks=[];
    for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-d.getDay()-i*7);
      const a=todayISO(d), e=new Date(d); e.setDate(e.getDate()+6); const b=todayISO(e);
      const n=STATE.checkins.filter(c=>c.date>=a&&c.date<=b).reduce((s,c)=>s+(c.done?c.done.length:0),0);
      weeks.push({y:n,label:fmtShort(a)}); }
    barChart($("cm"), weeks, {color:cssVar("--s3")});
    $("wtable").onclick=()=>{
      modal(mh(t("pg.weightChart"))+'<table class="tbl"><thead><tr><th>'+t("common.date")+'</th><th class="num">kg</th></tr></thead><tbody>'+
        wpts.slice().reverse().map(p=>"<tr><td>"+esc(p.label)+'</td><td class="num">'+fmtNum(p.y,1)+"</td></tr>").join("")+"</tbody></table>"); };
    if($("shprog")) $("shprog").onclick=shareProgress;
  }
  /* fotos */
  if($("addph")) $("addph").onclick=()=>{ if(precisaConta()) photoModal(); };
  if($("cmp")) $("cmp").onclick=compareModal;
  document.querySelectorAll("[data-delph]").forEach(b=>b.onclick=()=>confirmBox(t("common.confirmDel"),()=>{
    STATE.photos=STATE.photos.filter(p=>p.id!==b.getAttribute("data-delph")); save(); render(); }));
  /* medidas */
  if($("addms")) $("addms").onclick=()=>{ if(precisaConta()) measureModal(); };
  if($("scanmeas")) $("scanmeas").onclick=()=>{ SCANMODE="tape"; go("scan"); };
  document.querySelectorAll("[data-delms]").forEach(b=>b.onclick=()=>{
    STATE.measures=STATE.measures.filter(x=>x.id!==b.getAttribute("data-delms")); save(); render(); });
  /* exames */
  if($("addex2")) $("addex2").onclick=()=>{ if(precisaConta()) examModal(); };
  wireLaudoCard();
  if($("eximprimir")) $("eximprimir").onclick=()=>{ try{ window.print(); }catch(e){ toast(t("ex.printErr")); } };
  if($("eximp")) $("eximp").onchange=e=>{ const f=e.target.files[0]; if(f) exArquivo(f); e.target.value=""; };
  if($("exexp")) $("exexp").onclick=exExportar;
  if($("scanexam")) $("scanexam").onclick=()=>{ SCANMODE="exam"; go("scan"); };
  document.querySelectorAll("[data-delex]").forEach(b=>b.onclick=()=>{
    STATE.exams=STATE.exams.filter(x=>x.id!==b.getAttribute("data-delex")); save(); render(); });
  /* missoes e lembretes */
  if($("addmi")) $("addmi").onclick=missionModal;
  if($("addrm")) $("addrm").onclick=reminderModal;
  document.querySelectorAll("[data-delmi]").forEach(b=>b.onclick=()=>{
    STATE.missions=STATE.missions.filter(m=>m.id!==b.getAttribute("data-delmi")); save(); render(); });
  document.querySelectorAll("[data-delrm]").forEach(b=>b.onclick=()=>{
    STATE.reminders=STATE.reminders.filter(r=>r.id!==b.getAttribute("data-delrm")); save(); render(); });
  document.querySelectorAll("[data-rmon]").forEach(b=>b.onchange=()=>{
    const r=STATE.reminders.find(x=>x.id===b.getAttribute("data-rmon")); if(r){ r.on=b.checked; save(); } });
  if($("notifbtn")) $("notifbtn").onclick=()=>{
    if(!("Notification" in window)){ toast(t("nt.unsupported")); return; }
    Notification.requestPermission().then(p=>{ const nc=notifCfg(); nc.on=(p==="granted"); save(); toast(p==="granted"?t("common.ok"):t("nt.denied")); });
  };
};

function compareModal(){
  if(STATE.photos.length<2){ toast(t("common.empty")); return; }
  const ps=STATE.photos.slice().sort((a,b)=>a.date<b.date?-1:1);
  const opt=ps.map((p,i)=>'<option value="'+i+'">'+fmtDate(p.date)+" · "+t("pg."+(p.tag||"front"))+"</option>").join("");
  const m=modal(mh(t("pg.compare"))+
    '<div class="grid g2"><label class="fld"><span>A</span><select id="cpa">'+opt+'</select></label><label class="fld"><span>B</span><select id="cpb">'+opt+"</select></label></div>"+
    '<div class="grid g2" id="cpimg"></div>',{wide:true});
  const a=m.querySelector("#cpa"), b=m.querySelector("#cpb"); b.value=String(ps.length-1);

      const p=ps[+i]; return '<div class="photo"><img src="'+p.src+'" style="height:300px"><div class="pd">'+fmtDate(p.date)+"</div></div>"; }).join(""); };
  a.onchange=paint; b.onchange=paint; paint();

/* motor de lembretes (roda com o app aberto) */
let lastRemMin="";
setInterval(function(){
  if(!STATE) return;
  const d=new Date(), hh=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(hh===lastRemMin) return; lastRemMin=hh;
  (STATE.reminders||[]).forEach(r=>{

let SCANMODE="label", SCANIMG=null, SCANTEXT="", SCANFOUND=null;
const OCR_CDN=["https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js",
               "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"];
function loadTesseract(cb){
  if(window.Tesseract){ cb(true); return; }
  let i=0;
  const tryNext=()=>{
    if(i>=OCR_CDN.length){ cb(false); return; }
    const s=document.createElement("script");
    s.src=OCR_CDN[i++]; s.async=true;
    s.onload=()=>cb(!!window.Tesseract);
    s.onerror=tryNext;
    document.head.appendChild(s);
  };
  tryNext();
}
function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function firstNum(s){ const m=String(s).match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(",",".")):null; }
function grab(txt, res){ for(const r of res){ const m=txt.match(r); if(m){ const v=parseFloat(String(m[1]).replace(",",".")); if(!isNaN(v)) return v; } } return null; }

function parseLabel(raw){
  const x=norm(raw).replace(/ /g," ");
  const o={};
  o.portion = grab(x,[/por[cç]?ao[^\d]{0,24}(\d+(?:[.,]\d+)?)\s*(?:g|ml)/, /serving size[^\d]{0,24}(\d+(?:[.,]\d+)?)/]);
  o.kcal = grab(x,[/valor energetico[^\d]{0,40}(\d+(?:[.,]\d+)?)\s*kcal/, /(\d+(?:[.,]\d+)?)\s*kcal/, /calorie[s]?[^\d]{0,24}(\d+(?:[.,]\d+)?)/]);
  o.prot = grab(x,[/proteina[s]?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /protein[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.carb = grab(x,[/carboidrato[s]?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /carbohydrate[s]?[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.fat  = grab(x,[/gorduras? totai?s?[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /total fat[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /gordura[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.fiber= grab(x,[/fibra[s]? alimentar[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /fiber[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  o.sodium=grab(x,[/sodio[^\d]{0,30}(\d+(?:[.,]\d+)?)/, /sodium[^\d]{0,30}(\d+(?:[.,]\d+)?)/]);
  return (o.kcal||o.prot||o.carb||o.fat)?o:null;
}
function parseScale(raw){
  const lines=norm(raw).split(/\n+/); const o={};
  lines.forEach(l=>{
    const n=firstNum(l); if(n===null) return;
    if(/%|gordura|fat/.test(l) && n>3 && n<70 && o.fat===undefined) o.fat=n;
    else if(/(massa|muscle|musculo|lean)/.test(l) && o.muscle===undefined) o.muscle=n;
    else if(/(kg|peso|weight)/.test(l) && n>20 && n<350 && o.weight===undefined) o.weight=n;
  });
  if(o.weight===undefined){ const all=(norm(raw).match(/\d+(?:[.,]\d+)?/g)||[]).map(v=>parseFloat(v.replace(",",".")));
    const cand=all.filter(v=>v>=30&&v<=250); if(cand.length) o.weight=cand[0]; }
  return (o.weight!==undefined||o.fat!==undefined)?o:null;
}
const TAPEKEYS=[["waist",["cintura","waist"]],["hip",["quadril","hip"]],["chest",["peito","torax","chest"]],
  ["arm",["braco","biceps","arm"]],["thigh",["coxa","thigh"]],["calf",["panturrilha","calf"]],
  ["weight",["peso","weight"]],["fat",["gordura","fat"]]];
function parseTape(raw){
  const x=norm(raw); const o={}; let any=false;
  TAPEKEYS.forEach(([k,words])=>{
    for(const w of words){ const m=x.match(new RegExp(w+"[^\\d]{0,18}(\\d+(?:[.,]\\d+)?)")); if(m){ o[k]=parseFloat(m[1].replace(",",".")); any=true; break; } }
  });
  return any?o:null;
}
function parseSheet(raw){
  const lines=String(raw).split(/\n+/).map(l=>l.trim()).filter(l=>l.length>3);
  const found=[];
  lines.forEach(l=>{
    const nl=norm(l);
    let best=null,bestScore=0;
    allEx().forEach(x=>{
      [norm(x.pt),norm(x.en)].forEach(nm=>{
        if(!nm) return;
        const words=nm.split(/\s+/).filter(w=>w.length>3);
        if(!words.length) return;
        const hit=words.filter(w=>nl.indexOf(w)>=0).length/words.length;
        if(hit>bestScore){ bestScore=hit; best=x; }
      });
    });
    if(best && bestScore>=0.5){
      const sr=l.match(/(\d+)\s*[xX×]\s*(\d+)/);
      const kg=l.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|quilos?)/i);
      found.push({exId:best.id, name:exName(best), sets:sr?+sr[1]:3, reps:sr?String(sr[2]):"12", load:kg?parseFloat(kg[1].replace(",",".")):0, line:l});
    }
  });
  return found.length?found:null;
}
function parseExam(raw){
  const lines=String(raw).split(/\n+/).map(l=>l.trim()).filter(l=>/\d/.test(l)&&l.length>4);
  const out=[];
  lines.forEach(l=>{
    const m=l.match(/^([A-Za-zÀ-ÿ\s\.\-\/()]{3,40}?)[\s:.\-]+(\d+(?:[.,]\d+)?)\s*([A-Za-z%\/µ]{0,12})/);
    if(m) out.push({name:m[1].trim(), value:m[2].replace(",","."), unit:(m[3]||"").trim(), ref:""});
  });
  return out.length?out.slice(0,25):null;
}

/* ---- pré-processamento do OCR (vindo do leitor-OCR de testes): endireitar, recortar o papel, ampliar e limpar ----
   Por que: o motor lê muito melhor texto reto, grande e preto no branco. A foto de rótulo ou laudo quase nunca vem assim. */
function ocrGrayOf(img, maxDim){
  const w0=img.naturalWidth||img.width, h0=img.naturalHeight||img.height;
  const k=Math.min(1, maxDim/Math.max(w0,h0));
  const w=Math.max(1,Math.round(w0*k)), h=Math.max(1,Math.round(h0*k));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const cx=c.getContext("2d"); cx.drawImage(img,0,0,w,h);
  const d=cx.getImageData(0,0,w,h).data, g=new Float32Array(w*h);
  for(let i=0;i<g.length;i++) g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  return {w,h,g};
}
function ocrIntegral(g,w,h){
  const integ=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row+=g[y*w+x]; integ[(y+1)*(w+1)+x+1]=integ[y*(w+1)+x+1]+row; } }
  return integ;
}
/* quanto a foto está inclinada: as linhas de texto formam faixas escuras; o ângulo em que elas ficam mais nítidas é o certo (só até ±30°) */
function ocrEstimateAngle(img){
  const {w,h,g}=ocrGrayOf(img,360);
  const integ=ocrIntegral(g,w,h), r=Math.max(6,Math.round(w/12)), ink=new Uint8Array(w*h);
  for(let y=0;y<h;y++){ const ya=Math.max(0,y-r), yb=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){ const xa=Math.max(0,x-r), xb=Math.min(w,x+r+1), area=(xb-xa)*(yb-ya);
      const sum=integ[yb*(w+1)+xb]-integ[ya*(w+1)+xb]-integ[yb*(w+1)+xa]+integ[ya*(w+1)+xa];
      ink[y*w+x]= g[y*w+x]*area < sum*0.9 ? 1 : 0; } }
  const cx=w/2, cy=h/2, diag=Math.ceil(Math.sqrt(w*w+h*h));
  let best=0, bestScore=-1;
  for(let a=-30;a<=30;a+=2){
    const ar=a*Math.PI/180, sa=Math.sin(ar), ca=Math.cos(ar), prof=new Float32Array(diag+2);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      if(!ink[y*w+x]) continue;
      const yy=-(x-cx)*sa+(y-cy)*ca+diag/2, y0=Math.floor(yy);
      if(y0<0||y0>=diag) continue;
      const f=yy-y0; prof[y0]+=1-f; prof[y0+1]+=f;
    }
    let sc=0; for(let i=1;i<=diag;i++){ const dv=prof[i]-prof[i-1]; sc+=dv*dv; }
    if(sc>bestScore){ bestScore=sc; best=a; }
  }
  return best;
}
/* monta a imagem que vai para o motor: girada, (opcionalmente) recortada no papel, ampliada e em preto no branco */
function ocrCanvas(img, rotation, opts){
  opts=opts||{};
  const MAX_SRC=3000;
  let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  const s=Math.min(1, MAX_SRC/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const rad=rotation*Math.PI/180, cos=Math.abs(Math.cos(rad)), sin=Math.abs(Math.sin(rad));
  const src=document.createElement("canvas"); src.width=Math.round(w*cos+h*sin); src.height=Math.round(w*sin+h*cos);
  const sctx=src.getContext("2d"); sctx.fillStyle="#808080"; sctx.fillRect(0,0,src.width,src.height);
  sctx.translate(src.width/2,src.height/2); sctx.rotate(rad); sctx.drawImage(img,-w/2,-h/2,w,h);
  let cx=0, cy=0, cw=src.width, ch=src.height;
  if(opts.crop){
    /* acha o papel: a maior mancha clara numa cópia pequena da foto */
    const {w:sw,h:sh,g:gray}=ocrGrayOf(src,300), k=sw/src.width;
    const otsu=from=>{ const hist=new Array(256).fill(0); let n=0;
      for(let i=0;i<gray.length;i++){ const v=gray[i]|0; if(v>=from){ hist[v]++; n++; } }
      let sum=0; for(let t2=0;t2<256;t2++) sum+=t2*hist[t2];
      let sumB=0,wB=0,best=0,thr=from;
      for(let t2=0;t2<256;t2++){ wB+=hist[t2]; if(!wB||wB===n) continue; sumB+=t2*hist[t2];
        const mB=sumB/wB, mF=(sum-sumB)/(n-wB), bt=wB*(n-wB)*(mB-mF)*(mB-mF); if(bt>best){ best=bt; thr=t2; } }
      return thr; };
    const largest=thr=>{ const seen=new Uint8Array(sw*sh); let bestBox=null,bestArea=0; const stack=[];
      for(let st=0;st<gray.length;st++){ if(seen[st]||gray[st]<=thr) continue;
        let area=0,x0=sw,y0=sh,x1=0,y1=0; seen[st]=1; stack.push(st);
        while(stack.length){ const q=stack.pop(), x=q%sw, y=(q-x)/sw; area++;
          if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
          const nb=[x>0?q-1:-1, x<sw-1?q+1:-1, y>0?q-sw:-1, y<sh-1?q+sw:-1];
          for(const z of nb){ if(z>=0&&!seen[z]&&gray[z]>thr){ seen[z]=1; stack.push(z); } } }
        if(area>bestArea){ bestArea=area; bestBox={x0,y0,x1,y1}; } }
      return {box:bestBox, frac:bestArea/(sw*sh)}; };
    let blob=largest(otsu(0));
    for(let i=0;i<3 && blob.frac>0.6;i++) blob=largest(otsu(otsu(0)+1+i*8));
    if(blob.box && blob.frac>0.15 && blob.frac<0.9){
      const pad=0.02*Math.max(sw,sh);
      const bx0=Math.max(0,blob.box.x0-pad), by0=Math.max(0,blob.box.y0-pad), bx1=Math.min(sw,blob.box.x1+1+pad), by1=Math.min(sh,blob.box.y1+1+pad);
      cx=Math.round(bx0/k); cy=Math.round(by0/k); cw=Math.round((bx1-bx0)/k); ch=Math.round((by1-by0)/k);
    }
  }
  const scale=Math.max(0.5, Math.min(3, (opts.targetW||1600)/cw));
  const out=document.createElement("canvas"); out.width=Math.round(cw*scale); out.height=Math.round(ch*scale);
  const octx=out.getContext("2d"); octx.imageSmoothingEnabled=true; octx.imageSmoothingQuality="high";
  octx.drawImage(src,cx,cy,cw,ch,0,0,out.width,out.height);
  const od=octx.getImageData(0,0,out.width,out.height), d=od.data, W=out.width, H=out.height, g=new Float32Array(W*H);
  for(let i=0;i<g.length;i++) g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  if(opts.binarize){
    /* limiar local: aguenta sombra, brilho e impressão fraca */
    const integ=ocrIntegral(g,W,H), r=Math.max(8,Math.round(W/32)), T=0.15;
    for(let y=0;y<H;y++){ const ya=Math.max(0,y-r), yb=Math.min(H,y+r+1);
      for(let x=0;x<W;x++){ const xa=Math.max(0,x-r), xb=Math.min(W,x+r+1), area=(xb-xa)*(yb-ya);
        const sum=integ[yb*(W+1)+xb]-integ[ya*(W+1)+xb]-integ[yb*(W+1)+xa]+integ[ya*(W+1)+xa];
        g[y*W+x]= g[y*W+x]*area < sum*(1-T) ? 0 : 255; } }
  } else {
    /* só reforça o contraste, mantendo os tons (bom para rótulo colorido) */
    for(let i=0;i<g.length;i++) g[i]=Math.min(255,Math.max(0,(g[i]-128)*1.5+128));
  }
  for(let i=0;i<g.length;i++) d[i*4]=d[i*4+1]=d[i*4+2]=g[i];
  octx.putImageData(od,0,0);
  return out;
}
/* a leitura "deu certo" quando o leitor do modo atual encontra alguma coisa nela */
function ocrParsedOk(text){
  if(!text || text.trim().length<8) return false;
  try{
    if(SCANMODE==="label"){ const o=parseRotulo(text); return !!(o && (o.kcal!=null||o.ings.length>2)); }
    if(SCANMODE==="exam"){ const e=parseExame(text); if(e && e.length>=3) return true; return !!parseLaudo(text); }
    if(SCANMODE==="scale"){ return !!parseScale(text); }
    if(SCANMODE==="tape"){ return !!parseTape(text); }
    if(SCANMODE==="sheet"){ const e=parseSheet(text); return !!(e && e.length); }
    if(SCANMODE==="card"){ return !!parseCarteirinha(text); }
  }catch(e){}
  return text.trim().length>20;
}
let OCR_WORKER=null, OCR_LANG="", SCANROT=0;
function ocrWorker(lg, logger){
  if(OCR_WORKER && OCR_LANG===lg) return Promise.resolve(OCR_WORKER);
  const old=OCR_WORKER; OCR_WORKER=null;
  if(old) try{ old.terminate(); }catch(e){}
  return window.Tesseract.createWorker(lg, 1, {logger}).then(w=>{ OCR_WORKER=w; OCR_LANG=lg; return w; });
}
function runOCR(dataUrl, rot){
  SCANIMG=dataUrl; SCANTEXT=""; SCANFOUND=null; SCANROT=rot||0;
  const out=document.getElementById("scanout");
  out.innerHTML='<div class="card"><img id="ocrimg" src="'+dataUrl+'" style="width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:var(--surface2);transform:rotate('+SCANROT+'deg)">'+
    '<div class="row" style="margin-top:8px"><button class="btn xs line" id="ocrrotl">↺ '+t("sc.rotate")+'</button><button class="btn xs line" id="ocrrotr">↻ '+t("sc.rotate")+"</button></div>"+
    '<div class="sep"></div><p id="ocrst">⏳ '+t("sc.loadingEngine")+'</p><div class="bar"><i id="ocrbar" style="width:6%"></i></div></div>';
  out.querySelector("#ocrrotl").onclick=()=>runOCR(dataUrl, (SCANROT+270)%360);
  out.querySelector("#ocrrotr").onclick=()=>runOCR(dataUrl, (SCANROT+90)%360);
  const st=msg=>{ const n=document.getElementById("ocrst"); if(n) n.textContent=msg; };
  const bar=p=>{ const b=document.getElementById("ocrbar"); if(b) b.style.width=Math.max(6,Math.min(100,Math.round(p)))+"%"; };
  const meu=SCANIMG+":"+SCANROT;   /* se a pessoa girou ou trocou a foto no meio, o resultado velho é descartado */
  loadTesseract(ok=>{
    if(!ok){ st("⚠ "+t("sc.engineFail")); manualFallback(); return; }
    const lg = LANG==="pt" ? "por" : "eng";
    const im=new Image();
    im.onload=()=>{
      st("⏳ "+t("sc.prep"));
      let tilt=0; try{ tilt=ocrEstimateAngle(im); }catch(e){}
      const base=SCANROT+tilt;
      /* três jeitos, parando no primeiro que o leitor do modo entende bem: reto e com contraste; reto, recortado e preto no branco; em bloco único */
      const passes=[[base,{crop:false,binarize:false,targetW:1600},"3"],[base,{crop:true,binarize:true,targetW:1600},"6"],[base,{crop:false,binarize:true,targetW:1400},"4"]];
      let i=0, best=null;
      const logger=m=>{ if(m.status==="recognizing text" && m.progress) bar(((i+m.progress)/passes.length)*100); };
      ocrWorker(lg, logger).then(w=>{
        const next=()=>{
          if(SCANIMG+":"+SCANROT!==meu) return;
          if(i>=passes.length || (best && best.ok && best.conf>=78)){
            SCANTEXT=best? best.text : ""; bar(100); paintScan();
            const o2=document.getElementById("scanout");
            if(o2 && best){ const c=document.createElement("p"); c.className="tiny muted"; c.textContent=t("sc.conf").replace("{a}",Math.round(best.conf))+(best.conf<55?" · "+t("sc.confLow"):""); o2.prepend(c); }
            return;
          }
          const [rot,opts,psm]=passes[i];
          st("⏳ "+t("sc.pass").replace("{a}",i+1).replace("{b}",passes.length));
          let cv; try{ cv=ocrCanvas(im, rot, opts); }catch(e){ cv=im; }
          w.setParameters({tessedit_pageseg_mode:psm, preserve_interword_spaces:"1"}).then(()=>w.recognize(cv)).then(r=>{
            const text=(r&&r.data&&r.data.text)||"", conf=(r&&r.data&&r.data.confidence)||0, ok=ocrParsedOk(text);
            const score=conf+(ok?25:0);
            if(!best || score>best.score) best={text,conf,ok,score};
            i++; next();
          }).catch(()=>{ i++; next(); });
        };
        next();
      }).catch(()=>{ st("⚠ "+t("sc.engineFail")); manualFallback(); });
    };
    im.onerror=()=>{ st("⚠ "+t("sc.engineFail")); manualFallback(); };
    im.src=dataUrl;
  });
}

function paintScan(){
  const out=document.getElementById("scanout");

  else if(SCANMODE==="card") parsed=parseCarteirinha(SCANTEXT);
  else if(SCANMODE==="scale") parsed=parseScale(SCANTEXT);

  else if(SCANMODE==="sheet") parsed=parseSheet(SCANTEXT);

  SCANFOUND=parsed;
  if(SCANMODE==="label" && parsed){
    body='<div class="row"><button class="btn line sm" id="lblsave">'+I("book")+t("nu.saveFood")+"</button></div>";

      '<label class="fld"><span>'+t("pl.prod")+'</span><input id="cd_p" type="text" value="'+esc(parsed.produto||"")+'"></label></div>'+
      '<div class="grid g2 collapse"><label class="fld"><span>'+t("pl.num")+'</span><input id="cd_n" type="text" inputmode="numeric" value="'+esc(parsed.numero||"")+'"></label>'+
      '<label class="fld"><span>'+t("pl.valid")+'</span><input id="cd_v" type="text" value="'+esc(parsed.validade||"")+'"></label></div>'+
      '<label class="fld"><span>'+t("pl.holder")+'</span><input id="cd_t" type="text" value="'+esc(parsed.titular||"")+'"></label>'+
      '<p class="tiny muted">'+t("pl.checkNote")+"</p>";
  } else if((SCANMODE==="scale"||SCANMODE==="tape") && parsed){
    body='<div class="grid g4">'+Object.keys(parsed).map(k=>stat(scLabel(k), fmtNum(parsed[k],1), k==="fat"?"%":(k==="weight"?"kg":"cm"),"")).join("")+"</div>";
  } else if(SCANMODE==="sheet" && parsed){
    body='<table class="tbl"><thead><tr><th>'+t("ex.title")+'</th><th class="num">'+t("wk.sets")+'</th><th class="num">'+t("wk.reps")+'</th><th class="num">'+t("wk.load")+"</th></tr></thead><tbody>"+
      parsed.map(p=>"<tr><td>"+esc(p.name)+'</td><td class="num">'+p.sets+'</td><td class="num">'+esc(p.reps)+'</td><td class="num">'+(p.load?fmtNum(p.load,1)+" kg":"—")+"</td></tr>").join("")+"</tbody></table>";
  } else if(SCANMODE==="exam" && parsed){
    body='<table class="tbl"><thead><tr><th>'+t("pg.examName")+'</th><th class="num">'+t("pg.value")+"</th><th>"+t("pg.unit")+"</th><th>"+t("pg.ref")+"</th></tr></thead><tbody>"+
      parsed.map(p=>"<tr><td>"+esc(p.name)+(p.ind?' <span class="pill xs ok">'+t("pg.known")+"</span>":"")+'</td><td class="num">'+esc(p.value)+"</td><td>"+esc(p.unit)+"</td><td>"+esc(p.ref||"—")+"</td></tr>").join("")+"</tbody></table>"+
      '<p class="tiny muted">'+t("pg.refNote")+"</p>";
  } else if(SCANMODE==="free"){ body='<div class="ocrbox">'+esc(SCANTEXT||"")+"</div>"; }
  else body='<p class="muted">'+t("sc.nothing")+"</p>";
  out.innerHTML=((SCANMODE==="label"&&parsed)? rotuloCard(parsed) : "")+
    '<div class="card">'+cardHead("search", t("sc.found"), "")+body+
    (parsed&&SCANMODE!=="free"?'<div class="sep"></div><div class="row"><button class="btn" id="scok">'+t("sc.confirm")+'</button><button class="btn line" id="scman">'+t("common.edit")+"</button></div>":

  const ok=out.querySelector("#scok"); if(ok) ok.onclick=commitScan;
  out.querySelector("#scman").onclick=()=>manualFor(SCANMODE, prefillFrom(parsed));
  const ls=out.querySelector("#lblsave"); if(ls) ls.onclick=()=>foodEditModal(foodFromLabel(parsed));

function scLabel(k){ return {waist:t("pg.waist"),hip:t("pg.hip"),chest:t("pg.chest"),arm:t("pg.arm"),thigh:t("pg.thigh"),
  calf:t("pg.calf"),weight:t("home.weight"),fat:t("pg.fat"),muscle:(LANG==="pt"?"Massa magra":"Lean mass")}[k]||k; }
function prefillFrom(p){
  if(!p) return {};
  if(SCANMODE==="label") return {kcal:p.kcal,prot:p.prot,carb:p.carb,fat:p.fat,qty:p.portion||100};
  if(SCANMODE==="scale"||SCANMODE==="tape") return p;
  if(SCANMODE==="exam") return p[0]||{};
  return {};
}
function commitScan(){
  const p=SCANFOUND; if(!p) return;
  if(SCANMODE==="card"){
    const q=id=>{ const n=document.getElementById(id); return n? n.value.trim() : ""; };
    cardSave({operadora:q("cd_o"), produto:q("cd_p"), numero:q("cd_n").replace(/[^0-9]/g,""), validade:q("cd_v"), titular:q("cd_t"), ans:p.ans}, SCANIMG);
    toast(t("common.saved")); go("progress","exames"); return;
  }
  if(SCANMODE==="label"){ mealModal({kcal:p.kcal||0,prot:p.prot||0,carb:p.carb||0,fat:p.fat||0,qty:p.portion||100}); return; }
  if(SCANMODE==="scale"||SCANMODE==="tape"){ measureModal(p); return; }
  if(SCANMODE==="exam"){
    if(typeof precisaConta==="function" && !precisaConta()) return;
    if(p.tipo==="laudo"){
      const q=id=>{ const n=document.getElementById(id); return n? n.value.trim() : ""; };
      laudoSave({data:q("sl_d")||p.data, titulo:q("sl_t")||p.titulo, texto:p.texto});
      save(); toast(t("common.saved")); go("progress","exames"); return;
    }
    /* a data e a faixa saem do proprio laudo, nao do relogio do aparelho */
    const dia=exData(SCANTEXT)||todayISO();
    p.forEach(e=>STATE.exams.push({id:uid(),date:dia,name:e.name,value:e.value,unit:e.unit,ref:e.ref||""}));
    save(); toast(t("common.saved")); go("progress","exames"); return;
  }
  if(SCANMODE==="sheet"){
    const w={id:uid(), name:(LANG==="pt"?"Treino da ficha ":"Sheet workout ")+fmtShort(todayISO()), days:[],
      items:p.map(i=>({exId:i.exId,sets:i.sets,reps:i.reps,load:i.load,rest:60}))};
    STATE.workouts.push(w); save(); toast(t("common.saved")); go("workout"); return;
  }
}

function cloudConnect(provider, clientId){
  /* Arquitetura pronta: com o Client ID informado, o fluxo OAuth do provedor e aberto.
     Sem Client ID, o app segue funcionando com backup em arquivo. */
  if(provider==="gdrive"){
    const redirect=location.origin+location.pathname;
    const url="https://accounts.google.com/o/oauth2/v2/auth?client_id="+encodeURIComponent(clientId)+
      "&redirect_uri="+encodeURIComponent(redirect)+"&response_type=token&scope="+
      encodeURIComponent("https://www.googleapis.com/auth/drive.file")+"&prompt=consent";
    window.open(url,"_blank","noopener");
    toast(LANG==="pt"?"Autorize na janela do Google e volte ao app.":"Authorise in the Google window and return to the app.");
  } else if(provider==="onedrive"){
    const redirect=location.origin+location.pathname;
    const url="https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id="+encodeURIComponent(clientId)+
      "&response_type=token&redirect_uri="+encodeURIComponent(redirect)+"&scope="+encodeURIComponent("Files.ReadWrite offline_access");
    window.open(url,"_blank","noopener");
    toast(LANG==="pt"?"Autorize na janela da Microsoft e volte ao app.":"Authorise in the Microsoft window and return to the app.");
  } else toast(t("st.cloudPending"));
}
function cloudCaptureToken(){
  const h=location.hash||"";
  if(h.indexOf("access_token=")>=0){
    const tk=new URLSearchParams(h.slice(1)).get("access_token");
    if(tk){ sessionStorage.setItem("riseone.cloudtoken",tk);
      if(STATE){ STATE.settings.cloud.connected=true; save(); }
      history.replaceState(null,"",location.pathname+location.search);
      toast(LANG==="pt"?"Nuvem conectada nesta sessão.":"Cloud connected for this session."); }
  }
}
function backupBlob(){
  const data={app:"RiseONE", version:APP_VERSION, exported:new Date().toISOString(), state:STATE};
  return new Blob([JSON.stringify(data)],{type:"application/json"});
}
function exportBackup(){
  if(!canUse("cloud")) return gotItLocked("cloud");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(backupBlob());
  a.download="riseone-backup-"+todayISO()+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(t("common.saved"));
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      const st=d.state||d; if(!st.profile) throw 0;
      STATE=Object.assign(defaultState(), st); save(); boot(); toast(t("common.saved"));
    }catch(e){ toast(t("tr.badCode")); } };
  r.readAsText(file);
}
function shareApp(){
  const url=location.href.split("#")[0];
  const data={title:"RiseONE", text:t("share.text"), url};
  if(navigator.share) navigator.share(data).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(t("share.text")+" "+url).then(()=>toast(t("share.copied")));
  else window.open("https://wa.me/?text="+encodeURIComponent(t("share.text")+" "+url),"_blank","noopener");
}

/* texto <-> base64 usando TextEncoder/TextDecoder (sem escape/unescape, que são obsoletos) */
function textoParaB64(txt){
  const bytes=new TextEncoder().encode(txt);
  let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ParaTexto(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function makeCode(workouts){
  const payload={v:1, w:(workouts||[]).filter(Boolean).map(w=>({name:w.name,days:w.days,items:w.items})), d:STATE.diet};
  return "RISE1:"+textoParaB64(JSON.stringify(payload));
}

  try{

/* ---------- 31. LOGIN, CONTA E RECUPERACAO ---------- */
/* Senha guardada com PBKDF2 (WebCrypto) e salto aleatório. Contas criadas nas versões antigas (hash simples)
   continuam entrando e são atualizadas para PBKDF2 no primeiro login. Sem WebCrypto (navegador muito antigo), cai no hash simples. */
function hexOf(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
function cryptoOK(){ return !!(window.crypto && crypto.subtle && crypto.getRandomValues); }
function makeHash(secret){
  if(!cryptoOK()) return Promise.resolve(hashPass(secret));
  const salt=crypto.getRandomValues(new Uint8Array(16));
  return crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"])
    .then(k=>crypto.subtle.deriveBits({name:"PBKDF2", salt:salt, iterations:120000, hash:"SHA-256"}, k, 256))
    .then(bits=>"pbkdf2$"+hexOf(salt)+"$"+hexOf(bits)).catch(()=>hashPass(secret));
}
function checkHash(secret, stored){
  if(!stored) return Promise.resolve(false);
  if(String(stored).indexOf("pbkdf2$")!==0) return Promise.resolve(hashPass(secret)===stored);
  if(!cryptoOK()) return Promise.resolve(false);
  const parts=stored.split("$"), salt=new Uint8Array((parts[1].match(/../g)||[]).map(h=>parseInt(h,16)));
  return crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"])
    .then(k=>crypto.subtle.deriveBits({name:"PBKDF2", salt:salt, iterations:120000, hash:"SHA-256"}, k, 256))
    .then(bits=>hexOf(bits)===parts[2]).catch(()=>false);
}
function makeRecovery(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const blk=()=>Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join("");
  return "RISE-"+blk()+"-"+blk();
}
