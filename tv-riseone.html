<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiseONE na TV</title>
<style>
:root{--bg:#0e1014;--sf:#15181e;--sf2:#1b1f26;--bd:rgba(255,255,255,.1);
 --tx:#f3f5f8;--tx2:#aab2bf;--tx3:#7a8493;--ac:#ff7a2f;--eq-machine:#5aa9ff; --eq-machine-dk:#3f7fc4; --eq-machine-edge:#1d4f86; --eq-weight-edge:#7d8796;--eq-weight:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);overflow:hidden;
 font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:3vh 4vw;gap:2vh}
header{display:flex;align-items:baseline;gap:1.5vw}
.marca{font-weight:900;font-size:2.4vh;letter-spacing:.02em}
.marca span{color:var(--ac)}
h1{margin:0;font-size:6.4vh;line-height:1.05;font-weight:900}
.sub{color:var(--tx2);font-size:2.8vh;margin-top:.4vh}
.palco{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vw;min-height:0}
.palco.um{grid-template-columns:1fr;max-width:52vh;margin:0 auto}
figure{margin:0;background:var(--sf);border:1px solid var(--bd);border-radius:2vh;
 padding:2vh;display:flex;flex-direction:column;min-height:0}
figure svg{flex:1;width:100%;height:100%;min-height:0}
figcaption{text-align:center;color:var(--ac);font-size:2.2vh;font-weight:800;
 text-transform:uppercase;letter-spacing:.06em;margin-top:1vh}
.dica{color:var(--tx2);font-size:2.6vh;text-align:center;margin:0}
.relogio{flex:1;display:flex;align-items:center;justify-content:center;
 font-size:34vh;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.relogio.pouco{color:var(--ac)}
.espera{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:2vh;color:var(--tx3);text-align:center}
.espera b{color:var(--tx);font-size:4vh}
.logo{width:14vh;height:14vh}
/* mesmo traço do app: pessoa laranja, aparelho azul, peso branco */
svg .aout line{stroke:#a8430c;fill:none}
svg .abody line{stroke:var(--ac);fill:none}
svg .phb{fill:#a8430c}
svg .ph{fill:var(--ac)}
svg .ashoe line{stroke:#8fa0b6}
svg .asom{fill:#000;opacity:.3}
svg .pl{fill:none;stroke:var(--ac);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
svg .aeq{stroke:var(--eq-weight);stroke-width:4.2;stroke-linecap:round;fill:none}
svg .aeqp{stroke:var(--eq-weight);stroke-width:5.4;stroke-linecap:round;fill:none}
svg .aeqb{stroke:var(--eq-machine);stroke-width:3.4;fill:none;stroke-linecap:round}
svg .aeqc{stroke:var(--eq-machine);stroke-width:1.8;stroke-dasharray:3 3;fill:none}
svg .aeqf{fill:var(--eq-machine);stroke:var(--eq-machine-edge);stroke-width:1.2;stroke-linejoin:round}
svg .aeqfb{fill:var(--eq-machine-dk);stroke:var(--eq-machine-edge);stroke-width:1.2;stroke-linejoin:round}
svg .aeqo{fill:none;stroke:var(--eq-machine);stroke-width:3}
svg .aeqw{fill:var(--eq-weight);stroke:var(--eq-weight-edge);stroke-width:1.2;stroke-linejoin:round}
svg .aeqwd{fill:var(--eq-weight-edge);stroke:none}
svg .agr{stroke:var(--tx3);stroke-width:2.5;stroke-linecap:round;opacity:.45}
svg .aar{fill:none;stroke:#ffb020;stroke-width:2.6;stroke-linecap:round}
svg .aarh{fill:#ffb020;stroke:none}
svg .pg{fill:none;stroke:var(--tx3);stroke-width:2.5;opacity:.5}
</style>
</head>
<body>
<div id="app">
  <header><span class="marca">Rise<span>ONE</span></span><span class="sub" id="modo"></span></header>
  <div id="corpo"></div>
</div>
<script>
/* Esta pagina e aberta PELA TV (Chromecast / Google TV). Ela nao faz nada sozinha:
   fica esperando o celular mandar o que mostrar. Sem celular, mostra o aviso de espera. */
var CORPO=document.getElementById("corpo"), MODO=document.getElementById("modo");
var T={pt:{espera:"Esperando o celular",esperaS:"Abra um exercicio ou o cronometro no RiseONE.",descanso:"Descanso"},
       en:{espera:"Waiting for the phone",esperaS:"Open an exercise or the timer in RiseONE.",descanso:"Rest"}};
var LG="pt";
function tt(k){ return (T[LG]||T.pt)[k]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function espera(){
  CORPO.className=""; MODO.textContent="";
  CORPO.innerHTML='<div class="espera"><svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1b1f26"/>'+
    '<path d="M14 46 L24 26 L32 38 L40 16 L50 46" fill="none" stroke="#ff7a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '<b>'+tt("espera")+'</b><span>'+tt("esperaS")+'</span></div>';
  CORPO.style.flex="1"; CORPO.style.display="flex";
}
function figuras(d){
  var duas = d.frente && d.lado;
  var f=function(svg,cap){ return '<figure>'+svg+'<figcaption>'+cap+'</figcaption></figure>'; };
  var capF = LG==="pt"?"De frente":"Front view", capL = LG==="pt"?"De lado":"Side view";
  var inner = duas ? (f(d.frente,capF)+f(d.lado,capL)) : f(d.frente||d.lado||"", d.frente?capF:capL);
  return '<div class="palco'+(duas?"":" um")+'">'+inner+'</div>';
}
function mostra(d){
  LG = d.lang==="en" ? "en" : "pt";
  CORPO.style.display=""; CORPO.style.flex="";
  if(d.tipo==="espera"){ espera(); return; }
  if(d.tipo==="relogio"){
    CORPO.className=""; MODO.textContent=d.nome||tt("descanso");
    var m=Math.floor(d.seg/60), s=d.seg%60;
    CORPO.innerHTML='<div class="relogio'+(d.seg<=10?" pouco":"")+'">'+m+":"+(s<10?"0":"")+s+'</div>';
    CORPO.style.flex="1"; CORPO.style.display="flex"; CORPO.style.flexDirection="column";
    return;
  }
  MODO.textContent="";
  CORPO.innerHTML='<h1>'+esc(d.nome||"")+'</h1>'+
    (d.sub?'<div class="sub">'+esc(d.sub)+'</div>':"")+
    figuras(d)+
    (d.dica?'<p class="dica">'+esc(d.dica)+'</p>':"");
  CORPO.style.flex="1"; CORPO.style.display="flex"; CORPO.style.flexDirection="column"; CORPO.style.gap="2vh";
  /* os bonecos vem prontos do celular, com dois quadros; a troca e feita aqui */
  anima();
}
/* Os SVG que chegam tem os dois quadros embutidos como atributo data-a / data-b.
   Aqui so trocamos entre eles, devagar, para nao pesar na TV. */
function anima(){
  var svgs=CORPO.querySelectorAll("svg[data-a]");
  if(!svgs.length) return;
  var i=0;
  clearInterval(window._an);
  window._an=setInterval(function(){
    i=1-i;
    for(var k=0;k<svgs.length;k++){
      var d=svgs[k].getAttribute(i? "data-b":"data-a");
      if(d) svgs[k].innerHTML=d;
    }
  },1200);
}
if(navigator.presentation && navigator.presentation.receiver){
  navigator.presentation.receiver.connectionList.then(function(list){
    function liga(c){ c.addEventListener("message", function(ev){ try{ mostra(JSON.parse(ev.data)); }catch(e){} }); }
    list.connections.forEach(liga);
    list.addEventListener("connectionavailable", function(ev){ liga(ev.connection); });
  });
}
window.addEventListener("message", function(ev){ try{ mostra(JSON.parse(ev.data)); }catch(e){} });
espera();
</script>
</body>
</html>
